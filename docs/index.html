 gods gave her birth by way of his head' [26]. Athene enters the world already 'arrayed in arms of war', her craft natal rather than learned; the guardian of crafts enters the record as a byproduct of a coup.", "source": "[26] Th. 886-929", "date_added": "2026-10-12", "era": -750}, {"frm": "zeus", "to": "metis", "type": "conflict", "title": "The swallowing of counsel", "essay": "The most economical coup in the corpus: advised that Metis might bear 'something stronger than his thunderbolt', Zeus 'seized her with his hands and put her in his belly' [26]. No battle is needed against an intelligence; the monarch simply converts counsel into nutrition. It is a conflict in which only one side fights.", "source": "[26] Th. 886-900", "date_added": "2026-10-12", "era": -750}, {"frm": "zeus", "to": "cincinnatus", "type": "analogy", "title": "Licensed thrones, late and early", "essay": "ANALOGY, not transmission: Callimachus writes 'from Zeus come kings; for nothing is diviner than the kings of Zeus' [29], and the Roman insistence that power must be handed back to be legitimate is the same doctrine in reverse gear. The Welsh and Roman fathers-in-arms of cincinnatus share only the licensing scheme with the Olympian; no textual carrier between the strata is claimed.", "source": "[29] Callim. Hy. 1.79-84", "date_added": "2026-10-12", "era": -270}, {"frm": "zeus", "to": "hephaestus", "type": "conflict", "title": "The thrown artificer", "essay": "Hephaestus attests his own dismissal from Olympus: defending his mother, he was caught by the foot and flung from the threshold, falling a whole day to Lemnos [1]. The father-discipline that later nails Prometheus to the Caucasus is documented first against the smith; the forge itself is royal property.", "source": "[1] Il. 1.590-594", "date_added": "2026-10-12", "era": -750}, {"frm": "hephaestus", "to": "athene", "type": "interaction", "title": "Co-proprietors of the crafts", "essay": "The Homeric Hymn yokes them as joint teachers: 'With bright-eyed Athene he taught men glorious gifts throughout the world' [30]. Plato's allegation that Prometheus burgled both their arts in one theft [27] here finds its sole Hesiodic-era anchor: metals and craft were already held as one shared office.", "source": "[30] Hy. 20.1-5", "date_added": "2026-10-12", "era": -700}, {"frm": "athene", "to": "erinyes", "type": "interaction", "title": "Wrath given an address", "essay": "The Furies are won by contract, not force: 'You are not dishonored... So yield to my counsel' [31]; the play closes with the escort to their sanctuary beneath the Areopagus, renamed from wrath to blessing in the translator's summary [31]. This is the reverse of the Metis edge: instead of enfolding danger, Athene seats it.", "source": "[31] Eum. 824-851, ending", "date_added": "2026-10-12", "era": -458}, {"frm": "zeus", "to": "erinyes", "type": "analogy", "title": "The keys, mentioned and set down", "essay": "ANALOGY: Athene's leverage over the Furies rests on invoking Zeus' arsenal she does not intend to use, since she 'alone of the gods know[s] the keys to the house where his thunderbolt is sealed... there is no need of that' [31]. Power held in escrow works harder than power used; note this as standing structure, not textual transmission.", "source": "[31] Eum. 824-851", "date_added": "2026-10-12", "era": -458}, {"frm": "hera", "to": "heracles", "type": "conflict", "title": "The madness that made the labors", "essay": "Hera's single attested act here has structural consequences: jealous madness, parricide-fire, exile, oracle, serfdom to Eurystheus, then the labors [32]. Everything heroic in the tradition is invoice for Hera's sabotage. Conflict edge; the conflict is unreciprocated in these texts, which is itself a finding.", "source": "[32] Bibl. 2.4.12", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "heracles", "type": "kinship", "title": "Licensed liberation", "essay": "The freeing of Prometheus happens under civic cover: Zeus wills it 'that the glory of Heracles the Theban-born might be yet greater than it was before' [26]. Even mercy is a glory-investment; the father's anger at Prometheus is reported retired on the strength of the son's fame.", "source": "[26] Th. 526-534", "date_added": "2026-10-12", "era": -750}, {"frm": "nithuths-queen", "to": "volundr", "type": "conflict", "title": "The eyes of snakes, the order given", "essay": "The initiative for the maiming is hers, delivered in two images that diagnose power in a look: serpent eyes and gnashing teeth suffice, so 'cut his sinews of strength, And set him then in Saevarstath' [24]. It is done at once by unnamed hands. Her diagnosis was correct; her prescription made it a self-fulfilling one.", "source": "[24] Vkv 17-18", "date_added": "2026-10-12", "era": 900}, {"frm": "nithuth", "to": "nithuths-queen", "type": "kinship", "title": "Her rings, his sword", "essay": "The spoil of the isle is divided along gendered lines: Nithuth wears the sword, the queen claims the ring of Bothvild's stolen troth [24]. In the Vengeful catalogue the pair appears only as recipients: gems 'to Nithuth's wife so wise he gave them' [24]. Domesticity here is a ledger-balancing.", "source": "[24] Vkv 18 (prose: \"The queen spake\")", "date_added": "2026-10-12", "era": 900}, {"frm": "nithuth", "to": "bothvild", "type": "kinship", "title": "The only daughter", "essay": "Volund's announcement fixes their kinship for him to exploit: brooch from her brothers' teeth, their shared daughter 'big with child' [24]. The poem names her only in speech by others until her lament; the witness writes this family as a set of delivery addresses.", "source": "[24] Vkv 38", "date_added": "2026-10-12", "era": 900}, {"frm": "volundr", "to": "bothvild", "type": "agency", "title": "Ring, isle, accusation", "essay": "Bothvild's only documented speech is an answer to a charge: 'An hour of lust, alas it should be!... Nor from his strength could I save myself' [24]. The tradition has often read the ring-trick as courtship gone wrong; the text gives coercion. Her bigger-with-child coda arrives from Volund's mouth [24], so even her fate is reported through her injurer.", "source": "[24] Vkv 42-43", "date_added": "2026-10-12", "era": 900}, {"frm": "apollo", "to": "asclepius", "type": "kinship", "title": "Off the pyre, to the centaur", "essay": "The healing line begins as salvage: the mother burns for her infidelity and the god cuts his unborn son from the fire, delivering him to Chiron for rearing [34]. The cult's founder is twice orphaned in a sentence: from his mother by death, from his father by delegation.", "source": "[34] Bibl. 3.10.3", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "asclepius", "type": "conflict", "title": "Thunderbolt against medicine", "essay": "Zeus' motive is given with rare candor: 'fearing that men might acquire the healing art from him and so come to the rescue of each other, smote him with a thunderbolt' [34]. Immortality is a moat, and Asclepius was bridging it. The conflict is between sovereignty and medicine, and sovereignty fires first.", "source": "[34] Bibl. 3.10.4", "date_added": "2026-10-12", "era": 100}, {"frm": "athene", "to": "asclepius", "type": "interaction", "title": "The Gorgon's two bloods", "essay": "Apollodorus records the healer's working capital as a gift from the goddess: 'he had received from Athena the blood that flowed from the veins of the Gorgon', bane from the left side, salvation from the right [34]. The same Athene whose workshop Prometheus burgled here donates the substance that raises the dead; her edges increasingly read as underwriting.", "source": "[34] Bibl. 3.10.3", "date_added": "2026-10-12", "era": 100}, {"frm": "chiron", "to": "achilles", "type": "transmission", "title": "Herbs up, spear down", "essay": "The centaur's two recorded smiles: he 'showed' the herbs to Achilles, and 'cut upon a mountain top... the ashen spear... given to Peleus, wherewith to deal out death among heroes' [1]. Both gifts are tools of war seen from the pharmacy; the double transmission (healing through Achilles, killing through Peleus) is the graph's cleanest surviving case of one node arming both the soldier and the surgeon.", "source": "[1] Il. 11.831; 16.143", "date_added": "2026-10-12", "era": -750}, {"frm": "podaleirius", "to": "eurypylus-telephid", "type": "interaction", "title": "The unavailable doctor", "essay": "Eurypylus' report names the crisis: one physician wounded, the other 'fighting the Trojans upon the plain' [1], so the patient must beg a non-physician (Patroclus) for herbs. Podaleirius' whole attested action at Troy is his absence from the wound that needs him; the text itself documents a failure of medical logistics.", "source": "[1] Il. 11.833-836", "date_added": "2026-10-12", "era": -750}, {"frm": "inana", "to": "lilith", "type": "interaction", "title": "The phantom maid expelled", "essay": "The earliest stratum of the Lilith-file anchors here: Inana's garden harbors 'the phantom maid built herself a dwelling' in the tree's trunk [17], and Gilgamec's clearing work drives her to the desolate places. No name is spoken; the label 'ki-sikil-lil-la' comes through this text's apparatus and our batch-2 reading of Isaiah [18]. ([17] GEN t.1.8.1.4, 123-135)", "source": "[17] GEN t.1.8.1.4, 123-135", "date_added": "2026-10-12", "era": -2000}, {"frm": "gilgamesh", "to": "enkidu", "type": "kinship", "title": "My walnut, my mallet", "essay": "Of all the ground this text covers, the edge of command is teaching: Gilgamec briefs his servant at length on how not to be recognized in the nether world [17]; the instruction fails in exactly the manner warned about; Utu's brotherly hole in the ground is what returns him [17]. The poem itself ties the bond to grief ('my beloved servant, my faithful companion, my counsellor') [17].", "source": "[17] GEN t.1.8.1.4, 176-183", "date_added": "2026-10-12", "era": -2000}, {"frm": "inana", "to": "gilgamesh", "type": "interaction", "title": "Pest control as office", "essay": "The throne-and-bed project cannot proceed while the tree is occupied, so the goddess applies to her brother-warrior, whose bronze axe settles the matter in one stanza [17]. The exchange is documented, not adoration: her relation to kingship seeds her authority pool. ([17] GEN t.1.8.1.4, 114-135)", "source": "[17] GEN t.1.8.1.4, 114-135", "date_added": "2026-10-12", "era": -2000}, {"frm": "lilith", "to": "methuselah", "type": "conflict", "title": "The demon-registry surrendered", "essay": "Methuselah's single legible exploit is conducted against Lilith's get: after three fast days he writes the Name on his sword and annihilates 'ninety-four myriads' at once [19]. The sword-grip is subcontracted omnipotence; that such a weapon exists is testimony from the demon side to the same night-economy she feeds on [19].", "source": "[19] Legends I ch.2 (Methuselah)", "date_added": "2026-10-12", "era": 900}, {"frm": "lilith", "to": "agrimus", "type": "kinship", "title": "First-born of the brood", "essay": "The demon's first-born negotiates the cease-fire and delivers the census of demons and imps to the enemy [19]. Kin only in the legend's manner of speaking; no generation ritual is shown. One line in Ginzberg, no location, no cult.", "source": "[19] Legends I ch.2", "date_added": "2026-10-12", "era": 900}, {"frm": "eve", "to": "agrimus", "type": "analogy", "title": "Label housekeeping", "essay": "Eve's 'angel of the Lord' exclamation [19] and Agrimus' census-handing [19] mark the two ends of the same story about paternity-contamination. No text in our corpus connects them; the link is structural (each ancestral mother gets a shadow sire), not transmission.", "source": "[19] Legends I ch.1-2", "date_added": "2026-10-12", "era": 900}, {"frm": "pwyll", "to": "arawn", "type": "interaction", "title": "The year of the semblance", "essay": "Pwyll borrows Arawn's body and court, kills Havgan with the single permitted blow, and returns; Arawn's offer 'by ridding me of this oppression... shalt thou gain my friendship' establishes the Otherworld's way of doing foreign policy: subcontracting [21]. Homage is rendered but no tribute is paid: Dyved's sovereignty exchanges straight for Annwvyn's favors.", "source": "[21] Pwyll, Prince of Dyved (Mab. I)", "date_added": "2026-10-12", "era": 1350}, {"frm": "teyrnon", "to": "pryderi", "type": "kinship", "title": "Fostered under the claw", "essay": "Teirnyon loses his mare's foals every May Eve; the year he keeps watch, he hacks off the monster's arm and picks up the royal child in the doorway [21]. He raises Gwri until the resemblance forces return, and the court names him Pryderi [21]. Fosterage is here logged as the tradition's highest office, all duty, no claim.", "source": "[21] Pwyll (Mab. I, end)", "date_added": "2026-10-12", "era": 1350}, {"frm": "llwyd", "to": "manawyddan", "type": "conflict", "title": "The mouse, ransomed", "essay": "Llwyd strips every field Manawyddan sows; Manawyddan answers by hanging one pregnant mouse and refusing three ransoms until the terms are read aloud [21]. Then Llwyd confesses and swears friendship: vengeance paid by the disclosure rather than the deed [21]. Vengeance is discharged by disclosure, enforcement by trade-settlement.", "source": "[21] Manawyddan (Mab. III)", "date_added": "2026-10-12", "era": 1350}, {"frm": "manawyddan", "to": "bran", "type": "kinship", "title": "Counsel at Harlech", "essay": "Bran's inventory of counsel begins with 'his brother Manawyddan the son of Llyr' sitting with him on the rock [21]; through the Irish catastrophe it is the brothers' counsel that holds the court. Manawyddan survives to bury him; the Second Branch's only living mourner figures in our corpus are his.", "source": "[21] Branwen (Mab. II)", "date_added": "2026-10-12", "era": 1350}, {"frm": "brumidi", "to": "victory", "type": "transmission", "title": "Victory, flanking the demigod", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[26][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "victory", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "neptune", "type": "transmission", "title": "Marine: the sea's leaseholder", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[35][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "neptune", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "vulcan", "type": "transmission", "title": "Mechanics: cannon from the old forge", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[1][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "vulcan", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "mercury", "type": "transmission", "title": "Commerce: the boundary-crosser on the ledger", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[38][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "mercury", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "venus", "type": "transmission", "title": "The ancestress in the six", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[37][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "venus", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "ceres", "type": "transmission", "title": "Agriculture: the first exchange", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[37][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "ceres", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "brumidi", "to": "minerva", "type": "transmission", "title": "Science: the desk half of war", "essay": "Per the Architect of the Capitol's own text, Brumidi's Mechanics/Marine/Commerce/Agriculture/Science perimeter assigns each national faculty its tutelary [16].", "source": "[36][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "minerva", "to": "george-washington", "type": "transmission", "title": "Rent from the national cult", "essay": "Installed by state commission in the Rotunda's mechanic ring, the borrowed god collects a tithe of the national pool the enthroned founder organizes: the faculty answers the name the republic budgeted for [16].", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "vulcan", "to": "hephaestus", "type": "analogy", "title": "Name change, same forge", "essay": "Rome naturalized the Greek forge god as Vulcan; Ovid files the equivalence by geography, 'Vulcan by the Hypsipylian land' [37], Lemnos being Hephaestus' fixed address in Homer [1]. Identification of office, documented both sides.", "source": "[1][37]", "date_added": "2026-10-12", "era": -19}, {"frm": "james-watt", "to": "prometheus", "type": "transmission", "title": "The fire goes retail", "essay": "Prometheus' theft reaches flesh: what was a crime against Olympus becomes a product line at Soho, sold by the yard of horsepower [39]. The routing is literal this time: every reading in the P_energy pool denominates itself in this man's name.", "source": "[39][6]", "date_added": "2026-10-12", "era": 1776}, {"frm": "benjamin-franklin", "to": "prometheus", "type": "transmission", "title": "Prometheus, unchained by anti-patent", "essay": "Same act, opposite jurisprudence: fire drawn visibly from the clouds at knee height [40], and instead of an eagle, a refusal to patent. The gift stays a gift because the giver declines the exclusive.", "source": "[40][6]", "date_added": "2026-10-12", "era": 1752}, {"frm": "benjamin-franklin", "to": "george-washington", "type": "analogy", "title": "The apron and the plough, no rental", "essay": "Two biographies the young republic bought in bulk. Weems stamps Washington 'Cincinnatus-like' at the plough [15], a Roman mold rented outright. Franklin needs no rental: his Autobiography liquidates the printing business on his own arithmetic, 'I flatter'd myself that, by the sufficient tho' moderate fortune I had acquir'd, I had secured leisure during the rest of my life for philosophical studies and amusements' [40]. The resemblance is enacted and contemporary, not transmitted: neither text cites Livy, and no carrier links Franklin to the Roman exemplum.", "source": "[40][15]", "date_added": "2026-10-12", "era": 1752}, {"frm": "benjamin-franklin", "to": "mercury", "type": "analogy", "title": "Postmaster and printer of the exchange god", "essay": "Crosser of boundaries for a living: postmaster, printer, diplomat, dealer in information as commodity. His section of the Autobiography is a merchant's ledger kept by Mercury's office [38][40].", "source": "[40][38]", "date_added": "2026-10-12", "era": 1752}, {"frm": "atlas", "to": "zeus", "type": "transmission", "title": "The assigned lot", "essay": "Hesiod uses pension-file language: the sky is a lot, assigned by Zeus [26]; Atlas collects a set-aside of sovereign order in the form of a permanent sentence.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "poseidon", "to": "neptune", "type": "analogy", "title": "Name change, same empire", "essay": "Rome naturalized the earth-holder as Neptune; the Aeneid's Neptune rules by Vergil's title-language, 'by fatal lot to me the liquid empire fell' [35], which is Hesiod's poseidonian lot [26] translated into Latin deed.", "source": "[35][26]", "date_added": "2026-10-12", "era": -19}, {"frm": "iris", "to": "zeus", "type": "transmission", "title": "The golden jug run", "essay": "For the oath protocol Zeus 'sends Iris' with the jug to bring back the great oath [26]; the messenger's throughput is the sovereign's signature process.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "dionysus", "to": "zeus", "type": "kinship", "title": "A mortal woman an immortal son", "essay": "Semele's promotion is filed inside Dionysus' own line: 'a mortal woman an immortal son. And now they both are gods' [26]; the promotion memo belongs to the father's register.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "aphrodite", "to": "venus", "type": "analogy", "title": "Foam-born to month-holder", "essay": "Hesiod's portion list gives Aphrodite 'the whisperings of maidens and smiles and deceits' [26]; Ovid gives Venus April as a dividend of Julian genealogy [37]. Same office, different jurisdiction, two accounting systems for desire.", "source": "[26][37]", "date_added": "2026-10-12", "era": -8}, {"frm": "styx", "to": "zeus", "type": "transmission", "title": "Escrow of Olympus", "essay": "Styx came first to the levy and 'her he appointed to be the great oath of the gods' [26]; the sovereign's covenants settle in her water. She is paid in advance, in perpetuity, which is the tightest contract in the Theogony.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "janus", "to": "zeus", "type": "analogy", "title": "The gatekeeper predates the king", "essay": "Janus regulates 'the goings and the comings of Jupiter himself' [41]; whoever controls access to the sovereign office is older than the office. Rome begins the year at his name for this reason.", "source": "[41]", "date_added": "2026-10-12", "era": -8}, {"frm": "mars", "to": "cincinnatus", "type": "analogy", "title": "The sword and the plough share", "essay": "Ovid's census: Mars was Latium's god 'for that he is the patron of the sword' [36]. Livy's dictator must put down the sword to be legible [33]. The tradition stages the two as the same Roman budget line seen in different reading legs: war is the revenue, the resignation the expense report.", "source": "[36][33]", "date_added": "2026-10-12", "era": -450}, {"frm": "vesta", "to": "genius", "type": "analogy", "title": "The hearth and the tutelary", "essay": "Both are architecture made god: Servius says no place is without its genius [14]; Ovid's trembling altar of Vesta is that doctrine with a thermostat [36]. The state stores its continuity in a protected center that must never be looked at directly.", "source": "[36][14]", "date_added": "2026-10-12", "era": -8}, {"frm": "quirinus", "to": "cincinnatus", "type": "analogy", "title": "Founder to office-holder", "essay": "Both are Roman poses against the same backdrop: Romulus/Quirinus founds with a wall Remus must not cross [36]; Cincinnatus is deputed from exactly such a wall-footprint of dirt [33]. The city manufactures its essential man twice over, once as founder, once as volunteer.", "source": "[36][33]", "date_added": "2026-10-12", "era": -450}, {"frm": "diana", "to": "juno", "type": "analogy", "title": "The census of patronesses", "essay": "Ovid's geography of cults files both: 'Juno by Sparta and Pelopid Mycenae, Diana by Minoan Crete' [36]. The Fasti's patroness catalogue is a census of what the state records as productive worship; the huntress holds hers from an island off the mainland's balance sheet.", "source": "[36][37]", "date_added": "2026-10-12", "era": -8}, {"frm": "aeneas", "to": "venus", "type": "kinship", "title": "The ancestress launches the founder", "essay": "The goddess of the month gets her dividend paid forward: Venus's son carries the household gods to Italy [35], and Ovid's calendar arithmetic follows the blood down to the ruling house [37]. Blood is how a goddess becomes a budget line.", "source": "[35][37]", "date_added": "2026-10-12", "era": -19}, {"frm": "dido", "to": "aeneas", "type": "conflict", "title": "The city Aeneas does not found", "essay": "Carthage receives the counterfeit infant while the actual mission walks out the back: Dido 'devour'd his charms' while destiny charts for Italy [35]. Hers is the debt column of the founder story, the city offered and refused.", "source": "[35]", "date_added": "2026-10-12", "era": -19}, {"frm": "sibyl", "to": "apollo", "type": "transmission", "title": "The oracle with the filing system", "essay": "The Sibyl speaks Apollo's lines and keeps the state manual; the Sibylline books were Rome's constitutional panic button for centuries. The connection is a standard oracle-priestess routing: the god lends the voice, the woman keeps the password.", "source": "[35]", "date_added": "2026-10-12", "era": -19}, {"frm": "evander", "to": "athene", "type": "analogy", "title": "The town named for the goddess nobody built yet", "essay": "Pallanteum sits on Rome's future footprint named for 'Pallas, his great-grandsire' [35] before Minerva ever draws her Roman salary [36]. The site's chain of title already runs through the goddess of skill, informally, pre-state.", "source": "[35][36]", "date_added": "2026-10-12", "era": -19}, {"frm": "camilla", "to": "athene", "type": "analogy", "title": "Pallas refused", "essay": "'Unbred to spinning, in the loom unskill'd, she chose the nobler Pallas of the field' [35]: Camilla selects the war-side of Athena's charter and relinquishes the craft-side. The city's goddess of a thousand works [36] does not always get to pick which department the women take.", "source": "[35]", "date_added": "2026-10-12", "era": -19}, {"frm": "hippocrates", "to": "asclepius", "type": "transmission", "title": "The guild keeps the name", "essay": "Hippocrates' flesh house called itself Asclepiadae [3] and sold a discipline whose first aphorism is a disclaimer [42]. The hero-god's name operates the way a license operates: inheritable by the house, revocable by results.", "source": "[42][3]", "date_added": "2026-10-12", "era": -400}, {"frm": "adam-smith", "to": "mercury", "type": "transmission", "title": "The invisible hand is the boundary-crosser", "essay": "Smith's exchange mechanism 'led by an invisible hand' [43] runs the same circuit as Hermes' barter with Apollo: the transaction sanctifies what neither party intended [38]. Commerce's god has finally been assigned an economist, and the economist reports no one is in charge.", "source": "[43][38]", "date_added": "2026-10-12", "era": 1776}, {"frm": "matthew-boulton", "to": "james-watt", "type": "transmission", "title": "The partner holds the pen", "essay": "Watt improved the engine; Boulton named the product. 'I sell here, Sir, what all the world desires to have--POWER' was Boulton's voice to Boswell, 'father to his tribe' of seven hundred [39]. The fire goes retail through the partnership, and the salesman collects history's commission.", "source": "[39]", "date_added": "2026-10-12", "era": 1776}, {"frm": "hector", "to": "paris-alexandrus", "type": "conflict", "title": "The brother who would not hide", "essay": "Hector rebukes Paris for the war his carrying-off wages; the conflict edge is within the family, Troy's perimeter holding its own cause accountable [1].", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "thetis", "to": "zeus", "type": "transmission", "title": "The mother petitions the summit", "essay": "Thetis climbs to Olympus and puts her son's honor on the king's agenda [1]; the favor Zeus owes her is one of the oldest debts of his accession, and the war's course is her calling it in.", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "xanthus-balius", "to": "achilles", "type": "kinship", "title": "The estate of Peleus flagged mortal", "essay": "The immortal team was given to Peleus on his wedding, and the gift's fine print is mortality: attached to a mortal account, even undying horses accrue grief [1].", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "ares", "to": "athene", "type": "conflict", "title": "War scheduled out of the room", "essay": "Athena to Ares: 'may we not now leave the Trojans and Achaeans to fight it out' [1]. Ovid will translate the same desk-power to the Roman register: 'fierce wars are waged by Minerva's hands' [36]. Minerva runs war's office; Ares rents the field.", "source": "[1][36]", "date_added": "2026-10-12", "era": -750}, {"frm": "priam", "to": "hector", "type": "kinship", "title": "The ransom is memorial, not metal", "essay": "Priam buys Hector's body with the price of standing in for Achilles' father [1]; the exchange is one father-figure for a son's corpse, weighted in filial arithmetic.", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "latinus", "to": "aeneas", "type": "transmission", "title": "The prior king with impeccable paperwork", "essay": "Latinus's pedigree runs Saturn to Faunus to him [35]; his function in the founder system is the waiting landlord whose title the myth requires the hero to marry. His daughter's betrothal is the deed transfer.", "source": "[35]", "date_added": "2026-10-12", "era": -19}, {"frm": "iopas", "to": "atlas", "type": "transmission", "title": "The Titan becomes curriculum", "essay": "Iopas 'sung what ancient Atlas taught' [35]: celestial mechanics as after-dinner repertoire. The Titan's sentenced posture is converted into dining-room astronomy, which is how condemned labor survives as high culture.", "source": "[35]", "date_added": "2026-10-12", "era": -19}, {"frm": "fama", "to": "george-washington", "type": "analogy", "title": "Victory-Fame, indivisible twin", "essay": "Brumidi pairs 'Liberty and Victory/Fame' at Washington's side [16]; Vergil's Fama is the last-born Titan who grows from pigmy to skyhead [35]. The American cult's tutelary twin is Rome's rumor-daimon, installed there by the state as if unawares.", "source": "[35][16]", "date_added": "2026-10-12", "era": -19}, {"frm": "tiberinus", "to": "george-washington", "type": "analogy", "title": "Drowned king, national river", "essay": "Tiberinus becomes the state's waterway by drowning into it [37]; Washington becomes the building's tutelary by being suspended by the legislature [16]. Both are officials absorbed into infrastructure, name kept on the brass plate.", "source": "[37][14]", "date_added": "2026-10-12", "era": -19}, {"frm": "pericles", "to": "athene", "type": "transmission", "title": "The city as the god", "essay": "Pericles offers Athens as 'the school of Hellas' [44]; Minerva's Quinquatrus made the school the goddess's tithe zone [36]. The flesh-record statesman packages the polis itself as the cult object for which the dead are payment.", "source": "[44][36]", "date_added": "2026-10-12", "era": -431}, {"frm": "fdr", "to": "cincinnatus", "type": "analogy", "title": "The sixteenth day, not scheduled", "essay": "FDR asks Congress for 'broad Executive power to wage a war against the emergency' equal to repelling an invasion [45]; Cinccinatus got exactly that power and gave it back on the sixteenth day [33]. The graph records both scripts; the loan instruments are identical, the repayment terms not.", "source": "[45][33]", "date_added": "2026-10-12", "era": 1933}, {"frm": "fdr", "to": "george-washington", "type": "transmission", "title": "The office projects the founders", "essay": "The presidency inherits the tutelary's furniture: the office Washington organized is the office FDR asks to expand toward war footing [45]. The share routed is the national pool itself.", "source": "[45][16]", "date_added": "2026-10-12", "era": 1933}, {"frm": "hecate", "to": "zeus", "type": "transmission", "title": "Grandfathered in all three jurisdictions", "essay": "'The son of Cronos did her no wrong nor took anything away' [26]: the redistribution of Olympus stops at her file. She collects from the sovereign order precisely because the order could not collect from her.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "mnemosyne", "to": "zeus", "type": "kinship", "title": "Mother of the house songbook", "essay": "The Muses who praise Zeus's distributions are Mnemosyne's daughters [26]; the court's memory department is married into the throne, and the chronicle sings accordingly.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "thetis", "to": "xanthus-balius", "type": "transmission", "title": "Both price the gift of gods to mortals", "essay": "Thetis counts the span, Zeus counts the grief-loan terms on the horses [1]; both notes state that immortality attached to flesh record is not advantage, only accounting.", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "castor-polydeuces", "to": "paris-alexandrus", "type": "conflict", "title": "The brothers decline the war", "essay": "Helen herself assigns their absence its motive: 'for the shame and disgrace that I have brought upon them' [1]. The twin gods of the horse-race withdraw from the Trojan account as reputational risk.", "source": "[1]", "date_added": "2026-10-12", "era": -750}, {"frm": "typhoeus", "to": "zeus", "type": "conflict", "title": "The last firewall test", "essay": "Earth's youngest almost took the throne: 'he would have come to reign... had not the father of men and gods been quick to perceive it' [26]. The conflict line is the annealing moment of Zeus's power; after the spike there are no more contenders.", "source": "[26]", "date_added": "2026-10-12", "era": -700}, {"frm": "odin", "to": "yggdrasil", "type": "transmission", "title": "The tree is the gallows-library", "essay": "Odin hangs 'on a wind-rocked tree... to Odin offered, myself to myself' [46]; the world-tree serves here as instrument of self-extraction, the branch on which knowledge is bartered from one's own body.", "source": "[46]", "date_added": "2026-10-12", "era": 1100}, {"frm": "thor", "to": "volundr", "type": "analogy", "title": "Tools against the costs of flesh", "essay": "Thor's entire function is the hammer that answers the giants,and Völund's smith-work is the Edda's other documented product line of tool-power [24][46]. The tradition's arms makers and arms wielders sit closer together than the saga's axes say.", "source": "[46][24]", "date_added": "2026-10-12", "era": 1100}, {"frm": "baldr", "to": "machaon", "type": "analogy", "title": "The one death the healers cannot bill", "essay": "Baldr falls to the plant overlooked in the inventory [46]; Machaon's line ends under the same arithmetic of the one wound no healer was counted worth [3]. Both gods store the lesson that the healable world stops at its chosen exception.", "source": "[46][1]", "date_added": "2026-10-12", "era": -750}, {"frm": "loki", "to": "thor", "type": "conflict", "title": "The liability walks beside the asset", "essay": "The Edda pairs them as expedition partners who cannot be discharged: Loki's progeny fills the apocalypse roster [46], and Thor's last assignment is one of Loki's entries. Conflict here is priced as joint tenancy.", "source": "[46]", "date_added": "2026-10-12", "era": 1100}, {"frm": "freyr", "to": "freyja", "type": "kinship", "title": "Twin lines of the hoard", "essay": "The Vanir siblings split the household portfolio: his office is unbinding [46], hers is the gold that flows when the husband leaves [46]. Between them the fertility economy is complete:release below, liquidity above.", "source": "[46]", "date_added": "2026-10-12", "era": 1100}, {"frm": "heimdall", "to": "odin", "type": "transmission", "title": "The horn is stored with the pledge", "essay": "The trumpet waits under the world-tree, collateral beside Odin's forfeited deposit [46]; the watchman's alarm is pre-funded by the father's body. Surveillance as trust instrument.", "source": "[46]", "date_added": "2026-10-12", "era": 1100}, {"frm": "sulla", "to": "apollo", "type": "transmission", "title": "The amulet with the surname rider", "essay": "The small golden Apollo went bosom-carried into battle, addressed by name as the client-stabilizer: 'Fortunate Cornelius Sylla' rents the Pythian against every campaign outcome [47]. The client's trust is a contract affirmed in threats: 'wilt thou now cast him down?' The god's answer is the only one on record that is read as loyalty. The naming-rights deal outlasts the battlefield.", "source": "[47]", "date_added": "2026-10-12", "era": -82}, {"frm": "sulla", "to": "cincinnatus", "type": "conflict", "title": "The resignation that proves nothing", "essay": "Both men leave the dictatorship alive, and that is the entire contrast: the office returned at day sixteen is the Republic's founding proof of the rule [33]; the office returned after the proscriptions is the counter-proof that the office itself had already changed the man holding it [48]. Each resignation narrates the other.", "source": "[48][33]", "date_added": "2026-10-12", "era": -82}, {"frm": "galen", "to": "hippocrates", "type": "transmission", "title": "The surname of the ascribed line", "essay": "Galen files Hippocrates as the correct fork in the elder schism: nature artistic and equitable rather than atomic chance [53]. The Asclepiadae descent [3] becomes a theory of matter; kinship here is doctrinal inheritance, the family brand kept as physics.", "source": "[53][42]", "date_added": "2026-10-12", "era": 170}, {"frm": "newton", "to": "minerva", "type": "analogy", "title": "The desk half of war extended", "essay": "Minerva's fasti file includes the school-fees line and the hundred crafts; the Royal Society register is the same office, motions recorded 'as well as' campaigns further south and war-machines unwritten [50][36]. The goddess who collects the pennies also collects the calculus.", "source": "[50][36]", "date_added": "2026-10-12", "era": 1687}, {"frm": "faraday", "to": "benjamin-franklin", "type": "transmission", "title": "The kite becomes the motor", "essay": "Franklin bottled the sky's electricity [40]; Faraday's diary converts magnetism into that electricity on demand [51]. The transmission is laboratory-thick: same fire, metered by persistence, devices instead of gifts.", "source": "[51][40]", "date_added": "2026-10-12", "era": 1831}, {"frm": "ampere", "to": "faraday", "type": "transmission", "title": "Crumbs into currents", "essay": "Ampère abstracts counting out of biscuit crumbs [49]; Faraday magnets current out of coils [51]. The units interconvert because the men hold pieces of the same table. The SI assigns their names to quantities that still resemble the kitchen supplies.", "source": "[49][51]", "date_added": "2026-10-12", "era": 1775}, {"frm": "joule", "to": "james-watt", "type": "transmission", "title": "The audit of power", "essay": "Five hundred-plus foot-pounds per unit of heat [52]; power sold 'what all the world desires' [39]. Joule provides the conversion table in which Watt's retail commodity is denominated; the two units are conjugate in every modern bill of lading for heat and work.", "source": "[52][39]", "date_added": "2026-10-12", "era": 1847}, {"frm": "zeus", "to": "hera", "type": "marriage", "title": "The last wife", "essay": "Hesiod's list of the sovereign's consorts closes with the one who shares the throne-name: 'Lastly, he made Hera his blooming wife' [26]. The marriage is registered last because it sticks; the tradition files the earlier unions as procurements and this one as co-tenancy of Olympus. ([26] Theogony, ll. 921-923)", "source": "[26] Theogony 921-923", "date_added": "2026-10-12", "era": -700}, {"frm": "hera", "to": "hephaestus", "type": "kinship", "title": "Born of the quarrel", "essay": "Answer to the head-birth: Zeus brings forth Athene alone from his skull, 'But Hera without union with Zeus, for she was very angry and quarrelled with her mate, bare famous Hephaestus, who is skilled in crafts more than all the sons of Heaven' [26]. The forge on Olympus is the wife's entry in the rivalry of self-sufficient birth. ([26] Theogony, ll. 924-929)", "source": "[26] Theogony 927-929", "date_added": "2026-10-12", "era": -700}, {"frm": "hephaestus", "to": "aphrodite", "type": "marriage", "title": "The lame husband", "essay": "Demodocus sings it as common knowledge: the intrigue of Ares and Aphrodite 'in the house of Vulcan', 'King Vulcan's marriage bed' [54]. The Odyssey's divine household pairs the craft-god's throne with desire's, and the mismatch is the joke the whole pantheon attends in person. ([54] Od. 8.267ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700}, {"frm": "hephaestus", "to": "ares", "type": "conflict", "title": "The invisible net", "essay": "Alerted by the Sun, the smith 'got his great anvil into its place, and began to forge some chains which none could either unloose or break', festoons the bed 'all over with chains like cobwebs', and holds Ares fast until ransom terms are settled [54]. Craft triumphs over war once, in the court poem, and collects bail from the sea. ([54] Od. 8.272ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700}, {"frm": "ares", "to": "aphrodite", "type": "interaction", "title": "The adultery sung at court", "essay": "'The loves of Mars and Venus, and how they first began their intrigue in the house of Vulcan' [54]: Homer's boldest divine episode assigns the war-god desire and shows both published by the Sun, netted by the smith, and bailed by the sea. The tradition likes them together precisely as an exposure story. ([54] Od. 8.266ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700}, {"frm": "apollo", "to": "achilles", "type": "conflict", "title": "Thrice beaten from the wall", "essay": "At Troy's wall the rampage of Patroclus meets no proxy: 'thrice did Patroclus charge at an angle of the high wall, and thrice did Apollo beat him back, striking his shield with his own immortal hands' [1]. The horse Xanthus later gives the autopsy of the aristeia's end: it was 'the mighty god whom lovely Leto bore' that slew Patroclus and 'vouchsafed a triumph to Hector' [1]. Apollo is the creditor who moves against Achilles' house in two installments: the friend first, then his own death's foretelling. ([1] Il. 16.698ff; Il. 19.404ff)", "source": "[1] Il. 16, 19", "date_added": "2026-10-12", "era": -750}, {"frm": "erinyes", "to": "xanthus-balius", "type": "interaction", "title": "Censors of the speaking horse", "essay": "Granted a human voice by Hera, Xanthus prophesies his master's death, and the permission has a limit: 'When he had thus said the Erinyes stayed his speech' [1]. Even a dispensation from Olympus answers to the old licenses; the speaking animal is silenced by the powers of curse and due measure. ([1] Il. 19.418)", "source": "[1] Il. 19", "date_added": "2026-10-12", "era": -750}, {"frm": "juno", "to": "erinyes", "type": "interaction", "title": "The queen rents Allecto", "essay": "When fate will not bar the Trojan from Italy, Juno procures the war from below: she descends to the Stygian flood, raises the Fury Allecto, and the poem sneers its own receipt, 'An act that well became the wife of Jove' [35]. The tutelary of women financing a vendetta with the underworld's barrister: the Greek curse-demons at Roman state retainers. ([35] Aen. 7.286ff, 7.323ff)", "source": "[35] Aen. 7", "date_added": "2026-10-12", "era": -19}], "sources": [{"id": 1, "url": "https://classics.mit.edu/Homer/iliad.mb.txt", "title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)"}, {"id": 2, "url": "https://classics.mit.edu/Plato/ion.html", "title": "Plato, Ion, trans. Jowett (MIT Classics)"}, {"id": 3, "url": "https://www.theoi.com/Text/Pausanias3B.html", "title": "Pausanias 3, trans. Jones 1918 (Loeb, via theoi.com)"}, {"id": 4, "url": "https://www.gutenberg.org/cache/epub/6341/pg6341.txt", "title": "Hoffmann, Nachtstücke 1816, Der Sandmann (Gutenberg #6341)"}, {"id": 5, "url": "https://archive.org/details/freud-1925-cp-5", "title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (arch title": "Plato, Republic, trans. Jowett 1871 (MIT Classics)"}, {"id": 58, "url": "https://classics.mit.edu/Aristotle/poetics.mb.txt", "title": "Aristotle, Poetics, trans. S.H. Butcher 1895 (MIT Classics)"}, {"id": 59, "url": "https://classics.mit.edu/Aristotle/rhetoric.mb.txt", "title": "Aristotle, Rhetoric, trans. W. Rhys Roberts 1924 (MIT Classics)"}, {"id": 60, "url": "https://www.gutenberg.org/cache/epub/21765/pg21765.txt", "title": "Ovid, Metamorphoses, trans. Brookes More 1922 (Gutenberg #21765)"}, {"id": 61, "url": "https://www.gutenberg.org/cache/epub/14033/pg14033.txt", "title": "Plutarch, Lives, trans. Dryden rev. Clough 1864 (Gutenberg #14033)"}, {"id": 62, "url": "https://www.gutenberg.org/cache/epub/14988/pg14988.txt", "title": "Cicero, De Natura Deorum, trans. Brooks 1896 (Gutenberg #14988)"}, {"id": 63, "url": "https://www.gutenberg.org/cache/epub/20/pg20.txt", "title": "Milton, Paradise Lost 1667 (Gutenberg #20)"}, {"id": 64, "url": "https://www.gutenberg.org/cache/epub/100/pg100.txt", "title": "Shakespeare, Complete Works (Gutenberg #100)"}, {"id": 65, "url": "https://www.gutenberg.org/cache/epub/8800/pg8800.txt", "title": "Dante, Divine Comedy, trans. H.F. Cary 1814 (Gutenberg #8800)"}, {"id": 66, "url": "https://www.gutenberg.org/cache/epub/5160/pg5160.txt", "title": "The Mabinogion, trans. Guest 1877 (Gutenberg #5160)"}, {"id": 67, "url": "https://classics.mit.edu/Euripides/bacchan.pl.txt", "title": "Euripides, Bacchae, trans. Coleridge 1891 (MIT Classics)"}, {"id": 68, "url": "https://archive.org/download/anoldbabylonian00claygoog/anoldbabylonian00claygoog_djvu.txt", "title": "Jastrow & Clay, An Old Babylonian Version of the Gilgamesh Epic 1920 (archive.org)"}, {"id": 69, "url": "http://www.perseus.tufts.edu/hopper/text?doc=Pind.+P.+3&fromdoc=Perseus:text:1999.01.0162", "title": "Pindar, Pythian 3, trans. Sandys 1915 (Perseus)"}], "version": 5, "generated": "2026-10-13"}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = {}; DATA.nodes.forEach(n=>byId[n.id]=n);

/* ---------- edit tracking (localStorage v2) ---------- */
const LSKEY='highdrama_edits_v2';
let edits = JSON.parse(localStorage.getItem(LSKEY)||'[]');
let editMode=false;
const editStatus=document.getElementById('editStatus');
function showEditStatus(){ editStatus.textContent = edits.length? `${edits.length} local edit(s)` : ''; }
function applyEdits(){
  edits.forEach(e=>{
    if(e.kind==='node-essay' && byId[e.id]) byId[e.id].essay=e.new;
    if(e.kind==='edge-title'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.title=e.new;}
    if(e.kind==='edge-essay'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.essay=e.new;}
  });
  showEditStatus();
}
function record(kind, idOrEdge, oldVal, newVal){
  if(oldVal===newVal) return;
  const rec = Object.assign({kind, old:oldVal, new:newVal, ts:new Date().toISOString()}, idOrEdge);
  function kindrec(e){ return e.kind==='node-essay'? {id:e.id} : {frm:e.frm,to:e.to,type:e.type}; }
  const key = JSON.stringify([kind, idOrEdge]);
  const ix = edits.findIndex(e=>JSON.stringify([e.kind, kindrec(e)])===key);
  if(ix>=0){ rec.old = edits[ix].old; edits[ix]=rec; } else edits.push(rec);
  localStorage.setItem(LSKEY, JSON.stringify(edits));
  showEditStatus();
}

/* ---------- helpers ---------- */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return esc(t).replace(/\[(\d+)\]/g,(m,n)=>{
    const s=DATA.sources.find(s=>s.id==n);
    return s? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m;
  });
}
function fmtW(w){ if(!w) return '0 W';
  if(w>=1e12) return (w/1e12).toPrecision(3)+' TW'; if(w>=1e9) return (w/1e9).toPrecision(3)+' GW';
  if(w>=1e6) return (w/1e6).toPrecision(3)+' MW'; if(w>=1e3) return (w/1e3).toPrecision(3)+' kW';
  return Math.round(w)+' W'; }
function yearFmt(y){ return y<0? (-y)+' BCE' : y+' CE'; }

/* ---------- time model ---------- */
const ZMIN=-2100, ZMAX=2030, ZSPAN=320;
function zOf(era){ return ((era-ZMIN)/(ZMAX-ZMIN))*ZSPAN - ZSPAN/2; }
function currentT(){ return parseInt(document.getElementById('year').value,10); }
function edgeWeight(e,T){ if(e.era>T) return 0; return Math.exp(-(T-e.era)/250); }
function nodeCentrality(id,T){ let s=0; for(const e of DATA.edges){ if(e.frm===id||e.to===id) s+=edgeWeight(e,T); } return s; }
let sizeMode='centrality';
function nodeSize(n,T){
  if(sizeMode==='watts') return 1.8+1.5*Math.max(0,Math.log10(Math.max(n.pw_t,1)));
  return 3.0+3.4*Math.sqrt(nodeCentrality(n.id,T));
}

/* ---------- colors ---------- */
const PALETTE=['#7a4a1f','#3b6ea5','#5e7f3c','#8e3b46','#6a5a8e','#a5762b','#2f7d6d','#945e9a','#8c2f2f','#4c6b8a'];
function tradColor(t){ let h=0; for(const c of (t||'')) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

/* ---------- 3D graph ---------- */
let Graph=null, simReady=false;

function makeLabelSprite(text){
  const label = (text.length>24? text.slice(0,23)+'…':text);
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const font='44px Georgia, serif';
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(label).width)+16;
  cv.width=w; cv.height=64;
  ctx.font=font; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(43,38,32,0.92)';
  ctx.fillText(label,8,34);
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4; tex.minFilter=THREE.LinearFilter; tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const h=6; spr.scale.set(h*w/64, h, 1);
  return spr;
}

function styleNode(n,T){
  const g=n.__group; if(!g) return;
  const vis = n.era<=T;
  g.visible = vis;
  if(!vis) return;
  const s=nodeSize(n,T);
  n.__mesh.scale.setScalar(s);
  n.__sprite.position.set(0, s+3.2, 0);
}

function applyLinkStyles(){
  const T=currentT();
  // Re-apply style accessors with fresh closures: re-renders link visuals ONLY.
  // Does NOT touch graphData or the simulation, so engineRunning stays false
  // and tickFrame never calls layout.tick -> no race, no reheat, no pop-in.
  Graph.linkVisibility(l=> l.era<=T)
       .linkColor(l=>{ const w=edgeWeight(l,T); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
       .linkWidth(l=> 0.4+2.6*edgeWeight(l,T));
}

function applyTimeStyles(){
  if(!Graph) return;
  const T=currentT();
  Graph.graphData().nodes.forEach(n=>styleNode(n,T));  // engine nodes carry the meshes
  applyLinkStyles();
}

function initGraph(){
  const el=document.getElementById('graph');
  const T0=currentT();

  // Build data ONCE. z is pinned to era from the start (fz); x/y relax during warmup.
  const nodes = DATA.nodes.map(n=>Object.assign({}, n, {fz:zOf(n.era||0)}));
  const idset = new Set(nodes.map(n=>n.id));
  const links = DATA.edges
    .filter(e=>idset.has(e.frm)&&idset.has(e.to))
    .map(e=>({frm:e.frm,to:e.to,type:e.type,title:e.title,essay:e.essay,
              era:e.era,influence:e.influence, source:e.frm, target:e.to}));
  // parallel edges between the same directed pair get alternating curvature offsets
  const pairCount={}, pairSeen={};
  links.forEach(l=>{ const k=l.frm+'->'+l.to; pairCount[k]=(pairCount[k]||0)+1; });
  links.forEach(l=>{ const k=l.frm+'->'+l.to, n=pairCount[k];
    if(n>1){ const i=(pairSeen[k]=(pairSeen[k]||0)+1); l.curvature=((i%2)?1:-1)*Math.ceil(i/2)*0.28; }
    else l.curvature=0; });

  Graph = ForceGraph3D()(el)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#f6f1e7')
    .showNavInfo(false)
    .enableNodeDrag(false)
    .nodeThreeObject(n=>{
      const group=new THREE.Group();
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(1,16,12),
        new THREE.MeshLambertMaterial({color:tradColor(n.tradition)}));
      group.add(mesh);
      const sprite=makeLabelSprite(n.label);
      group.add(sprite);
      n.__group=group; n.__mesh=mesh; n.__sprite=sprite;
      styleNode(n, currentT());
      return group;
    })
    .nodeLabel(n=>`<div style="font-family:Georgia,serif">
        <b>${esc(n.label)}</b><br>${esc(n.tradition)}<br>
        attested ${yearFmt(n.era)} · ⚡ ${fmtW(n.pw_t)}</div>`)
    .linkColor(l=>{ const w=edgeWeight(l,currentT()); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
    .linkWidth(l=> 0.4+2.6*edgeWeight(l,currentT()))
    .linkVisibility(l=> l.era<=currentT())
    .linkCurvature(l=> l.curvature||0)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .warmupTicks(90)
    .cooldownTime(700)
    .d3AlphaMin(0.004)
    .onEngineStop(()=>{
      if(simReady) return;
      simReady=true;
      applyTimeStyles();
      Graph.zoomToFit(600, 60);
    })
    .onNodeClick(n=> openNode(n.id))
    .onLinkClick(l=>{ const e=DATA.edges.find(x=>x.frm===l.frm&&x.to===l.to&&x.type===l.type); if(e) openEdge(e); })
    .onNodeHover(n=>{ el.style.cursor=n?'pointer':'grab'; })
    .onLinkHover(l=>{ el.style.cursor=l?'pointer':'grab'; });

  Graph.d3Force('charge').strength(-120);
  // Set the full dataset LAST — library creates layout + starts/stops engine in one digest.
  Graph.graphData({nodes, links});

  window.addEventListener('resize', ()=>{
    Graph.width(el.clientWidth).height(el.clientHeight);
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const drawerBody=document.getElementById('drawerBody');
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
document.getElementById('drawerClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function openNode(id){
  const n=byId[id]; if(!n) return;
  const rel=DATA.edges.filter(e=>e.frm===id||e.to===id);
  drawerBody.innerHTML=`
    <div class="meta">batch ${n.batch} · added ${n.date_added} · ${esc(n.tradition)} · attested ${yearFmt(n.era)}</div>
    <h2>${esc(n.label)}</h2>
    <p class="meta" style="font-size:.86rem">⚡ commands ≈ <b>${fmtW(n.pw_t)}</b>
      (${fmtW(n.pw_d)} direct${n.pw_p?` + ${fmtW(n.pw_p)} by proxy`:''})${n.pw_pool?` · pool: ${esc(n.pw_pool)} × witness ${n.pw_ws}`:''}<br>
      <span class="hint">${n.pw_why?esc(n.pw_why):'No industry pool attributed; power flows to it, if at all, by proxy (see edges).'}
      Method: pool × claim-share × witness-strength; single-hop proxy routing.</span></p>
    <p id="essayNode" data-id="${esc(n.id)}">${linkify(n.essay)}</p>
    <h4>Documented interactions (${rel.length})</h4>
    ${rel.map(e=>{const other=e.frm===id?byId[e.to]:byId[e.frm];const dir=e.frm===id?'→':'←';
      return `<div class="edge"><div class="etype">${esc(e.type)}</div>
        <div class="t" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
        <div data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)} ${e.source?`<span class="hint">(${esc(e.source)})</span>`:''}</div>
        <div class="hint">${dir} ${other?esc(other.label):esc(e.frm===id?e.to:e.frm)}</div></div>`;}).join('')}
    <p class="hint">${editMode?'Edit mode ON: click the essay or any edge title/paragraph to correct the language.':'Toggle Edit to correct the language here.'}</p>`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

function openEdge(e){
  const a=byId[e.frm], b=byId[e.to];
  drawerBody.innerHTML=`
    <div class="meta">edge · added ${e.date_added} · attested ${yearFmt(e.era)}</div>
    <div class="etype">${esc(e.type)}</div>
    <h2>${esc(a?a.label:e.frm)} → ${esc(b?b.label:e.to)}</h2>
    <div class="t" style="font-size:1.12rem" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
    <p data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)}</p>
    ${e.source?`<p class="hint">Witness: ${esc(e.source)}</p>`:''}`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

/* ---------- contenteditable arming ---------- */
function armEditables(scope){
  scope.querySelectorAll('#essayNode').forEach(el=>{
    el.contentEditable=true; el.dataset.orig=byId[el.dataset.id].essay;
    el.onblur=()=>{ record('node-essay',{id:el.dataset.id},el.dataset.orig,el.innerText);
      byId[el.dataset.id].essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
  scope.querySelectorAll('[data-et]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.et.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.title;
    el.onblur=()=>{ record('edge-title',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.title=el.innerText; el.dataset.orig=el.innerText; };
  });
  scope.querySelectorAll('[data-ee]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.ee.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.essay;
    el.onblur=()=>{ record('edge-essay',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
}

/* ---------- toolbar wiring ---------- */
document.getElementById('editBtn').onclick=()=>{
  editMode=!editMode;
  const b=document.getElementById('editBtn'); b.textContent='Edit: '+(editMode?'on':'off'); b.classList.toggle('on',editMode);
  if(editMode) armEditables(drawerBody);
  else drawerBody.querySelectorAll('[contenteditable]').forEach(el=>el.contentEditable=false);
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({page:'High Drama — Spirit Graph', exported:new Date().toISOString(), edits},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='high-drama-edits.json'; a.click();
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Discard all your local edits?')){ edits=[]; localStorage.removeItem(LSKEY); location.reload(); }
};
document.getElementById('sizeBtn').onclick=()=>{
  sizeMode = sizeMode==='centrality' ? 'watts' : 'centrality';
  document.getElementById('sizeBtn').textContent='size: '+sizeMode;
  applyTimeStyles();
};

  // Retune forces for a given year: strong/fresh links bind tight, decayed ones stretch;
  // invisible (future) nodes carry no charge; z stays era-pinned.
  function retuneForces(T){
    if(!simReady) return;
    Graph.d3Force('link').distance(l=>24+150*(1-edgeWeight(l,T)))
                        .strength(l=>0.9*edgeWeight(l,T));
    Graph.d3Force('charge').strength(n=> (n.era<=T ? -120 : 0));
    Graph.d3ReheatSimulation();  // safe post-init: layout exists; this is the race-free path
  }

const yearEl=document.getElementById('year'), yearLabel=document.getElementById('yearLabel');
function retime(){
  const T=currentT();
  yearLabel.textContent=yearFmt(T);
  applyTimeStyles();           // visibility, sizes, link paint
  retuneForces(T);             // then let physics flow with the new weights
}
yearEl.addEventListener('input', retime);

let playing=false, playTimer=null;
document.getElementById('playBtn').onclick=()=>{
  const b=document.getElementById('playBtn');
  playing=!playing; b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing);
  if(playing){ playTimer=setInterval(()=>{
    let y=currentT()+10; if(y>2030){ y=-2100; }
    yearEl.value=y; retime();
  },200);} else clearInterval(playTimer);
};

/* search: focus camera on first matching visible node */
document.getElementById('q').addEventListener('change',()=>{
  if(!Graph) return;
  const q=document.getElementById('q').value.trim().toLowerCase(); if(!q) return;
  const gn=Graph.graphData().nodes.find(n=>n.label.toLowerCase().includes(q) && n.era<=currentT());
  if(gn && gn.x!=null){
    const d=120;
    Graph.cameraPosition({x:gn.x,y:gn.y,z:gn.z+d},{x:gn.x,y:gn.y,z:gn.z},900);
  }
});

/* ---------- boot ---------- */
applyEdits();
initGraph();
</script>
