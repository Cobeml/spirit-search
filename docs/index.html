ept on the brass plate.", "source": "[37][14]", "date_added": "2026-10-12", "era": -19, "excerpts": [{"text": "Because he traced his descent from her through many generations: he willed that the place of the second month should belong to Venus.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}], "influence": 0.0}, {"frm": "pericles", "to": "athene", "type": "transmission", "title": "The city as the god", "essay": "Pericles offers Athens as 'the school of Hellas' [44]; Minerva's Quinquatrus made the school the goddess's tithe zone [36]. The flesh-record statesman packages the polis itself as the cult object for which the dead are payment.", "source": "[44][36]", "date_added": "2026-10-12", "era": -431, "excerpts": [{"text": "In short, I say that as a city we are the school of Hellas, while I doubt if the world can produce a man who, where he has only himself to depend upon, is equal to so many emergencies, and graced by so happy a versatility, as the Athenian.", "source_id": 44, "source_title": "Thucydides 2.34-46, Pericles Funeral Oration, trans. Jowett (Hanover excerpt)", "source_url": "https://history.hanover.edu/courses/excerpts/111pericles.html"}], "influence": 0.3}, {"frm": "fdr", "to": "cincinnatus", "type": "analogy", "title": "The sixteenth day, not scheduled", "essay": "FDR asks Congress for 'broad Executive power to wage a war against the emergency' equal to repelling an invasion [45]; Cinccinatus got exactly that power and gave it back on the sixteenth day [33]. The graph records both scripts; the loan instruments are identical, the repayment terms not.", "source": "[45][33]", "date_added": "2026-10-12", "era": 1933, "excerpts": [{"text": "The only thing we have to fear is fear itself--nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance.", "source_id": 45, "source_title": "Franklin D. Roosevelt, First Inaugural Address, 1933 (Avalon Project)", "source_url": "https://avalon.law.yale.edu/20th_century/froos1.asp"}], "influence": 0.0}, {"frm": "fdr", "to": "george-washington", "type": "transmission", "title": "The office projects the founders", "essay": "The presidency inherits the tutelary's furniture: the office Washington organized is the office FDR asks to expand toward war footing [45]. The share routed is the national pool itself.", "source": "[45][16]", "date_added": "2026-10-12", "era": 1933, "excerpts": [{"text": "The only thing we have to fear is fear itself--nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance.", "source_id": 45, "source_title": "Franklin D. Roosevelt, First Inaugural Address, 1933 (Avalon Project)", "source_url": "https://avalon.law.yale.edu/20th_century/froos1.asp"}], "influence": 0.2}, {"frm": "hecate", "to": "zeus", "type": "transmission", "title": "Grandfathered in all three jurisdictions", "essay": "'The son of Cronos did her no wrong nor took anything away' [26]: the redistribution of Olympus stops at her file. She collects from the sovereign order precisely because the order could not collect from her.", "source": "[26]", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "influence": 0.2}, {"frm": "mnemosyne", "to": "zeus", "type": "kinship", "title": "Mother of the house songbook", "essay": "The Muses who praise Zeus's distributions are Mnemosyne's daughters [26]; the court's memory department is married into the throne, and the chronicle sings accordingly.", "source": "[26]", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "influence": 0.2}, {"frm": "thetis", "to": "xanthus-balius", "type": "transmission", "title": "Both price the gift of gods to mortals", "essay": "Thetis counts the span, Zeus counts the grief-loan terms on the horses [1]; both notes state that immortality attached to flesh record is not advantage, only accounting.", "source": "[1]", "date_added": "2026-10-12", "era": -750, "excerpts": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "influence": 0.0}, {"frm": "castor-polydeuces", "to": "paris-alexandrus", "type": "conflict", "title": "The brothers decline the war", "essay": "Helen herself assigns their absence its motive: 'for the shame and disgrace that I have brought upon them' [1]. The twin gods of the horse-race withdraw from the Trojan account as reputational risk.", "source": "[1]", "date_added": "2026-10-12", "era": -750, "excerpts": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "influence": 0.0}, {"frm": "typhoeus", "to": "zeus", "type": "conflict", "title": "The last firewall test", "essay": "Earth's youngest almost took the throne: 'he would have come to reign... had not the father of men and gods been quick to perceive it' [26]. The conflict line is the annealing moment of Zeus's power; after the spike there are no more contenders.", "source": "[26]", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "influence": 0.3}, {"frm": "odin", "to": "yggdrasil", "type": "transmission", "title": "The tree is the gallows-library", "essay": "Odin hangs 'on a wind-rocked tree... to Odin offered, myself to myself' [46]; the world-tree serves here as instrument of self-extraction, the branch on which knowledge is bartered from one's own body.", "source": "[46]", "date_added": "2026-10-12", "era": 1100, "excerpts": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "influence": 0.2}, {"frm": "thor", "to": "volundr", "type": "analogy", "title": "Tools against the costs of flesh", "essay": "Thor's entire function is the hammer that answers the giants,and Völund's smith-work is the Edda's other documented product line of tool-power [24][46]. The tradition's arms makers and arms wielders sit closer together than the saga's axes say.", "source": "[46][24]", "date_added": "2026-10-12", "era": 1100, "excerpts": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "influence": 0.0}, {"frm": "baldr", "to": "machaon", "type": "analogy", "title": "The one death the healers cannot bill", "essay": "Baldr falls to the plant overlooked in the inventory [46]; Machaon's line ends under the same arithmetic of the one wound no healer was counted worth [3]. Both gods store the lesson that the healable world stops at its chosen exception.", "source": "[46][1]", "date_added": "2026-10-12", "era": -750, "excerpts": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/ date_added": "2026-10-12", "era": 1100, "excerpts": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "influence": 0.1}, {"frm": "sulla", "to": "apollo", "type": "transmission", "title": "The amulet with the surname rider", "essay": "The small golden Apollo went bosom-carried into battle, addressed by name as the client-stabilizer: 'Fortunate Cornelius Sylla' rents the Pythian against every campaign outcome [47]. The client's trust is a contract affirmed in threats: 'wilt thou now cast him down?' The god's answer is the only one on record that is read as loyalty. The naming-rights deal outlasts the battlefield.", "source": "[47]", "date_added": "2026-10-12", "era": -82, "excerpts": [{"text": "There is a story that he had a small golden image of Apollo from Delphi, which he was always wont in battle to carry about him in his bosom.", "source_id": 47, "source_title": "Plutarch, Sylla, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Plutarch/sylla.html"}], "influence": 0.3}, {"frm": "sulla", "to": "cincinnatus", "type": "conflict", "title": "The resignation that proves nothing", "essay": "Both men leave the dictatorship alive, and that is the entire contrast: the office returned at day sixteen is the Republic's founding proof of the rule [33]; the office returned after the proscriptions is the counter-proof that the office itself had already changed the man holding it [48]. Each resignation narrates the other.", "source": "[48][33]", "date_added": "2026-10-12", "era": -82, "excerpts": [{"text": "In 79 Sulla resigned his dictatorship and retired to Puteoli, where he died in the following year.", "source_id": 48, "source_title": "EB1911, \"Sulla, Lucius Cornelius\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Sulla,_Lucius_Cornelius"}], "influence": 0.0}, {"frm": "galen", "to": "hippocrates", "type": "transmission", "title": "The surname of the ascribed line", "essay": "Galen files Hippocrates as the correct fork in the elder schism: nature artistic and equitable rather than atomic chance [53]. The Asclepiadae descent [3] becomes a theory of matter; kinship here is doctrinal inheritance, the family brand kept as physics.", "source": "[53][42]", "date_added": "2026-10-12", "era": 170, "excerpts": [{"text": "Nature acts throughout in an artistic and equitable manner, having certain faculties, by virtue of which each part of the body draws to itself the juice which is proper to it.", "source_id": 53, "source_title": "Galen, On the Natural Faculties, trans. Brock (MIT Classics)", "source_url": "https://classics.mit.edu/Galen/natfac.mb.txt"}], "influence": 0.3}, {"frm": "newton", "to": "minerva", "type": "analogy", "title": "The desk half of war extended", "essay": "Minerva's fasti file includes the school-fees line and the hundred crafts; the Royal Society register is the same office, motions recorded 'as well as' campaigns further south and war-machines unwritten [50][36]. The goddess who collects the pennies also collects the calculus.", "source": "[50][36]", "date_added": "2026-10-12", "era": 1687, "excerpts": [{"text": "This treatise De Motu was the germ of the Principia.", "source_id": 50, "source_title": "EB1911, \"Newton, Sir Isaac\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Newton,_Sir_Isaac"}], "influence": 0.0}, {"frm": "faraday", "to": "benjamin-franklin", "type": "transmission", "title": "The kite becomes the motor", "essay": "Franklin bottled the sky's electricity [40]; Faraday's diary converts magnetism into that electricity on demand [51]. The transmission is laboratory-thick: same fire, metered by persistence, devices instead of gifts.", "source": "[51][40]", "date_added": "2026-10-12", "era": 1831, "excerpts": [{"text": "He still persevered, and on the 29th of August 1831 he obtained the first evidence that an electric current can produce another in a different circuit.", "source_id": 51, "source_title": "EB1911, \"Faraday, Michael\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Faraday,_Michael"}], "influence": 0.2}, {"frm": "ampere", "to": "faraday", "type": "transmission", "title": "Crumbs into currents", "essay": "Ampère abstracts counting out of biscuit crumbs [49]; Faraday magnets current out of coils [51]. The units interconvert because the men hold pieces of the same table. The SI assigns their names to quantities that still resemble the kitchen supplies.", "source": "[49][51]", "date_added": "2026-10-12", "era": 1775, "excerpts": [{"text": "He took a passionate delight in the pursuit of knowledge from his very infancy, and is reported to have worked out long arithmetical sums by means of pebbles and biscuit crumbs before he knew the figures.", "source_id": 49, "source_title": "EB1911, \"Ampère, André Marie\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Amp%C3%A8re,_Andr%C3%A9_Marie"}], "influence": 0.3}, {"frm": "joule", "to": "james-watt", "type": "transmission", "title": "The audit of power", "essay": "Five hundred-plus foot-pounds per unit of heat [52]; power sold 'what all the world desires' [39]. Joule provides the conversion table in which Watt's retail commodity is denominated; the two units are conjugate in every modern bill of lading for heat and work.", "source": "[52][39]", "date_added": "2026-10-12", "era": 1847, "excerpts": [{"text": "This inquiry yielded (in 1867) the result 783... repeated with every precaution, and again indicated 772.55 foot-pounds.", "source_id": 52, "source_title": "EB1911, \"Joule, James Prescott\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Joule,_James_Prescott"}], "influence": 0.3}, {"frm": "zeus", "to": "hera", "type": "marriage", "title": "The last wife", "essay": "Hesiod's list of the sovereign's consorts closes with the one who shares the throne-name: 'Lastly, he made Hera his blooming wife' [26]. The marriage is registered last because it sticks; the tradition files the earlier unions as procurements and this one as co-tenancy of Olympus. ([26] Theogony, ll. 921-923)", "source": "[26] Theogony 921-923", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "influence": 0.0}, {"frm": "hera", "to": "hephaestus", "type": "kinship", "title": "Born of the quarrel", "essay": "Answer to the head-birth: Zeus brings forth Athene alone from his skull, 'But Hera without union with Zeus, for she was very angry and quarrelled with her mate, bare famous Hephaestus, who is skilled in crafts more than all the sons of Heaven' [26]. The forge on Olympus is the wife's entry in the rivalry of self-sufficient birth. ([26] Theogony, ll. 924-929)", "source": "[26] Theogony 927-929", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "influence": 0.2}, {"frm": "hephaestus", "to": "aphrodite", "type": "marriage", "title": "The lame husband", "essay": "Demodocus sings it as common knowledge: the intrigue of Ares and Aphrodite 'in the house of Vulcan', 'King Vulcan's marriage bed' [54]. The Odyssey's divine household pairs the craft-god's throne with desire's, and the mismatch is the joke the whole pantheon attends in person. ([54] Od. 8.267ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "influence": 0.0}, {"frm": "hephaestus", "to": "ares", "type": "conflict", "title": "The invisible net", "essay": "Alerted by the Sun, the smith 'got his great anvil into its place, and began to forge some chains which none could either unloose or break', festoons the bed 'all over with chains like cobwebs', and holds Ares fast until ransom terms are settled [54]. Craft triumphs over war once, in the court poem, and collects bail from the sea. ([54] Od. 8.272ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "influence": 0.0}, {"frm": "ares", "to": "aphrodite", "type": "interaction", "title": "The adultery sung at court", "essay": "'The loves of Mars and Venus, and how they first began their intrigue in the house of Vulcan' [54]: Homer's boldest divine episode assigns the war-god desire and shows both published by the Sun, netted by the smith, and bailed by the sea. The tradition likes them together precisely as an exposure story. ([54] Od. 8.266ff)", "source": "[54] Od. 8", "date_added": "2026-10-12", "era": -700, "excerpts": [{"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "influence": 0.0}, {"frm": "apollo", "to": "achilles", "type": "conflict", "title": "Thrice beaten from the wall", "essay": "At Troy's wall the rampage of Patroclus meets no proxy: 'thrice did Patroclus charge at an angle of the high wall, and thrice did Apollo beat him back, striking his shield with his own immortal hands' [1]. The horse Xanthus later gives the autopsy of the aristeia's end: it was 'the mighty god whom lovely Leto bore' that slew Patroclus and 'vouchsafed a triumph to Hector' [1]. Apollo is the creditor who moves against Achilles' house in two installments: the friend first, then his own death's foretelling. ([1] Il. 16.698ff; Il. 19.404ff)", "source": "[1] Il. 16, 19", "date_added": "2026-10-12", "era": -750, "excerpts": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "influence": 0.0}, {"frm": "erinyes", "to": "xanthus-balius", "type": "interaction", "title": "Censors of the speaking horse", "essay": "Granted a human voice by Hera, Xanthus prophesies his master's death, and the permission has a limit: 'When he had thus said the Erinyes stayed his speech' [1]. Even a dispensation from Olympus answers to the old licenses; the speaking animal is silenced by the powers of curse and due measure. ([1] Il. 19.418)", "source": "[1] Il. 19", "date_added": "2026-10-12", "era": -750, "excerpts": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "influence": 0.0}, {"frm": "juno", "to": "erinyes", "type": "interaction", "title": "The queen rents Allecto", "essay": "When fate will not bar the Trojan from Italy, Juno procures the war from below: she descends to the Stygian flood, raises the Fury Allecto, and the poem sneers its own receipt, 'An act that well became the wife of Jove' [35]. The tutelary of women financing a vendetta with the underworld's barrister: the Greek curse-demons at Roman state retainers. ([35] Aen. 7.286ff, 7.323ff)", "source": "[35] Aen. 7", "date_added": "2026-10-12", "era": -19, "excerpts": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "influence": 0.0}], "sources": [{"id": 1, "url": "https://classics.mit.edu/Homer/iliad.mb.txt", "title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)"}, {"id": 2, "url": "https://classics.mit.edu/Plato/ion.html", "title": "Plato, Ion, trans. Jowett (MIT Classics)"}, {"id": 3, "url": "https://www.theoi.com/Text/Pausanias3B.html", "title": "Pausanias 3, trans. Jones 1918 (Loeb, via theoi.com)"}, {"id": 4, "url": "https://www.gutenberg.org/cache/epub/6341/pg6341.txt", "title": "Hoffmann, Nachtstücke 1816, Der Sandmann (Gutenberg #6341)"}, {"id": 5, "url": "https://archive.org/details/freud-1925-cp-5", "title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)"}, {"id": 6, "url": "http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0010", "title": "Aeschylus, Prometheus Bound, trans. Smyth, Loeb 1926 (Perseus)"}, {"id": 7, "url": "https://en.wikisource.org/wiki/Protagoras_%28Jowett%29", "title": "Plato, Protagoras, trans. Jowett 1871 (Wikisource)"}, {"id": 8, "url": "https://archive.org/stream/the-question-concerning-technology-1/The%20Question%20Concerning%20Technology%20%281%29_djvu.txt", "title": "Heidegger, QCT, trans. Lovitt 1977 (IN COPYRIGHT; OCR for verification only)"}, {"id": 9, "url": "https://en.wikisource.org/wiki/The_works_of_Horace/Second_Book_of_Epistles", "title": "Horace, Epistles II, trans. C. Smart 1856 (Wikisource)"}, {"id": 10, "url": "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Censorinus/text*.html", "title": "Censorinus, De Die Natali ch.2-3, Latin (LacusCurtius)"}, {"id": 11, "url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5", <script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = {}; DATA.nodes.forEach(n=>byId[n.id]=n);

/* ---------- edit tracking (localStorage v2) ---------- */
const LSKEY='highdrama_edits_v2';
let edits = JSON.parse(localStorage.getItem(LSKEY)||'[]');
let editMode=false;
const editStatus=document.getElementById('editStatus');
function showEditStatus(){ editStatus.textContent = edits.length? `${edits.length} local edit(s)` : ''; }
function applyEdits(){
  edits.forEach(e=>{
    if(e.kind==='node-essay' && byId[e.id]) byId[e.id].essay=e.new;
    if(e.kind==='edge-title'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.title=e.new;}
    if(e.kind==='edge-essay'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.essay=e.new;}
  });
  showEditStatus();
}
function record(kind, idOrEdge, oldVal, newVal){
  if(oldVal===newVal) return;
  const rec = Object.assign({kind, old:oldVal, new:newVal, ts:new Date().toISOString()}, idOrEdge);
  function kindrec(e){ return e.kind==='node-essay'? {id:e.id} : {frm:e.frm,to:e.to,type:e.type}; }
  const key = JSON.stringify([kind, idOrEdge]);
  const ix = edits.findIndex(e=>JSON.stringify([e.kind, kindrec(e)])===key);
  if(ix>=0){ rec.old = edits[ix].old; edits[ix]=rec; } else edits.push(rec);
  localStorage.setItem(LSKEY, JSON.stringify(edits));
  showEditStatus();
}

/* ---------- helpers ---------- */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return esc(t).replace(/\[(\d+)\]/g,(m,n)=>{
    const s=DATA.sources.find(s=>s.id==n);
    return s? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m;
  });
}
function fmtW(w){ if(!w) return '0 W';
  if(w>=1e12) return (w/1e12).toPrecision(3)+' TW'; if(w>=1e9) return (w/1e9).toPrecision(3)+' GW';
  if(w>=1e6) return (w/1e6).toPrecision(3)+' MW'; if(w>=1e3) return (w/1e3).toPrecision(3)+' kW';
  return Math.round(w)+' W'; }
function yearFmt(y){ return y<0? (-y)+' BCE' : y+' CE'; }

/* ---------- time model ---------- */
const ZMIN=-2100, ZMAX=2030, ZSPAN=320;
function zOf(era){ return ((era-ZMIN)/(ZMAX-ZMIN))*ZSPAN - ZSPAN/2; }
function currentT(){ return parseInt(document.getElementById('year').value,10); }
function edgeWeight(e,T){ if(e.era>T) return 0; return Math.exp(-(T-e.era)/250); }
function nodeCentrality(id,T){ let s=0; for(const e of DATA.edges){ if(e.frm===id||e.to===id) s+=edgeWeight(e,T); } return s; }
let sizeMode='centrality';
function nodeSize(n,T){
  if(sizeMode==='watts') return 1.8+1.5*Math.max(0,Math.log10(Math.max(n.pw_t,1)));
  return 3.0+3.4*Math.sqrt(nodeCentrality(n.id,T));
}

/* ---------- colors ---------- */
const PALETTE=['#7a4a1f','#3b6ea5','#5e7f3c','#8e3b46','#6a5a8e','#a5762b','#2f7d6d','#945e9a','#8c2f2f','#4c6b8a'];
function tradColor(t){ let h=0; for(const c of (t||'')) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

/* ---------- 3D graph ---------- */
let Graph=null, simReady=false;

function makeLabelSprite(text){
  const label = (text.length>24? text.slice(0,23)+'…':text);
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const font='44px Georgia, serif';
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(label).width)+16;
  cv.width=w; cv.height=64;
  ctx.font=font; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(43,38,32,0.92)';
  ctx.fillText(label,8,34);
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4; tex.minFilter=THREE.LinearFilter; tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const h=6; spr.scale.set(h*w/64, h, 1);
  return spr;
}

function styleNode(n,T){
  const g=n.__group; if(!g) return;
  const vis = n.era<=T;
  g.visible = vis;
  if(!vis) return;
  const s=nodeSize(n,T);
  n.__mesh.scale.setScalar(s);
  n.__sprite.position.set(0, s+3.2, 0);
}

function applyLinkStyles(){
  const T=currentT();
  // Re-apply style accessors with fresh closures: re-renders link visuals ONLY.
  // Does NOT touch graphData or the simulation, so engineRunning stays false
  // and tickFrame never calls layout.tick -> no race, no reheat, no pop-in.
  Graph.linkVisibility(l=> l.era<=T)
       .linkColor(l=>{ const w=edgeWeight(l,T); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
       .linkWidth(l=> 0.4+2.6*edgeWeight(l,T));
}

function applyTimeStyles(){
  if(!Graph) return;
  const T=currentT();
  Graph.graphData().nodes.forEach(n=>styleNode(n,T));  // engine nodes carry the meshes
  applyLinkStyles();
}

function initGraph(){
  const el=document.getElementById('graph');
  const T0=currentT();

  // Build data ONCE. z is pinned to era from the start (fz); x/y relax during warmup.
  const nodes = DATA.nodes.map(n=>Object.assign({}, n, {fz:zOf(n.era||0)}));
  const idset = new Set(nodes.map(n=>n.id));
  const links = DATA.edges
    .filter(e=>idset.has(e.frm)&&idset.has(e.to))
    .map(e=>({frm:e.frm,to:e.to,type:e.type,title:e.title,essay:e.essay,
              era:e.era,influence:e.influence, source:e.frm, target:e.to}));
  // parallel edges between the same directed pair get alternating curvature offsets
  const pairCount={}, pairSeen={};
  links.forEach(l=>{ const k=l.frm+'->'+l.to; pairCount[k]=(pairCount[k]||0)+1; });
  links.forEach(l=>{ const k=l.frm+'->'+l.to, n=pairCount[k];
    if(n>1){ const i=(pairSeen[k]=(pairSeen[k]||0)+1); l.curvature=((i%2)?1:-1)*Math.ceil(i/2)*0.28; }
    else l.curvature=0; });

  Graph = ForceGraph3D()(el)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#f6f1e7')
    .showNavInfo(false)
    .enableNodeDrag(false)
    .nodeThreeObject(n=>{
      const group=new THREE.Group();
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(1,16,12),
        new THREE.MeshLambertMaterial({color:tradColor(n.tradition)}));
      group.add(mesh);
      const sprite=makeLabelSprite(n.label);
      group.add(sprite);
      n.__group=group; n.__mesh=mesh; n.__sprite=sprite;
      styleNode(n, currentT());
      return group;
    })
    .nodeLabel(n=>`<div style="font-family:Georgia,serif">
        <b>${esc(n.label)}</b><br>${esc(n.tradition)}<br>
        attested ${yearFmt(n.era)} · ⚡ ${fmtW(n.pw_t)}</div>`)
    .linkColor(l=>{ const w=edgeWeight(l,currentT()); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
    .linkWidth(l=> 0.4+2.6*edgeWeight(l,currentT()))
    .linkVisibility(l=> l.era<=currentT())
    .linkCurvature(l=> l.curvature||0)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .warmupTicks(90)
    .cooldownTime(700)
    .d3AlphaMin(0.004)
    .onEngineStop(()=>{
      if(simReady) return;
      simReady=true;
      applyTimeStyles();
      Graph.zoomToFit(600, 60);
    })
    .onNodeClick(n=> openNode(n.id))
    .onLinkClick(l=>{ const e=DATA.edges.find(x=>x.frm===l.frm&&x.to===l.to&&x.type===l.type); if(e) openEdge(e); })
    .onNodeHover(n=>{ el.style.cursor=n?'pointer':'grab'; })
    .onLinkHover(l=>{ el.style.cursor=l?'pointer':'grab'; });

  Graph.d3Force('charge').strength(-120);
  // Set the full dataset LAST — library creates layout + starts/stops engine in one digest.
  Graph.graphData({nodes, links});

  window.addEventListener('resize', ()=>{
    Graph.width(el.clientWidth).height(el.clientHeight);
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');

function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }

/* one excerpt/highlight card: blockquote + citation line (+ optional proposed tag) */
function excerptHtml(x, proposed){
  const cite = x.source_url
    ? `<a class="cite" href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc(x.source_title||x.source_url)}</a>`
    : esc(x.source_title||'');
  return `<div class="hl${proposed?' proposed':''}">
    ${proposed?'<span class="tag-proposed">proposed</span>':''}
    <blockquote>${esc(x.text)}</blockquote>
    <div class="cite-line">— ${cite}${x.cluster?`<span class="cluster">${esc(x.cluster)}</span>`:''}</div>
  </div>`;
}

function openNode(id){
  const n=byId[id]; if(!n) return;
  const rel=DATA.edges.filter(e=>e.frm===id||e.to===id);
  const hl=(n.highlights||[]);
  const props=(n.proposals||[]);
  const mainBlock = hl.length
    ? `<h4 class="sec">Highlights (${hl.length})</h4>${hl.map(x=>excerptHtml(x,false)).join('')}`
    : `<p id="essayNode" data-id="${esc(n.id)}">${linkify(n.essay)}</p>`;
  const propBlock = props.length
    ? `<details class="proposals"><summary>Proposed connections (from corpus) · ${props.length}</summary>
         ${props.map(x=>excerptHtml(x,true)).join('')}</details>` : '';
  drawerBody.innerHTML=`
    <div class="meta">batch ${n.batch} · added ${n.date_added} · ${esc(n.tradition)} · attested ${yearFmt(n.era)}</div>
    <h2>${esc(n.label)}</h2>
    <p class="meta" style="font-size:.86rem">⚡ commands ≈ <b>${fmtW(n.pw_t)}</b>
      (${fmtW(n.pw_d)} direct${n.pw_p?` + ${fmtW(n.pw_p)} by proxy`:''})${n.pw_pool?` · pool: ${esc(n.pw_pool)} × witness ${n.pw_ws}`:''}<br>
      <span class="hint">${n.pw_why?esc(n.pw_why):'No industry pool attributed; power flows to it, if at all, by proxy (see edges).'}
      Method: pool × claim-share × witness-strength; single-hop proxy routing.</span></p>
    ${mainBlock}
    ${propBlock}
    <h4>Documented interactions (${rel.length})</h4>
    ${rel.map(e=>{const other=e.frm===id?byId[e.to]:byId[e.frm];const dir=e.frm===id?'→':'←';
      const body=(e.excerpts&&e.excerpts.length)
        ? e.excerpts.map(x=>excerptHtml(x,false)).join('')
        : `<div data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)} ${e.source?`<span class="hint">(${esc(e.source)})</span>`:''}</div>`;
      return `<div class="edge"><div class="etype">${esc(e.type)}</div>
        <div class="t" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
        ${body}
        <div class="hint">${dir} ${other?esc(other.label):esc(e.frm===id?e.to:e.frm)}</div></div>`;}).join('')}
    <p class="hint">${editMode?'Edit mode ON: click an editable essay or edge title to correct the language.':'Toggle Edit to correct the language here.'}</p>`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

function openEdge(e){
  const a=byId[e.frm], b=byId[e.to];
  const exc=(e.excerpts||[]);
  const body = exc.length
    ? `<h4 class="sec">Excerpts (${exc.length})</h4>${exc.map(x=>excerptHtml(x,false)).join('')}`
    : `<p data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)}</p>`;
  drawerBody.innerHTML=`
    <div class="meta">edge · added ${e.date_added} · attested ${yearFmt(e.era)}</div>
    <div class="etype">${esc(e.type)}</div>
    <h2>${esc(a?a.label:e.frm)} → ${esc(b?b.label:e.to)}</h2>
    <div class="t" style="font-size:1.12rem" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
    ${e.influence!=null?`<p class="meta">influence: <b>${(+e.influence).toFixed(2)}</b></p>`:''}
    ${body}
    ${e.source?`<p class="hint">Witness: ${esc(e.source)}</p>`:''}`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

/* ---------- contenteditable arming ---------- */
function armEditables(scope){
  scope.querySelectorAll('#essayNode').forEach(el=>{
    el.contentEditable=true; el.dataset.orig=byId[el.dataset.id].essay;
    el.onblur=()=>{ record('node-essay',{id:el.dataset.id},el.dataset.orig,el.innerText);
      byId[el.dataset.id].essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
  scope.querySelectorAll('[data-et]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.et.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.title;
    el.onblur=()=>{ record('edge-title',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.title=el.innerText; el.dataset.orig=el.innerText; };
  });
  scope.querySelectorAll('[data-ee]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.ee.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.essay;
    el.onblur=()=>{ record('edge-essay',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
}

  // Retune forces for a given year: strong/fresh links bind tight, decayed ones stretch;
  // invisible (future) nodes carry no charge; z stays era-pinned.
  function retuneForces(T){
    if(!simReady) return;
    Graph.d3Force('link').distance(l=>24+150*(1-edgeWeight(l,T)))
                        .strength(l=>0.9*edgeWeight(l,T));
    Graph.d3Force('charge').strength(n=> (n.era<=T ? -120 : 0));
    Graph.d3ReheatSimulation();  // safe post-init: layout exists; this is the race-free path
  }

const yearEl=document.getElementById('year'), yearLabel=document.getElementById('yearLabel');
function retime(){
  const T=currentT();
  yearLabel.textContent=yearFmt(T);
  applyTimeStyles();           // visibility, sizes, link paint
  retuneForces(T);             // then let physics flow with the new weights
}
yearEl.addEventListener('input', retime);

let playing=false, playTimer=null;
document.getElementById('playBtn').onclick=()=>{
  const b=document.getElementById('playBtn');
  playing=!playing; b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing);
  if(playing){ playTimer=setInterval(()=>{
    let y=currentT()+10; if(y>2030){ y=-2100; }
    yearEl.value=y; retime();
  },200);} else clearInterval(playTimer);
};

/* ---------- corpus search (search server on :8788) ---------- */
const SEARCH_API='http://127.0.0.1:8788/search';
let searchMode='hybrid';
const csInput=document.getElementById('corpusSearch');
const csResults=document.getElementById('searchResults');
document.getElementById('searchModeSeg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    searchMode=b.dataset.mode;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(csInput.value.trim()) runCorpusSearch();
  };
});
function markTerms(snippet, q){
  let out=esc(snippet);
  const terms=q.trim().split(/\s+/).filter(Boolean).slice(0,8);
  for(const t of terms){
    const re=new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  }
  return out;
}
let searchTimer=null;
csInput.addEventListener('input',()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(runCorpusSearch,220); });
csInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); runCorpusSearch(); } });
document.addEventListener('click',e=>{
  if(!document.getElementById('searchWrap').contains(e.target)) csResults.classList.remove('open');
});
async function runCorpusSearch(){
  const q=csInput.value.trim();
  if(!q){ csResults.classList.remove('open'); csResults.innerHTML=''; return; }
  let data;
  try{
    const res=await fetch(`${SEARCH_API}?q=${encodeURIComponent(q)}&k=10&mode=${encodeURIComponent(searchMode)}`);
    if(!res.ok) throw new Error('bad status '+res.status);
    data=await res.json();
  }catch(err){
    csResults.innerHTML=`<div id="searchNote">search server offline (research/_search_server.py on :8788)</div>`;
    csResults.classList.add('open');
    return;
  }
  const items=(data&&data.results)||[];
  csResults.innerHTML = items.length
    ? items.map(r=>`<div class="sr-item">
        <div class="sr-snip">${markTerms(r.snippet||r.text||'', q)}</div>
        <div class="sr-meta">${r.url?`<a class="cite" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title||r.url)}</a>`:esc(r.title||'')}${r.cluster?` · ${esc(r.cluster)}`:''}</div>
      </div>`).join('')
    : `<div id="searchNote">no results</div>`;
  csResults.classList.add('open');
}

/* search: focus camera on first matching visible node */
document.getElementById('q').addEventListener('change',()=>{
  if(!Graph) return;
  const q=document.getElementById('q').value.trim().toLowerCase(); if(!q) return;
  const gn=Graph.graphData().nodes.find(n=>n.label.toLowerCase().includes(q) && n.era<=currentT());
  if(gn && gn.x!=null){
    const d=120;
    Graph.cameraPosition({x:gn.x,y:gn.y,z:gn.z+d},{x:gn.x,y:gn.y,z:gn.z},900);
  }
});
