<style>

           padding:.4rem .55rem;color:var(--ink);flex:1;min-width:160px;}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:6px;
           padding:.4rem .7rem;cursor:pointer;color:var(--ink);white-space:nowrap;}
  button:hover{border-color:var(--accent);}
  button.on{background:var(--accent);color:var(--paper);border-color:var(--accent);}
  .tgroup{display:flex;align-items:center;gap:.4rem;}
  input[type=range]{width:160px;accent-color:var(--accent);}
  #yearLabel{min-width:72px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--faint);}
  .hint{font-size:.78rem;color:var(--faint);}

  /* drawer */

         transition:opacity .22s ease;z-index:20;}
  #scrim.open{opacity:1;pointer-events:auto;}
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(43,38,32,.12);
          transform:translateX(102%);transition:transform .24s ease;z-index:21;
          display:flex;flex-direction:column;}

  #drawerClose{position:absolute;top:.6rem;right:.7rem;border:none;background:transparent;
          font-size:1.5rem;line-height:1;padding:.2rem .4rem;color:var(--faint);}

  .edge{border-top:1px dashed var(--line);padding:.6rem 0;}
  .edge .t{font-weight:600;font-size:1rem;}
  a.cite{color:var(--accent);text-decoration:none;}

  [contenteditable=true]{outline:1.5px dashed var(--accent);outline-offset:3px;background:#fffef4;}
  p{text-align:justify;}
  @media(max-width:860px){
    #drawer{width:100%;height:76vh;top:auto;bottom:0;left:0;right:0;border-left:none;
            border-top:1px solid var(--line);border-radius:14px 14px 0 0;
            transform:translateY(102%);box-shadow:0 -10px 34px rgba(43,38,32,.14);}

<script id="data" type="application/json">{"nodes": [{"id": "asclepius", "label": "Asclepius", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 30000000000.0, "pw_p": 5000000000.0, "pw_t": 35000000000.0, "pw_e": 737222604.793, "pw_pool": "P_health", "pw_why": "Pandemic-scale healing cult of the ancient world; father-source of Machaon line [1][3]; Apollo/Asculapius branding persists on modern medicine.", "pw_ws": 1.0, "essay": "Born in fire and reared by a horse. Apollo 'killed Coronis. As she was burning, he snatched the babe from the pyre and brought it to Chiron, the centaur, by whom he was brought up and taught the arts of healing and hunting' [34]. The mythographer then states plainly what the cult had to believe: he 'not only prevented some from dying, but even raised up the dead', armed with the Gorgon's two bloods from Athena, one side bane, the other salvation [34], and the witnesses queue up their raised dead with bibliography: Capaneus, Hippolytus, Tyndareus, Hymenaeus, Glaucus, each tagged to Stesichorus or Panyasis or Melesagoras [34]. The punishment follows the same accounting: 'Zeus, fearing that men might acquire the healing art from him and so come to the rescue of each other, smote him with a thunderbolt' [34]. Behind all this the Iliad gives the office its catalogue price, sons who are 'skilled in the art of healing' leading thirty ships [1], and the Homeric Hymn reduces the god to his function, 'healer of sickness' [30]. His salience problem runs opposite Machaon's: the myth grew to violate the decree of death itself; what perished in the telling is the man."}, {"id": "athene", "label": "Athene", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 100000000000.0, "pw_p": 0.0, "pw_t": 100000000000.0, "pw_e": 2106350299.408, "pw_pool": "P_metals", "pw_why": "Co-owner of the burgled crafts with Hephaestus [7].", "pw_ws": 1.0, "essay": "Athene's credentials in this corpus are all mechanisms of retention. Born through the skull of the father who ate her mother to prevent her birth [26], she surfaces 'arrayed in arms of war' and joins Hephaestus as co-teacher of the crafts that move men out of caves [30]; Plato credits half of Prometheus' burglary to her workshop [7][27]. Her own voice arrives only in the Eumenides, and it is the voice of an officeholder. Founding the Areopagus she addresses the city as an equal body at law: 'Hear now my ordinance, people of Attica, as you judge the first trial for bloodshed... this court of judges will always exist for the people of Aegeus' [31]. Her single great constitutional sentence follows: 'Neither anarchy nor tyranny--this I counsel my citizens to support and respect, and not to drive fear wholly out of the city' [31]. And facing down the Furies she reveals her reserve account: 'I alone of the gods know the keys to the house where his thunderbolt is sealed. But there is no need of that. So yield to my counsel' [31]. Threat, in her register, is a tool of last resort precisely because it is banked. Zeus rules by holding power; Athene by knowing where it is locked."}, {"id": "chiron", "label": "Chiron", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 24000000000.0, "pw_t": 24000000000.0, "pw_e": 505524071.858, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The centaur enters the poem by inventory. When Menelaus is wounded under the truce, Machaon draws the arrow and applies 'soothing drugs which Chiron had given to Aesculapius out of the good will he bore him' [1]. When Eurypylus is hit, he begs for the herbs 'shown you by Achilles, who was himself shown them by Chiron, most righteous of all the centaurs' [1]. And the spear none but Achilles can lift is 'the ashen spear from Mount Pelion, which Chiron had cut upon a mountain top and had given to Peleus, wherewith to deal out death among heroes' [1]. the Iliad's only centaur is thus an ontological anomaly, the just beast, dispenser of salves and a murderous spear, teacher of the art of healing by way of Apollo's orphan and Achilles both. Apollodorus documents his birth as a kidding: 'to Cronus and Philyra was born Chiron, a centaur of double form' [28], and his rearing of Asclepius as a foster-parentage purchased with the boy's mother's pyre [34]. He commands nothing and is commanded by nothing in these witnesses; power routes through him because the tradition made him its courier between gods and men."}, {"id": "epimetheus", "label": "Epimetheus", "tradition": "Greek myth", "batch": 1, "date_added": "2026-10-11", "era": -380, "pw_d": 0.0, "pw_p": 4800000000000.0, "pw_t": 4800000000000.0, "pw_e": 169129968346.298, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hindsight walks with foresight, and is the smaller brother. Hesiod names him once in the Theogony genealogy and gives him no deeds but one epithet, 'scatter-brained Epimetheus', and one disaster: it was he who first took from Zeus the woman the Father had had formed [26]. Works and Days fills in the mechanism. Hermes brings the snare to his door, and Epimetheus does not remember what Prometheus told him; he took the gift, and only afterwards, when the evil was already his, understood [26]. The mischief of the text is temporal, not moral: the warning existed, spoken in advance, and was useless to a mind that only reads backward. Plato then promotes him from fool to author of the human condition. In Protagoras' myth Epimetheus claims the office of distribution and spends the whole inventory of qualities on the beasts; when he comes to man nothing is left [27]. Fire, in Plato, is not Prometheus' rebellion but his brother's railway accounting: Prometheus 'is said to have been afterwards prosecuted for theft, owing to the blunder of Epimetheus' [27]. Apollodorus writes the family's aftermath: Pyrrha, daughter of Epimetheus and Pandora, marries Prometheus' son Deucalion, and the two survivors of the flood that ends the Bronze Age re-people the world by throwing stones [28]. Even here Epimetheus fathers only continuity. One contradiction in the witnesses is worth keeping visible: Hesiod makes his mother Clymene daughter of Ocean, while Apollodorus names Asia [26][28]; the genealogy itself is unstable, as if the tradition could not be bothered to give the after-thinker a fixed mother. What Epimetheus commands is the structure of every misallocation discovered too late: the gods' gift is real power, and the instruction manual arrives after the damage."}, {"id": "eurypylus-telephid", "label": "Eurypylus son of Telephus", "tradition": "Greek epic cycle", "batch": 1, "date_added": "2026-10-11", "era": -600, "pw_d": 0.0, "pw_p": 1500000000.0, "pw_t": 1500000000.0, "pw_e": 38923257.682, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "First, a correction: our corpus knows Eurypylus the Thessalian, 'son of Euaemon', who led forty ships out of Ormenius [1], killed Hypsenor 'priest of the river Scamander, who was honoured among the people as though he were a god' [1], and was himself wounded by Paris' arrow to the thigh, whence his plea for the drug-oilment lodged in Book 11 [1]. The Telephid Eurypylus of the Odyssean sequel-tradition, to whom later tradition attached this name, is nowhere attested in our fetched witnesses; the conflation is borrowed from scholarship and has to remain marked as such. What survives in the epic is a competent mid-tier captain who kills a river-priest and then becomes the poem's second case of medicine lamed by logistics, the wound that proves Machaon irreplaceable."}, {"id": "genius", "label": "Genius (tutelary)", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -20, "pw_d": 4000000000.0, "pw_p": 0.0, "pw_t": 4000000000.0, "pw_e": 232513887.871, "pw_pool": "P_self", "pw_why": "Tutelary of every person and place [9][10][14]: the pool of selfhood-ritual answers to it structurally, no myth needed.", "pw_ws": 1.0, "essay": "A relation, not a person. Censorinus defines it by attachment: the god under whose tutelage each person lives from birth [10]. Horace gives it astrology and a birthday [9]. Servius makes every place answer to one, usually shown as a serpent [14]. Pliny registers the multiplication with open skepticism [11], and Augustine quotes Varro's cosmic version only to reduce it [13]. Across every fetched witness, no genius ever speaks, acts, or receives a story. The sources argue only about what it attaches to: soul, place, or world. There is no character here to recover or to misquote; the disagreement is the content of the tradition."}, {"id": "hephaestus", "label": "Hephaestus", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 6319050898.225, "pw_pool": "P_metals", "pw_why": "The forge the fire was stolen from [7]; divine artisan of the Greek pool.", "pw_ws": 1.0, "essay": "The god of the forge is introduced by his own body hitting the ground. In the Iliad he tells it in the first person: Zeus 'caught me by the foot and flung me from the heavenly threshold. All day long from morn till eve, was I falling, till at sunset I came to ground in the island of Lemnos', where the Sintians tended him [1][30]. The craftsman of heaven begins as industrial refuse. Yet the Homeric Hymn to Hephaestus records the counter-account, the one the metals trade still runs on: 'With bright-eyed Athene he taught men glorious gifts throughout the world, men who before used to dwell in caves in the mountains like wild beasts' [30]. Human housing, in that witness, is Hephaestus output. Prometheus' whole revolution is framed by Plato as burglary of two workshops: 'the art of Hephaestus' and 'the art of Athene', taken together with fire [27]. So the smith who could not defend his own threshold against his father holds the license to everything other characters fight over; when Aeschylus opens Prometheus Bound, it is Hephaestus who must haul the thief to the rock [6]. His power is the quietest kind on record: he commands not men but the means by which command is carried out."}, {"id": "heracles", "label": "Heracles (as unbinder, prophesied)", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -458, "pw_d": 3750000000.0, "pw_p": 0.0, "pw_t": 3750000000.0, "pw_e": 118550991.267, "pw_pool": "P_military", "pw_why": "Labors as licensed force; release of Prometheus anchors him into the machine [6].", "pw_ws": 0.75, "essay": "The strongest man in the tradition holds his power on lease. Hesiod's Prometheus passage is explicit that even his most famous deed was license-dependent: he slew the eagle and released its victim 'not without the will of Olympian Zeus who reigns on high, that the glory of Heracles the Theban-born might be yet greater' [26]. Apollodorus then documents what that lease costs: driven mad 'through the jealousy of Hera', he flings his own children into the fire, condemns himself to exile, and is assigned by the Pythia to serve a lesser king twelve years and 'to perform the ten labours imposed on him' [32]. Before the first labor is even told, the narrator records his own cult-protocol: he instructs Molorchus that if he fails to return, the sacrifice should be made 'to him as to a hero' [32]. The fetched witnesses thus bracket his whole career between a stepmother's sabotage and a pre-negotiated tomb. Nothing in these texts shows him choosing his tasks. What Heracles commands is licensed force itself, force that works only while the office above it signs off."}, {"id": "juno", "label": "Juno (as female counterpart-genius)", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -400, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "In our witnesses Juno appears strictly as the female case of the genius doctrine. Pliny's complaint that 'each individual makes a separate God for himself, adopting his own Juno and his own Genius' [11], and Smith's capsule 'Women called their genius Juno (Senec. Epist. 110; Tibull. iv. 6. 1)' [12], both derive from the older equation our batch 1 logged in Augustine. Augustine then uses her as the polemic's reductio: 'queen among the select gods', yet her job-share is allotted in the small print, Juno Lucina sharing the bloods of women with the exacted-out Mena, Iterduca walking boys along roads beside 'a most ignoble pair' of roadside goddesses [13]. Glory, in the bishop's retelling, is bonus salary for clerical work. The fetched witnesses give the goddess no myth, no deed, no line of dialogue: only an org chart. So Juno here is a tutelary function for women plus an org chart. The thinness must be marked as an argument from silence: Latin poetry and cult gave her far more, but that witness was not fetched."}, {"id": "lares-penates", "label": "Lares & Penates", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -200, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The corpus knows them mostly as a grammatical accident of plurality: Smith's dictionary reports that the genii are 'frequently confounded with the Manes, Lares, and Penates (Censorin. 3.)', then insists on the essential difference that 'the genii are the powers which produce life... and accompany mortals from their first existence to the end of it' [12]. Protection versus production: the Lares underwrite places, the genius underwrites a lifespan's continuity, and the tradition's own antiquaries could not always tell them apart, which is itself witness to how crowded the Roman threshold was. Our fetched evidence for them is entirely definitional; no Larius gets a story in this corpus. The state outsourced smaller-order vigilance to them: Pliny records a temple 'dedicated to Fever, at the public expense, on the Palatine Hill... near the Temple of the Lares' [11], a state shrine to a disease doing its protecting next door to them. That absurdity is data: micro-powers were on payroll."}, {"id": "machaon", "label": "Machaon", "tradition": "Greek epic/hero-cult", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 5000000000.0, "pw_p": 0.0, "pw_t": 5000000000.0, "pw_e": 105317514.97, "pw_pool": "P_health", "pw_why": "Battlefield medicine personified; the Iliad prices the healer explicitly at several men [1]; Gerenia cult sustained a healing economy locally [3].", "pw_ws": 1.0, "essay": "Two offices in one Catalogue entry, and almost nothing else. Homer gives Machaon deeds: he draws Pandarus' arrow from Menelaus and lays on 'soothing drugs which Chiron had given to Aesculapius' [1]. When Paris wounds him, the army's value-scale is spoken over his body: a physician is worth more than several men together [1]. Centuries later Pausanias finds him a local cult, a bronze statue, and a legend of bones brought home [3]. What no witness gives him is a personality. His silence is not scarcity; it is the tradition transmitting an office rather than a person. Whether that thinness caused his low later salience or resulted from it cannot be decided from the fetched witnesses, and the Gerenia cult is evidence he stayed locally salient for centuries."}, {"id": "nathanael", "label": "Nathanael", "tradition": "Hoffmann's tale", "batch": 1, "date_added": "2026-10-11", "era": 1816, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The case-study subject who proves diagnostic. Jentsch's rule of narrative uncertainty is built around him: the reader must not be allowed to clear up 'whether a particular figure in the story is a human being or an automaton' [5]. Nathanael 'falls in love with her so violently that, because of her, he quite forgets the clever and sensible girl to whom he is betrothed' [5]; the autopilot of desire is the point. His end comes on the tower, where the Sandman-words return as pure formula: 'Ring of fire, spin about!' [5], the whole crisis read backward through the childhood line. Freud mines the tale for the eye-anxiety and for involuntary return; the cost falls on him: in the story he perceives, absorbs, and echoes a fear; he never generates one. His nominal agency is zeroed out by narration, which is precisely why psychoanalysis could index on him."}, {"id": "nestor", "label": "Nestor", "tradition": "Greek epic", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Nestor's credential is duration itself, stated in arithmetic: 'the words fell from his lips sweeter than honey. Two generations of men born and bred in Pylos had passed away under his rule, and he was now reigning over the third' [1]. The poem grants him no strength, only the voice; his role in the wound-scenes is transport and provision (his mare carries Machaon off the field; his handmaid grates goat-cheese over Pramnian wine for the surgeons' posset [1][2]). He is a relay with three generations of uptime: power persists through him by memory, not command. The fetched witnesses give no deed of his that is not advice or hauling; the 'knight of Gerene' title, given twice over, is all ceremony."}, {"id": "olympia", "label": "Olympia the automaton", "tradition": "Hoffmann's tale", "batch": 1, "date_added": "2026-10-11", "era": 1816, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Assessed entirely on what she is documented as being: 'an automaton whose clock-work has been made by Spalanzani, and whose eyes have been put in by Coppola, the Sand-Man' [5]. Hoffmann's German adds the institutional chill, since Nathanael himself reports her kept so 'daß durchaus kein Mensch in ihre Nähe kommen darf' (so that absolutely no one could come near her) [4]. Her only performance, singing at the party, is noticed not by her doing but by its effect; Freud remarks that the tale plays her 'with a faint touch of satire' at the student's expense [5]. The doll's power in the repertoire is not deceptive because it deceives; it is the power of a surface on which men discourse across a gap. As a node she is a manufactured nexus of custody (Spalanzani's lock) and optics (Coppola's eyes), i.e. two separate Workshops' joint product."}, {"id": "paris-alexandrus", "label": "Paris/Alexandrus", "tradition": "Greek epic", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 1500000000.0, "pw_t": 1500000000.0, "pw_e": 31595254.491, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The war's author enters on the back foot. At the sight of Menelaus, Alexandrus 'quailed... and shrank in fear of his life under cover of his men', compared by the narrator to one who starts back at 'a serpent in some mountain glade' [1]. Hector's rebuke is the tradition's own thumbnail of the defendant: 'evil-hearted Paris, fair to see, but woman-mad, and false of tongue' [1]. And yet the same archer, taunting Diomed with an arrow through the foot, laughs from cover: 'my arrow has not been shot in vain; would that it had hit you in the belly and killed you' [1]. His puncture wounds, the remoter damage to Eurypylus, and Machaon's dragging-off are one casualty network. The Iliad's power-verdict on him is demographic rather than heroic: he removes three Achaeans from field-medicine, not sword-hand. He commands ranged damage and reproductive calamity; his era sees him fined by no higher office except Zeus's bookkeeping."}, {"id": "podaleirius", "label": "Podaleirius", "tradition": "Greek epic", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Machaon's shadow, distinguished from his brother in our corpus chiefly by one line of third person news: at the crisis of Book 11 Eurypylus reports, 'of the physicians Podalirius and Machaon, I hear that the one is lying wounded in his tent and is himself in need of healing, while the other is fighting the Trojans upon the plain' [1]. The Catalogue had twinned them, 'the two sons of Aesculapius, skilled in the art of healing' [1], and the tradition never bothered to split them. Which is which remains debated by scholarship; the fetched verse declines to tell us, and so the finding stands as absence: Podaleirius is the healer whose identity is a function of logistics. That the wounded healer still requires a healer in the poem's own arithmetic is noted; the cult later (Pausanias) divided the brothers' shares where the epic does not [3]."}, {"id": "prometheus", "label": "Prometheus", "tradition": "Greek myth/philosophy", "batch": 1, "date_added": "2026-10-11", "era": -458, "pw_d": 12000000000000.0, "pw_p": 2250000000000.0, "pw_t": 14250000000000.0, "pw_e": 450493766813.506, "pw_pool": "P_energy", "pw_why": "Fire and all arts as the mythic origin of combustion and craft; Aeschylus PB 505-506 outright sums it [6]; Plato documents the transfer [7].", "pw_ws": 1.0, "essay": "One act and one catalogue. Aeschylus has the accused enumerate the gifts: fire, then numbers, letters, the yoked beast, the ship, ending 'every art possessed by man comes from Prometheus' [6]. Plato moves the same act into a political myth in which the theft of the arts of Hephaestus and Athene leaves man with wisdom for life but not for the city, 'for that was in the keeping of Zeus' [7]. Even Aeschylus' sustained speech, the only temperament the tradition offers, is mostly a recital of benefits. Heidegger's later use of techne as a mode of revealing [8] is documented transmission, but it adds no person either. What the tradition hands down is a gift and a punishment; character beyond defiance exists only in Aeschylus, not across witnesses."}, {"id": "silvanus", "label": "Silvanus", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -20, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "One offering in one poem: Horace's sketch of the old country calendar has the farmer 'atoned with a hog [the goddess] Earth, with milk Silvanus, with flowers and wine the genius that reminds us of our short life' [9]. The triad is precise about jurisdiction: a beast to the ground, milk to the wood, wine and flowers to the term of one's days. Silvanus here is not the wild-wood fright of folklore but a line item in the harvest debt. Everything else about him in our corpus is absence; the fetched tradition expended no narrative on a power whose business is the fence between field and forest. That parsimony, as with the Lares, is itself the datum: some Roman spirits were kept as accounting entries, not characters."}, {"id": "sandman", "label": "The Sandman / Coppelius / Coppola", "tradition": "German Romantic / psychoanalytic", "batch": 1, "date_added": "2026-10-11", "era": 1816, "pw_d": 500000000.0, "pw_p": 0.0, "pw_t": 500000000.0, "pw_e": 373377162.866, "pw_pool": "P_sleep", "pw_why": "The sleep-enforcer of the nursery [4]; psychoanalytic tradition (Freud) made it the canonical figure of the unheimlich night [5].", "pw_ws": 1.0, "essay": "Hoffmann's tale and Freud's essay are the two witnesses that matter, and both survive direct quotation. The nurse's Sandman throws sand so children's eyes spring bloody from the head, and feeds them to his own young on the half-moon [4]. Coppelius at the brazier cries for eyes and the father begs them back [4]. Freud builds the uncanny's definition on this figure and privileges the eye-motif over Jentsch's automaton reading [5]. A plain fact about the tale's mechanics: the Sandman never takes an eye or a life in the present action. Nathanael's death is his own leap. The figure's force works through anticipation and recurrence, never through an executed act. This entry is retained as the log's control case, a well-known figure used to check the method rather than count as a discovery."}, {"id": "zeus", "label": "Zeus", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 7500000000000.0, "pw_p": 20750000000.0, "pw_t": 7520750000000.0, "pw_e": 158413340142.758, "pw_pool": "P_authority", "pw_why": "The distribution of political wisdom itself stays in his keeping [7]; ancient sovereign order answers to the name.", "pw_ws": 1.0, "essay": "The fetched witnesses describe an asset seizure more than a reign. Zeus frees the sons of Heaven his father bound, and they pay him in arms: they 'gave him thunder and the glowing thunderbolt and lightening... In them he trusts and rules over mortals and immortals' [26]. Power in Hesiod is explicitly hardware, received for a kindness and hoarded. The same poem records his insurance policy: warned by Earth and Heaven that Metis' offspring might displace him, Zeus swallows the goddess whole, 'to the end that no other should hold royal sway over the eternal gods' [26]. Athene is then born out of his own head; counsel becomes an internal organ rather than a rival. Yet the Works and Days gives the same god his civil license: cities flourish when men 'give straight judgements to strangers and to the men of the land,' and for them 'all-seeing Zeus never decrees cruel war' [26]. Half a millennium later Callimachus, hymning at the court-adjacent shrine of Cyrenean tradition, states the doctrine outright: 'from Zeus come kings; for nothing is diviner than the kings of Zeus' [29]. Between the fire-tool and the throne-hymn, the witnesses agree on the mechanics: Zeus commands not by force of personality but by holding the license, the arsenal, and the appointments office simultaneously. What he changes, in every stratum, is who is permitted to hold power at all."}, {"id": "achilles", "label": "Achilles", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Achilles reaches this record only through Chiron: to him the centaur showed the herbs, and from Peleus the Pelian spear passed down 'fraught with the death of heroes' [1]. A witness, not a portrait; the full account of him has not been fetched."}, {"id": "adam", "label": "Adam", "tradition": "Hebrew/medieval Jewish", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ginzberg's account splits Adam's paternity in two, and this is its most graphically significant datum: his union with Eve yields Cain, explicitly 'Cain's descent from Satan, who is the angel Samael' [19], while 'Seth became, in a genuine sense, the father of the human race, especially the father of the pious, while the depraved and godless are descended from Cain' [19]. Later, the same tradition has him begetting the great demon legacy during his long separation, 'the posterity of Adam which he had begotten with Lilith' [19]. So Adam is routed downstream in three races: pious, impious, and demonic. He himself remains a vortex in the witness: considered as character, the text gives him mostly a fatality for unions."}, {"id": "agrimus", "label": "Agrimus", "tradition": "medieval Jewish aggadah", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The first-born demon saves his species by capitulation. When Methuselah's Ineffable-Name sword is killing demons at ninety-four myriads per minute, Agrimus 'came to him and entreated him to desist, at the same time handing the names of the demons and imps over to him' [19]. The kings among them go to iron fetters; the remainder hide in 'the innermost chambers and recesses of the ocean' [19]. He represents the trace that survives defeat: a demon's registry. No later fetched witness renews him; one generation of him suffices to people the night-brood Lilith nominally presides over."}, {"id": "anzud-bird", "label": "Anzud bird", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "One of the tree's three illegal occupants, its vacancy announced only in passing: 'In its branches, the Anzud bird settled its young' beside the snake at the roots and the laughing maid in the trunk [17]. When Gilgamec swings at the snake, it is the bird that demonstrates the correct zoological response: it 'took up its young and went into the mountains' [17]. No speech, no combat, just relocation. The figure survives here as the middle stratum of a triune infestation; nothing in the fetched witness connects it to the crown-and-scepter eagle of the Etana and Zu tales, and on the present evidence he should be read as wildlife with good instincts."}, {"id": "apollo", "label": "Apollo", "tradition": "Greek epic/mythography", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 6000000000.0, "pw_t": 6000000000.0, "pw_e": 126381017.965, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Apollo enters this ledger from the Asclepius file: here his attested acts are punishing the informant ('cursed the raven that brought the tidings and made him black instead of white'), killing his pregnant Coronis, and snatching the child from her pyre to hand it to Chiron [34]. He stands at the origin of the healing cult and at the origin of its casualties in the same paragraph. Everything further about him waits on witnesses not yet fetched."}, {"id": "arawn", "label": "Arawn", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "King of Annwvyn, the fixed Otherworld neighbor. His attested acts are two: he declares his domain ('Arawn, a King of Annwvyn, am I') and hires Pwyll as his champion against the rival king Havgan, 'by ridding me of this oppression... shalt thou gain my friendship' [21]. All his enforcement is delegated; All Hallows' battle is pre-engineered to permit one blow only, because a second revives the victim overnight [21]. In the fetched witness his court, his wife, his greyhounds are set-dressing; the figure is an office in negative space, power exercised principally through the calendar of its contest. That the Pwyll branch ends in fog: nothing is told of his character beyond that he keeps the year faithfully."}, {"id": "bothvild", "label": "Bothvild / Beadohild", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The only daughter 'ye two had ever' exists in the Lay chiefly as a vector of proof. She is baited (the stolen ring lures her to the isle), then used: 'True is it, Nithuth, that which was told thee, Once in the isle with Volund was I, An hour of lust, alas it should be! Nought was my might with such a man, Nor from his strength could I save myself' [24]. The verse leaves no plank of consent standing; Bellows' note that Volund's oath-construct forces the vengeance 'to fall more heavily on her father than on her' [24] only fixes the arithmetic, not the act. Then the poem spends her once more, sending her the brooch wrought from her brothers' teeth and closing her story in the mouth of her violator: 'Now big with child does Bothvild go' [24]. The English retellings' gentleman Wayland is a laundering this text does not permit. Bothvild is the tradition's second casualty of the same office of power as her mother's rings: a person the poem converts into evidence."}, {"id": "bran", "label": "Bran the Blessed", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Bendigeid Vran, 'crowned king of this Island' and 'exalted from the crown of London' [21], sits on the rock of Harlech looking over the sea when the fleet of Matholwch arrives; everything after is concession arithmetic. The cauldron he gives the Irish is the most literal resurrection technology in the corpus: 'if one of thy men be slain to-day, and be cast therein, to-morrow he will be as well as ever he was at the best, except that he will not regain his speech' [21]. Wounded in the foot at the last battle, he orders his own beheading and annotations the procession: seven years' feast in Harlech with 'the birds of Rhiannon singing', then fourscore at Gwales, then burial at the White Mount facing France [21]. He converts himself from king to sentinel: a wading bridge across the Irish Sea, then an interred boundary stone against invasion. The fetched tale calls him blessed precisely where he stops being enumerable."}, {"id": "cincinnatus", "label": "Cincinnatus", "tradition": "Roman exemplar", "batch": 2, "date_added": "2026-10-12", "era": -450, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Livy prefaces the whole episode with an editorial sneer at his readers: the story is worth hearing precisely for 'those who despise all human interests in comparison with riches'. Then he shows the machine: Three miles across the Tiber, 'the one hope of Rome, L. Quinctius, used to cultivate a four-acre field', and the senate's deputation finds him 'intent on his husbandry' and must ask him to put on his toga before telling him the state needs him [33]. The power transfer is narrated as an interruption of ditch-digging. It ends the same way it began, by act of the holder, not the moment: 'Quinctius resigned on the sixteenth day the dictatorship which had been conferred upon him for six months' [33]. Between those brackets the man does what the office exists for; the memorable item our witness wants remembered is the giving-back. Livy's own ink tells on the myth: the citizen far above the details is sketched entirely through details, four acres, the toga request, sixteen days. Two millennia later the American republic rented the same dramaturgy for Washington, first in the Society of the Cincinnati, then in Weems' biography [15]; the connection remains analogy, for the transmission passes through institutions, not this text."}, {"id": "brumidi", "label": "Constantino Brumidi", "tradition": "American, artist 1865", "batch": 2, "date_added": "2026-10-12", "era": 1865, "pw_d": 0.0, "pw_p": 126000000000.0, "pw_t": 126000000000.0, "pw_e": 100725666820.478, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The government keeps its own caption for the act: the AOC page in our corpus records that the fresco hangs 'suspended 180 feet above the Rotunda floor', covers 4,664 square feet, and was painted in eleven months at war's end for $40,000 [16]. Its subject, per the same official text, is 'George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame', with thirteen maidens for the original states; the page even glosses its title, 'the raising of a person to the rank of a god' [16]. The perimeter distributes the republic's powers as six named groups, War, Science, Marine, Commerce, Mechanics, Agriculture, each with its tutelary god and its inventor: Vulcan forging cannon in Mechanics, Mercury converting finance into myth in Commerce. Brumidi was 'born and trained in Rome and had painted in the Vatican and Roman palaces before emigrating' [16]; the state hired pagan technique to install its founder on Olympus. About the man the witness is thin, and the thinness is the datum: Brumidi survives as a function, the hand that fixed Washington's address in the air."}, {"id": "deucalion", "label": "Deucalion", "tradition": "Greek mythography", "batch": 3, "date_added": "2026-10-12", "era": 100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "'Prometheus had a son Deucalion' [28]: the flood hero is explicitly the fore-thinker's line continuing its profession. Where Epimetheus' house forgot the warning about a gift, Deucalion's acts on one: 'by the advice of Prometheus constructed a chest', survives nine days and nights of universal rain, and lands at Parnassus [28]. Granted a choice by Zeus through Hermes, he chooses to get men, and the stones thrown over the shoulders of the pair become men and women [28]. The fetched witness is a mythographer's epitome, so the figure arrives already compressed; no cult, no cult-site, and no speech survive in this corpus."}, {"id": "enkidu", "label": "Enkidu", "tradition": "Sumerian epic", "batch": 3, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The servant who volunteers for the fetch-errand: 'My king, you weep; why does your heart worry? Today I shall retrieve your ball from the nether world' [17]. Gilgamec then issues the longest manager's brief in the corpus, the do-not list for the underworld, and Enkidu violates every clause: clean garments, shod, armed, kissing and hitting; 'he aroused an outcry and was detained in the nether world' [17]. His release is brokered through Enki instructing Utu to open a hole and bring the servant up [17]. Enkidu's character in this witness is perfect procedural disobedience, a lawful casualty of received instructions inverted."}, {"id": "epona", "label": "Epona", "tradition": "Gaulish/Romano-Celtic epigraphic", "batch": 2, "date_added": "2026-10-12", "era": 150, "pw_d": 112500000.0, "pw_p": 0.0, "pw_t": 112500000.0, "pw_e": 8283370.034, "pw_pool": "P_horses", "pw_why": "Epigraphic horse-cult, carried by cavalry [23]; absorbed into the modern equine economy only residually.", "pw_ws": 0.75, "essay": "Epona's dossier here is entirely epigraphic statistics and scholarly 'perhaps'. MacCulloch reports Anwyl's census, in which among the recorded goddesses 'there are 35 mentioned once... 1 twenty-six times (Epona)' [23], and then gives the cautious form of the claim: 'others have remained separate, like Epona, perhaps a river-goddess merged with an animal divinity, and known from inscriptions as a horse-goddess' [23]. Our corpus supplies no story for her anywhere: her salience is all in count and iconography, in stone rather than in text. The link to Rhiannon is analogy only: the textual princess rides; the inscriptional horse-goddess repeats. Her numerousness is her act of power."}, {"id": "eve", "label": "Eve", "tradition": "Hebrew", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The fetched witness gives Eve two speeches and one crime against chronology. At Cain's birth her exclamation, per Ginzberg's quotation of the aggada, is 'I have gotten a man through an angel of the Lord' [19], sharing paternity with Samael, the serpent-angel. Lilith is not her ancestor or sister in this corpus but her successor (Adam's other consort) and her quasi-parasite. The traditions assembled here give her no ongoing office of command; her power gets expressed in progeny. Cain is 'the ancestor of all the impious generations' [19]. Eve's figure in this evidence is less a persuadable mother of mankind than an abducted agency, tricked into the founding error and later cited as its witness."}, {"id": "george-washington", "label": "George Washington", "tradition": "American national cult", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 180000000000.0, "pw_p": 0.0, "pw_t": 180000000000.0, "pw_e": 131458176663.585, "pw_pool": "P_nation", "pw_why": "State-commissioned national tutelary [16]; his biography industry was Weems [15]; the US national pool is the pool the name organizes.", "pw_ws": 1.0, "essay": "A tutelary manufactured in two steps, both documented. Step one is Weems' biography for 'young countrymen': the cherry-tree anecdote introduced as 'too true to be doubted; for it was communicated to me by the same excellent lady,' an unnamed informant who is the story's only authority [15]. Weems' Washington is explicitly 'the HERO, and the Demigod,' 'the jupiter Conservator,' 'Cincinnatus-like' at the plough, and a man whom 'the prayers of millions' would have made 'immortal on earth' [15]. The famous wording is not even his: he writes 'I can't tell a lie, Pa' [15]. Step two is architecture: Brumidi's 1865 Rotunda fresco, whose own title the Architect of the Capitol glosses as 'the raising of a person to the rank of a god,' with Washington 'rising to the heavens in glory' among Minerva, Neptune, Venus, Mercury, Vulcan, and Ceres [16]. A Roman genius loci commissioned by a legislature: the Servian structure executed with federal funds."}, {"id": "gilgamesh", "label": "Gilgamesh", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 125000000.0, "pw_t": 125000000.0, "pw_e": 462962.963, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Gilgamec appears in this Sumerian witness as exterminator and undertaker. Inana cries; her warrior-brother 'took his bronze axe used for expeditions, which weighs seven talents and seven minas', killed the snake immune to incantations at the tree's roots, scattered the Anzud brood into the mountains, and made the phantom maid flee [17]. Then comes the poem's pivot to mortality: his ball and mallet drop to the nether world, Enkidu goes down to fetch them and is seized [17], and the long interrogation returns its census of the dead, including the spirit 'who has no funerary offerings' who 'eats the scraps and the crumbs' [17]. In this telling the hero's power is not defiance of death; it is pest removal indoors plus a budget for funerary cult. When the fetchings end with his heart 'smitten' and his search for life just beginning [17], the transition is declared openly by the text itself."}, {"id": "gwawl", "label": "Gwawl", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Gwawl's one attested decision is category error: he asks Pwyll, who is bound by a feast-pledge, for 'the lady I love best', and Rhiannon's management converts it him into a badger. At the trap's spring she warns him first: 'bestow me upon him lest shame befall thee', said she, to keep the letter of Pwyll's word [21]; next scene, he is in the bag, struck by each entering knight, and must beg: 'Lord... I merit not to be slain in a bag' [21]. Llwyd later avenges 'the game of Badger in the Bag' [21]. The fetched tale keeps him as its investment folly: a man of great power and wealth spent in one ill-phrased petition. He is what the ballgame cost."}, {"id": "hera", "label": "Hera", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "In the fetched witnesses Hera acts only through interference. Apollodorus is blunt: after the battle with the Minyans 'Hercules was driven mad through the jealousy of Hera' and burned his own children [32]. She does not argue in these texts, she deranges. On the strength of the present corpus her character must be recorded as thin: a cause, not a voice; but a cause of exactly the crime the hero then spends a career answering for."}, {"id": "inana", "label": "Inana", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 1111111111.111, "pw_pool": "P_authority", "pw_why": "Owner of the halub-tree and its throne/bed claim [17]; Sumerian sovereignty-adjacent.", "pw_ws": 1.0, "essay": "The fetched witness is the first-person prologue so often elided: the goddess narrates in her own voice how she found the ḫalub tree after the flood-wind had stripped it, carried it to her garden in Unug, and planted it 'with my feet, not with my hands' [17]. Her whole action is prospective furnishing: 'When will this be a luxuriant chair on which I can take a seat? When will this be a luxuriant bed on which I can lie down?' [17]. She plans a throne and a bed counted in property terms; a decade later the tree is massive but unsurveyable, colonized at root, branch, and trunk by three squatters [17]. Her recourse is complaint: she cries to Utu and at last to Gilgamec, whose services she retains [17]. It is worth marking against the fear-intensive later goddess and against her sister of the nether world: power here is domestic ambition, thwarted, and crowdsourced. The garden tree episode is the graph's earliest attested case of sovereignty subcontracting pest control."}, {"id": "lilith", "label": "Lilith / phantom maid / lamia", "tradition": "Sumer→Hebrew→medieval Jewish", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 250000000.0, "pw_p": 0.0, "pw_t": 250000000.0, "pw_e": 925925.926, "pw_pool": "P_amulet", "pw_why": "Infant-protection economy literally documented as her price (amulet with three angel names) [19]; night-fear persists in Isaiah/Huluppu strata [17][18][20].", "pw_ws": 1.0, "essay": "Three strata, three different beings. The Sumerian witness is a squatter in Inana's halub-tree, 'the phantom maid ... the maid who laughs with a joyful heart,' who, when Gilgamesh clears the tree, 'left her dwelling and sought refuge in the wilderness' [17]. Isaiah names her once, in a ruin catalogue between satyrs and beasts; the KJV makes her a screech owl [18], while the Vulgate's lamia and Wycliffe's 'Lamya schal ligge there' [20] turn her into the Greco-Roman night-witch. Only the medieval Ben Sira satire gives her a will: a first wife who claims equality, pronounces the Name, flies to the Red Sea, refuses return, and takes revenge on infants [19]. The modern 'first feminist' figure is a selection from that satire, taking the claim and dropping the revenge. Before the satire she is a habitat: tree-trunk, wilderness, ruins by night."}, {"id": "llwyd", "label": "Llwyd", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 225000000.0, "pw_t": 225000000.0, "pw_e": 87889227.371, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The purest revenge economics in the corpus: Llwyd the son of Kilcoed casts the charm over seven Cantrevs not for land but out of 'the friendship I had towards him [Gwawl]', and only stops when a hostage is the price of admission into narrative again. His weasel-army harvests wheat night by night, strand-like; when Manawyddan sets up a gallows for the pregnant mouse, the doubling clerk and the churl and the bishop arrive in sequence to redeem it [21]. Caught, his confession is the whole essay: 'To despoil thee... I cast the charm over the seven Cantrevs of Dyved... upon Pryderi did I revenge Gwawl the son of Clud, for the game of Badger in the Bag' [21]. He vanishes by treaty, not defeat: oaths for friendship-keeps. His power is gated entirely through enchantment-with-terms, and when it ends the land simply regrows."}, {"id": "manawyddan", "label": "Manawyddan fab Llyr", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Brother of Bran, sole counselor in this corpus whose counsel consistently under-performs until handicraft is allowed. When Dyved is magically emptied, he paces the alternative economies: saddles, then shoes, then wheat-land; each is extinguished by guild or spell, and his answer to the last is patient siege engineering (the trap-mouse courtroom) that brings Llwyd to terms. 'By that will I gladly abide,' he says when Pryderi offers Rhiannon in marriage, and right glad is he, 'May Heaven reward him who hath shewn unto me friendship so perfect as this' [21]. Llwyd's confession settles the debt [21]. In the fetched witnesses Manawyddan never rules glorywise; he drills supply chains. He is the Welsh margin of sovereignty: authority that survives occupation by knowing a trade."}, {"id": "mason-weems", "label": "Mason Locke Weems", "tradition": "American, 1800s biographer", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 0.0, "pw_p": 162000000000.0, "pw_t": 162000000000.0, "pw_e": 118312358997.226, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "A bookselling parson invents the measurement by which the United States still checks its leaders against their legends. Weems' own frame for the cherry tree is open about the epistemology: the anecdote 'is too valuable to be lost, and too true to be doubted; for it was communicated to me by the same excellent lady' who never appears again [15]. Valuable first, true second, source an unnamed lady; the sentence is the whole manufacture in miniature, His child Washington then speaks the line America memorized in smoothed form: 'I can't tell a lie. Pa; you know I can't tell a lie. I did cut it with my hatchet' [15]. The fetched text does not say 'I cannot'; the contraction belongs to a kitchen, which is Weems' real craft: he puts eternity in colloquial clothes so it can be sold door to door. The witness is a fabricator who labeled his fabrication; the fabrication kept at work because the nation it organized never survived without it."}, {"id": "methuselah", "label": "Methuselah", "tradition": "medieval Jewish aggadah", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The longest biography reduces to an anti-demonic police action. Ginzberg compiles the apocryphal account: after Enoch's translation 'Methuselah was proclaimed ruler of the earth by all the kings', ruled in rectitude, and then addressed the demon surplus, 'the posterity of Adam which he had begotten with Lilith, that she-devil of she-devils' [19]. After three days' fasting he is authorized to inscribe the Ineffable Name upon his sword, 'wherewith he slew ninety-four myriads of the demons in a minute' [19]; Agrimus, Lilith's first-born demon, surrenders the registry of the rest to him. Power accounting: name-on-sword, ninety-four myriads per minute, and a sobriquet earned. The patriarch of record longevity dies before the flood; witnesses retain him chiefly as the spell-checker of the demon roll."}, {"id": "metis", "label": "Metis (Thought)", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Counsel, in the Theogony, is a substance one can eat. Metis, Ocean's daughter, 'was wisest among gods and mortal men', and her career ends when Zeus, acting on the advice of Earth and starry Heaven, deceives her with cunning words and puts her in his belly, 'for fear that she might bring forth something stronger than his thunderbolt' [26]. EW's marginal gloss translates her name outright: Thought. She then exists only as an interior cause: from within, she conceives Athene, who emerges through Zeus' head armed [26]. The fetched witnesses give her no actions of her own after the swallowing; she is the one figure whose entire power is exercised from inside an enemy. That internalization is the Theogony's most direct definition of what Zeus commands: even wisdom itself, once ingested, cannot object."}, {"id": "nithuths-queen", "label": "Nithuth's queen", "tradition": "Volundarkvitha", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Lay's explicit oracle of power and fear: she 'spake: The glow of his eyes is like gleaming snakes, His teeth he gnashes if now is shown / The sword... Let them straightway cut his sinews of strength' [24]. What other characters must summon as proof, she reads off the smith's face at once. Yet her counsel generates the very thing it warned of; the maiming creates its avenger. Her closing inventory is domestic and macabre in equal parts: Volund's confession assigns her the quarry of her murdered sons' eyes, 'gems full fair... To Nithuth's wife so wise he gave them' [24]. In testimony she is the highest-fidelity sensor in the poem; in action she enables the loss her sensor detected. That pairing is her character in the fetched witness, and it is thin by function: a queen who exists to say 'now'."}, {"id": "nithuth", "label": "Nithuth/Niðhad", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 1000000000.0, "pw_p": 30000000000.0, "pw_t": 31000000000.0, "pw_e": 6476686140.449, "pw_pool": "P_military", "pw_why": "A king who commands force sufficient to maim an elf-smith [24]; pool share is a throne-share, small.", "pw_ws": 1.0, "essay": "The king of the Njars is remembered for three administrative decisions, all thefts. He takes the smith Volund from the isle where he sat 'fashioning the gold', and it is his queen who supplies the diagnosis: 'The glow of his eyes is like gleaming snakes... Let them straightway cut his sinews of strength, And set him then in Saevarstath' [24]. Maimed and islanded, Volund 'smithied for the king all kinds of precious things. No man dared to go to him, save only the king himself' [24]: Nithuth converts a person into a crown monopoly before he suspects a crown monopoly can hate. The poem's answer arrives by installments: 'I smote off the heads of both thy sons', skulls silvered into cups, eyes as gems to the queen, teeth as a brooch to the daughter [24]. In stanza 39 the king can only concede altitude: 'There is no man so high from thy horse to take thee... While high in the clouds thy course thou takest' [24]. Nithuth's is the most complete documented case of power confiscating craft: it worked for exactly the interval between two island trips."}, {"id": "pandora", "label": "Pandora", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The first woman enters the tradition not as a person but as a consignment. In Works and Days each god contributes a component to the package, and Hermes delivers her to Epimetheus door to door [26]; the Theogony's compressed version calls her 'the woman, the maiden' Zeus had formed [26]. Apollodorus, centuries later, softens her into a mother: 'Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods' [28]. Between those two statements is the whole of her character available in the fetched witnesses: fabricated, gifted, forgotten, and then quietly maternal. The jar is a later proverb's accessory; in Hesiod she opens nothing, Epimetheus simply 'took the gift' [26]. Under-definition again functions as finding: the tradition mined her for mechanism, not personality."}, {"id": "pryderi", "label": "Pryderi", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Pryderi is born from Rhiannon's shoulder as an infant whose colt-night theft is the whole branch: one claw, one vigil, one foster-household, one naming by Pendaran: 'Pryderi, son of Pwyll, chief of Annwvyn' [21]. In the Third Branch he supplies the balm: a kingdom emptied by a spell he triggers, an exile kept alive by market craft: shoemaking in three towns is the only employment sequence in the corpus where national scales are settled by craft guild pricing ('nothing would the brewers do but take the trade of him' style; the fetched passage runs saddlery-to-shoeing) [21]. His most legible decision is exogamy-statecraft: 'I did offer thee as a wife to Manawyddan the son of Llyr' is his line to his mother [21]. He reads as a transfer student between tales, thin in all of them; by the Fourth Branch his death belongs to another book."}, {"id": "pwyll", "label": "Pwyll", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Prince of Dyved is the Mabinogion's documented case of rule by courtesy. He meets a stranger of the Otherworld on his own chase, asks friendship, and accepts the price: 'I will show thee. Behold thus it is thou mayest' -- a body swap to fight Havgan, 'a man whose dominions are opposite to mine, who is ever warring against me' [21]. Only one blow is allowed, and Pwyll gives exactly one, declining the second for a year of impersonated kingship; the witness emphasizes that he did not touch Arawn's wife. Later, pledged hospitality sends him a rival: he learns of Rhiannon's designation for 'Gwawl the son of Clud' and must yield on the word already spoken [21]. His rescue plays out as literate contract abuse: the bag is exactly what was promised and who gets into it is Gwawl, beaten by Pwyll's knights, whence 'the game of Badger in the Bag' [21]. He rules by keeping words harder than anyone else keeps them."}, {"id": "pyrrha", "label": "Pyrrha", "tradition": "Greek mythography", "batch": 3, "date_added": "2026-10-12", "era": 100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Known by one sentence of Apollodorus and one act. She is 'the daughter of Epimetheus and Pandora' and the wife Deucalion takes aboard the chest his father advised [28]. After nine days on the water she disembarks at Parnassus with him and, at Zeus' bidding through Hermes, helps throw the stones that become the new race of men [28]. The witnesses give her no words. Her salience is genealogical: she is the hinge between the thieving, gift-forgetting generation of Titans' children and the rebuilt human stock."}, {"id": "rhiannon", "label": "Rhiannon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 450000000.0, "pw_p": 0.0, "pw_t": 450000000.0, "pw_e": 175778454.742, "pw_pool": "P_horses", "pw_why": "Horse association is a penance in the primary witness [21] and the goddess claim scholarship [23]; the equine economy still runs under her modern name.", "pw_ws": 0.75, "essay": "The texts give a woman with full agency; the modern label gives a function. In the Pwyll branch she rides past pursuit-'the more he urged his horse, the further was she from him'-and halts only when spoken to, remarking 'it were better for thy horse hadst thou asked it long since' [21]. She engineers her own marriage, survives a false accusation and a horse-carrying penance at the gate [21], and in the Branwen branch her three birds sing the survivors of Ireland through seven years at Harlech [21]. The Manawyddan branch has Pryderi settle her on Manawyddan with the seven Cantrevs, after which Llwyd empties Dyfed in a fall of mist [21]. Nowhere is she called a goddess or given a horse attribute. The label 'Welsh horse goddess' rests on MacCulloch's Rigantona etymology ('we may postulate') [23] plus an analogy to the genuinely epigraphic Epona [23], whose rose-decked stable shrine Apuleius already attests [22]. The abstraction erases exactly what the primary witness supplies."}, {"id": "teyrnon", "label": "Teyrnon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Teirnyon Twryf Vliant, the lord who keeps the account books of May Day. His mare foals 'on the night of every first of May... and no one ever knew what became of the colt'; Teirnyon keeps vigil, severs the vast claw that comes through the window, and finds at his door a new-born child in a sea-satin cloth [21]. He raises Gwri Wallt Euryn, sees his resemblance to Pwyll grown up, and delivers him back to the court despite his wife's half-in-earnest remonstrance; Pendaran Dyved crowns the household-naming: 'well hast thou named thy son Pryderi, and well becomes him the name of Pryderi, son of Pwyll, chief of Annwvyn' [21]. The fetched tale grants him no office and no tenure in the royal line; only a stolid logistics of honesty by horse. He is the graph's cleanest documented fosterage-edge: all strength, little claim."}, {"id": "erinyes", "label": "The Erinyes (Spirits of Wrath/Blessing)", "tradition": "Greek tragedy", "batch": 3, "date_added": "2026-10-12", "era": -458, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Older than the court they are escorted to. In the Eumenides they enter as 'the daughters of Night', pursuers of blood-guilt, and are publicly mocked for it: 'What I have suffered is unbearable' [31]. Athene's settlement neither defeats nor disbands them but converts them; the translator's argument for the play states the outcome plainly, they move from Spirits of Wrath to Spirits of Blessing with a sanctuary beneath the Hill of Ares [31]. Their salience is the durable one: the play proposes that vengeance, given a seat and an address, becomes the guarantee of law rather than its enemy."}, {"id": "volundr", "label": "Volundr / Wayland / Velent", "tradition": "Germanic/Norse", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 50000000000.0, "pw_p": 600000000.0, "pw_t": 50600000000.0, "pw_e": 10571623184.087, "pw_pool": "P_metals", "pw_why": "Smith-king of the Germanic tradition; revenge executed precisely through metalwork [24][25]; share small but the attribution is absolute within its domain.", "pw_ws": 1.0, "essay": "The tradition's actual figure is a revenge-tragedy protagonist. The queen reads the captive's nature at a glance-'The glow of his eyes is like gleaming snakes'-and prescribes the hamstringing that sets him on the island [24]. His reply is workshop horror: he smites the two princes, sets their skulls in silver for the king, fashions gems from their eyes for the queen, and a brooch from their teeth for Bothvild [24]. Bothvild comes with her broken ring; the beer out-sleeps her [24]; Deor reports in Old English that her brothers' death grieved her less than her own thing, 'that she was with child' [25]. Then the exit: 'Laughing Volund rose aloft, / Weeping Bothvild went from the isle' [24]. Bellows' note documents the legend's geography from Saxon regions into the North [24]. The softened craftsman of Scott and Kipling is not this figure; the softening deletes precisely what the witnesses keep."}], "edges": [{"frm": "asclepius", "to": "machaon", "type": "kinship", "title": "Sons of the healer", "essay": "The Catalogue identifies both brothers as 'the two sons of Aesculapius' [1]; the office descends as kinship before it appears as skill.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "podaleirius", "type": "kinship", "title": "The other healing son", "essay": "Podaleirius shares the Catalogue entry and the thirty ships [1]; Pausanias adds his separate landing at Syrnus [3]. He is Machaon's structural double across the same sources.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": 170}, {"frm": "chiron", "to": "asclepius", "type": "transmission", "title": "transmission", "essay": "craft lineage: 'soothing drugs which Chiron had given to Aesculapius'", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "machaon", "type": "transmission", "title": "The trade descends with the bloodline", "essay": "Chiron's drugs pass from the centaur to Asclepius, and the Catalogue names the sons 'skilled in the art of healing' [1]. Machaon's clinic at Menelaus' wound applies the inherited line directly [1].", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "paris-alexandrus", "to": "machaon", "type": "conflict", "title": "The arrow that priced a physician", "essay": "Alexandrus' triple-barbed arrow to the right shoulder triggers the Iliad's explicit value judgment: Idomeneus tells Nestor a physician is worth more than several other men [1], and the rescue sets Patroclus' errand in motion [1].", "source": "[1] Il. 11.506-520", "date_added": "2026-10-12", "era": -750}, {"frm": "nestor", "to": "machaon", "type": "interaction", "title": "The knight of Gerene, twice", "essay": "Nestor drives the wounded Machaon from the field in the poem [1], and Pausanias reports the same Nestor bringing the healer's bones home to Gerenia for cult [3]. The man who rescues the body becomes the guardian of the grave.", "source": "[1] Il. 11.596-604; [3] Paus. 3.26.10", "date_added": "2026-10-12", "era": 170}, {"frm": "eurypylus-telephid", "to": "machaon", "type": "conflict", "title": "The healer's killer, by report", "essay": "The Little Iliad tradition, preserved only through Pausanias, has Eurypylus son of Telephus kill Machaon [3]. A lost epic's claim reaching us through a traveler's report ([3] Paus. 3.26).", "source": "[3] Paus. 3.26.9-10", "date_added": "2026-10-12", "era": 170}, {"frm": "genius", "to": "lares-penates", "type": "comparison", "title": "Categories confounded, firm only in a dictionary", "essay": "Smith's 1870 dictionary keeps the boundary: genii produce life and attend it as a second self, while lares and penates operate after life begins; the same entry admits the terms are 'frequently confounded' [12]. The clean distinction is an antiquarian artifact.", "source": "[12] Smith s.v. Genius", "date_added": "2026-10-12", "era": 1870}, {"frm": "juno", "to": "genius", "type": "analogy", "title": "Every soul its own named god", "essay": "Pliny's skepticism documents the pairing: 'each individual makes a separate God for himself, adopting his own Juno and his own Genius' [11]. The female counterpart principle is attested but its doctrine is unstable across sources [12].", "source": "[11] Plin. NH 2.5", "date_added": "2026-10-12", "era": 1870}, {"frm": "silvanus", "to": "genius", "type": "interaction", "title": "One rustic altar, three recipients", "essay": "Horace's farmer atones Earth with a hog, Silvanus with milk, and 'with flowers and wine the genius that reminds us of our short life' [9]. The genius sits at the same field-table as the established gods, without ever receiving a myth.", "source": "[9] Horace Ep. 2.1.143-144", "date_added": "2026-10-12", "era": -20}, {"frm": "sandman", "to": "nathanael", "type": "conflict", "title": "The threat that never has to execute", "essay": "Coppelius cries for the eyes and the father buys them back; years later the cry 'Sköne Oke' from the crowd is enough to throw Nathanael from the tower [4]. No act is ever completed onstage; recurrence does all the work.", "source": "[4] Hoffmann, Der Sandmann", "date_added": "2026-10-12", "era": 1816}, {"frm": "olympia", "to": "nathanael", "type": "interaction", "title": "The dispute Freud overruled", "essay": "Jentsch located the tale's uncanny in Olympia's ambiguity, animate doll or living woman; Freud rejects that reading in favor of the eye-motif and castration economy [5]. The log flags the disagreement as unresolved rival readings, not a settled point.", "source": "[5] Freud CP IV, pp. 383-384", "date_added": "2026-10-12", "era": 1919}, {"frm": "sandman", "to": "genius", "type": "analogy", "title": "The companion who attends you to death", "essay": "Horace's genius 'dies with each individual' [9]; Hoffmann's phantom tracks one individual to his [4]. Structural analogy only: no document connects the Roman tutelary to the German nursery bogey.", "source": "log batch 1 connection map; [9], [5]", "date_added": "2026-10-11", "era": 1919}, {"frm": "prometheus", "to": "hephaestus", "type": "conflict", "title": "Theft from the craftsman", "essay": "Aeschylus names the stolen thing 'flashing fire, source of all arts' [6]; Plato specifies the burglarized workshops: 'the mechanical arts of Hephaestus and Athene, and fire with them' [7]. The giver to men begins as a thief among gods.", "source": "[7] Protagoras 321c-d; [6] PB 4-10", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "athene", "type": "conflict", "title": "Her arts, taken in the same burglary", "essay": "Plato's myth distributes the theft across two divine workshops; Athene's crafts pass to mortals through a crime committed by a Titan [7].", "source": "[7] Protagoras 321c-d", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "zeus", "type": "conflict", "title": "The distribution and the penalty", "essay": "Prometheus' gift leaves man without political wisdom, 'for that was in the keeping of Zeus' [7], and the punishment plus the concession-'Skill is weaker by far than Necessity' [6]-frame the bond between giver and ruler.", "source": "[6] PB; [7] Protagoras", "date_added": "2026-10-12", "era": -380}, {"frm": "epimetheus", "to": "prometheus", "type": "kinship+interaction", "title": "The blunder that armed the theft", "essay": "Epimetheus exhausts the faculties on the animals, leaving man unprovided; Prometheus' theft follows from the blunder, and Plato notes he was 'prosecuted for theft, owing to the blunder of Epimetheus' [7].", "source": "[7] Protagoras 320c-321e", "date_added": "2026-10-12", "era": -380}, {"frm": "heracles", "to": "prometheus", "type": "interaction", "title": "Release, prophesied", "essay": "The tradition of eventual release by Heracles stands within the Prometheus Bound frame; the log records it as tradition-internal prophecy [6], with the release narrative itself not fetched as a separate witness.", "source": "[6] PB", "date_added": "2026-10-12", "era": -458}, {"frm": "gilgamesh", "to": "lilith", "type": "conflict", "title": "Dispossessed by the hero's axe", "essay": "When Gilgamesh kills the snake and the Anzud flees with its young, 'the phantom maid living in its trunk left her dwelling and sought refuge in the wilderness' [17]. Her only recorded act in Sumer is a retreat. The name-link to later Lilith is philology, and stays only that.", "source": "[17] lines 136-150 (philological linkage flagged)", "date_added": "2026-10-12", "era": -2000}, {"frm": "lilith", "to": "adam", "type": "interaction", "title": "The wife who chose the wilderness", "essay": "The Ben Sira narrative, via Ginzberg: created from the same dust, she claims equality as a matter of derivation, pronounces the Ineffable Name, and flies away; facing the angelic ultimatum she 'preferred this punishment to living with Adam' [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "eve", "to": "adam", "type": "kinship", "title": "The second fabrication", "essay": "In the same anthology's frame, Eve is formed from Adam's body on the principle that 'only when like is joined unto like the union is indissoluble' [19]. The replacement spouse replaces the rebel.", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "lilith", "to": "agrimus", "type": "kinship+conflict", "title": "The demon's mother, the demon's bargain", "essay": "Methuselah 'delivered the world from thousands of demons, the posterity of Adam which he had begotten with Lilith,' slaying myriads until Agrimus, their first-born, sued for terms and surrendered the demons' names [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "methuselah", "to": "agrimus", "type": "conflict", "title": "Ninety-four myriads per minute", "essay": "Ginzberg's Methuselah wields a sword inscribed with the Ineffable Name; the demon hierarchy capitulates, its kings are fettered, and the rest hide in the ocean's chambers [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "pwyll", "to": "rhiannon", "type": "interaction+marriage", "title": "The courtship no horse can win", "essay": "Three days of pursuit fail-'the more he urged his horse, the further was she from him'-until Pwyll speaks, and she answers that it would have been better for his horse had he asked sooner; she has come on her own quest to seek him [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "arawn", "to": "pwyll", "type": "interaction", "title": "A year in another man's shape", "essay": "Pwyll exchanges form and kingdom with Arawn of Annwfn, holds to the covenant including the marriage bed, and returns as both lord of Dyfed and Head of Annwfn [21]. The exchange is the branch's hinge and Rhiannon's entrance follows it.", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "gwawl", "to": "rhiannon", "type": "conflict", "title": "The suitor in the bag", "essay": "Gwawl claims by covenant what Pwyll rashly granted; Rhiannon's counter-counsel traps him in the small bag at the feast's tallies, and the badger-in-the-bag sport settles the wager [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "llwyd", "to": "rhiannon", "type": "conflict", "title": "A kingdom emptied for a wedding debt", "essay": "Llwyd's revenge for Gwawl arrives as mist over the Gorsedd of Narberth: when it lifts, Dyfed holds 'neither house, nor beast, nor smoke, nor fire, nor man, nor dwelling' [21]. The feud is inherited by Pryderi's marriage.", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "teyrnon", "to": "pryderi", "type": "interaction", "title": "The May-eve vigil", "essay": "Teyrnon watches his mare on the night her colts always vanish; he severs the claw that reaches through the window, pursues the wailing into the dark, and returns to find the newborn in satin at his door [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "pryderi", "type": "kinship", "title": "The mother who served the sentence", "essay": "Accused of destroying her newborn, Rhiannon lets the penance stand rather than press her own vindication, sitting at the horse-block and offering to carry guests into the palace, until the grown child's face settles the account [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "manawyddan", "type": "marriage", "title": "The widow held in the same trap", "essay": "Pryderi gives his mother to Manawyddan with the seven Cantrevs; the enchantment strips the land, and husband and wife are taken together in Llwyd's fortress until the one captured mouse is ransomed [21].", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "bran", "to": "rhiannon", "type": "interaction", "title": "Seven years at the tables of birds", "essay": "Bran's company, reduced to seven and a head, sit at Harlech where the three birds of Rhiannon sing 'and at this repast they continued seven years' [21]. The song is distance-canceling and time-dissolving.", "source": "[21] Branwen branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "epona", "type": "analogy", "title": "A goddess borrowed from another country", "essay": "Epona is real in the record: Gaulish inscriptions, stable statuettes, a shrine-decked pillar in Apuleius [22], cult carried by Roman cavalry [23]. Rhiannon's equation to her is MacCulloch's postulation over a contested etymology [23]; the Mabinogi itself gives Rhiannon a horse only as penance [21].", "source": "[23] vs [21]", "date_added": "2026-10-12", "era": 1911}, {"frm": "nithuth", "to": "volundr", "type": "conflict", "title": "The king who stole the smith's limbs", "essay": "Nithuth takes Völund by night, wears his sword, gives his ring to Bothvild; the queen prescribes: 'Let them straightway cut his sinews of strength,' and the island captivity follows [24].", "source": "[24] st. 17-18 + prose", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "nithuth", "type": "conflict", "title": "Payment in the family's own metal", "essay": "The two princes come for keys and gold; Völund smites off their heads, hides the feet under the bellows, silvers the skulls for Nithuth, sets the eyes as gems for the queen, and brooches the teeth for Bothvild [24]. The revenge is executed in the arrested craft.", "source": "[24] st. 24-26", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "bothvild", "type": "conflict+interaction", "title": "The ring, the beer, the child", "essay": "Bothvild brings the broken ring; the beer puts her to sleep [24]. The Old English Deor states the consequence without euphemism: the death of her brothers grieved her less than her own thing, 'that she was with child' [25].", "source": "[24] st. 27-29; [25]", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "prometheus", "type": "analogy", "title": "Two smiths, two chains", "essay": "Prometheus steals for men and suffers at Zeus' order while conceding that skill bows to Necessity [6]; Völundr suffers at a king's order and answers with the family's own flesh reworked as gifts [24]. Analogy only; no document joins the Greek and Germanic smiths.", "source": "log batch 2 connection map", "date_added": "2026-10-12", "era": 1923}, {"frm": "mason-weems", "to": "george-washington", "type": "transmission", "title": "The parson's unnamed lady", "essay": "Weems introduces the cherry tree as 'too true to be doubted; for it was communicated to me by the same excellent lady' [15], an informant without a name. The most repeated anecdote of the American childhood rests on 'the same excellent lady' and nothing else inside the text.", "source": "[15]", "date_added": "2026-10-12", "era": 1800}, {"frm": "cincinnat
