spá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "The work being nearly done, and the gods fearing to lose Freyja and the sun and moon, Loki [159] Poetic Edda Loki spake : 24. \"They say that with spells in Samsey once Like witches with charms didst thou work; And in witch's guise among men didst thou go ; Unmanly thy soul must seem.\" Frigg spake: 25. \"Of the deeds ye two of old have done Ye should make no speech among men ; Whate'er ye have done in days gone by, Old tales should ne'er be told.\" Loki spake: 26.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Then the father of men and of gods said to him: (ll. 543-544) ‘Son of Iapetus, most glorious of all lords, good sir, how unfairly you have divided the portions!’ (ll. 545-547) So said Zeus whose wisdom is everlasting, rebuking him. But wily Prometheus answered him, smiling softly and not forgetting his cunning trick: (ll. 548-558) ‘Zeus, most glorious and greatest of the eternal gods, take which ever of these portions your heart within you bids.’ So he said, thinking trickery. But Zeus, whose wisdom is everlasting, saw and failed not to perceive the trick, and in his heart he thought mischief against mortal men which also was to be fulfilled.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "\"Be silent, Tyr! for a son with me Thy wife once chanced to win ; Not a penny, methinks, wast thou paid for the wrong, Nor wast righted an inch, poor wretch.\" Freyr spake: 41. \"By the mouth of the river the wolf remains 38. Snorri mentions Tyr's incompetence as a peacemaker.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "sulla", "label": "Lucius Cornelius Sulla (Felix)", "tradition": "Roman dictator, flesh record", "batch": 9, "date_added": "2026-10-12", "era": -82, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His totem fit in a toga: 'he had a small golden image of Apollo from Delphi, which ... in battle to carry about him in his bosom, and that he then kisst it with these words: O Apollo Pythius, who in so many battles hast raised to honour and greatness the Fortunate Cornelius Sylla, wilt thou now cast him down...?' [47]. The man named himself the god's client while campaigning, surname Felix filed in the records as a corporate designation of the relationship. Then the exit that breaks the Roman pattern's own rule: 'In 79 Sulla resigned his dictatorship and retired to Puteoli, where he died in the following year' [48]. Cincinnatus hands back the office at day sixteen to keep the plough [33]; Sulla attends to it after the proscriptions, a longer rent on the dictator's lease. The god kept the amulet's end of the bargain: the tenant died in bed, unpunished. The tradition records him as the exception that proved rule by walking away late and unpursued.", "highlights": [{"text": "There is a story that he had a small golden image of Apollo from Delphi, which he was always wont in battle to carry about him in his bosom.", "source_id": 47, "source_title": "Plutarch, Sylla, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Plutarch/sylla.html"}, {"text": "In 79 Sulla resigned his dictatorship and retired to Puteoli, where he died in the following year.", "source_id": 48, "source_title": "EB1911, \"Sulla, Lucius Cornelius\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Sulla,_Lucius_Cornelius"}, {"text": "human interests in comparison with riches, and think that there is no scope for high honours or for virtue except where lavish wealth abounds, to listen to this story. The one hope of Rome, L. Quinctius, used to cultivate a four-acre field on the other side of the Tiber, just opposite the place where the dockyard and arsenal are now situated; it bears the name of the \" Quinctian Meadows.\" There he was found by the deputation from the senate either digging out a ditch or ploughing, at all events, as is generally agreed, intent on his husbandry", "source_id": 33, "source_title": "Livy, Ab Urbe Condita Book 3, trans. Canon Roberts 1905 (Wikisource raw)", "source_url": "https://en.wikisource.org/wiki/From_the_Founding_of_the_City/Book_3?action=raw"}, {"text": "City was bestowed on L. Mamilius the Tusculan, amidst universal approval. The Dictator would at once have laid down his office had not the meeting of the Assembly for the trial of M. Volscius detained him: fear of the Dictator prevented the tribunes from obstructing it. Volscius was condemned and went into exile at Lanuvium. Quinctius resigned on the sixteenth day the dictatorship which had been conferred upon him for six months. During that period the consul Nau", "source_id": 33, "source_title": "Livy, Ab Urbe Condita Book 3, trans. Canon Roberts 1905 (Wikisource raw)", "source_url": "https://en.wikisource.org/wiki/From_the_Founding_of_the_City/Book_3?action=raw"}], "proposals": [{"text": "Forewarned of the likelihood of disturbance, he had come down into the Forum with an armed escort, not to injure peaceable citizens, but to uphold the authority of the government by putting down the disturbers of public tranquillity. \"It will therefore,\" he proceeded, \"be better for you to keep quiet. Go, lictor, remove the crowd and clear a way for the master to take possession of his slave.\" When, in a transport of rage, he had thundered out these words, the people fell back and left the deserted girl a prey to injustice.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "The thousand soldiers from Antium who had come after the battle, too late to help, were sent back almost with ignominy. ===6=== Then the elections were held, and L. Servilius were chosen as consuls; they entered upon office on August 1, which was then the commencement of the consular year. The season was a trying one, and that year happened to be a pestilential one both for the City and the rural districts, for the flocks and herds quite as much as for human beings.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "It is recorded that after the question of the war had been introduced by Appius Claudius, and before the formal discussion began, L. Valerius Potitus created a scene by demanding that he should be allowed to speak on the political question, and on the decemvirs forbidding him in threatening tones to do so, he declared that he would present himself before the people. Marcus Horatius Barbatus showed himself an equally determined opponent, called the decemvirs \"ten Tarquins,\" and reminded them that it was under the leadership of the Valerii and the Horatii that monarchy had been expelled from Rome.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}]}, {"id": "manawyddan", "label": "Manawyddan fab Llyr", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Brother of Bran, sole counselor in this corpus whose counsel consistently under-performs until handicraft is allowed. When Dyved is magically emptied, he paces the alternative economies: saddles, then shoes, then wheat-land; each is extinguished by guild or spell, and his answer to the last is patient siege engineering (the trap-mouse courtroom) that brings Llwyd to terms. 'By that will I gladly abide,' he says when Pryderi offers Rhiannon in marriage, and right glad is he, 'May Heaven reward him who hath shewn unto me friendship so perfect as this' [21]. Llwyd's confession settles the debt [21]. In the fetched witnesses Manawyddan never rules glorywise; he drills supply chains. He is the Welsh margin of sovereignty: authority that survives occupation by knowing a trade.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "pwyll-branch.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "FISHER UNWIN 11 PATERNOSTER BUILDINGS MXCII {The finding of Taliesin: p0.jpg} INTRODUCTION. {Picture: p11.jpg} This third volume completes the series of Mabinogion and tales translated by Lady Charlotte Guest. As in the two preceding volumes, I have compared Lady Guest's transcript with the original text in the Red Book of Hergest, and with Dr Gwenogvryn Evans' scrupulously accurate diplomatic edition. I have, as before, revised the translation as carefully as I could.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "mars", "label": "Mars", "tradition": "Roman war god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 2500000000.0, "pw_p": 0.0, "pw_t": 2500000000.0, "pw_e": 147766470.929, "pw_pool": "P_military", "pw_why": "Ovid's census: the god of Latium 'the patron of the sword; 'twas the sword that won for a fierce race empire and glory' [36]. The Roman military economy worshipped him by name, at the month-charging start of the year.", "pw_ws": 1.0, "essay": "Ovid writes the Roman exception in a census of cults: the Greeks gave the crafts to Athena, Crete to Diana, Lemnos to Vulcan, but 'Mars was the god to be revered by Latium, for that he is the patron of the sword; 'twas the sword that won for a fierce race empire and glory' [36]. A theology honest enough to name its true economy. The Roman census of gods is a census of revenue sources, and the sword is the oldest revenue Rome admits to. The republic that worshipped him would eventually paint its own founder into the sky above six faculties, War first [16]; the Fasti says openly what the Rotunda's perimeter implies.", "highlights": [{"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "These had probably supplanted earlier names derived from those of the corresponding native gods. Many temples of the god existed, especially in the region of the Allobrogi, and bronze statuettes of him have been found in abundance. Pliny also describes a colossal statue designed for the Arverni who bad a great temple of the god on the Puy de Dome.2 Mercury was not necessarily the chief god, and at times, e.g. in war, the native war-gods would be prominent.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Prostrate matrons, sweeping with their dishevelled hair the temple floors, were everywhere imploring pardon from offended heaven, and entreating that an end might be put to the pestilence. ===8=== Whether it was that the gods graciously answered prayer or that the unhealthy season had passed, people gradually threw off the influence of the epidemic and the public health became more satisfactory. Attention was once more turned to affairs of State, and after one or two interregna had expired, P. Valerius Publicola, who had been interrex for two days, conducted the election of L.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "Quart.” vii. 217-8.] 1705 (return) [ As the price to be given to her father for her: so in _Iliad_ xviii. 593 maidens are called ‘earners of oxen’. Possibly Glaucus, like Aias (fr. 68, ll. 55 ff.), raided the cattle of others.] 1706 (return) [ _i.e._ Glaucus should father the children of others. The curse of Aphrodite on the daughters of Tyndareus (fr. 67) may be compared.] 1707 (return) [ Porphyry, scholar, mathematician, philosopher and historian, lived 233-305 (?) A.D.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "mason-weems", "label": "Mason Locke Weems", "tradition": "American, 1800s biographer", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 0.0, "pw_p": 162000000000.0, "pw_t": 162000000000.0, "pw_e": 118312358997.226, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "A bookselling parson invents the measurement by which the United States still checks its leaders against their legends. Weems' own frame for the cherry tree is open about the epistemology: the anecdote 'is too valuable to be lost, and too true to be doubted; for it was communicated to me by the same excellent lady' who never appears again [15]. Valuable first, true second, source an unnamed lady; the sentence is the whole manufacture in miniature, His child Washington then speaks the line America memorized in smoothed form: 'I can't tell a lie. Pa; you know I can't tell a lie. I did cut it with my hatchet' [15]. The fetched text does not say 'I cannot'; the contraction belongs to a kitchen, which is Weems' real craft: he puts eternity in colloquial clothes so it can be sold door to door. The witness is a fabricator who labeled his fabrication; the fabrication kept at work because the nation it organized never survived without it.", "highlights": [{"text": "It is too valuable to be lost, and too true to be doubted", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}, {"text": "only Wash- ington, the HERO, and the Demigod — Washington the sun-beam in council, or the storm in war", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}], "proposals": [{"text": "Price, Twenty-five cents. 42 LIPPINCOTT, GRAMBO & CO.'S PUBLICATIONS. 2#rrntsTs Tlh nf 3#nrton. FRANCIS MAEION, A celebrated Partisan Officer in the Revolutionary War. against the British and Tories in South Carolina and Georgia. L.Weems. 12mo.; cloth, gilt; with five Engravings.", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "This, the first birth of true religion, appears to him as the one thing needful, the spring of political life, and bond of per- fection. Merciful God ! what good man can think of it but as of treason, and as a very Pandora's box, replete with every curse that can give up our dear country to desolation and havoc !", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "This, the first birth of true religion, appears to iiim as the one thing needful, the spring of political hfe, and bond of per- fection. LIFE OF WASHINGTON. 233 «— so familiar as to have worn off half it3 horrors from the minds of many of our deluded citizens ! Merciful God ! wliat good man can think of it but as of treason, and as a very Pandora's box, replete with every curse that can give up our dear country to desolation and havoc !", "source_title": "weems-life-of-washington-1800s-archive-full.txt", "source_url": "", "cluster": "washington", "proposed": true}]}, {"id": "matthew-boulton", "label": "Matthew Boulton", "tradition": "Soho manufactory proprietor, flesh record", "batch": 5, "date_added": "2026-10-12", "era": 1776, "pw_d": 0.0, "pw_p": 80000000000.0, "pw_t": 80000000000.0, "pw_e": 56508153263.806, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Boswell's actual host at Soho was the senior partner, and Boswell supplies his own employee-file testimony: 'I contemplated him as an iron chieftain, and he seemed to be a father to his tribe' [39]. The line that anchors Watt's pool claim was Boulton's voice: 'I sell here, Sir, what all the world desires to have--POWER' [39]. Watt supplied the improvement, Boulton the covenant: seven hundred wage-hands, one salesman, and a catalogue whose first entry is command-over-work itself. He inherits proxied watts through the firm, as any good salesman collects commission, and his tribe-model of employment is the flesh-record version of every tutelary's household: with dependents, with duties reciprocal, with the house holding the accounts.", "highlights": [{"text": "I shall never forget Mr. Bolton's expression to me: 'I sell here, Sir, what all the world desires to have--POWER.' He had about seven hundred people at work. I contemplated him as an iron chieftain, and he seemed to be a father to his tribe.", "source_id": 39, "source_title": "Boswell, Life of Johnson, Vol 2 (1776 Soho visit), Gutenberg #9072", "source_url": "https://www.gutenberg.org/cache/epub/9072/pg9072.txt"}], "proposals": [{"text": "The following works will be the first issued: CHAMBERS'S INFORMATION FOR THE PEOPLE. CHAMBERS'S CYCLOPEDIA OF ENGLISH LITERATURE. A Critical and Biographical History of English Writers in all departments of Literature, illustrated by specimens of their writings.", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "In the mean season he was delivered to the hands of the executioner. For I cannot but declare and open my conscience, least I should be found to beare small honour and faith to the Gods, wherefore I pray you give eare, and I will shew you the whole truth of the matter. When the Physitian had spoken these words you might perceive how the trayterous knave changed his colour, how hee sweat for feare, how he trembled in every part of his body: and how he set one leg upon another, scratching Ibis head and grinding his teeth, whereby there was no person but would judge him culpable.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "These illustrations are not original; they are coples—exact copies, we are solemnly assured— from original paintings by Christoph Haitzmann. (2) The actual Tvophaeum Mariano-Cellense (in Latin), the work of a reverend compiler who signs himself at the foot P. E., adding four lines in verse containing his biography. It ends with a deposition by the Abbot Kilian of St.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "mercury", "label": "Mercury", "tradition": "Roman name of Hermes, exchange god", "batch": 3, "date_added": "2026-10-12", "era": -650, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 435707115.998, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His charter myth is a trade executed at sword's length. The newborn Hermes steals Apollo's cattle, invents the lyre from a tortoise, and when Apollo comes to collect, the two settle not by combat but by barter: 'He held out the lyre: and Phoebus Apollo took it, and readily put his shining whip in Hermes' hand, and ordained him keeper of herds' [38]. The thief keeps the herd, the victim gets music, and exchange is born as the mechanism by which theft becomes relationship. That is why commerce still prays to him: he is the god of the transaction that converts what you took into what you own. He wears this résumé into the Capitol's Commerce panel [16], where the republic that runs on tariffs and Manifest Destiny hangs the professional boundary-crosser over its ledgers without apparent irony.", "highlights": [{"text": "When Hermes had said this, he held out the lyre: and Phoebus Apollo took it, and readily put his shining whip in Hermes' hand, and ordained him keeper of herds.", "source_id": 38, "source_title": "Homeric Hymn 4 to Hermes, trans. Evelyn-White 1914 (theoi.com)", "source_url": "https://www.theoi.com/Text/HomericHymns2.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "A god Moccus, \"swine,\" was also identified with Mercury, and the swine was a frequent repre- sentative of the corn-spirit or of vegetation divinities in 1 Trans. Gaelic Soc. of Inverness, xxvi. p. 41 1 f. 2 Vallentin, Les Dieux de la cite\" des Allobrogcs, 15 ; Pliny, HN xxxiv. 7. 3 These names are Alaunius, Arcecius, Artaius, Arvernorix, Arvernus, Adsmerius, Canetonensis, Clavariatis, Cissonius, Cimbrianus, Duraiatis, Magniacus, Moccus, Tocirenus, Vassocaletus, Vellaunus, Visucius, Biausius, Cimiacinus, Naissatis. GODS OF GAUL AND CONTINENTAL CELTS 25 Europe.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "These had probably supplanted earlier names derived from those of the corresponding native gods. Many temples of the god existed, especially in the region of the Allobrogi, and bronze statuettes of him have been found in abundance. Pliny also describes a colossal statue designed for the Arverni who bad a great temple of the god on the Puy de Dome.2 Mercury was not necessarily the chief god, and at times, e.g. in war, the native war-gods would be prominent.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "The _Hymn to Hermes_ differs from others in its burlesque, quasi-comic character, and it is also the best-known of the Hymns to English readers in consequence of Shelley’s translation. After a brief narrative of the birth of Hermes, the author goes on to show how he won a place among the gods. First the new-born child found a tortoise and from its shell contrived the lyre; next, with much cunning circumstance, he stole Apollo’s cattle and, when charged with the theft by Apollo, forced that god to appear in undignified guise before the tribunal of Zeus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "methuselah", "label": "Methuselah", "tradition": "medieval Jewish aggadah", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The longest biography reduces to an anti-demonic police action. Ginzberg compiles the apocryphal account: after Enoch's translation 'Methuselah was proclaimed ruler of the earth by all the kings', ruled in rectitude, and then addressed the demon surplus, 'the posterity of Adam which he had begotten with Lilith, that she-devil of she-devils' [19]. After three days' fasting he is authorized to inscribe the Ineffable Name upon his sword, 'wherewith he slew ninety-four myriads of the demons in a minute' [19]; Agrimus, Lilith's first-born demon, surrenders the registry of the rest to him. Power accounting: name-on-sword, ninety-four myriads per minute, and a sobriquet earned. The patriarch of record longevity dies before the flood; witnesses retain him chiefly as the spell-checker of the demon roll.\n\nThe Bible files him as a ledger line with a summit: 'And all the days of Methuselah were nine hundred sixty and nine years: and he died' [18]. Genesis leaves him no speech and no act, only the maximum term; the demon-slaying kingship of the aggadah [19] is the later tradition's answer to the question that line dares you to ask: what is done with nine hundred and sixty-nine years.", "highlights": [{"text": "To banish his loneliness, Lilith was first given to Adam as wife.", "source_id": 19, "source_title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)", "source_url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt"}, {"text": "he was engirdled by storm and whirlwind, hurricane and thundering.[61] METHUSELAH After the translation of Enoch, Methuselah was proclaimed ruler of the earth by all the kings. He walked in the footsteps of his father, teaching truth, knowledge, and fear of God to the children of men all his life, and deviating from the path of rectitude neither to the right nor the left.[62] He delivered the world from thousands of demons, the posterity of Adam which he had begotten wi", "source_id": 19, "source_title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)", "source_url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt"}, {"text": "screech owl also shall rest there, and find for herself a place of rest", "source_id": 18, "source_title": "KJV Bible, Isaiah 34:14 (Gutenberg #10)", "source_url": "https://www.gutenberg.org/cache/epub/10/pg10.txt"}], "proposals": [{"text": "Y schal brynge hem in to myn hooli hil, and Y schal make hem glad in the hous of my preier; her brent sacrifices and her slayn sacrifices schulen plese me on my auter; for whi myn hous schal be clepid an hous of preier to alle puplis, {{verse|chapter=56|verse=8}} seith the Lord God, that gaderith togidere the scaterid men of Israel. Whethir ye ben not cursid sones, a seed of leesyngis?", "source_title": "wycliffe-isaiah-wikisource.txt", "source_url": "", "cluster": "lilith", "proposed": true}, {"text": "The ancient authors and their modern brethren of the guild alike elaborate legendary material which they found at hand. It has been held by some that the Haggadah contains no popular legends, that it is wholly a factitious, academic product. A cursory glance at the pseudepigraphic literature of the Jews, which is older than the Haggadah literature by several centuries, shows how untenable this view is.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}, {"text": "And it is on account of the wonderful sword by means of which the demons were killed that he was called Methuselah.[63] He was so pious a man that he composed two hundred and thirty parables in praise of God for every word he uttered. When he died, the people heard a great commotion in the heavens, and they saw nine hundred rows of mourners corresponding to the nine hundred orders of the Mishnah which he had studied, and tears flowed from the eyes of the holy beings down upon the spot where he died. Seeing the grief of the celestials, the people on earth also mourned over the demise of Methuselah, and God rewarded them therefor.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "metis", "label": "Metis (Thought)", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Counsel, in the Theogony, is a substance one can eat. Metis, Ocean's daughter, 'was wisest among gods and mortal men', and her career ends when Zeus, acting on the advice of Earth and starry Heaven, deceives her with cunning words and puts her in his belly, 'for fear that she might bring forth something stronger than his thunderbolt' [26]. EW's marginal gloss translates her name outright: Thought. She then exists only as an interior cause: from within, she conceives Athene, who emerges through Zeus' head armed [26]. The fetched witnesses give her no actions of her own after the swallowing; she is the one figure whose entire power is exercised from inside an enemy. That internalization is the Theogony's most direct definition of what Zeus commands: even wisdom itself, once ingested, cannot object.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "Freedom from the domination of the great tradition could only be found by seeking new subjects, and such freedom was really only illusionary, since romantic subjects alone are suitable for epic treatment. In its third period, therefore, epic poetry shows two divergent tendencies. In Ionia and the islands the epic poets followed the Homeric tradition, singing of romantic subjects in the now stereotyped heroic style, and showing originality only in their choice of legends hitherto neglected or summarily and imperfectly treated.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Croiset note that the _Aethiopis_ and the _Sack_ were originally merely parts of one work containing lays (the Amazoneia, Aethiopis, Persis, etc.), just as the _Iliad_ contained various lays such as the Diomedeia.] 1114 (return) [ No date is assigned to him, but it seems likely that he was either contemporary or slightly earlier than Lesches.] 1115 (return) [ Cp. In the text I have followed the arrangement of these scholars, numbering the Hymns to Dionysus and to Demeter, I and II respectively: to place _Demeter_ after _Hermes_, and the Hymn to Dionysus at the end of the collection seems to be merely perverse.] 1116 (return) [ _Greek Melic Poets_, p. 165.] 1117 (return) [ This monument was returned to Greece in the 1980’s.— DBK.] 1118 (return) [ Cp. Marckscheffel, _Hesiodi fragmenta_, p. 35.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "The texts of the _Batrachomyomachia_ and of the _Contest of Homer and Hesiod_ are those of Baumeister and Flach respectively: where I have diverged from these, the fact has been noted. Owing to the circumstances of the present time I have been prevented from giving to the _Introduction_ that full revision which I should have desired. INTRODUCTION General The early Greek epic—that is, poetry as a natural and popular, and not (as it became later) an artificial and academic literary form—passed through the usual three phases, of development, of maturity, and of decline.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "faraday", "label": "Michael Faraday", "tradition": "Flesh record, Royal Institution", "batch": 9, "date_added": "2026-10-12", "era": 1831, "pw_d": 0.0, "pw_p": 20000000000.0, "pw_t": 20000000000.0, "pw_e": 15249881712.696, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The induction discovery is logged with the tenacity of a working diary: 'In December 1824 he had attempted to obtain an electric current by means of a magnet, and on three occasions he had made elaborate but unsuccessful attempts to produce a current in one wire by means of a current in another wire... He still persevered, and on the 29th of August 1831' the conversion succeeded [51]. Seven years of negative entries, one positive line-item on a Tuesday. The Britannica obituary-with-accounting calls him a genius of experiment just before this passage; the ledger itself is the evidence. The Prometheus line finally has its auditor: on the record is the man who made magnetism pay current income.", "highlights": [{"text": "He still persevered, and on the 29th of August 1831 he obtained the first evidence that an electric current can produce another in a different circuit.", "source_id": 51, "source_title": "EB1911, \"Faraday, Michael\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Faraday,_Michael"}], "proposals": [{"text": "Secondly, one would like to hear more about the difference between the ‘ ceremonial ’ (purely formal, ritual, official) coitus performed on these occasions and ordinary sexual intercourse. The writers of such works as I could obtain were either too much ashamed to mention such things or else they again underestimated the psychological importance of these sexual details. It is to be hoped that the first-hand reports of travellers and missionaries may be fuller and less equivocal, but in view of the inaccessibility at the present time of publications of this nature,t which are mostly foreign, I cannot speak with any certainty upon the matter.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "Fermoy, 89a. 2 O'Curry, MO Intro, dcxl, ii. 222. 3 Adarnnan, Vita S. Eeeve's ed. 288. 4 Carmichael, Carmina Gadelica, ii, 317. SACRIFICE, PRAYER, AND DIVINATION 239 Ireland, and the foundation of the palace of Emain Macha was also laid with a human victim.1 Many similar legends are connected with buildings all over the Celtic area, and prove the popularity of the pagan custom.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "It, too, is accustomed to divine secret and concealed things from unconsidered or unnoticed details, from the rubbish-heap, as it were, of our observations. Now in two places in the figure of Moses there are certain details which have hitherto not only escaped notice—but, in fact, have not even been properly de- scribed. These are the attitude of his right hand and the position of the two Tables of the Law.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "minerva", "label": "Minerva", "tradition": "Roman crafts and schools goddess", "batch": 3, "date_added": "2026-10-12", "era": -8, "pw_d": 400000000.0, "pw_p": 18000000000.0, "pw_t": 18400000000.0, "pw_e": 1087561226.037, "pw_pool": "P_school", "pw_why": "Ovid logs schoolmasters paying her fees at the Quinquatrus and credits her with attracting new pupils [36]; the education economy has a named patroness with a documented revenue stream.", "pw_ws": 1.0, "essay": "Ovid opens March with a correction: the month is named for Mars, yet the poet points out that 'fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?' [36]. Her festival, the Quinquatrus, is a payroll inventory: the first day bloodless because she was born that day; thereafter the wool-carders, the dyers, the shoemakers, the doctors and, Ovid insists twice, the schoolmasters pay her, 'ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils' [36]. A goddess whose cult collects actual fees from the education economy, which Ovid knew got skimmed. He sums her as 'the goddess of a thousand works' [36]. The Capitol files her under Science [16], which is exactly the Roman job: not war's opposite but its desk half, the faculty that makes skill a taxable category.", "highlights": [{"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "Quart.” vii. 217-8.] 1705 (return) [ As the price to be given to her father for her: so in _Iliad_ xviii. 593 maidens are called ‘earners of oxen’. Possibly Glaucus, like Aias (fr. 68, ll. 55 ff.), raided the cattle of others.] 1706 (return) [ _i.e._ Glaucus should father the children of others. The curse of Aphrodite on the daughters of Tyndareus (fr. 67) may be compared.] 1707 (return) [ Porphyry, scholar, mathematician, philosopher and historian, lived 233-305 (?) A.D.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Her minister and worshipper was I, howbeit I was a stranger to her Church, and unknowne to her religion there. And to the end I might know him againe, he shewed me how the ankle of his left foote was somewhat maimed, which caused him a little to halt.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "The Celtic Minerva, or the goddesses equated with her, \" taught the elements of industry and the arts,\" 2 and is thus the equivalent of the Irish Brigit. Her functions are in keeping with the position of woman as the first civiliser — dis- covering agriculture, spinning, the art of pottery, etc. During this period goddesses were chiefly worshipped, and though the Celts had long outgrown this primitive stage, such culture- goddesses still retained their importance.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "mnemosyne", "label": "Mnemosyne (Memory)", "tradition": "Greek Titaness", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Muses' mother comes on the payroll in a single line of job description: 'Them in Pieria did Mnemosyne, who reigns over the hills of Eleuther, bear of union with the father... a forgetting of ills and a rest from sorrow' [26]. Memory's great service to the king of gods is forgetfulness; the state of the immortal court depends on nine nights with the department that manages what everyone stops remembering. The Muses she bears then issue 'the laws of all and the goodly ways' [26] as song. The genealogical logic is exact: law and song come only after wrath is forgotten.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "DESPECTARE id est electas iam intentius despicere. [1.397] STRIDENTIBUS ALIS signum augurii est.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "#2—Clement, Stromateis i. 16. 75: Celmis, again, and Damnameneus, the first of the Idaean Dactyls, discovered iron in Cyprus; but bronze smelting was discovered by Delas, another Idaean, though Hesiod calls him Scythes 1501. THE THEOGONY (ll. 1-25) From the Heliconian Muses let us begin to sing, who hold the great and holy mount of Helicon, and dance on soft feet about the deep-blue spring and the altar of the almighty son of Cronos, and, when they have washed their tender bodies in Permessus or in the Horse’s Spring or Olmeius, make their fair, lovely dances upon highest Helicon and move with vigorous feet. And one day they taught Hesiod glorious song while he was shepherding his lambs under holy Helicon, and this word first the goddesses said to me—the Muses of Olympus, daughters of Zeus who holds the aegis: (ll. 26-28) ‘Shepherds of the wilderness, wretched things of shame, mere bellies, we know how to speak many false things as though they were true; but we know, when we will, to utter true things.’", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "neptune", "label": "Neptune", "tradition": "Roman, sea and horse god", "batch": 3, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 1047768474.926, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil stages him as a jurisdiction dispute with a whip in it. Juno has borrowed the winds from their keeper Aeolus to wreck the Trojan fleet, and Neptune rises from the water not to fight but to read the offenders their charter: 'The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea' [35]. His power is a deed of property registered against other gods, including the king of the winds, who is told to go home and 'boast and bluster in his empty hall.' The sea calms not through force but through title. The Capitol's Marine panel [16] hangs this god over the young republic's shipping for the same reason Vergil's Rome needed him: the sea is the one territory no senate can garrison, so you put its leaseholder on the wall and pay him in fresco.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Pluto was confounded with Plutus, the god of riches, because corn and minerals came out of the earth, and were thus the gifts of an Earth or Under-earth god. Celtic myth may have had the same confusion. On a Paris altar and on certain steles a god attacks a serpent with a club.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Superstitions, 203 ; and for the Manx Glaslityn, a kind of water- horse, see Rhys, GFL i. 285. For French cognates, see Berenger-Feraud, Superstitions et Survivances, i. 349 f. RIVER AND WELL WORSHIP 189 connected with the similar form ascribed to Celtic water- divinities.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "nereus", "label": "Nereus (Old Man of the Sea)", "tradition": "Greek sea elder", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod's character reference is the shortest personnel file in the Theogony and the most envious: 'Sea begat Nereus, the eldest of his children, who is true and lies not: and men call him the Old Man because he is trusty and gentle and does not forget the laws of righteousness, but thinks just and kindly thoughts' [26]. Positioned in the genealogy before Thaumas (father of Iris) and Phorkys (father of monsters), he is the respectable son in a family of wonders. His narrative function across the tradition is to know and to withhold until caught; prophecy as a family business where the patriarch is honest only under duress.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "The sun's glorious orb now sank into Oceanus and drew down night over the land. Sorry indeed were the Trojans when light failed them, but welcome and thrice prayed for did darkness fall upon the Achaeans. Then Hector led the Trojans back from the ships, and held a council on the open space near the river, where there was a spot ear corpses.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "As for my own self, let me live long and happily, seeing the light of the sun, and come to the threshold of old age, a man prosperous among the people.’ (ll. 106-142) Thereupon Aphrodite the daughter of Zeus answered him: ‘Anchises, most glorious of all men born on earth, know that I am no goddess: why do you liken me to the deathless ones? Nay, I am but a mortal, and a woman was the mother that bare me. Otreus of famous name is my father, if so be you have heard of him, and he reigns over all Phrygia rich in fortresses.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Atreus, when he died, left it to Thyestes, rich in flocks, and Thyestes in his turn left it to be borne by Agamemnon, that he might be lord of all Argos and of the isles. Leaning, then, on his sceptre, he addressed the Argives. \"My friends,\" he said, \"heroes, servants of Mars, the hand of heaven has been laid heavily upon me.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "victory", "label": "Nike / Victory", "tradition": "Greek-Roman, victory daimon", "batch": 3, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 406442279.497, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod gives the whole job description in one sentence of zoning law. Styx bears Nike, Victory, and her siblings Kratos and Bia, Strength and Force, and of the four he says they 'have no house apart from Zeus, nor any dwelling nor path except that wherein God leads them, but they dwell always with Zeus the loud-thunderer' [26]. Victory is not a free agent with her own cult itinerary; she is live-in staff of the sovereign, part of the household that arrived at Olympus because Styx came first to the levy with her children and was rewarded with permanence. Twenty-six centuries later Brumidi paints the same floor plan with federal funds: Washington enthroned, and at his sides 'female figures representing Liberty and Victory/Fame' [16], the abstractions rendered as ladies because that is what a daimon is once a state has purchased the wall space. The Greek text already knew what the Rotunda executes: wherever ultimate authority is seated, Victory has her room in the same house, and she is not paying rent.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "PORGITE DEXTRIS] id est 'propinate mutuo'. an divisae sunt personae, ut 'cingite fronde comas' ad convivas referatur, 'pocula porgite' ad ministros.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "SUPPLEX ORASSE SUPINIS partim precatur, unde ait 'supplex': partim conqueritur, unde ait 'orasse', id est dixisse: hinc et oratores dicimus: nam 'rogare' non procedit, quia conqueritur magis. [4.206] IVPPITER OMNIPOTENS epitheta, quae commemorationem potentiae habent, interdum exprobrationis vim obtinent, ut hoc loco. LENAEUM Bacchicum: nam Liber Lenaeus dicitur, quia torculis praeest, qui et Graece lenoi dicuntur: nam cum sit Graecum, a mentis delenimento non potest accipi. LENAEUS ex calcatorio apo tes lenou, hoc est lacu. [4.208] ASPICIS HAEC id est talia. et hoc sentit: itane talia aspicis, nec vindicas?", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "IAM NUNC aut 'iam nunc excipiam'. [9.270] MATRUM cum dicit 'matrum', non solum sexum ostendit, sed etiam propter muneris laudem vult ostendere fecundas. [9.271] CAPTIVOSQUE DABIT subaudiendum 'bis sex'. [9.272] INSUPER HIS super haec: est figurata elocutio, per dativum casum.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "nithuths-queen", "label": "Nithuth's queen", "tradition": "Volundarkvitha", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Lay's explicit oracle of power and fear: she 'spake: The glow of his eyes is like gleaming snakes, His teeth he gnashes if now is shown / The sword... Let them straightway cut his sinews of strength' [24]. What other characters must summon as proof, she reads off the smith's face at once. Yet her counsel generates the very thing it warned of; the maiming creates its avenger. Her closing inventory is domestic and macabre in equal parts: Volund's confession assigns her the quarry of her murdered sons' eyes, 'gems full fair... To Nithuth's wife so wise he gave them' [24]. In testimony she is the highest-fidelity sensor in the poem; in action she enables the loss her sensor detected. That pairing is her character in the fetched witness, and it is thin by function: a queen who exists to say 'now'.", "highlights": [{"text": "He smote off their heads, and their feet he hid Under the sooty straps of the bellows", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}, {"text": "The glow of his eyes is like gleaming snakes", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}], "proposals": [{"text": "The annotator inserted this note rather clumsily in the midst of the speech of Nithuth's wife. [260] Volundarkvitha house, and he himself wore the sword that Volund had had. \"The glow of his eyes is like gleaming snakes, His teeth he gnashes if now is shown The sword, or Bothvild's ring he sees; Let them straightway cut his sinews of strength, And set him then in Saevarstath.\" So was it done: the sinews in his knee-joints were cut, and he was set in an island which was near the mainland, and was called Saevarstath. There he smithied for the king all kinds of precious things.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "\" Then Nithuth called, the lord of the Njars: \"How gottest thou, Volund, greatest of elves, These treasures of ours in Ulfdalir?\" Volund spake: 16. \"The gold was not on Grani's way, spurious, or lines 4-5 may have been expanded out of a single line running \"The wind-dried wood for Volund burned well.\" 13. Elves: the poem here identifies Volund as belonging to the race of the elves.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "The manuscript of the Volundarkvitha is in such bad shape, and the conjectural emendations have been so numerous, that in the notes I have attempted to record only the most important of them. [253] Poetic Edda There was a king in Sweden named Nithuth. He had two sons and one daughter; her name was Bothvild. There were three brothers, sons of a king of the Finns: one was called Slagfith, another Egil, the third Volund.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "nithuth", "label": "Nithuth/Niðhad", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 1000000000.0, "pw_p": 30000000000.0, "pw_t": 31000000000.0, "pw_e": 6476686140.449, "pw_pool": "P_military", "pw_why": "A king who commands force sufficient to maim an elf-smith [24]; pool share is a throne-share, small.", "pw_ws": 1.0, "essay": "The king of the Njars is remembered for three administrative decisions, all thefts. He takes the smith Volund from the isle where he sat 'fashioning the gold', and it is his queen who supplies the diagnosis: 'The glow of his eyes is like gleaming snakes... Let them straightway cut his sinews of strength, And set him then in Saevarstath' [24]. Maimed and islanded, Volund 'smithied for the king all kinds of precious things. No man dared to go to him, save only the king himself' [24]: Nithuth converts a person into a crown monopoly before he suspects a crown monopoly can hate. The poem's answer arrives by installments: 'I smote off the heads of both thy sons', skulls silvered into cups, eyes as gems to the queen, teeth as a brooch to the daughter [24]. In stanza 39 the king can only concede altitude: 'There is no man so high from thy horse to take thee... While high in the clouds thy course thou takest' [24]. Nithuth's is the most complete documented case of power confiscating craft: it worked for exactly the interval between two island trips.", "highlights": [{"text": "He smote off their heads, and their feet he hid Under the sooty straps of the bellows", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}, {"text": "The glow of his eyes is like gleaming snakes", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}], "proposals": [{"text": "Helblindi: \"Hel-Blinder\" (two manu- scripts have if fr*/iw</z— \"Host-Blinder\"). Sath: \"The Truthful.\" Svipal: \"The Changing.\" Sannge- tal: \"The Truth-Teller.\" Herteit: \"Glad of the Host.\" Hnikar: \"The Overthrower.\" Bileyg: \"The Shifty-Eyed.\" Baleyg: \"The Flaming-Eyed.\" Bolverk: \"Doer of 111\" (cf. Fjolnir: \"The Many-Shaped.\" Grimnir: \"The Hooded.\" Glapsvith: \"Swift in Deceit.\" Fjolsvith: \"Wide of Wisdom.\" 48.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Hlithskjolf (\"Gate-Shelf\") : Othin's watch-tower in heaven, whence he can overlook all the nine worlds; cf. Grimnir: \"the Hooded One.\" [863 Grimnismol he was questioned. The king had him tortured to make him speak, and set him between two fires, and he sat there eight nights.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Gering translates it, \"helmed,\" or else \"fair and wise.\" I suspect that the annotator, anxious to give the Saxon legend as much northern local color as possible, was mistaken in his mythology, and that [254] Volundarkvitha home to their hall with them. Egil took Olrun, and Slag- fith Swan-White, and Volund All-Wise. There they dwelt seven winters ; but then they flew away to find bat- tles, and came back no more.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "odin", "label": "Odin", "tradition": "Norse All-Father", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The rune-purchase is narrated as a self-transaction with no purchaser's regret: 'I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself... Bread no one gave me... downward I peered, to runes applied myself, wailing learnt them' [46]. The offering is the offerer; the office buys its own knowledge with its own body. The Edda's All-Father is not the father of Olympus' desk-temper; he is a one-man research staff, self-sacrificed on the world-tree's branch to acquire the alphabet. The model's thinnest premise, that power is sustained by pain, is his entire job description.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "\"More lightly thou spakest with Laufey's son, When thou badst me come to thy bed ; Such things must be known if now we two Shall seek our sins to tell.\" Then Sif came forward and poured mead for Loki in a crystal cup, and said : 53. \"Hail to thee, Loki, and take thou here The crystal cup of old mead ; For me at least, alone of the gods. Laufey's son: Loki; not much is known of his parents be- yond their names.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "[ Van Lennep explains that Hecate, having no brothers to support her claim, might have been slighted.] 1618 (return) [ The goddess of the _hearth_ (the Roman _Vesta_), and so of the house. Cp. _Homeric Hymns_ v.22 ff.; xxxix.1 ff.] 1619 (return) [ The variant reading ‘of his father’ (sc. Heaven) rests on inferior MS. authority and is probably an alteration due to the difficulty stated by a Scholiast: ‘How could Zeus, being not yet begotten, plot against his father?’ The phrase is, however, part of the prophecy.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "His son, Vithar, is the silent god, famed chiefly for his great shield, and his strength, which is little less than Thor's. This and the following stanza are clearly in bad shape. In Regius only lines i and 4 are found, combined with stanza 56 as a single stanza.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "pandora", "label": "Pandora", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The first woman enters the tradition not as a person but as a consignment. In Works and Days each god contributes a component to the package, and Hermes delivers her to Epimetheus door to door [26]; the Theogony's compressed version calls her 'the woman, the maiden' Zeus had formed [26]. Apollodorus, centuries later, softens her into a mother: 'Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods' [28]. Between those two statements is the whole of her character available in the fetched witnesses: fabricated, gifted, forgotten, and then quietly maternal. The jar is a later proverb's accessory; in Hesiod she opens nothing, Epimetheus simply 'took the gift' [26]. Under-definition again functions as finding: the tradition mined her for mechanism, not personality.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "; [1.2.3] to Iapetus and Asia was born Atlas, who has the sky on his shoulders, and Prometheus, and Epimetheus, and Menoetius, he whom Zeus in the battle with the Titans smote with a thunderbolt and hurled down to Tartarus. 22 [1.2.4] And to Cronus and Philyra was born Chiron, a centaur of double form 23 ; an", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "4 [1.7.2] And Prometheus had a son Deucalion. 105 He reigning in the regions about Phthia, married Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods. 106 And when Zeus would destroy the men of the Bronze Age, Deucalion by the advice of Prometheus constructed a chest, 107 and having stored it with provisions he em", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}], "proposals": [{"text": "TO HESTIA (ll. 1-5) Hestia, you who tend the holy house of the lord Apollo, the Far-shooter at goodly Pytho, with soft oil dripping ever from your locks, come now into this house, come, having one mind with Zeus the all-wise—draw near, and withal bestow grace upon my song. TO THE MUSES AND APOLLO (ll. 1-5) I will begin with the Muses and Apollo and Zeus. For it is through the Muses and Apollo that there are singers upon the earth and players upon the lyre; but kings are from Zeus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And he charged Hermes the guide, the Slayer of Argus, to put in her a shameless mind and a deceitful nature. (ll. 69-82) So he ordered. And they obeyed the lord Zeus the son of Cronos. Forthwith the famous Lame God moulded clay in the likeness of a modest maid, as the son of Cronos purposed.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Grant that we may come again rejoicing to this season, and from that season onwards for many a year. TO ARTEMIS (ll. 1-20) I sing of Artemis, whose shafts are of gold, who cheers on the hounds, the pure maiden, shooter of stags, who delights in archery, own sister to Apollo with the golden sword. Over the shadowy hills and windy peaks she draws her golden bow, rejoicing in the chase, and sends out grievous shafts.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "pericles", "label": "Pericles", "tradition": "Athenian statesman, flesh record", "batch": 6, "date_added": "2026-10-12", "era": -431, "pw_d": 0.0, "pw_p": 30000000000.0, "pw_t": 30000000000.0, "pw_e": 984693100.471, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His funeral oration is an audit of the Athenian character submitted to a juy of mourners: Athens is 'the school of Hellas,' its citizens 'equal to so many emergencies, and graced by so happy a versatility,' and the boasting is 'no mere boast thrown out for the occasion, but plain matter of fact, the power of the state acquired by these habits proves' [44]. Where Brumidi sells Washington as apotheosis [16], Pericles sells the city itself as the monument: the paragon is not a man enthroned but a habit of association itself, and the dead are proof of the operating system. The flesh-record man proposes that the city is the god, and the speech is the offering.\n\nPlutarch files the character the funeral speech sells. Trained by Anaxagoras, he carried natural philosophy into his oratory, and for that elevation 'he was nicknamed the Olympian', a surname some traced to the city's new buildings, some to his power 'both as a politician and a general' [61]. Plutarch's own verdict is severer than the nickname: the man 'never gave way to feelings of envy or hatred', a serenity 'utterly uncorrupt though possessed of great power' [61]. Thucydides lets him have the last word himself, and it is a fiat of identity: 'I am the same man and do not alter, it is you who change' [56]. Statesman, city-cult, apologist of empire: all three registers quote the same man.", "highlights": [{"text": "In short, I say that as a city we are the school of Hellas, while I doubt if the world can produce a man who, where he has only himself to depend upon, is equal to so many emergencies, and graced by so happy a versatility, as the Athenian.", "source_id": 44, "source_title": "Thucydides 2.34-46, Pericles Funeral Oration, trans. Jowett (Hanover excerpt)", "source_url": "https://history.hanover.edu/courses/excerpts/111pericles.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}, {"text": "The Project Gutenberg eBook of Plutarch's Lives, Volume 1 (of 4) This eBook is for the use of anyone anywhere in the United States and most other parts of the world at no cost and with almost no restrictions whatsoever. You may copy it, give it away or re-use it under th", "source_id": 61, "source_title": "Plutarch, Lives, trans. Dryden rev. Clough 1864 (Gutenberg #14033)", "source_url": "https://www.gutenberg.org/cache/epub/14033/pg14033.txt"}, {"text": "at http://classics.mit.edu//Thucydides/pelopwar.html The History of the Peloponnesian War By Thucydides Translated by Richard Crawley ---------------------------------------------------------------------- THE FIRST BOOK Chapter I The State of Greece from the earliest Times to the Commencement", "source_id": 56, "source_title": "Thucydides, History of the Peloponnesian War, trans. Crawley 1874 (MIT Classics)", "source_url": "https://classics.mit.edu/Thucydides/pelopwar.mb.txt"}], "proposals": [{"text": "His work, a mixture of history and geography, was used by Herodotus.] 1716 (return) [ The Hesiodic story of the daughters of Proetus can be reconstructed from these sources. They were sought in marriage by all the Greeks (Pauhellenes), but having offended Dionysus (or, according to Servius, Juno), were afflicted with a disease which destroyed their beauty (or were turned into cows). They were finally healed by Melampus.] 1717 (return) [ Fl. 56-88 A.D.: he is best known for his work on Vergil.] 1718 (return) [ This and the following fragment segment are meant to be read together.—DBK.] 1719 (return) [ This fragment as well as fragments #40A, #101, and #102 were added by Mr.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "First, apparently, in the collection stood the _Hymn to Dionysus_, of which only two fragments now survive. While it appears to have been a hymn of the longer type 1115, we have no evidence to show either its scope or date. The _Hymn to Demeter_, extant only in the MS. discovered by Matthiae at Moscow, describes the seizure of Persephone by Hades, the grief of Demeter, her stay at Eleusis, and her vengeance on gods and men by causing famine.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "322: ‘For Locrus truly was leader of the Lelegian people, whom Zeus the Son of Cronos, whose wisdom is unfailing, gave to Deucalion, stones gathered out of the earth. So out of stones mortal men were made, and they were called people.’ 1752 Fragment #83—Tzetzes, Schol. in Exeg. Iliad. 126: ‘...Ileus whom the lord Apollo, son of Zeus, loved.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "poseidon", "label": "Poseidon", "tradition": "Greek sea god", "batch": 5, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Homer's portrait of reserve power: the three strides to Aegae are protocol footage of an old god who rarely needs to move [1]. The Iliad never gives him Olympus' desk, only the deep address and the title Zeus's brother cannot rescind: when Hera plots to drug Zeus, it is Poseidon's faction that flips the field below Troy. His labour is negative, the threat that holds the balance. The Romans will rename him, re-fresco him for Marine [35][16], and bill the republic's shipping to his account; the bill has been outstanding since the Iliad first noted 'the earth-holder who shakes the earth' [26].\n\nThe Odyssey prices his vendetta precisely. Zeus lays out the terms in the divine council of book 1: Polyphemus 'is son to Neptune by the nymph Thoosa', and 'therefore though he will not kill Ulysses outright, he torments him by preventing him from getting home' [54]. Not a grudge to the death but a licensed harassment, the sea's jurisdiction used as a blockade. Homer's second poem gives the earth-shaker what the first never did: a casus belli and a schedule of damages.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}, {"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Dionysus in especial; a
