e single-point failure. The tradition stores the grief as asset: belovedness converted into the calendar's most replayed loss.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "It is worth noting that the name Hild (\"Warrior\") is the basis of Bryn-hild (\"Warrior in Mail- Coat\"). 32. Baldr: The death of Baldr, the son of Othin and Frigg, was the first of the great disasters to the gods. Frigg had demanded of all created things, saving only the mistletoe, which she thought too weak to be worth trou- [14] Voluspo Famous and fair in the lofty fields, Full grown in strength the mistletoe stood. 33.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Loki, the trouble-maker, brought the mistletoe to Baldr's blind brother, Hoth, and guided his hand in hurling the twig. Baldr was slain, and grief came upon all the gods. The lines in this and the following stanza have been combined in various ways by editors, lacunae having been freely conjectured, but the manuscript version seems clear enough.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Valfather (\"Father of the Slain\") : Othin, chief of the gods, so called because the slain warriors were brought to him at Val- hall (\"Hall of the Slain\") by the Valkyries (\"Choosers of the Slain\"). 2. Nine worlds: the worlds of the gods (Asgarth), of the Wanes (Vanaheim, cf. stanza 21 and note), of the elves (Alf- heim), of men (Mithgarth), of the giants (Jotunheim), of fire (Muspellsheim, cf. stanza 47 and note), of the dark elves (Svartalfaheim), of the dead (Niflheim), and presumably of the dwarfs (perhaps Nithavellir, cf. stanza 37 and note, but the ninth world is uncertain). The tree: the world-ash Yggdrasil, [3] Poetic Edda 3.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "benjamin-franklin", "label": "Benjamin Franklin", "tradition": "American, flesh record", "batch": 4, "date_added": "2026-10-12", "era": 1752, "pw_d": 100000000000.0, "pw_p": 120000000000.0, "pw_t": 220000000000.0, "pw_e": 150296835449.179, "pw_pool": "P_energy", "pw_why": "Drew lightning into a Leyden jar and published directions [40]; the lightning rod and the unpatented stove make electrification and heating his personal doing, gift-form intact.", "pw_ws": 1.0, "essay": "His own Autobiography prints the kite instructions with the flatness of a hardware manual: cedar cross, silk handkerchief, and when the cloud comes over, 'you will find it stream out plentifully from the key on the approach of your knuckle. At this key the phial may be charged; and from electric fire thus obtained, spirits may be kindled' [40]. Fire drawn from heaven, bottleable at knee height, by a printer's apprentice. Aeschylus gave the same act a rock, a vulture, and a tyrant's grudge [6]; Franklin published directions. And he made the inversion explicit as policy writing the clause Prometheus never had: 'as we enjoy great advantages from the inventions of others, we should be glad of an opportunity to serve others by any invention of ours; and this we should do freely and generously' [40]. He refused the patent on his stove. The unchained Prometheus is not a hero myth but a licensing decision, and the American cult got its founder's signature on both.", "highlights": [{"text": "As soon as any of the thunder clouds come over the kite, the pointed wire will draw the electric fire from them... At this key the phial may be charged; and from electric fire thus obtained, spirits may be kindled.", "source_id": 40, "source_title": "Franklin, Autobiography, Gutenberg #20203", "source_url": "https://www.gutenberg.org/cache/epub/20203/pg20203.txt"}, {"text": "That, as we enjoy great advantages from the inventions of others, we should be glad of an opportunity to serve others by any invention of ours; and this we should do freely and generously.", "source_id": 40, "source_title": "Franklin, Autobiography, Gutenberg #20203", "source_url": "https://www.gutenberg.org/cache/epub/20203/pg20203.txt"}, {"text": "and gold—who would claim to have discovered them before me? No one, I know full well, unless he likes to babble idly. [505] Hear the sum of the whole matter in the compass of one brief word—every art possessed by man comes from Prometheus. <div class=\"footnote", "source_id": 6, "source_title": "Aeschylus, Prometheus Bound, trans. Smyth, Loeb 1926 (Perseus)", "source_url": "http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0010"}], "proposals": [{"text": ", were so terrified at the sight, that they could make no attempt to extin- guish the flames. In this most distressing state, the image of my little son came, I thought, to my mind LIFE OF WASHINGTON. 61 more dear and tender than ever: and turning tow- ards the garden where he was engaged with his little corn-stalk plough, I screamed out twice with all my might, George ! George ! — In a moment, as I thought, he threw down his mimic plough, and ran to me saying, \" High !", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "For it was Hermes who first invented fire-sticks and fire. Next he took many dried sticks and piled them thick and plenty in a sunken trench: and flame began to glow, spreading afar the blast of fierce-burning fire. (ll. 115-137) And while the strength of glorious Hephaestus was beginning to kindle the fire, he dragged out two lowing, horned cows close to the fire; for great strength was with him. He threw them both panting upon their backs on the ground, and rolled them on their sides, bending their necks over 2517, and pierced their vital chord.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And Abraham took the wood and arranged it upon the altar, and he bound Isaac, to place him upon the wood which was upon the altar, to slay him for a burnt offering before the Lord.[241] Isaac spake hereupon: \"Father, make haste, bare thine arm, and bind my hands and feet securely, for I am a young man, but thirty-seven years of age, and thou art an old man. When I behold the slaughtering knife in thy hand, I may perchance begin to tremble at the sight and push against thee, for the desire unto life is bold. Also I may do myself an injury and make myself unfit to be sacrificed.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "bothvild", "label": "Bothvild / Beadohild", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The only daughter 'ye two had ever' exists in the Lay chiefly as a vector of proof. She is baited (the stolen ring lures her to the isle), then used: 'True is it, Nithuth, that which was told thee, Once in the isle with Volund was I, An hour of lust, alas it should be! Nought was my might with such a man, Nor from his strength could I save myself' [24]. The verse leaves no plank of consent standing; Bellows' note that Volund's oath-construct forces the vengeance 'to fall more heavily on her father than on her' [24] only fixes the arithmetic, not the act. Then the poem spends her once more, sending her the brooch wrought from her brothers' teeth and closing her story in the mouth of her violator: 'Now big with child does Bothvild go' [24]. The English retellings' gentleman Wayland is a laundering this text does not permit. Bothvild is the tradition's second casualty of the same office of power as her mother's rings: a person the poem converts into evidence.", "highlights": [{"text": "He smote off their heads, and their feet he hid Under the sooty straps of the bellows", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}, {"text": "The glow of his eyes is like gleaming snakes", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}], "proposals": [{"text": "In their present forms the second Guthrun lay is undoubtedly older than the first; In the prose following the Brot the annotator refers to the \"old\" Guthrun lay in terms which can apply only to the second one in the collection. The shorter and \"first\" lay, therefore, can scarcely have been composed much before the year looo, and may be somewhat later. The poet appears to have known and made use of the older lament; stanza 17, for example, is a close parallel to stanza 2 of the earlier poem; but whatever material he used he fitted into a definite poetic scheme of his [411] Poetic Edda own.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "This episode likewise appears among the scenes from Volund's career rudely carved on an ancient casket of ivory, bearing an Anglo-Saxon inscription in runic let- ters, which has been preserved. 40. The manuscript indicates no lacuna. 1267] Poetic Edda 41. Then spake Nithuth, lord of the Njars: \"Rise up, Thakkrath, best of my thralls, Bid Bothvild come, the bright-browed maid, Bedecked so fair, with her father to speak.\" 42.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "The last section, stanzas 31-43, is again fairly consecutive, and tells of the death of Helgi following the rash oath of his brother, Hethin, to win Svava for himself. Parts I, n, and IV may all have come from the same poem or they may not; it is quite impossible to tell surely. All of them are generally dated by commentators not later than the first half of the tenth century, whereas the Hrimgertharmol (section HI) is placed considerably later.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "bran", "label": "Bran the Blessed", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Bendigeid Vran, 'crowned king of this Island' and 'exalted from the crown of London' [21], sits on the rock of Harlech looking over the sea when the fleet of Matholwch arrives; everything after is concession arithmetic. The cauldron he gives the Irish is the most literal resurrection technology in the corpus: 'if one of thy men be slain to-day, and be cast therein, to-morrow he will be as well as ever he was at the best, except that he will not regain his speech' [21]. Wounded in the foot at the last battle, he orders his own beheading and annotations the procession: seven years' feast in Harlech with 'the birds of Rhiannon singing', then fourscore at Gwales, then burial at the White Mount facing France [21]. He converts himself from king to sentinel: a wading bridge across the Irish Sea, then an interred boundary stone against invasion. The fetched tale calls him blessed precisely where he stops being enumerable.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "But Bran also figures as a Christian missionary. He is described as hostage at Rome for his son Caradawc, returning thence as preacher of Christianity to the Cyniry — a legend arising out 1 See Ch. XXIV. 2 See p. 242. 3 Loth, i. 65, ii. 285. 4 Hist.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "They are now restored, and Llwyt seeks no further revenge. But into this framework many native elements were set, and we may therefore scrutinise the story for Celtic mythical elements utilised by its redactor, who probably did not strip its Celtic personages of their earlier divine attributes. In the two Mabinogi these personages are Llyr, his sons Bran and Manawyddan, his daughter Branwen, their half-brothers Nissyen and Evnissyen, sons of Llyr's wife Penardim, daughter of Beli, by a previous marriage with Eurosswyd.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Math or Math Hen, \"the Ancient,\"4 is probably an old 1 See p. 60, supra, and Rhys, HL 90 f. 2 Lady Guest, iii. 255 ; Skene, i. 297, 350. 3 For this Mabinogi see Loth, i. 117 f. ; Guest, iii. 189 f. 4 Skene, i. 236. THE GODS OF THE BRYTHONS 105 divinity of Gwyned, of which he is called lord. He is a king and a magician, pre-eminent in wizardy, which he teaches to Gwydion, and in a Triad he is called one of the great men of magic and metamorphosis of Britain.1 More important are his traits of goodness to the suffering, and justice with no trace of vengeance to the wrong-doer.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "camilla", "label": "Camilla", "tradition": "Roman epic, Volscian amulet-warrior", "batch": 5, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil's portrait of the war-maid reads as a personnel file for a talent the state cannot absorb: 'Unbred to spinning, in the loom unskill'd, she chose the nobler Pallas of the field... outstripp'd the winds in speed upon the plain' [35]. Camilla picks Pallas's other faculty, the loom's opposite number, and the catalogue entry praises her warp-speed legs precisely because her skill cannot be housed indoors. The tradition flags her as Pallas's own refusal: what the city teaches women, the field refuses. She is in the six-groups perimeter's blind spot, the faculty nobody commissioned.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "\"Why are you here,\" said he, \"daughter of aegis-bearing Jove? To see the pride of Agamemnon, son of Atreus? Let me tell you- and it shall surely be- he shall pay for this insolence with his life.\" And Minerva said, \"I come from heaven, if you will hear me, to bid you stay your anger.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "And they saw Aber Sain, and a castle at the mouth of the river. The portal of the castle saw they open, and into the castle they went, and they saw a hall in the castle. Then said they, \"Behold the hall which he saw in his sleep.\" They went into the hall, and they beheld two youths playing at chess on the golden bench.", "source_title": "guest-mabinogion-vol2-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "The Trojans and Achaeans were struck with awe as they beheld, and one would turn to his neighbour, saying, \"Either we shall again have war and din of combat, or Jove the lord of battle will now make peace between us.\" Thus did they converse. Then Minerva took the form of Laodocus, son of Antenor, and went through the ranks of the Trojans to find Pandarus, the redoubtable son of Lycaon. She found him standing among the stalwart heroes who had followed him from the banks of the Aesopus, so she went close up to him and said, \"Brave son of Lycaon, will you do as I tell you?", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "castor-polydeuces", "label": "Castor and Pollux (Dioscuri)", "tradition": "Greek twin demigods", "batch": 7, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Helen's roll-call of the absent has the twins filed by their specialties and then by their excuse: 'Castor, breaker of horses, and Pollux the mighty boxer... Either they have not left Lacedaemon, or else, though they have brought their ships, they will not show themselves in battle for the shame and disgrace that I have brought upon them' [1]. Heroes who stay away because showing up would advertise the shame. Homer gives the absence as employment record: her brother corps will not join her war. The twins who will later be the stable's gods are here stabled indefinitely, out of public view, by reputation-management.\n\nOdysseus files their whereabouts from below: 'Both these heroes are lying under the earth, though they are still alive, for by a special dispensation of Jove, they die and come to life again, each one of them every other day throughout all time, and they have the rank of gods' [54]. The shame Helen suspects kept them from Troy has been settled, and the settlement is a schedule: one immortality, time-shared between two bodies, the earliest alternating pension in the record. Later witnesses will station them on ships as the Dioscuri; Homer already has the god-rank and the roster.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "proposals": [{"text": "Can it be that by eating he would have forfeited the position he claimed as one of the Twelve Gods?] 2520 (return) [ _Lit_. In this hymn they are represented as aged maidens (ll. 553-4), but are closely associated with bees (ll. 559-563) and possibly are here conceived as having human heads and breasts with the bodies and wings of bees. See the edition of Allen and Sikes, Appendix III.] 2524 (return) [ Cronos swallowed each of his children the moment that they were born, but ultimately was forced to disgorge them.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": ".’ Fragment #8—Scholiast on Apollonius Rhodes, Arg. iv. 57: Hesiod says that Endymion was the son of Aethlius the son of Zeus and Calyee, and received the gift from Zeus: ‘(To be) keeper of death for his own self when he was ready to die.’ Fragment #9—Scholiast Ven. on Homer, Il. xi. 750: The two sons of Actor and Molione... Hesiod has given their descent by calling them after Actor and Molione; but their father was Poseidon. Hom. ad Iliad. pert., 265: But Aristarchus is informed that they were twins, not.... such as were the Dioscuri, but, on Hesiod’s testimony, double in form and with two bodies and joined to one another.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "The following analysis (after Marckscheffel) 1108 will show the principle of its composition. From Prometheus and Pronoia sprang Deucalion and Pyrrha, the only survivors of the deluge, who had a son Hellen (frag. 1), the reputed ancestor of the whole Hellenic race. From the daughters of Deucalion sprang Magnes and Macedon, ancestors of the Magnesians and Macedonians, who are thus represented as cousins to the true Hellenic stock.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "ceres", "label": "Ceres", "tradition": "Roman grain goddess", "batch": 3, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 1063918590.688, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid prices her in a single transaction: she was 'the first who invited man to better sustenance and exchanged acorns for more useful food' [37]. The exchange of acorn for grain is the founding trade of the human diet, and so of everything built on the surplus. She 'forced bulls to yield their necks to the yoke; then for the first time did the upturned soil behold the sun' [37]: animal labor and fossil-free horsepower yoked into the calorie economy. The Capitol's Agriculture panel places her, per the AOC caption, with Ceres enthroned in a chair given by an American farmer [16]. Her pool is the oldest energy economy there is, and her claim on it predates every other meter in the graph: before there was a state to deify, there was a field and a god who taught it to feed more people than it used to.", "highlights": [{"text": "Because he traced his descent from her through many generations: he willed that the place of the second month should belong to Venus.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}, {"text": "The first who invited man to better sustenance and exchanged acorns for more useful food. She forced bulls to yield their necks to the yoke; then for the first time did the upturned soil behold the sun.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "NTINENTAL CELTS 45 Hathors in Egypt, the Moirai, Gorgons, and Graias of Greece, the Eoman Fates, and the Norse Nornse, and it is noticeable that the Matres were sometimes equated with the Parcae and Fates.1 In the Matres, primarily goddesses of fertility and plenty, we have one of the most popular and also primitive aspects of Celtic religion. They originated in an age when women cultivated the ground, and the Earth was a goddess whose cult was performed by priestesses. But in course of time new functions were bestowed on the Matres.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "They were thus goddesses of fertility, and probably derived from a cult of a great Mother-goddess, the Earth personified. She may have survived as a goddess Berecynthia ; worshipped at Autun, where her image was borne through the fields to promote fertility, or as the goddesses equated with Denieter and Kore, worshipped by women on an island nearv Britain.2 Such cults of a Mother-goddess lie behind many \\ religions, but gradually her place was taken by an Earth-god,/ \\ the Celtic Dispater or Dagda, whose consort the goddess ' became. She may therefore be the goddess with the cornu- copia on monuments of the horned god, or Aeracura, consort of Dispater, or a goddess on a monument at Epinal holding a basket of fruit and a cornucopia, and accompanied by a ram's- headed serpent.3 These symbols show that this goddess was akin to the Matres.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "See p. 73, infra. 4 Vallentin, op. cit. iv. 29 ; Maury, Croyances du Moyen Age, 382. 0 Holder, s.v. GODS OF GAUL AND CONTINENTAL CELTS 47 thus exhibited the characteristic of the whole group of goddesses.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "cincinnatus", "label": "Cincinnatus", "tradition": "Roman exemplar", "batch": 2, "date_added": "2026-10-12", "era": -450, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Livy prefaces the whole episode with an editorial sneer at his readers: the story is worth hearing precisely for 'those who despise all human interests in comparison with riches'. Then he shows the machine: Three miles across the Tiber, 'the one hope of Rome, L. Quinctius, used to cultivate a four-acre field', and the senate's deputation finds him 'intent on his husbandry' and must ask him to put on his toga before telling him the state needs him [33]. The power transfer is narrated as an interruption of ditch-digging. It ends the same way it began, by act of the holder, not the moment: 'Quinctius resigned on the sixteenth day the dictatorship which had been conferred upon him for six months' [33]. Between those brackets the man does what the office exists for; the memorable item our witness wants remembered is the giving-back. Livy's own ink tells on the myth: the citizen far above the details is sketched entirely through details, four acres, the toga request, sixteen days. Two millennia later the American republic rented the same dramaturgy for Washington, first in the Society of the Cincinnati, then in Weems' biography [15]; the connection remains analogy, for the transmission passes through institutions, not this text.", "highlights": [{"text": "human interests in comparison with riches, and think that there is no scope for high honours or for virtue except where lavish wealth abounds, to listen to this story. The one hope of Rome, L. Quinctius, used to cultivate a four-acre field on the other side of the Tiber, just opposite the place where the dockyard and arsenal are now situated; it bears the name of the \" Quinctian Meadows.\" There he was found by the deputation from the senate either digging out a ditch or ploughing, at all events, as is generally agreed, intent on his husbandry", "source_id": 33, "source_title": "Livy, Ab Urbe Condita Book 3, trans. Canon Roberts 1905 (Wikisource raw)", "source_url": "https://en.wikisource.org/wiki/From_the_Founding_of_the_City/Book_3?action=raw"}, {"text": "City was bestowed on L. Mamilius the Tusculan, amidst universal approval. The Dictator would at once have laid down his office had not the meeting of the Assembly for the trial of M. Volscius detained him: fear of the Dictator prevented the tribunes from obstructing it. Volscius was condemned and went into exile at Lanuvium. Quinctius resigned on the sixteenth day the dictatorship which had been conferred upon him for six months. During that period the consul Nau", "source_id": 33, "source_title": "Livy, Ab Urbe Condita Book 3, trans. Canon Roberts 1905 (Wikisource raw)", "source_url": "https://en.wikisource.org/wiki/From_the_Founding_of_the_City/Book_3?action=raw"}, {"text": "It is too valuable to be lost, and too true to be doubted", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}, {"text": "only Wash- ington, the HERO, and the Demigod — Washington the sun-beam in council, or the storm in war", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}, {"text": "The consuls in that year won a great reputation both at home and in war, for they secured peace abroad, and though there was not harmony at home, the commonwealth was less disturbed than it had been on other occasions. ===25=== The new consuls, L. Nautius, took over the two subjects which remained from the previous year. As before, they obstructed the Law, the tribunes obstructed the trial of Volscius; but the new quaestors possessed greater energy and greater weight.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "algorithmic": true}], "proposals": [{"text": "Herophilus autem, artis eiusdem professor, venarum pulsus rhythmis musicis ait moveri. 5 [![[ALT imaginis: Legamen ad hanc sectionem in lingua gallica]](Images/Utility/Flags/link/France.gif)](F/Roman/Texts/Censorinus/text*.html#12.5)Itaque si et in corporis et in animi motu est harmonia, procul dubio a natalibus nostris musica non est aliena.", "source_title": "censorinus_de_die_natali_lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "Parmenides enim tum ex dextris tum e laevis partibus id ire putavit. Hipponi vero Metapontino, sive, ut Aristoxenus auctor est, Samio ex medullis profluere semen videtur, idque eo probari, quod post admissionem pecudum si quis mares interimat, medullas utpote exhaustas non reperiat.", "source_title": "censorinus_de_die_natali_lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "CERTAM HASTAM inevitabilem: unde est e contra et incertam excussit cervice securim , id est infirmam, evitabilem. [11.768] SACER CYBELO nam montem pro numine, quod in eo colitur, posuit. et bona occasio ad mortem Camillae, ut sacerdotem maioris numinis conetur occidere: per quod quasi exauctoratur Dianae favor, interveniente maioris numinis iracundia. OLIMQUE SACERDOS aut quia vetus sacerdos: aut cuius etiam maiores sacerdotes fuissent, quibus apud veteres in sacra quoque succedebatur. [11.769] LONGE FULGEBAT vel 'longe fulgebat', vel 'longe insignis'.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "brumidi", "label": "Constantino Brumidi", "tradition": "American, artist 1865", "batch": 2, "date_added": "2026-10-12", "era": 1865, "pw_d": 0.0, "pw_p": 126000000000.0, "pw_t": 126000000000.0, "pw_e": 100725666820.478, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The government keeps its own caption for the act: the AOC page in our corpus records that the fresco hangs 'suspended 180 feet above the Rotunda floor', covers 4,664 square feet, and was painted in eleven months at war's end for $40,000 [16]. Its subject, per the same official text, is 'George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame', with thirteen maidens for the original states; the page even glosses its title, 'the raising of a person to the rank of a god' [16]. The perimeter distributes the republic's powers as six named groups, War, Science, Marine, Commerce, Mechanics, Agriculture, each with its tutelary god and its inventor: Vulcan forging cannon in Mechanics, Mercury converting finance into myth in Commerce. Brumidi was 'born and trained in Rome and had painted in the Vatican and Roman palaces before emigrating' [16]; the state hired pagan technique to install its founder on Olympus. About the man the witness is thin, and the thinness is the datum: Brumidi survives as a function, the hand that fixed Washington's address in the air.", "highlights": [{"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "# Apotheosis of Washington | Architect of the Capitol URL: http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm Painted in 1865 by Constantino Brumidi, the fresco is suspended 180 feet above the Rotunda floor and covers an area of 4,664 square feet. \"The Apotheosis of Washington\" in the eye of the Rotunda of the U.S. Capitol was painted in the true fresco technique by Constantino Brumidi in 1865.", "source_title": "brumidi-apotheosis-aoc.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "400 pages, has h canosome portrait and medallion likeness of Jones, and is illustrated with numerous original wood engravings of naval scenes and disungulshed men with whom ho was familiar. THE GREEK EXILE; Or, A Narrative of the Captivity ad Escape of Christophorus Plato Castsnis, DURING THE MASSACRE ON THE ISLAND OF SCIO BY THE TURKS TOGETHER WITH VARIOUS A1JVENTURES IN GREECE AND AMERICA. WILSON. 21 LIPPINCOTT, GRAMBO R CO.'S PUBLICATIONS.", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "Fragment #6—Athenaeus, xv. 682 D, F: The author of the _Cypria_, whether Hegesias or Stasinus, mentions flowers used for garlands. The poet, whoever he was, writes as follows in his first book: (ll. 1-7) ‘She clothed herself with garments which the Graces and Hours had made for her and dyed in flowers of spring—such flowers as the Seasons wear—in crocus and hyacinth and flourishing violet and the rose’s lovely bloom, so sweet and delicious, and heavenly buds, the flowers of the narcissus and lily.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "deucalion", "label": "Deucalion", "tradition": "Greek mythography", "batch": 3, "date_added": "2026-10-12", "era": 100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "'Prometheus had a son Deucalion' [28]: the flood hero is explicitly the fore-thinker's line continuing its profession. Where Epimetheus' house forgot the warning about a gift, Deucalion's acts on one: 'by the advice of Prometheus constructed a chest', survives nine days and nights of universal rain, and lands at Parnassus [28]. Granted a choice by Zeus through Hermes, he chooses to get men, and the stones thrown over the shoulders of the pair become men and women [28]. The fetched witness is a mythographer's epitome, so the figure arrives already compressed; no cult, no cult-site, and no speech survive in this corpus.\n\nOvid restores the speeches the mythographers compress. Landed on the emptied earth, Deucalion turns to Pyrrha 'with tears bursting forth': 'O sister, O wife, O thou, the only woman surviving... we two are the whole people of the earth, whatever both the East and the West behold' [60]. The flood hero's character in the Roman redaction is a husband doing arithmetic aloud, and building an argument that ends in prayer: the couple go together to Themis' oracle, and the answer given is the riddling command to 'throw behind your backs the bones of your great mother' [60]. Forethought's line has in him become grief administration: he survives the warning to preside over the census of two.", "highlights": [{"text": "; [1.2.3] to Iapetus and Asia was born Atlas, who has the sky on his shoulders, and Prometheus, and Epimetheus, and Menoetius, he whom Zeus in the battle with the Titans smote with a thunderbolt and hurled down to Tartarus. 22 [1.2.4] And to Cronus and Philyra was born Chiron, a centaur of double form 23 ; an", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "4 [1.7.2] And Prometheus had a son Deucalion. 105 He reigning in the regions about Phthia, married Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods. 106 And when Zeus would destroy the men of the Bronze Age, Deucalion by the advice of Prometheus constructed a chest, 107 and having stored it with provisions he em", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "The Project Gutenberg eBook of The Metamorphoses of Ovid, Books I-VII This eBook is for the use of anyone anywhere in the United States and most other parts of the world at no cost and with almost no restrictions whatsoever. You may copy it, give it away or re-use it under t", "source_id": 60, "source_title": "Ovid, Metamorphoses, trans. Brookes More 1922 (Gutenberg #21765)", "source_url": "https://www.gutenberg.org/cache/epub/21765/pg21765.txt"}], "proposals": [{"text": "The following analysis (after Marckscheffel) 1108 will show the principle of its composition. From Prometheus and Pronoia sprang Deucalion and Pyrrha, the only survivors of the deluge, who had a son Hellen (frag. 1), the reputed ancestor of the whole Hellenic race. From the daughters of Deucalion sprang Magnes and Macedon, ancestors of the Magnesians and Macedonians, who are thus represented as cousins to the true Hellenic stock.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "1-9 are preserved by Diodorus Siculus iii. 66. 3; ll. 10-21 are extant only in M.] 2502 (return) [ Dionysus, after his untimely birth from Semele, was sewn into the thigh of Zeus.] 2503 (return) [ _sc_. In _Geoponica_ i. 14. 8 the living tortoise is prescribed as a charm to preserve vineyards from hail.]", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Cernunnos was an underworld god, and Conall has do trace of such a character. D'Arbois also traces the saga in Gaul in the fact that on the menhir of Kervadel Mercury is figured with a child, Mercury, in hie opinion, being Lug, and the child Cuchulainn.4 On another altar are depicted (1) a woodman, Esus, cutting down a tree, and (2) a bull on which are perched three birds — Tarvos Trigaranos. Eeinach points out, are combined on another altar at Treves, on which a woodman is cutting down a tree in which are perched three birds, while a bull's head appears in the branches.5 These represent, according to M.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "diana", "label": "Diana", "tradition": "Roman huntress", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid registers her by way of comparative geography: 'Pallas is worshipped by the sons of Cecrops, Diana by Minoan Crete' [36]. The Roman census assigns each people its specialist, and hers is the island tradition of the hunt and the moon, foreign by design. She carries no pool on this graph; the Roman state's cult kept the hunt to the periphery, where the charter says she belongs. What she does hold is the telling parallel in the catalogue itself: a god's worth, per the Fasti, is a function of whose citizens remember her, and the census keeps score.", "highlights": [{"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}], "proposals": [{"text": "You will And it better to chase wild beasts and deer upon the mountains than to fight those who are stronger than you are. If you would try war, do so, and find out by pitting yourself against me, how far stronger I am than you are.\" She caught both Diana's wrists with her left hand as she spoke, and with her right she took the bow from her shoulders, and laughed as she beat her with it about the ears while Diana wriggled and writhed under her blows. Her swift arrows were shed upon the ground, and she fled weeping from under Juno's hand as a dove that flies before a falcon to the cleft of some hollow rock, when it is her good fortune to escape.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "When Queen Juno saw her, she said to Minerva, \"Look, daughter of aegis-bearing Jove, unweariable, that vixen Venus is again taking Mars through the crowd out of the battle; go after her at once.\" Thus she spoke. Minerva sped after Venus with a will, and made at her, striking her on the bosom with her strong hand so that she fell fainting to the ground, and there they both lay stretched at full length. Then Minerva vaunted over her saying, \"May all who help the Trojans against the Argives prove just as redoubtable and stalwart as Venus did when she came across me while she was helping Mars.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "And Alexander beckoned with the hand, and would have made his defence unto the people. 19:34 But when they knew that he was a Jew, all with one voice about the space of two hours cried out, Great is Diana of the Ephesians.", "source_title": "kjv-isaiah-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "dido", "label": "Dido", "tradition": "Roman epic, flesh of Carthage", "batch": 5, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "She receives Cupid as a suppliant gift and Vergil narrates the counterfeit in one clause: 'Unhappy Dido little thought what guest, how dire ay god, she drew so near her breast... she took him to her arms with greedy pleasure, and devour'd his charms' [35]. The seduction is an act of state, an appeal from Venus upstairs to stop the city's founding. Carthage falls to a disguised toddler; the age's largest geopolitical result is produced in the nursery register. Her function in the graph is the counter-node of the founder-story: the city that begs Aeneas to stay, which history answers by sinking hazard. She holds no pool, but Rome's century of Punic terror is her proxy receipt.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "Lesches or Lescheos (as Pausanias calls him) of Pyrrha or Mitylene is dated at about 660 B.C. In his _Little Iliad_ he undertook to elaborate the _Sack_ as related by Arctinus. His work included the adjudgment of the arms of Achilles to Odysseus, the madness of Aias, the bringing of Philoctetes from Lemnos and his cure, the coming to the war of Neoptolemus who slays Eurypylus, son of Telephus, the making of the wooden horse, the spying of Odysseus and his theft, along with Diomedes, of the Palladium: the analysis concludes with the admission of the wooden horse into Troy by the Trojans.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "The _Epigoni_ (ascribed to Antimachus of Teos) recounted the expedition of the “After-Born” against Thebes, and the sack of the city. The Trojan Cycle Six epics with the _Iliad_ and the _Odyssey_ made up the Trojan Cycle—The _Cyprian Lays_, the _Iliad_, the _Aethiopis_, the _Little Iliad_, the _Sack of Troy_, the _Returns_, the _Odyssey_, and the _Telegony_.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "First, apparently, in the collection stood the _Hymn to Dionysus_, of which only two fragments now survive. While it appears to have been a hymn of the longer type 1115, we have no evidence to show either its scope or date. The _Hymn to Demeter_, extant only in the MS. discovered by Matthiae at Moscow, describes the seizure of Persephone by Hades, the grief of Demeter, her stay at Eleusis, and her vengeance on gods and men by causing famine.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "dionysus", "label": "Dionysus", "tradition": "Greek ecstasy god", "batch": 5, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod records the anomaly in one compressed line: 'Semele, daughter of Cadmus was joined with him in love and bare him a splendid son, joyous Dionysus- a mortal woman an immortal son. And now they both are gods' [26]. The promotion of the mother is built into the son's entry in the god-list; the genealogy manufactures divinity in two steps, mortal to immortal, each generation one promotion. The state will later need no such machinery for its own founders: Brumidi hangs Washington directly on Olympus [16], but Dionysus shows the ancient route, admission via biography.\n\nEuripides stages the returned god as a plaintiff with a documented grievance. His prologue states the case: 'I am come to this land of Thebes, Dionysus, the son of Zeus, of whom on a day Semele, the daughter of Cadmus, was delivered by a flash of lightning. I have put off the god and taken human shape' [67]. Pentheus' refusal of the rites is answered with madness, rending, and a palace that shakes itself to ruins on cue [67]. Herodotus years before had filed the same arrival as a foreign policy matter: it was Melampus 'who introduced into Greece the name of Bacchus, the ceremonial of his worship, and the procession of the phallus' [55], the god imported through a named middleman rather than born onto Olympus. Between Hesiod's promotion line [26] and the Bacchae there lies the whole mechanism of admission: lightning birth, export, re-entry under protest.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}, {"text": "online at http://classics.mit.edu//Herodotus/history.html The History of Herodotus By Herodotus Translated by George Rawlinson ---------------------------------------------------------------------- BOOK I Clio These are the researches of Herodotus of Halicarnassus, which he publishes, in the hope", "source_id": 55, "source_title": "Herodotus, Histories, trans. G.C. Macaulay 1890 (MIT Classics)", "source_url": "https://classics.mit.edu/Herodotus/history.mb.txt"}], "proposals": [{"text": "Grant that I may gain the victory in this contest, and order you my song. And now I will remember you and another song also. TO DIONYSUS (ll. 1-16) I will tell of Dionysus, the son of glorious Semele, how he appeared on a jutting headland by the shore of the fruitless sea, seeming like a stripling in the first flush of manhood: his rich, dark hair was waving about him, and on his strong shoulders he wore a purple robe.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "TO HESTIA (ll. 1-5) Hestia, you who tend the holy house of the lord Apollo, the Far-shooter at goodly Pytho, with soft oil dripping ever from your locks, come now into this house, come, having one mind with Zeus the all-wise—draw near, and withal bestow grace upon my song. TO THE MUSES AND APOLLO (ll. 1-5) I will begin with the Muses and Apollo and Zeus. For it is through the Muses and Apollo that there are singers upon the earth and players upon the lyre; but kings are from Zeus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Dionysus had mercy and held him back and made him altogether happy, saying to him: (ll. 55-57) ‘Take courage, good...; you have found favour with my heart. I am loud-crying Dionysus whom Cadmus’ daughter Semele bare of union with Zeus.’ (ll. 58-59) Hail, child of fair-faced Semele! He who forgets you can in no wise order sweet song.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "enkidu", "label": "Enkidu", "tradition": "Sumerian epic", "batch": 3, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The servant who volunteers for the fetch-errand: 'My king, you weep; why does your heart worry? Today I shall retrieve your ball from the nether world' [17]. Gilgamec then issues the longest manager's brief in the corpus, the do-not list for the underworld, and Enkidu violates every clause: clean garments, shod, armed, kissing and hitting; 'he aroused an outcry and was detained in the nether world' [17]. His release is brokered through Enki instructing Utu to open a hole and bring the servant up [17]. Enkidu's character in this witness is perfect procedural disobedience, a lawful casualty of received instructions inverted.\n\nIn the Old Babylonian stratum he is not a companion the hero wins but a device the gods build: created by Aruru 'a man of Anu in her heart' [68], at the people's petition, to oppose a tyrant. The Sumerian poem keeps only the servant's obedience inverted [17]; between the two, the tradition records its own theory of disposition, choosing wildness as the calibrated remedy for surplus kingship, and then billing both prototypes for the lesson.", "highlights": [{"text": "In its trunk, the phantom maid built herself a dwelling, the maid who laughs with a joyful heart.", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "\" 79-90. \"I, the woman, planted the tree with my feet, but not with my hands. I, { Inana } {( 1 ms. has instead: ) the woman}, watered it using my feet but not my hands. She said: \"When will this be a luxuriant chair on which I can take a seat?\" She said: \"When will this be a luxuriant bed on which I can lie down?\" Five years, 10 years had gone by, the tree had grown massive; its bark, however, did not split. At its roots, a s", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "1919) has been followed. (7^ INTRODUCTION. I. The Gilgamesh Epic is the most notable literary product of Baby- lonia as yet discovered in the mounds of Mesopotamia. It recounts the exploits and adventures of a favorite hero, and in its final form covers twelve tablets,", "source_id": 68, "source_title": "Jastrow & Clay, An Old Babylonian Version of the Gilgamesh Epic 1920 (archive.org)", "source_url": "https://archive.org/download/anoldbabylonian00claygoog/anoldbabylonian00claygoog_djvu.txt"}], "proposals": [{"text": "0), but this theory has never seemed convincing (cf. introductory note). 60. The third line of this stanza is not found in Regius. The girdler of earth: Mith- [24] Voluspo And the mighty past they call to mind, And the ancient runes of the Ruler of Gods. 6i.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "And Kai attacked Geraint as best as he could. And Geraint became wroth, and he struck him with the shaft of his lance, so that he rolled headlong to the ground. But chastisement worse than this would he not inflict on him.", "source_title": "guest-mabinogion-vol2-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Snorri quotes eight stanzas of it in the Prose Edda, and in his prose text closely paraphrases many others. The poem is wholly in dialogue form except for a single narrative stanza (stanza 5). After a brief introductory discus- sion between Othin and his wife, Frigg, concerning the reputed wisdom of the giant Vafthruthnir, Othin, always in quest of wisdom, seeks out the giant, calling himself Gagnrath.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "epona", "label": "Epona", "tradition": "Gaulish/Romano-Celtic epigraphic", "batch": 2, "date_added": "2026-10-12", "era": 150, "pw_d": 112500000.0, "pw_p": 0.0, "pw_t": 112500000.0, "pw_e": 8283370.034, "pw_pool": "P_horses", "pw_why": "Epigraphic horse-cult, carried by cavalry [23]; absorbed into the modern equine economy only residually.", "pw_ws": 0.75, "essay": "Epona's dossier here is entirely epigraphic statistics and scholarly 'perhaps'. MacCulloch reports Anwyl's census, in which among the recorded goddesses 'there are 35 mentioned once... 1 twenty-six times (Epona)' [23], and then gives the cautious form of the claim: 'others have remained separate, like Epona, perhaps a river-goddess merged with an animal divinity, and known from inscriptions as a horse-goddess' [23]. Our corpus supplies no story for her anywhere: her salience is all in count and iconography, in stone rather than in text. The link to Rhiannon is analogy only: the textual princess rides; the inscriptional horse-goddess repeats. Her numerousness is her act of power.", "highlights": [{"text": "Gaul, others have remained separate, like Epona, perhaps a river-goddess merged with an animal divinity, and known from inscriptions as a horse-goddess.4 But the most striking instance is found in the grouped goddesses. 1 Anwyl, Celt. Rev. 1906, 43. 2 Holder, s.v. ; Bulliot, RC ii. 22. 3 Holder, i. 10, 89. 4 Holder, s.v. ; see p. 213,", "source_id": 23, "source_title": "MacCulloch, Religion of the Ancient Celts 1911 (archive.org)", "source_url": "https://archive.org/download/religionofancien00macc/religionofancien00macc_djvu.txt"}], "proposals": [{"text": "Les Celtes, 47 f., Les Druides, 157 f. 4 See p. 32, supra ; Reinach, CMR i. 72, Rev. Arch. ii. 123. 5 0' Grady, ii. 123. 1 214 THE RELIGION OF THE ANCIENT CELTS with its foal, or is seated among horses, or feeds horses. Epona may also have been confused with a river-goddess conceived of as a spirited steed.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Octav. xxvii. 7. 4 For the inscriptions, see Holder, s.v. \"Epona.\" 5 GIL iii. 7904. 6 GIL xiii. 3071 ; Reinach, 5^253, GMR i. 64, Ripert. de la Stat. ii. 745 ; Holder, ii. 651-652. ANIMAL WORSHIP 215 may have been found in the fact that the October horse was sacrificed to him for fertility, while the horse was probably associated with fertility among the Celts.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Epona may also have been confused with a river-goddess conceived of as a spirited steed. Water-spirits took that shape, and the Matres were also river-goddesses. A statuette of a horse, with a dedication to a god Eudiobus, otherwise unknown, may have been carried processionally, while a mule has a dedication to Segomo, equated elsewhere with Mars.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "evander", "label": "Evander", "tradition": "Roman epic, Greek emigrant king", "batch": 5, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil's map-annotation for the future Rome gives Evander's band the address and the genealogy in three lines: 'Have planted here, and plac'd on high their walls; their town the founder Pallanteum calls, Deriv'd from Pallas, his great-grandsire's name' [35]. Before there is Rome there is a Greek ark, named for the ancestral Pallas, sitting on the Palatine's exact footprint. The tradition keeps the chain of title transparent: the land was Greek before it was Roman, and the state's founder conducts his first alliance negotiation on the site with a man whose city is named after a goddess nobody has built yet.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "For great was their strength and unconquerable were the arms which grew from their shoulders on their strong limbs. Then Heracles spake to his charioteer strong Iolaus: (ll. 78-94) ‘O hero Iolaus, best beloved of all men, truly Amphitryon sinned deeply against the blessed gods who dwell on Olympus when he came to sweet-crowned Thebe and left Tiryns, the well-built citadel, because he slew Electryon for the sake of his wide-browned oxen. Then he came to Creon and long-robed Eniocha, who received him kindly and gave him all fitting things, as is due to suppliants, and honoured him in their hearts even more.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "As he did so, he cried aloud to the Trojans, \"Up, Trojans, break the wall of the Argives, and fling fire upon their ships.\" Thus did he hound them on, and in one body they rushed straight at the wall as he had bidden them, and scaled the battlements with sharp spears in their hands. Hector laid hold of a stone that lay just outside the gates and was thick at one end but pointed at the other; two of the best men in a town, as men now are, could hardly raise it from the ground and put it on to a waggon, but Hector lifted it quite easily by himself, for the son of scheming Saturn made it light for him. As a shepherd picks up a ram's fleece with one hand and finds it no burden, so easily did Hector lift the great stone and drive it right at the doors that closed the gates so strong and so firmly set.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Another son of Brigit's was Ogma, master of poetry and inventor of ogham writing, the word being derived from his name.3 It is more probable that Ogma's name is a derivative from some word signifying \" speech \" or \" writing,\" and that the connection with \" ogham \" may be a mere folk-etymology. Ogma appears as the champion of the gods,4 a position given him perhaps from the primitive custom of rousing the warriors' emotions by eloquent speeches before a battle. Similarly the Babylonian Marduk, \" seer of the gods,\" was also their champion in fight.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "eve", "label": "Eve", "tradition": "Hebrew", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The fetched witness gives Eve two speeches and one crime against chronology. At Cain's birth her exclamation, per Ginzberg's quotation of the aggada, is 'I have gotten a man through an angel of the Lord' [19], sharing paternity with Samael, the serpent-angel. Lilith is not her ancestor or sister in this corpus but her successor (Adam's other consort) and her quasi-parasite. The traditions assembled here give her no ongoing office of command; her power gets expressed in progeny. Cain is 'the ancestor of all the impious generations' [19]. Eve's figure in this evidence is less a persuadable mother of mankind than an abducted agency, tricked into the founding error and later cited as its witness.\n\nGenesis gives her the better line and the name. Questioned, she answers with causality, not blame: 'The serpent beguiled me, and I did eat' [18]. After sentence is passed, Adam names her for the outcome: 'And Adam called his wife's name Eve; because she was the mother of all living' [18]. The curse assigns her the childbirth economy [18]; Ginzberg's strata then re-establish her as the lawful line against the demonic unions of Adam's separation years [19]. From beguiled to 'mother of all living', the witnesses route the whole human fix through her.", "highlights": [{"text": "To banish his loneliness, Lilith was first given to Adam as wife.", "source_id": 19, "source_title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)", "source_url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt"}, {"text": "he was engirdled by storm and whirlwind, hurricane and thundering.[61] METHUSELAH After the translation of Enoch, Methuselah was proclaimed ruler of the earth by all the kings. He walked in the footsteps of his father, teaching truth, knowledge, and fear of God to the children of men all his life, and deviating from the path of rectitude neither to the right nor the left.[62] He delivered the world from thousands of demons, the posterity of Adam which he had begotten wi", "source_id": 19, "source_title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)", "source_url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt"}, {"text": "screech owl also shall rest there, and find for herself a place of rest", "source_id": 18, "source_title": "KJV Bible, Isaiah 34:14 (Gutenberg #10)", "source_url": "https://www.gutenberg.org/cache/epub/10/pg10.txt"}], "proposals": [{"text": "For this reason he was named Cain, the Hebrew word for stalk of straw. Now Adam took Eve and the boy to his home in the east. God sent him various kinds of seeds by the hand of the angel Michael, and he was taught how to cultivate the ground and make it yield produce and fruits, to sustain himself and his family and his posterity.[7] After a while, Eve bore her second son, whom she named Hebel, because, she said, he was born but to die.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}, {"text": "Cain's descent from Satan, who is the angel Samael, was revealed in his seraphic appearance. At his birth, the exclamation was wrung from Eve, \"I have gotten a man through an angel of the Lord.\"[3] Adam was not in the company of Eve during the time of her pregnancy with Cain. After she had succumbed a second time to the temptations of Satan, and permitted herself to be interrupted in her penance,[4] she left her husband and journeyed westward, because she feared her presence might continue to bring him misery.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}, {"text": "As expiation, all women are commanded to separate a heave offering from the dough. And because woman extinguished the light of man's soul, she is bidden to kindle the Sabbath light.[45] Adam was first made to fall into a deep sleep before the rib for Eve was taken from his side. For, had he watched her creation, she would not have awakened love in him.", "source_title": "ginzberg-legends1-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "fama", "label": "Fama (Rumor)", "tradition": "Roman rumor-daimon", "batch": 6, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil's etymology-of-panic paragraph is a startup growth chart: 'Fame, the great ill, from small beginnings grows: swift from the first; and ev'ry moment brings new vigor to her flights... Soon grows the pigmy to gigantic size; her feet on earth, her forehead in the skies' [35]. Earth manufactures her last, 'revengeful,' as the final Titan, the one born after the storm has ended [35]. The youngest daughter of Earth is the one no one can subpoena. Brumidi will put her on the Rotunda beside Washington as Victory/Fame [16], indistinguishably paired, because the state's version of the same spirit cannot be disentangled from the state's rumor about itself. Every tutelary runs on her wire.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "Icarus altiora petens, dum cupit caeli portionem cognoscere, pennis solis calore resolutis, mari in quod cecidit nomen Icarium inposuit. Phanodicus Deliacon Daedalum propter supradictas causas fugientem navem conscendisse et cum imminerent qui eum sequebantur, intendisse pallium ad adiuvandum ventos et sic evasisse: illos vero qui insequebantur reversos nuntiasse pinnis illum evasisse. MINOIA REGNA Cretam scilicet, id est Minois saevitiam.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "At the same time, a brief review of the chief facts is necessary in order to promote a clearer understanding of the poems which follow, and which make up more than a third of the Eddie collection. That the story of Sigurth reached the North from Germany, having previously developed among the Franks of the Rhine country, is now universally recognized. How and when it spread from northwestern Germany into Scandinavia are less certainly known.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Antonio cons. anno Juliano secundo; qui autem Sextilis fuerat, ex SC.", "source_title": "censorinus-de-die-natali-latin-cholodniak-lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "fdr", "label": "Franklin Delano Roosevelt", "tradition": "American statesman, flesh record", "batch": 6, "date_added": "2026-10-12", "era": 1933, "pw_d": 60000000000.0, "pw_p": 36000000000.0, "pw_t": 96000000000.0, "pw_e": 84354274085.928, "pw_pool": "P_nation", "pw_why": "Asked for and received the war-emergency office in peacetime words [45]; the national pool was his instrument for four terms, the Cincinnatus-loan never visibly returned.", "pw_ws": 1.0, "essay": "His first inaugural begins with an apotropaic charm against the only daimon he names: 'the only thing we have to fear is fear itself- nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance' [45]. Then the request the paragraph was protecting: 'I shall ask the Congress for the one remaining instrument to meet the crisis- broad Executive power to wage a war against the emergency, as great as the power that would be given to me if we were in fact invaded by a foreign foe' [45]. The Cincinnatus script without the plough: the republic is asked to loan the executive the dictator's office, with no sixteenth day scheduled. Whether the offering is handed back is precisely the question this graph's Roman strand exists to ask.", "highlights": [{"text": "The only thing we have to fear is fear itself--nameless, unreasoning, unjustified terror which paralyzes needed efforts to convert retreat into advance.", "source_id": 45, "source_title": "Franklin D. Roosevelt, First Inaugural Address, 1933 (Avalon Project)", "source_url": "https://avalon.law.yale.edu/20th_century/froos1.asp"}, {"text": "I shall ask the Congress for the one remaining instrument to meet the crisis--broad Executive power to wage a war against the emergency, as great as the power that would be given to me if we were in fact invaded by a foreign foe.", "source_id": 45, "source_title": "Franklin D. Roosevelt, First Inaugural Address, 1933 (Avalon Project)", "source_url": "https://avalon.law.yale.edu/20th_century/froos1.asp"}], "proposals": [{"text": "Neck, when training, as was expected, for immediate service. For his services as an adjutant general, he was allowed by the crown one hundred pounds sterling per annum 32 LIFE OF WASHINGTON. Fiench encroachments on the Ohio — Washington volunteers his service to governor Dinwiddie — his hazardous embassy to the French and Indians — miraculous escapes — account of his journal- anecdote of his modesty.", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "As things then stood, even his bitterest enemies, if he had any, m.ight have said, \"happy man be his dole !\" for he came to the helm in a perilous and fearful season. Like chaos, \" in the olden time,\" our government was \"without form and void : and dark- ness dwelt upon the face of the deep.\" Enemies innumerable threatened the country, both from witliin and without, abroad and at home — the people of three continents at daggers drawn with the young republic of America ! The pirates of Morocco laying their uncircumcised hands on our rich commerce in the Mediterraneao.", "source_title": "weems-life-of-washington-1800s-archive-full.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "— then swinging his arm in the air, with a tremendous stamp and voice of timndcr, that made the hollow dome resound, ho swore a mighty oath, \"that he owed no allegiance to the king of England !\" Many in Congress trembled at hearing such a speech ; and, on mention of Independence, felt the pang which nature feels when soul and body are parting. But fearing that \" true friendship could never grow again, whore wounds of deadly hate had pierced so deep,\" they at length resolved to part. The gentlemen appointed by Congress to frame the declaration of Independence, were Thomas Jeffer- son, JoHX Adams, Dr.", "source_title": "weems-life-of-washington-1800s-archive-full.txt", "source_url": "", "cluster": "washington", "proposed": true}]}, {"id": "freyja", "label": "Freyja", "tradition": "Norse love goddess", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The prose register files her under cash producing grief: 'Freyja is wedded to a person called Odur... and their daughter, named Hnossa, is so very handsome that whatever is beautiful and precious is called by her name (hnosir). But Odur left his wife in order to travel into very remote countries. Since that time Freyja continues to weep' [46], and any reader of the stanza knows the tears are gold. The goddess of the bride-price produces the precious thing herself, by the only domestic scene in the Edda that pays out. The hoard is wept, not mined. In this economy, the most liquid asset enters circulation through a household's loss.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "\"Be silent, Freyja ! for fully I know thee, Sinless thou art not thyself; 27. On the death of Baldr, slain through Loki's cunning by the blind Hoth, cf. Freyja: daughter of Njorth and sister of Freyr; cf. note on introductory prose.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "\"Maiden, awake! wake thee, my friend, My sister Hyndla, in thy hollow cave! Already comes darkness, and ride must we To Valhall to seek the sacred hall. 2. \"The favor of Heerfather seek we to find, To his followers gold he gladly gives; To Hermoth gave he helm and mail-coat, And to Sigmund he gave a sword as gift. 1.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "In line 3 the manuscript has \"he,\" the reference being, of course, to Thor, on whose appetite cf. Lokasenna, note to introductory prose and stanza 53. [ 180 ] Thrymskvitha 27. Thrym looked 'neath the veil, for he longed to kiss, But back he leaped the length of the hall : \"Why are so fearful the eyes of Freyja?", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "freyr", "label": "Freyr", "tradition": "Norse fertility god", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The flyting gives him the cleanest personnel review in the corpus, delivered by Ty as testimony and Loki as provocation: 'Frey is best of all the exalted gods in the Æsir's courts: no maid he makes to weep, no wife of man, and from bonds looses all' [46]. The list of negatives is the whole job: the fertility god is measured by what he does not take. In a family where conflict is the currency, Freyr's signature service is unbinding. Even the bawdiest god in the pantheon is documented as the one who does not damage the accounts of women, which the poem says out loud and the insult-comic does not dispute.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "No longer I hold it hid ; With thy sister hadst thou so fair a son. Thus hadst thou no worse a hope.\" Tyr spake : 37. \"Of the heroes brave is Freyr the best Here in the home of the gods ; 34.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "\"Small ill does it work though a woman may have A lord or a lover or both ; But a wonder it is that this womanish god Comes hither, though babes he has borne.\" 32. Before each of stanzas 32-42 the manuscript indicates the speaker, through the initial letter of the name written in the margin. Thy brother: Freyr; there is no other indication that such a relation existed between these two, but they themselves were the product of such a union; cf. stanza 36 and note. 33.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Much have I told thee, and further will tell ; There is much that I know; — wilt thou hear yet more? 34. Heith and Hrossthjof, the children of Hrimnir. are various references to the \"twelve\" gods (including Baldr) ; Snorri {Gylfaginning, 20-33) lists the following twelve in addi- tion to Othin: Thor, Baldr, Njorth, Freyr, Tyr, Bragi, Heimdall, Hoth, Vithar, Vali, Ull and Forseti; he
