nd they called the boy Pan 2532 because he delighted all their hearts. (ll. 48-49) And so hail to you, lord! And now I will remember you and another song also. TO HEPHAESTUS (ll. 1-7) Sing, clear-voiced Muses, of Hephaestus famed for inventions.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "But the glorious allies of loud-crashing Zeus have their dwelling upon Ocean’s foundations, even Cottus and Gyes; but Briareos, being goodly, the deep-roaring Earth-Shaker made his son-in-law, giving him Cymopolea his daughter to wed. (ll. 820-868) But when Zeus had driven the Titans from heaven, huge Earth bare her youngest child Typhoeus of the love of Tartarus, by the aid of golden Aphrodite. Strength was with his hands in all that he did and the feet of the strong god were untiring. From his shoulders grew an hundred heads of a snake, a fearful dragon, with dark, flickering tongues, and from under the brows of his eyes in his marvellous heads flashed fire, and fire burned from his heads as he glared.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "priam", "label": "Priam", "tradition": "Greek epic king of Troy", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His great negotiation is conducted in the idiom of kinship inventory: 'Think of your father, O Achilles like unto the gods, who is such even as I am, on the sad threshold of old age... he is glad, and his days are full of hope that he shall see his dear son come home to him from Troy; but I, wretched man that I am, had children not a few in far-famed Troy, and of all these there is none left' [1] (Il. 24). The ransom is purchased not in talents but in staged equivalents: one old man swapped for another, one sonless father teaching the victor's filial arithmetic. The king retrieves his son's body by performing a mortgage on memory. It is the oldest leveraged buyout in the tradition.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "proposals": [{"text": "Go you within, and embrace the knees of the son of Peleus: beseech him by his father, his lovely mother, and his son; thus you may move him.\" With these words Mercury went back to high Olympus. Priam sprang from his chariot to the ground, leaving Idaeus where he was, in charge of the mules and horses. The old man went straight into the house where Achilles, loved of the gods, was sitting.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "King Priam was first to note him as he scoured the plain, all radiant as the star which men call Orion's Hound, and whose beams blaze forth in time of harvest more brilliantly than those of any other that shines by night; brightest of them all though he be, he yet bodes ill for mortals, for he brings fire and fever in his train- even so did Achilles' armour gleam on his breast as he sped onwards. Priam raised a cry and beat his head with his hands as he lifted them up and shouted out to his dear son, imploring him to return; but Hector still stayed before the gates, for his heart was set upon doing battle with Achilles. The old man reached out his arms towards him and bade him for pity's sake come within the walls.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "He took the old man's hand and moved him gently away. The two wept bitterly- Priam, as he lay at Achilles' feet, weeping for Hector, and Achilles now for his father and now for Patroclous, till the house was filled with their lamentation. But when Achilles was now sated with grief and had unburthened the bitterness of his sorrow, he left his seat and raised the old man by the hand, in pity for his white hair and beard; then he said, \"Unhappy man, you have indeed been greatly daring; how could you venture to come alone to the ships of the Achaeans, and enter the presence of him who has slain so many of your brave sons?", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "pryderi", "label": "Pryderi", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Pryderi is born from Rhiannon's shoulder as an infant whose colt-night theft is the whole branch: one claw, one vigil, one foster-household, one naming by Pendaran: 'Pryderi, son of Pwyll, chief of Annwvyn' [21]. In the Third Branch he supplies the balm: a kingdom emptied by a spell he triggers, an exile kept alive by market craft: shoemaking in three towns is the only employment sequence in the corpus where national scales are settled by craft guild pricing ('nothing would the brewers do but take the trade of him' style; the fetched passage runs saddlery-to-shoeing) [21]. His most legible decision is exogamy-statecraft: 'I did offer thee as a wife to Manawyddan the son of Llyr' is his line to his mother [21]. He reads as a transfer student between tales, thin in all of them; by the Fourth Branch his death belongs to another book.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "And thereupon behold Pryderi and Rhiannon. And he rose up to meet them, and greeted them, and sat down beside them. \"Ah chieftain, set now my wife at liberty,\" said the bishop.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "ELIGION OF THE ANCIENT CELTS are to be found in the Mdbinogi, and there may have been more than one goddess called Eigantona, later fused into one. But in the tales she is merely a queen of old romance. Pryderi, as has been seen, was despoiled of his swine by Gwydion.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Gwynedd, and Pryderi the son of Pwyll was lord over the one and twenty Cantrevs of the South; and these were the seven Cantrevs of Dyved, and the seven Cantrevs of Morganwc, the four Cantrevs of Ceredigiawn, and the three of Ystrad Tywi. At that time, Math the son of Mathonwy could not exist unless his feet were in the lap of a maiden, except only when he was prevented by the tumult of war. Now the maiden who was with him was Goewin, the daughter of Pebin of Dol Pebin, in Arvon, and she was the fairest maiden of her time who was known there.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "pwyll", "label": "Pwyll", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Prince of Dyved is the Mabinogion's documented case of rule by courtesy. He meets a stranger of the Otherworld on his own chase, asks friendship, and accepts the price: 'I will show thee. Behold thus it is thou mayest' -- a body swap to fight Havgan, 'a man whose dominions are opposite to mine, who is ever warring against me' [21]. Only one blow is allowed, and Pwyll gives exactly one, declining the second for a year of impersonated kingship; the witness emphasizes that he did not touch Arawn's wife. Later, pledged hospitality sends him a rival: he learns of Rhiannon's designation for 'Gwawl the son of Clud' and must yield on the word already spoken [21]. His rescue plays out as literate contract abuse: the bag is exactly what was promised and who gets into it is Gwawl, beaten by Pwyll's knights, whence 'the game of Badger in the Bag' [21]. He rules by keeping words harder than anyone else keeps them.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "And after the first meal, Pwyll arose to walk, and he went to the top of a mound that was above the palace, and was called Gorsedd Arberth. \"Lord,\" said one of the Court, \"it is peculiar to the mound that whosoever sits upon it cannot go thence, without either receiving wounds or blows, or else seeing a wonder.\" \"I fear not to receive wounds and blows in the midst of such a host as this, but as to the wonder, gladly would I see it. I will go therefore and sit upon the mound.\" And upon the mound he sat.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "And after the first meal, Pwyll arose to walk, and he went to the top of a mound that was above the palace, and was called Gorsedd Arberth. \"Lord,\" said one of the Court, \"it is peculiar to the mound that whosoever sits upon it cannot go thence, without either receiving wounds or blows, or else seeing a wonder.\" \"I fear not to receive wounds and blows in the midst of such a host as this, but as to the wonder, gladly would I see it. I will go therefore and sit upon the mound.\" And upon the mound he sat.", "source_title": "pwyll-branch.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Gwynedd, and Pryderi the son of Pwyll was lord over the one and twenty Cantrevs of the South; and these were the seven Cantrevs of Dyved, and the seven Cantrevs of Morganwc, the four Cantrevs of Ceredigiawn, and the three of Ystrad Tywi. At that time, Math the son of Mathonwy could not exist unless his feet were in the lap of a maiden, except only when he was prevented by the tumult of war. Now the maiden who was with him was Goewin, the daughter of Pebin of Dol Pebin, in Arvon, and she was the fairest maiden of her time who was known there.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "pyrrha", "label": "Pyrrha", "tradition": "Greek mythography", "batch": 3, "date_added": "2026-10-12", "era": 100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Known by one sentence of Apollodorus and one act. She is 'the daughter of Epimetheus and Pandora' and the wife Deucalion takes aboard the chest his father advised [28]. After nine days on the water she disembarks at Parnassus with him and, at Zeus' bidding through Hermes, helps throw the stones that become the new race of men [28]. The witnesses give her no words. Her salience is genealogical: she is the hinge between the thieving, gift-forgetting generation of Titans' children and the rebuilt human stock.\n\nOvid gives her the words Apollodorus withholds, and they are a refusal. At Themis' answer, 'Pyrrha is the first by her words to break the silence, and refuses to obey the commands of the Goddess; and begs her, with trembling lips, to grant her pardon, and dreads to offend the shades of her mother' [60]. The tradition's one glimpse of her independence is piety against piety: she will not throw her mother's bones, and must be argued past herself by her husband's reading that the mother is earth and the bones are stones [60]. Pandora's daughter ends the myth doing what her mother never learned: refusing an instruction from the gods until its cost has been reasoned out.", "highlights": [{"text": "; [1.2.3] to Iapetus and Asia was born Atlas, who has the sky on his shoulders, and Prometheus, and Epimetheus, and Menoetius, he whom Zeus in the battle with the Titans smote with a thunderbolt and hurled down to Tartarus. 22 [1.2.4] And to Cronus and Philyra was born Chiron, a centaur of double form 23 ; an", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "4 [1.7.2] And Prometheus had a son Deucalion. 105 He reigning in the regions about Phthia, married Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods. 106 And when Zeus would destroy the men of the Bronze Age, Deucalion by the advice of Prometheus constructed a chest, 107 and having stored it with provisions he em", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "The Project Gutenberg eBook of The Metamorphoses of Ovid, Books I-VII This eBook is for the use of anyone anywhere in the United States and most other parts of the world at no cost and with almost no restrictions whatsoever. You may copy it, give it away or re-use it under t", "source_id": 60, "source_title": "Ovid, Metamorphoses, trans. Brookes More 1922 (Gutenberg #21765)", "source_url": "https://www.gutenberg.org/cache/epub/21765/pg21765.txt"}], "proposals": [{"text": "Croiset note that the _Aethiopis_ and the _Sack_ were originally merely parts of one work containing lays (the Amazoneia, Aethiopis, Persis, etc.), just as the _Iliad_ contained various lays such as the Diomedeia.] 1114 (return) [ No date is assigned to him, but it seems likely that he was either contemporary or slightly earlier than Lesches.] 1115 (return) [ Cp. In the text I have followed the arrangement of these scholars, numbering the Hymns to Dionysus and to Demeter, I and II respectively: to place _Demeter_ after _Hermes_, and the Hymn to Dionysus at the end of the collection seems to be merely perverse.] 1116 (return) [ _Greek Melic Poets_, p. 165.] 1117 (return) [ This monument was returned to Greece in the 1980’s.— DBK.] 1118 (return) [ Cp. Marckscheffel, _Hesiodi fragmenta_, p. 35.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Lesches or Lescheos (as Pausanias calls him) of Pyrrha or Mitylene is dated at about 660 B.C. In his _Little Iliad_ he undertook to elaborate the _Sack_ as related by Arctinus. His work included the adjudgment of the arms of Achilles to Odysseus, the madness of Aias, the bringing of Philoctetes from Lemnos and his cure, the coming to the war of Neoptolemus who slays Eurypylus, son of Telephus, the making of the wooden horse, the spying of Odysseus and his theft, along with Diomedes, of the Palladium: the analysis concludes with the admission of the wooden horse into Troy by the Trojans.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "The following analysis (after Marckscheffel) 1108 will show the principle of its composition. From Prometheus and Pronoia sprang Deucalion and Pyrrha, the only survivors of the deluge, who had a son Hellen (frag. 1), the reputed ancestor of the whole Hellenic race. From the daughters of Deucalion sprang Magnes and Macedon, ancestors of the Magnesians and Macedonians, who are thus represented as cousins to the true Hellenic stock.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "quirinus", "label": "Quirinus (Romulus)", "tradition": "Roman founding god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid's compressed founder story reads like a patent filing for succession: Silvia 'lay big, for already within her womb there was Rome's founder... Remus was growing, and growing, too, was Quirinus' [36]. Two embryos, one name becomes a god. Then the wall, and Ovid's single dry afterword recorded as historical commentary: 'Walls were built, which, small though they were, it had been better for Remus not to have overleaped' [36]. The founding breach is the founding lesson. It is the Roman original of a pattern this graph keeps finding: the first act of the city's god is the murder of the boundary-crosser. Quirinus is the nation state's own genius as tutelary [14] with a fratricide in the footer.", "highlights": [{"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "TEM INGENS GYROS loci genium per magnitudinem vult probare; nullus enim locus sine genio, qui per anguem plerumque osten", "source_id": 14, "source_title": "Servius, In Vergilii Aeneida Commentarii, ed. Thilo & Hagen 1881 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Serv.+A.+5.85"}], "proposals": [{"text": "Enough; I will make you amends for what I have said, and if any ill has now been spoken may the gods bring it to nothing.\" He then left them and went on to others. Presently he saw the son of Tydeus, noble Diomed, standing by his chariot and horses, with Sthenelus the son of Capaneus beside him; whereon he began to upbraid him. \"Son of Tydeus,\" he said, \"why stand you cowering here upon the brink of battle?", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "\"Dear son of Capaneus,\" said he, \"come down from your chariot, and draw the arrow out of my shoulder.\" Sthenelus sprang from his chariot, and drew the arrow from the wound, whereon the blood came spouting out through the hole that had been made in his shirt. Then Diomed prayed, saying, \"Hear me, daughter of aegis-bearing Jove, unweariable, if ever you loved my father well and stood by him in the thick of a fight, do the like now by me; grant me to come within a spear's throw of that man and kill him. He has been too quick for me and has wounded me; and now he is boasting that I shall not see the light of the sun much longer.\" Thus he prayed, and Pallas Minerva heard him; she made his limbs supple and quickened his hands and his feet.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "rhiannon", "label": "Rhiannon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 450000000.0, "pw_p": 0.0, "pw_t": 450000000.0, "pw_e": 175778454.742, "pw_pool": "P_horses", "pw_why": "Horse association is a penance in the primary witness [21] and the goddess claim scholarship [23]; the equine economy still runs under her modern name.", "pw_ws": 0.75, "essay": "The texts give a woman with full agency; the modern label gives a function. In the Pwyll branch she rides past pursuit-'the more he urged his horse, the further was she from him'-and halts only when spoken to, remarking 'it were better for thy horse hadst thou asked it long since' [21]. She engineers her own marriage, survives a false accusation and a horse-carrying penance at the gate [21], and in the Branwen branch her three birds sing the survivors of Ireland through seven years at Harlech [21]. The Manawyddan branch has Pryderi settle her on Manawyddan with the seven Cantrevs, after which Llwyd empties Dyfed in a fall of mist [21]. Nowhere is she called a goddess or given a horse attribute. The label 'Welsh horse goddess' rests on MacCulloch's Rigantona etymology ('we may postulate') [23] plus an analogy to the genuinely epigraphic Epona [23], whose rose-decked stable shrine Apuleius already attests [22]. The abstraction erases exactly what the primary witness supplies.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "Gaul, others have remained separate, like Epona, perhaps a river-goddess merged with an animal divinity, and known from inscriptions as a horse-goddess.4 But the most striking instance is found in the grouped goddesses. 1 Anwyl, Celt. Rev. 1906, 43. 2 Holder, s.v. ; Bulliot, RC ii. 22. 3 Holder, i. 10, 89. 4 Holder, s.v. ; see p. 213,", "source_id": 23, "source_title": "MacCulloch, Religion of the Ancient Celts 1911 (archive.org)", "source_url": "https://archive.org/download/religionofancien00macc/religionofancien00macc_djvu.txt"}, {"text": "image of the goddesse Hippone, which was garnished and decked round about with faire and fresh roses", "source_id": 22, "source_title": "Apuleius, Golden Asse, trans. Adlington 1566 (Gutenberg #1666)", "source_url": "https://www.gutenberg.org/cache/epub/1666/pg1666.txt"}, {"text": "FISHER UNWIN 11 PATERNOSTER BUILDINGS MXCII {The finding of Taliesin: p0.jpg} INTRODUCTION. {Picture: p11.jpg} This third volume completes the series of Mabinogion and tales translated by Lady Charlotte Guest. As in the two preceding volumes, I have compared Lady Guest's transcript with the original text in the Red Book of Hergest, and with Dr Gwenogvryn Evans' scrupulously accurate diplomatic edition. I have, as before, revised the translation as carefully as I could.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "algorithmic": true}], "proposals": []}, {"id": "styx", "label": "Styx", "tradition": "Greek oath-river", "batch": 5, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The reward for showing up first is permanent infrastructure. When Zeus levied the gods against the Titans, Styx 'came first to Olympus with her children' and he 'honoured her, and gave her very great gifts, for her he appointed to be the great oath of the gods' [26]. After that, Hediod says simply, 'he himself mightily reigns and rules' [26]. The causality is written backwards on purpose: he reigns because she holds the oath pool. Every contract between immortals is settled in her water, fetched in a golden jug by Iris [26]. Emulation, Victory, Strength and Force sleep in her house but answer to his roof; she is the escrow of Olympus, the one power in the register who got paid before the war was won.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "Such an oath, then, did the gods appoint the eternal and primaeval water of Styx to be: and it spouts through a rugged place. (ll. 807-819) And there, all in their order, are the sources and ends of the dark earth and misty Tartarus and the unfruitful sea and starry heaven, loathsome and dank, which even the gods abhor. And there are shining gates and an immoveable threshold of bronze having unending roots and it is grown of itself 1625. And beyond, away from all the gods, live the Titans, beyond gloomy Chaos.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And after these Erigenia 1616 bare the star Eosphorus (Dawn-bringer), and the gleaming stars with which heaven is crowned. (ll. 383-403) And Styx the daughter of Ocean was joined to Pallas and bare Zelus (Emulation) and trim-ankled Nike (Victory) in the house. Also she brought forth Cratos (Strength) and Bia (Force), wonderful children. These have no house apart from Zeus, nor any dwelling nor path except that wherein God leads them, but they dwell always with Zeus the loud-thunderer.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "‘Now hear this, Earth and wide Heaven above, and dropping water of Styx (this is the strongest and most awful oath for the blessed gods), surely Phoebus shall have here his fragrant altar and precinct, and you he shall honour above all.’ (ll. 89-101) Now when Leto had sworn and ended her oath, Delos was very glad at the birth of the far-shooting lord. But Leto was racked nine days and nine nights with pangs beyond wont. And there were with her all the chiefest of the goddesses, Dione and Rhea and Ichnaea and Themis and loud-moaning Amphitrite and the other deathless goddesses save white-armed Hera, who sat in the halls of cloud-gathering Zeus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "teyrnon", "label": "Teyrnon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Teirnyon Twryf Vliant, the lord who keeps the account books of May Day. His mare foals 'on the night of every first of May... and no one ever knew what became of the colt'; Teirnyon keeps vigil, severs the vast claw that comes through the window, and finds at his door a new-born child in a sea-satin cloth [21]. He raises Gwri Wallt Euryn, sees his resemblance to Pwyll grown up, and delivers him back to the court despite his wife's half-in-earnest remonstrance; Pendaran Dyved crowns the household-naming: 'well hast thou named thy son Pryderi, and well becomes him the name of Pryderi, son of Pwyll, chief of Annwvyn' [21]. The fetched tale grants him no office and no tenure in the royal line; only a stolid logistics of honesty by horse. He is the graph's cleanest documented fosterage-edge: all strength, little claim.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "FISHER UNWIN 11 PATERNOSTER BUILDINGS MXCII {The finding of Taliesin: p0.jpg} INTRODUCTION. {Picture: p11.jpg} This third volume completes the series of Mabinogion and tales translated by Lady Charlotte Guest. As in the two preceding volumes, I have compared Lady Guest's transcript with the original text in the Red Book of Hergest, and with Dr Gwenogvryn Evans' scrupulously accurate diplomatic edition. I have, as before, revised the translation as carefully as I could.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Math or Math Hen, \"the Ancient,\"4 is probably an old 1 See p. 60, supra, and Rhys, HL 90 f. 2 Lady Guest, iii. 255 ; Skene, i. 297, 350. 3 For this Mabinogi see Loth, i. 117 f. ; Guest, iii. 189 f. 4 Skene, i. 236. THE GODS OF THE BRYTHONS 105 divinity of Gwyned, of which he is called lord. He is a king and a magician, pre-eminent in wizardy, which he teaches to Gwydion, and in a Triad he is called one of the great men of magic and metamorphosis of Britain.1 More important are his traits of goodness to the suffering, and justice with no trace of vengeance to the wrong-doer.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "The Project Gutenberg eBook of The Mabinogion Vol. 2 This eBook is for the use of anyone anywhere in the United States and most other parts of the world at no cost and with almost no restrictions whatsoever. You may copy it, give it away or re-use it under the terms of the Project Gutenberg License included with this eBook or online at www.gutenberg.org. If you are not located in the United States, you will have to check the laws of the country where you are located before using this eBook.", "source_title": "guest-mabinogion-vol2-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "sibyl", "label": "The Cumaean Sibyl", "tradition": "Roman prophetic priestess", "batch": 5, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Her memo to Aeneas is the graph's only honest access-policy document: 'The gates of hell are open night and day; smooth the descent, and easy is the way: but to return, and view the cheerful skies, in this the task and mighty labor lies. To few great Jupiter imparts this grace' [35]. The underworld as a building with symmetric entry controls and asymmetric exit controls. She is Apollo's office manager in the Aeneid, the one flesh person in the epic whose job description grants her the password list. Rome institutionalized her books as the state's emergency manual; the Sibylline shelf was consulted by the Senate for five centuries. The model: prophecy as filings, accessible on petition.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "Her minister and worshipper was I, howbeit I was a stranger to her Church, and unknowne to her religion there. And to the end I might know him againe, he shewed me how the ankle of his left foote was somewhat maimed, which caused him a little to halt.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "This done, I gave charge to certaine of my companions to buy liberally, whatsoever was needfull and convenient, then he brought me to the next bains accompanied with all the religious sort, and demanding pardon of the goddesse, washed me and purified my body, according to custome. After this, when noone approached, he brought me backe againe to the temple, presented me before the face of the goddesse, giving a charge of certaine secret things unlawfull to be uttered, and commanding me, and generally all the rest, to fast by the space of ten continuall daies, without eating of any beast, or drinking any wine, which thing I observed with a marvellous continencie. Then behold the day approached, when as the sacrifice should be done, and when night came there arrived on every coast, a great multitude of Priests, who according to their order offered me many presents and gifts: then was all the Laity and prophane people commanded to depart, and when they had put on my back a linnen robe, they brought me to the most secret and sacred place of all the temple.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "erinyes", "label": "The Erinyes (Spirits of Wrath/Blessing)", "tradition": "Greek tragedy", "batch": 3, "date_added": "2026-10-12", "era": -458, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Older than the court they are escorted to. In the Eumenides they enter as 'the daughters of Night', pursuers of blood-guilt, and are publicly mocked for it: 'What I have suffered is unbearable' [31]. Athene's settlement neither defeats nor disbands them but converts them; the translator's argument for the play states the outcome plainly, they move from Spirits of Wrath to Spirits of Blessing with a sanctuary beneath the Hill of Ares [31]. Their salience is the durable one: the play proposes that vengeance, given a seat and an address, becomes the guarantee of law rather than its enemy.\n\nHomer keeps them, as law keeps them, under the floor of the family. Phoenix stands cursed by his father 'calling the dread Erinyes to witness', and 'the gods, Jove of the world below and awful Proserpine, fulfilled his curse' [1]; Meleager's mother, kneeling and beating the earth, prays her own son dead, 'and Erinys that walks in darkness and knows no ruth heard her from Erebus' [1]. Their jurisdiction extends even over miracles inside the war: when Xanthus the horse is given speech and foretells Achilles' end, he gets the prophecy out and no further: 'When he had thus said the Erinyes stayed his speech' [1]. Three centuries before Aeschylus sat them down in Athens, the Iliad knew them as the powers who enforce curses and censor the unlicensed voice alike.", "highlights": [{"text": "ENA [681] Hear now my ordinance, people of Attica, as you judge the first trial for bloodshed. In the future, even as now, this court of judges will always exist for the people of Aegeus. And this Hill of Ares, 25 the seat and camp of the Amazons, when they came with an army in resentment against Theseus, and in those days built up this new citadel with lofty towers t", "source_id": 31, "source_title": "Aeschylus, Eumenides, trans. Smyth 1926 (theoi.com)", "source_url": "https://www.theoi.com/Text/AeschylusEumenides.html"}, {"text": "[696] Neither anarchy nor tyranny—this I counsel my citizens to support and respect, and not to drive fear wholly out of the city. For who among mortals, if he fears nothing, is righteous? Stand in just awe of such majesty, and you will have a defense for your land and salvation of your city, such as no man has, either among the Scyth", "source_id": 31, "source_title": "Aeschylus, Eumenides, trans. Smyth 1926 (theoi.com)", "source_url": "https://www.theoi.com/Text/AeschylusEumenides.html"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "proposals": [{"text": "Antimachus _Thebais_ fr. 3 (Kinkel).] 3001 (return) [ The preceding part of the Epic Cycle (?).] 3002 (return) [ While the Greeks were sacrificing at Aulis, a serpent appeared and devoured eight young birds from their nest and lastly the mother of the brood. This was interpreted by Calchas to mean that the war would swallow up nine full years. Cp. _Iliad_ ii, 299 ff.] 3003 (return) [ _i.e._ Stasinus (or Hegesias: cp. fr. 6): the phrase ‘Cyprian histories’ is equivalent to “The Cypria”.] 3004 (return) [ Cp.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "He has killed many a brave man- unless indeed he is some god who is angry with the Trojans about their sacrifices, and and has set his hand against them in his displeasure.\" And the son of Lycaon answered, \"Aeneas, I take him for none other than the son of Tydeus. I know him by his shield, the visor of his helmet, and by his horses. It is possible that he may be a god, but if he is the man I say he is, he is not making all this havoc without heaven's help, but has some god by his side who is shrouded in a cloud of darkness, and who turned my arrow aside when it had hit him.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Croiset note that the _Aethiopis_ and the _Sack_ were originally merely parts of one work containing lays (the Amazoneia, Aethiopis, Persis, etc.), just as the _Iliad_ contained various lays such as the Diomedeia.] 1114 (return) [ No date is assigned to him, but it seems likely that he was either contemporary or slightly earlier than Lesches.] 1115 (return) [ Cp. In the text I have followed the arrangement of these scholars, numbering the Hymns to Dionysus and to Demeter, I and II respectively: to place _Demeter_ after _Hermes_, and the Hymn to Dionysus at the end of the collection seems to be merely perverse.] 1116 (return) [ _Greek Melic Poets_, p. 165.] 1117 (return) [ This monument was returned to Greece in the 1980’s.— DBK.] 1118 (return) [ Cp. Marckscheffel, _Hesiodi fragmenta_, p. 35.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "themis", "label": "Themis", "tradition": "Greek Titaness of order", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "She appears first in the Muses' proem as a court fixture: 'reverend Themis', counted between Poseidon and Aphrodite [26]. Before any laws are sung, the Titaness of custom sits the assembly where they will be recited. Her name is the name of the Muses' subject-matter: they 'sing the laws of all and the goodly ways of the immortals' [26], and those laws are her person. The tithe: Themis holds no flashy pool; she is the chart the pools are drawn on. When Zeus's reign is praised as reign, the praise says his distributions were lawful, i.e., Themis-worthy.\n\nThe Iliad keeps her at her assembly post: when Hera returns to Olympus in book 15, shaken from the deception plot, 'lovely Themis' is 'first to come running up to her' with the cup, and is dispatched to 'lead the gods to table' [1]. Usher, cupbearer, convener: the poem stages custom's goddess doing the courtesies the divine parliament cannot survive without.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "proposals": [{"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "#2—Clement, Stromateis i. 16. 75: Celmis, again, and Damnameneus, the first of the Idaean Dactyls, discovered iron in Cyprus; but bronze smelting was discovered by Delas, another Idaean, though Hesiod calls him Scythes 1501. THE THEOGONY (ll. 1-25) From the Heliconian Muses let us begin to sing, who hold the great and holy mount of Helicon, and dance on soft feet about the deep-blue spring and the altar of the almighty son of Cronos, and, when they have washed their tender bodies in Permessus or in the Horse’s Spring or Olmeius, make their fair, lovely dances upon highest Helicon and move with vigorous feet. And one day they taught Hesiod glorious song while he was shepherding his lambs under holy Helicon, and this word first the goddesses said to me—the Muses of Olympus, daughters of Zeus who holds the aegis: (ll. 26-28) ‘Shepherds of the wilderness, wretched things of shame, mere bellies, we know how to speak many false things as though they were true; but we know, when we will, to utter true things.’", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": ".’ Fragment #8—Scholiast on Apollonius Rhodes, Arg. iv. 57: Hesiod says that Endymion was the son of Aethlius the son of Zeus and Calyee, and received the gift from Zeus: ‘(To be) keeper of death for his own self when he was ready to die.’ Fragment #9—Scholiast Ven. on Homer, Il. xi. 750: The two sons of Actor and Molione... Hesiod has given their descent by calling them after Actor and Molione; but their father was Poseidon. Hom. ad Iliad. pert., 265: But Aristarchus is informed that they were twins, not.... such as were the Dioscuri, but, on Hesiod’s testimony, double in form and with two bodies and joined to one another.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "thetis", "label": "Thetis", "tradition": "Greek sea goddess, mother of Achilles", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 750000000000.0, "pw_t": 750000000000.0, "pw_e": 15797627245.563, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Her condolence paragraph is a ledger of maternity: 'My son, woe is me that I should have borne or suckled you. Would indeed that you had lived your span free from all sorrow at your ships, for it is all too brief; alas, that you should be at once short of life and long of sorrow' [1]. The goddess who can call in Olympus' favor for her son's honor is helpless about the span itself: she can move Zeus but not change the length written at birth. She is the graph's cleanest case of a spirit with enormous proxy power and zero say over the only variable she measures.\n\nThe Odyssey hears of her last rite for the son. Agamemnon's ghost recalls that after the fall of the Achaean dead, 'you never saw such prizes as silver-footed Thetis offered in your honour; for the gods loved you well' [54]. Her power registers at the one moment power cannot help: purse and games, love's expenditure upon a fixed grave.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "proposals": [{"text": "Achilles coming to know it, for his mother keeps night and day beside him. Let some one of you, therefore, send Thetis to me, and I will impart my counsel to her, namely that Achilles is to accept a ransom from Priam, and give up the body.\" On this Iris fleet as the wind went forth to carry his message. Down she plunged into the dark sea midway between Samos and rocky Imbrus; the waters hissed as they closed over her, and she sank into the bottom as the lead at the end of an ox-horn, that is sped to carry death to fishes.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "She found her son fallen about the body of Patroclus and weeping bitterly. The Myrmidons were struck with awe, and none dared look full at it, for they were afraid; but Achilles was roused to still greater fury, and his eyes gleamed with a fierce light, for he was glad when he handled the splendid present which the god had made him. Then, as soon as he had satisfied himself with looking at it, he said to his mother, \"Mother, the god has given me armour, meet handiwork for an immortal and such as no living could have fashioned; I will now arm, but I much fear that flies will settle upon the son of Menoetius and breed worms about his wounds, so that his body, now he is dead, will be disfigured and the flesh will rot.\"", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Come inside and let me set refreshment before you.\" The goddess led the way as she spoke, and bade Thetis sit on a richly decorated seat inlaid with silver; there was a footstool also under her feet. Then she called Vulcan and said, \"Vulcan, come here, Thetis wants you\"; and the far-famed lame god answered, \"Then it is indeed an august and honoured goddess who has come here; she it was that took care of me when I was suffering from the heavy fall which I had through my cruel mother's anger- for she would have got rid of me because I was lame. It would have gone hardly with me had not Eurynome, daughter of the ever-encircling waters of Oceanus, and Thetis, taken me to their bosom.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "thor", "label": "Thor", "tradition": "Norse thunder god", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His apocalypse entry is a work order: 'Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgard's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe' [46]. Even at the world's end Thor is dispatched on a specific task, and the finish is measured in feet walked after the kill: nine, then bowed. The god of the hammer does the deed that ends the story and counts his own steps off the job-site. There is no triumph in the stanza, only closing documentation.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "I know of the horn of Heimdall, hidden Under the high-reaching holy tree; On it there pours from Valfather's pledge A mighty stream: would you know yet more? work was not finished in tlie stipulated time (cf. The enraged giant then threatened the gods, whereupon Thor slew him. 0th' s bride: Freyja; of Oth little is known be- yond the fact that Snorri refers to him as a man who \"went away on long journeys.\" 26. Thor: the thunder-god, son of Othin and Jorth (Earth) ; cf . particularly Harbarthsljoth and Thrymskvitha, passim.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "\"Though on rocks the gods bind me with bowels torn Forth from my frost-cold son, Rigsthula. He was a son of Othin, born of nine sisters; cf. In the last battle he and Loki slay one an- other.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "\"Thou womanish Harbarth, to hell would I smite thee straight. Could mine arm reach over the sound.\" and, for a somewhat diflFerent version, Grimnismol, 14. Nowhere else is it indicated that Thor has an asylum for dead peasants. 26.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "tiberinus", "label": "Tiberinus", "tradition": "Roman river god", "batch": 6, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The river's biography in the Fasti is a single hire report: 'when Tiberinus possessed his father's kingdom after the death of Calpetus, he was drowned... and gave his own name to the water' [37]. The Alban king drowns in a stream and the stream takes his surname permanently; Rome's logistics artery is a drowning victim with tenure. When the Tiber floods, the tradition's memory is not of weather but of inheritance: a royal body converted into public infrastructure, surname and all. The state's central river is a personnel record.", "highlights": [{"text": "Because he traced his descent from her through many generations: he willed that the place of the second month should belong to Venus.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}, {"text": "The first who invited man to better sustenance and exchanged acorns for more useful food. She forced bulls to yield their necks to the yoke; then for the first time did the upturned soil behold the sun.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}], "proposals": [{"text": "The god became father of a mortal by a woman, and part of himself passed over to the child, who was thus the god himself. Conchobar was also a rebirth of a god, but he was named from the river whence his mother had drawn water containing the worms which she swallowed. This may point to a lost version in which he was the son of a river-god by Nessa.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Columba routed the spirits of a Scottish fountain which was worshipped as a god, and 1 Ethnol. in Folklore, 104 f. 2 D'Arbois, PH ii. 132, 169 ; Dottin, 240. 3 Justin, xxxii. 3 ; Strabo, iv. 1. 13. 4 S. Perhaps the feast and offerings were intended to cause rain in time of drought. See p. 321, infra. 1 82 THE RELIGION OF THE ANCIENT CELTS the well now became sacred, perhaps to the saint himself, who washed in it and blessed it so that it cured diseases.1 On inscriptions a river name is prefixed by some divine epithet — dea, augusta, and the worshipper records his gratitude for benefits received from the divinity or the river itself.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "US IPSE LOCI cum ipse fluvius Tiberinus sit, quid ita intulit 'deus fluvio'? SENIOR atqui ubique eum flavum dixit; sed 'senior' aut propter spumas dictum est, aut ad reverentiam pertinet: sic Lucanus de urbe Roma adhuc florente turrigero canos effundens vertice crines (1.188). [8.35] TUM SIC ADFARI subaudis 'visus'. CURAS HIS DEMERE DICTIS habitum futurae orationis ostendit. [8.36] O SATE GENTE DEUM alibi deum certissima proles et sate sanguine divum . sane interdum haec epitheta non vacant, sed vim hortandi obtinent. [8.37] URBEM QUI REVEHIS NOBIS ut Ilium in Italiam portans : 'urbem' ergo pro civibus posuit.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "typhoeus", "label": "Typhoeus", "tradition": "Greek chaos-monster", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 2250000000000.0, "pw_t": 2250000000000.0, "pw_e": 50805284937.092, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod's sequence is an escalation report for the incumbent's file: Earth's youngest, born when all her other weapons had failed, with an hundred snake-heads, 'and there were voices in all his dreadful heads which uttered every kind of sound unspeakable' [26]. It almost works: 'he would have come to reign over mortals and immortals, had not the father of men and gods been quick to perceive it. But he thundered hard and mightily' [26]. Hesiod's proem already told us the campaigns by which Zeus was established; here is the last firewall test, and the answer is raw kilowatts, no strategy. The succession of heaven ends not in deliberation but in the largest power spike in the register.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "But the glorious allies of loud-crashing Zeus have their dwelling upon Ocean’s foundations, even Cottus and Gyes; but Briareos, being goodly, the deep-roaring Earth-Shaker made his son-in-law, giving him Cymopolea his daughter to wed. (ll. 820-868) But when Zeus had driven the Titans from heaven, huge Earth bare her youngest child Typhoeus of the love of Tartarus, by the aid of golden Aphrodite. Strength was with his hands in all that he did and the feet of the strong god were untiring. From his shoulders grew an hundred heads of a snake, a fearful dragon, with dark, flickering tongues, and from under the brows of his eyes in his marvellous heads flashed fire, and fire burned from his heads as he glared.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Pindar, Nem. iii. 64: ‘Telemon never sated with battle first brought light to our comrades by slaying blameless Melanippe, destroyer of men, own sister of the golden-girdled queen.’ THE HOMERIC HYMNS I. TO DIONYSUS 2501 * * * * (ll. 1-9) For some say, at Dracanum; and some, on windy Icarus; and some, in Naxos, O Heaven-born, Insewn 2502; and others by the deep-eddying river Alpheus that pregnant Semele bare you to Zeus the thunder-lover. And others yet, lord, say you were born in Thebes; but all these lie.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Sleipnir: Othin's eight-legged horse; cf. Sledge: perhaps the one mentioned in Grimnismol, 49. 16. Grimnismol, 44 and note. [394] Sigrdrifumol On the wolf's claws bared, and the eagle's beak, On bloody wings, and bridge's end, On freeing hands and helping foot-prints. 17.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "venus", "label": "Venus", "tradition": "Roman state ancestress", "batch": 3, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 1063918590.688, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid does the arithmetic of state cult out loud. Asking why April belongs to Venus, he finds the reason in bookkeeping: the Julian house 'traced his descent from her through many generations,' so the founder of the line 'willed that the place of the second month should belong to Venus' [37]. A month of the state calendar allocated to a goddess as a dividend on the ruling family's genealogy. Rome's rulers are her collateral descendants, the calendar her certificate of title. When the American state needed its faculty of love and lineage for the Rotunda's six, Venus came with the portfolio already assembled [16]: the goddess who proves that politics begins with a family tree and that mythology, correctly filed, is hereditary office.", "highlights": [{"text": "Because he traced his descent from her through many generations: he willed that the place of the second month should belong to Venus.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}, {"text": "The first who invited man to better sustenance and exchanged acorns for more useful food. She forced bulls to yield their necks to the yoke; then for the first time did the upturned soil behold the sun.", "source_id": 37, "source_title": "Ovid, Fasti Book 4, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti4.html"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "Venus, and in the morning at her first comming abroad offered unto her oblations, provided banquets, called her by the name of Venus, which was not Venus indeed, and in her honour presented floures and garlands in most reverend fashion. When she had spoken these words she embraced and kissed her sonne, and took her voyage toward the sea.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "The thousand soldiers from Antium who had come after the battle, too late to help, were sent back almost with ignominy. ===6=== Then the elections were held, and L. Servilius were chosen as consuls; they entered upon office on August 1, which was then the commencement of the consular year. The season was a trying one, and that year happened to be a pestilential one both for the City and the rural districts, for the flocks and herds quite as much as for human beings.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "When Queen Juno saw her, she said to Minerva, \"Look, daughter of aegis-bearing Jove, unweariable, that vixen Venus is again taking Mars through the crowd out of the battle; go after her at once.\" Thus she spoke. Minerva sped after Venus with a will, and made at her, striking her on the bosom with her strong hand so that she fell fainting to the ground, and there they both lay stretched at full length. Then Minerva vaunted over her saying, \"May all who help the Trojans against the Argives prove just as redoubtable and stalwart as Venus did when she came across me while she was helping Mars.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "vesta", "label": "Vesta", "tradition": "Roman hearth goddess", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "She appears in the Fasti by defensive reflex: when the vestal Silvia bears the future founders in secret, 'the images of Vesta are said to have covered their eyes with their virgin hands... and the altar of the goddess trembled' [36]. The hearth goddess who cannot look at the arrival of the state. Her power is the negative pool, the flame that must not go out and must not see; Rome wires its continuity to her averted gaze. Every cantonment of the Roman fire has her floor plan: a protected, unseen center, tended by women whose term of service is the state's metabolism.", "highlights": [{"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}], "proposals": [{"text": "1608 (return) [ Nymphs of the ash-trees, as Dryads are nymphs of the oak-trees. Cp. _Homeric Hymns_ v.22 ff.; xxxix.1 ff.]", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "[ Van Lennep explains that Hecate, having no brothers to support her claim, might have been slighted.] 1618 (return) [ The goddess of the _hearth_ (the Roman _Vesta_), and so of the house. Cp. _Homeric Hymns_ v.22 ff.; xxxix.1 ff.] 1619 (return) [ The variant reading ‘of his father’ (sc. Heaven) rests on inferior MS. authority and is probably an alteration due to the difficulty stated by a Scholiast: ‘How could Zeus, being not yet begotten, plot against his father?’ The phrase is, however, part of the prophecy.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "He finds her name in the place-name Bononia and its derivatives. s Cormac, 23. 4 Csesar, vi. 17 ; Holder, s.v. ; Stokes, TIG 33. THE TUATHA D£ DANANN 69 whose shrine in Kildare a sacred fire, which must not be breathed on, or approached by a male, was watched daily by nineteen nuns in turn, and on the twentieth day by the saint herself.1 Similar sacred fires were kept up in other monasteries,2 and they point to the old cult of a goddess of fire, the nuns being successors of a virgin priesthood like the vestals, priestesses of Vesta. As has been seen, the goddesses Belisama and Sul, probably goddesses of fire, resembled Brigit in this.3 But Brigit, like Vesta, was at once a goddess of fire and of fertility, as her connection with Candlemas and certain ritual survivals also suggest.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "volundr", "label": "Volundr / Wayland / Velent", "tradition": "Germanic/Norse", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 50000000000.0, "pw_p": 600000000.0, "pw_t": 50600000000.0, "pw_e": 10571623184.087, "pw_pool": "P_metals", "pw_why": "Smith-king of the Germanic tradition; revenge executed precisely through metalwork [24][25]; share small but the attribution is absolute within its domain.", "pw_ws": 1.0, "essay": "The tradition's actual figure is a revenge-tragedy protagonist. The queen reads the captive's nature at a glance-'The glow of his eyes is like gleaming snakes'-and prescribes the hamstringing that sets him on the island [24]. His reply is workshop horror: he smites the two princes, sets their skulls in silver for the king, fashions gems from their eyes for the queen, and a brooch from their teeth for Bothvild [24]. Bothvild comes with her broken ring; the beer out-sleeps her [24]; Deor reports in Old English that her brothers' death grieved her less than her own thing, 'that she was with child' [25]. Then the exit: 'Laughing Volund rose aloft, / Weeping Bothvild went from the isle' [24]. Bellows' note documents the legend's geography from Saxon regions into the North [24]. The softened craftsman of Scott and Kipling is not this figure; the softening deletes precisely what the witnesses keep.", "highlights": [{"text": "He smote off their heads, and their feet he hid Under the sooty straps of the bellows", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}, {"text": "The glow of his eyes is like gleaming snakes", "source_id": 24, "source_title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)", "source_url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt"}, {"text": "T^tHe legend of the smitn persisted for centuries throughout all the Teutonic lands, and the name of Wayland Smith is familiar to all readers of Walter Scott, and even of Rudyard Kipling's tales of England. In what form this story reached the North is uncertain. Sun- dry striking parallels between the diction of the^EMltndark'vitha and that of the Weland passage in Dear's Lament make it dis- tinctly probable that a iiaxon song on this subject had found its way to Scandinavia or Iceland.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "algorithmic": true}, {"text": "\" Then Nithuth called, the lord of the Njars: \"How gottest thou, Volund, greatest of elves, These treasures of ours in Ulfdalir?\" Volund spake: 16. \"The gold was not on Grani's way, spurious, or lines 4-5 may have been expanded out of a single line running \"The wind-dried wood for Volund burned well.\" 13. Elves: the poem here identifies Volund as belonging to the race of the elves.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "algorithmic": true}, {"text": "Two of them were daughters of King Hlothver, Hlathguth the Swan-White and Hervor the All-Wise, and the third was Olrun, daughter of Kjar from Valland. Nithuth (\"Bitter Hater\") : here identified as a king of Sweden, is in the poem (stanzas 9, 15 and 32) called lord of the Njars, which may refer to the people of the Swedish district of Nerike. In any case, the scene of the story has moved from Saxon lands into the Northeast.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "algorithmic": true}], "proposals": [{"text": "Victims were easily obtained, and offered to the gods of war. Yet even these sacrifices preserved some trace of the older rite, in which the victim represented a divinity or spirit. Heafl-hui^kig^des6rib^d~M^e3£^ in Jjr ish texts, had also a sacrificjaLaapect.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Strabo describes how the Celtic votes {fdith) was also a philosopher, and this character is given in a poem to Seon (probably = Gwydion), whose artists are poets and magicians.2 But he is also a culture-god, bringing swine to men from the gods' land. Perhaps Gwydion also brought kine from Annwfn, since he is called one of the three herds of Britain,4 while he himself may once have been an animal god, then an anthropomorphic deity associated with animals. Thus in the Mabinogi, when Gwydion flees with the swine, he rests each night at a place one of the syllables of which is Moch, \"swine\" — an aetiological myth explaining why places which were once sites of the cult of a swine-god, afterwards wor- shipped as Gwydion, were so called.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Zeichen eignen Willens und eigner Willkür, fortführen und in den Wagen setzen ließ, der schnell fortrollte. Dem Alten, der ganzen Familie war so zumute, als erwachten sie nun erst aus einem bösen spukhaften Traum, der sie sehr geängstet. Bald darauf, als sich dies in dem Hause des Bürgermeisters von L. begeben, wurde in dem Zisterzienser Nonnenkloster zu O. eine Logenschwester mit ungewöhnlicher Feierlichkeit begraben und ein dumpfes Gerücht ging, daß diese Logenschwester die Gräfin Hermenegilda von C. gewesen, von der man glaubte, sie sei mit ihres Vaters Schwester, der Fürstin von Z., nach Italien gegangen.", "source_title": "hoffmann-der-sandmann-gutenberg-6341.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "vulcan", "label": "Vulcan", "tradition": "Roman name of the Greek forge god", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 379143053.894, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The name is Roman but the factory is Homer's. In the Iliad the lame god receives Thetis between jobs, and the jobs are already automated: 'Twenty tripods that were to stand by the wall of his house, and he set wheels of gold under them all that they might go of their own selves to the assemblies of the gods, and come back again: marvels indeed to see' [1]. A forge whose products report to work by themselves; the tradition's earliest description of self-driving manufacture is a household appliance of Vulcan's. Rome did not invent this god, it naturalized him, and the Capitol hires him again for Mechanics, where the AOC's own caption has him forging cannon [16]. Three thousand years of the same character sheet: the god who builds the weapons he does not command, lusting after the pool of whomever gives the orders.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "1-9 are preserved by Diodorus Siculus iii. 66. 3; ll. 10-21 are extant only in M.] 2502 (return) [ Dionysus, after his untimely birth from Semele, was sewn into the thigh of Zeus.] 2503 (return) [ _sc_. In _Geoponica_ i. 14. 8 the living tortoise is prescribed as a charm to preserve vineyards from hail.]", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Now there was a certain rich and honourable man among the Trojans, priest of Vulcan, and his name was Dares. He had two sons, Phegeus and Idaeus, both of them skilled in all the arts of war. These two came forward from the main body of Trojans, and set upon Diomed, he being on foot, while they fought from their chariot.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "This is expressed by sm6rthain, \"to attach,\" and is thus connected with and gave rise to the name Smertullos. On the altar Smertullos is attacking an eel or serpent. Rev. i. 1 f. ; IT i. 213 ; see p. 381, infra. 3 See p. 164, infra. 4 Diod.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "xanthus-balius", "label": "Xanthus and Balius", "tradition": "Greek immortal horses", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Zeus's regret for lending them out is the Iliad's most bizarre depreciation report: 'Why did we give you making over to Peleus who is a mortal, while you are yourselves ageless and immortal? Was it that you might share the sorrows that befall mankind? For of all creatures that live and move upon the earth there is none so pitiable as he is' [1]. The horses' immortality is a loan-covenant with grief embedded in the terms. Hector 'shall drive neither you nor your chariot' [1]; the divine asset returns to its unlanded st
