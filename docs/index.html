n crafts more than all the sons of Heaven' [26]. Motherhood as counter-stroke, in the poem of housekeeping at war which is the Iliad, becomes grand strategy. It is Hera who pities the dying Greeks and dispatches Athene to stay Achilles' hand: 'Juno has sent me, who cares for both of you alike' [1]. It is Hera who has sworn with Athene 'full many a time before all the immortals, that never would we shield Trojans from destruction, not even when all Troy is burning' [1], and who engineers the deception of Zeus in the fourteenth book, borrowing Aphrodite's own tackle: 'the curiously embroidered girdle into which all her charms had been wrought: love, desire, and that sweet flattery which steals the judgement even of the most prudent' [1]. The later mythographers only miniaturize the same character: Heracles 'was driven mad through the jealousy of Hera' and burned his own children [32]. Across the earliest witnesses she never wields a weapon and never needs one; her instruments are the aide, the alliance oath, the borrowed girdle, and the bedroom humiliation of the king. The Odyssey, which repatriates Greek husbands, has no work for her."}, {"id": "hippocrates", "label": "Hippocrates", "tradition": "Greek physician of record", "batch": 5, "date_added": "2026-10-12", "era": -400, "pw_d": 5000000000.0, "pw_p": 15000000000.0, "pw_t": 20000000000.0, "pw_e": 685379351.21, "pw_pool": "P_health", "pw_why": "Founder of the first billing discipline in medicine [42]; the Asclepiadae descent claim [3] makes the descent-line explicit rather than analogy.", "pw_ws": 1.0, "essay": "The Aphorisms open with the first limitation-of-liability clause in medicine: 'Life is short, and Art long; the crisis fleeting; experience perilous, and decision difficult' [42]. The physician who was flesh and billable drafts himself as the founder of a discipline whose first law is that it cannot promise. Our sources keep the descent public: his medical house claimed Asclepiadae descent, the healer clan of the hero-god [3][1]. Where Machaon binds wounds in the Iliad's line of battle, Hippocrates' corpus teaches that the art outlives the practitioner because the practitioner is mortal and the billing relationship is not. The health pool has a human signature now."}, {"id": "inana", "label": "Inana", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 1111111111.111, "pw_pool": "P_authority", "pw_why": "Owner of the halub-tree and its throne/bed claim [17]; Sumerian sovereignty-adjacent.", "pw_ws": 1.0, "essay": "The fetched witness is the first-person prologue so often elided: the goddess narrates in her own voice how she found the ḫalub tree after the flood-wind had stripped it, carried it to her garden in Unug, and planted it 'with my feet, not with my hands' [17]. Her whole action is prospective furnishing: 'When will this be a luxuriant chair on which I can take a seat? When will this be a luxuriant bed on which I can lie down?' [17]. She plans a throne and a bed counted in property terms; a decade later the tree is massive but unsurveyable, colonized at root, branch, and trunk by three squatters [17]. Her recourse is complaint: she cries to Utu and at last to Gilgamec, whose services she retains [17]. It is worth marking against the fear-intensive later goddess and against her sister of the nether world: power here is domestic ambition, thwarted, and crowdsourced. The garden tree episode is the graph's earliest attested case of sovereignty subcontracting pest control.\n\nIn the earliest Akkadian stratum of the Gilgamesh cycle her neighbor-claim is different: the crown she is attached to is the king's excess. When Erech labors under Gilgamesh's tyranny, the appeal goes to Aruru, and 'Aruru upon hearing this created a man of Anu in her heart' [68]. Enkidu enters the tradition as an engineered counterweight; by the Sumerian witness [17] Inana is the tree's proprietor hiring the strongman. The two strata keep her in the same posture toward the heroic economy: sponsor of its balances, not its deeds."}, {"id": "iopas", "label": "Iopas", "tradition": "Roman epic, court bard", "batch": 6, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "At Dido's banquet Vergil posts the one entertainment that matters to this graph: 'Iopas brought his golden lyre, and sung what ancient Atlas taught: the various labors of the wand'ring moon, and whence proceed the eclipses of the sun; th' original of men and beasts; and whence the rains arise, and fires their warmth dispense, and fix'd and erring stars dispose their influence' [35]. Atlas's stopped shoulder becomes curriculum. The bard at the queen's table transmits a Titan's burden as celestial mechanics; what the condemned god supports physically, the singer recites as physics. No one at the banquet appears to notice that the love-goddess is in the same register, rigging another landfall. The court hears cosmology while the machinery of lineage operates on the queen's lap."}, {"id": "iris", "label": "Iris", "tradition": "Greek messenger", "batch": 5, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 750000000000.0, "pw_t": 750000000000.0, "pw_e": 16935094979.031, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The delivery system of Olympus has a name and a route. Hesiod files her among the storm family: 'swift Iris' is born of Thaumas beside the Harpies who 'keep pace with the blasts of the winds' [26], and her job in the Theogony's own telling is procurement of the sovereign's signature liquid: 'Zeus sends Iris to bring in a golden jug the great oath of the gods' [26]. A messenger trusted exactly once per crisis, with the one container that can ruin a god. She has no pool of her own; her power is throughput, pure connectivity, the graph's first edge rendered as a goddess.\n\nIn the Iliad her delivery uniform is another person's body. She brings Zeus' bad news to the Trojan muster 'speaking with the voice of Priam's son Polites', comes to Helen 'in the form of her sister-in-law' Laodice, and pulls the wounded Aphrodite out of the press and begs Ares' horses for her [1]. The Odyssey does not speak her name once; in that poem the divine errands all run on Hermes. Between the two earliest epics her route is already fixed: the war-messenger, voice and face always borrowed, keeper only of the one errand Hesiod gives her, the oath-water run [26]."}, {"id": "newton", "label": "Isaac Newton", "tradition": "Flesh record, Royal Society", "batch": 9, "date_added": "2026-10-12", "era": 1687, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Principia was kept almost tribally internal before publication: Halley 'entered on the register his notions about motion,' and De Motu 'was the germ of the Principia' [50], intended as a summary of the yet unwritten whole. The county-line between private reckoning and public law is the Register itself: the Royal Society's book where motion's theorems were deposited under a date. Pallas's pool extends to him by computation: Minerva does the wars of the mind [36] and the schoolmasters pay their pennies [36]; Newton is the tithe-collector's nightmare because the account is apparently recordable by anyone who can compute, yet produced by only one hand."}, {"id": "joule", "label": "James Prescott Joule", "tradition": "Flesh record, brewing physics", "batch": 9, "date_added": "2026-10-12", "era": 1847, "pw_d": 0.0, "pw_p": 60000000000.0, "pw_t": 60000000000.0, "pw_e": 46778940111.892, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Joule spent his career re-running the same measurement until it satisfied the Association: asked to derive the mechanical equivalent of heat from electrical heating, 'this inquiry yielded (in 1867) the result 783,' his old friction method 'was repeated with every precaution, and again indicated 772.55 foot-pounds' [52]. Two numbers for the same conversion, and the discrepancy is the whole profession: the world will yield slightly different answers through different instruments, and the difference is published rather than hidden. The unit that prices steam tables and starship drives alike carries a man who never rounded off."}, {"id": "james-watt", "label": "James Watt", "tradition": "Soho manufactory, flesh record", "batch": 4, "date_added": "2026-10-12", "era": 1776, "pw_d": 200000000000.0, "pw_p": 240000000000.0, "pw_t": 440000000000.0, "pw_e": 310794842950.935, "pw_pool": "P_energy", "pw_why": "The SI unit of every pool in this graph is his name; the Soho works sold power itself as a commodity [39]. The man is the denomination of the modern fire economy Prometheus claims as mythic origin.", "pw_ws": 1.0, "essay": "The unit of this entire graph is his patronym. Boswell walked the Soho works in 1776 and recorded the proprietor's sales pitch in one sentence: 'I sell here, Sir, what all the world desires to have--POWER'; seven hundred people at work, the owner contemplated 'as an iron chieftain' who 'seemed to be a father to his tribe' [39]. The speaker at the bench was Boulton, but the power retailed was Watt's engine, and the transaction is the graph's thesis commercialized: what the Titan stole, the Soho partnership metered, priced, and shipped. Zeus chained his fire-thief to a rock; the Georgian fire-dealer patented his condenser and put the gods' forbidden commodity on a per-horsepower contract. Every watt in this graph's pools is denominated in his name, which makes him less a node in the mythology than the banknote in which the mythology now pays its bills."}, {"id": "janus", "label": "Janus", "tradition": "Roman threshold god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid's god answers the poet in propria persona, unmediated, staff in right hand, key in left: 'Whate'er you see- sky, sea, clouds, earth- all things are closed and opened by my hand. The guardianship of this vast universe is in my hands alone... I sit at heaven's gate with the gentle Hours; my office regulates the goings and the comings of Jupiter himself' [41]. The claim outranks the king upstairs: the being who lets Jupiter in and out of the room is older than the occupant, and says so. Rome put his month first for the same reason the graph's power model keys everything to sovereign order; every regime opens its account through the gate, and the gatekeeper predates the account."}, {"id": "latinus", "label": "Latinus", "tradition": "Roman epic, pre-founder king", "batch": 6, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil gives him the longest track-record announcement of any minor king in epic: 'Latinus, old and mild, had long possess'd the Latin scepter... His father Faunus; a Laurentian dame his mother; fair Marica was her name. But Faunus came from Picus: Picus drew his birth from Saturn, if records be true' [35]. In four lines the scepter's chain of title runs king to faun to woodpecker-man to the Titan who ate his children. The 'if records be true' is not skepticism, it is the Roman office of records keeping its hand in the register. Latinus is the graph's demonstration that the founder myth requires not only a founder but a prior king with impeccable paperwork waiting to hand over the land."}, {"id": "lilith", "label": "Lilith / phantom maid / lamia", "tradition": "Sumer→Hebrew→medieval Jewish", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 250000000.0, "pw_p": 0.0, "pw_t": 250000000.0, "pw_e": 925925.926, "pw_pool": "P_amulet", "pw_why": "Infant-protection economy literally documented as her price (amulet with three angel names) [19]; night-fear persists in Isaiah/Huluppu strata [17][18][20].", "pw_ws": 1.0, "essay": "Three strata, three different beings. The Sumerian witness is a squatter in Inana's halub-tree, 'the phantom maid ... the maid who laughs with a joyful heart,' who, when Gilgamesh clears the tree, 'left her dwelling and sought refuge in the wilderness' [17]. Isaiah names her once, in a ruin catalogue between satyrs and beasts; the KJV makes her a screech owl [18], while the Vulgate's lamia and Wycliffe's 'Lamya schal ligge there' [20] turn her into the Greco-Roman night-witch. Only the medieval Ben Sira satire gives her a will: a first wife who claims equality, pronounces the Name, flies to the Red Sea, refuses return, and takes revenge on infants [19]. The modern 'first feminist' figure is a selection from that satire, taking the claim and dropping the revenge. Before the satire she is a habitat: tree-trunk, wilderness, ruins by night."}, {"id": "llwyd", "label": "Llwyd", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 225000000.0, "pw_t": 225000000.0, "pw_e": 87889227.371, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The purest revenge economics in the corpus: Llwyd the son of Kilcoed casts the charm over seven Cantrevs not for land but out of 'the friendship I had towards him [Gwawl]', and only stops when a hostage is the price of admission into narrative again. His weasel-army harvests wheat night by night, strand-like; when Manawyddan sets up a gallows for the pregnant mouse, the doubling clerk and the churl and the bishop arrive in sequence to redeem it [21]. Caught, his confession is the whole essay: 'To despoil thee... I cast the charm over the seven Cantrevs of Dyved... upon Pryderi did I revenge Gwawl the son of Clud, for the game of Badger in the Bag' [21]. He vanishes by treaty, not defeat: oaths for friendship-keeps. His power is gated entirely through enchantment-with-terms, and when it ends the land simply regrows."}, {"id": "loki", "label": "Loki", "tradition": "Norse trickster", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Edda files him in the company with the one forecast he cannot script out of: 'The wolf will the father of men devour; him Vidar will avenge' [46], and the wolf is Loki's own. His function in the tradition is catalyst and debtor at once: he supplies the bridal veil-comedy's rescue and also the serpent-chain he ends up wearing. The god of cleverness is the one liability on the Aesir's books that cannot be provisioned against; his margin of usefulness is exactly the width of the last day."}, {"id": "sulla", "label": "Lucius Cornelius Sulla (Felix)", "tradition": "Roman dictator, flesh record", "batch": 9, "date_added": "2026-10-12", "era": -82, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His totem fit in a toga: 'he had a small golden image of Apollo from Delphi, which ... in battle to carry about him in his bosom, and that he then kisst it with these words: O Apollo Pythius, who in so many battles hast raised to honour and greatness the Fortunate Cornelius Sylla, wilt thou now cast him down...?' [47]. The man named himself the god's client while campaigning, surname Felix filed in the records as a corporate designation of the relationship. Then the exit that breaks the Roman pattern's own rule: 'In 79 Sulla resigned his dictatorship and retired to Puteoli, where he died in the following year' [48]. Cincinnatus hands back the office at day sixteen to keep the plough [33]; Sulla attends to it after the proscriptions, a longer rent on the dictator's lease. The god kept the amulet's end of the bargain: the tenant died in bed, unpunished. The tradition records him as the exception that proved rule by walking away late and unpursued."}, {"id": "manawyddan", "label": "Manawyddan fab Llyr", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Brother of Bran, sole counselor in this corpus whose counsel consistently under-performs until handicraft is allowed. When Dyved is magically emptied, he paces the alternative economies: saddles, then shoes, then wheat-land; each is extinguished by guild or spell, and his answer to the last is patient siege engineering (the trap-mouse courtroom) that brings Llwyd to terms. 'By that will I gladly abide,' he says when Pryderi offers Rhiannon in marriage, and right glad is he, 'May Heaven reward him who hath shewn unto me friendship so perfect as this' [21]. Llwyd's confession settles the debt [21]. In the fetched witnesses Manawyddan never rules glorywise; he drills supply chains. He is the Welsh margin of sovereignty: authority that survives occupation by knowing a trade."}, {"id": "mars", "label": "Mars", "tradition": "Roman war god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 2500000000.0, "pw_p": 0.0, "pw_t": 2500000000.0, "pw_e": 147766470.929, "pw_pool": "P_military", "pw_why": "Ovid's census: the god of Latium 'the patron of the sword; 'twas the sword that won for a fierce race empire and glory' [36]. The Roman military economy worshipped him by name, at the month-charging start of the year.", "pw_ws": 1.0, "essay": "Ovid writes the Roman exception in a census of cults: the Greeks gave the crafts to Athena, Crete to Diana, Lemnos to Vulcan, but 'Mars was the god to be revered by Latium, for that he is the patron of the sword; 'twas the sword that won for a fierce race empire and glory' [36]. A theology honest enough to name its true economy. The Roman census of gods is a census of revenue sources, and the sword is the oldest revenue Rome admits to. The republic that worshipped him would eventually paint its own founder into the sky above six faculties, War first [16]; the Fasti says openly what the Rotunda's perimeter implies."}, {"id": "mason-weems", "label": "Mason Locke Weems", "tradition": "American, 1800s biographer", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 0.0, "pw_p": 162000000000.0, "pw_t": 162000000000.0, "pw_e": 118312358997.226, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "A bookselling parson invents the measurement by which the United States still checks its leaders against their legends. Weems' own frame for the cherry tree is open about the epistemology: the anecdote 'is too valuable to be lost, and too true to be doubted; for it was communicated to me by the same excellent lady' who never appears again [15]. Valuable first, true second, source an unnamed lady; the sentence is the whole manufacture in miniature, His child Washington then speaks the line America memorized in smoothed form: 'I can't tell a lie. Pa; you know I can't tell a lie. I did cut it with my hatchet' [15]. The fetched text does not say 'I cannot'; the contraction belongs to a kitchen, which is Weems' real craft: he puts eternity in colloquial clothes so it can be sold door to door. The witness is a fabricator who labeled his fabrication; the fabrication kept at work because the nation it organized never survived without it."}, {"id": "matthew-boulton", "label": "Matthew Boulton", "tradition": "Soho manufactory proprietor, flesh record", "batch": 5, "date_added": "2026-10-12", "era": 1776, "pw_d": 0.0, "pw_p": 80000000000.0, "pw_t": 80000000000.0, "pw_e": 56508153263.806, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Boswell's actual host at Soho was the senior partner, and Boswell supplies his own employee-file testimony: 'I contemplated him as an iron chieftain, and he seemed to be a father to his tribe' [39]. The line that anchors Watt's pool claim was Boulton's voice: 'I sell here, Sir, what all the world desires to have--POWER' [39]. Watt supplied the improvement, Boulton the covenant: seven hundred wage-hands, one salesman, and a catalogue whose first entry is command-over-work itself. He inherits proxied watts through the firm, as any good salesman collects commission, and his tribe-model of employment is the flesh-record version of every tutelary's household: with dependents, with duties reciprocal, with the house holding the accounts."}, {"id": "mercury", "label": "Mercury", "tradition": "Roman name of Hermes, exchange god", "batch": 3, "date_added": "2026-10-12", "era": -650, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 435707115.998, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His charter myth is a trade executed at sword's length. The newborn Hermes steals Apollo's cattle, invents the lyre from a tortoise, and when Apollo comes to collect, the two settle not by combat but by barter: 'He held out the lyre: and Phoebus Apollo took it, and readily put his shining whip in Hermes' hand, and ordained him keeper of herds' [38]. The thief keeps the herd, the victim gets music, and exchange is born as the mechanism by which theft becomes relationship. That is why commerce still prays to him: he is the god of the transaction that converts what you took into what you own. He wears this résumé into the Capitol's Commerce panel [16], where the republic that runs on tariffs and Manifest Destiny hangs the professional boundary-crosser over its ledgers without apparent irony."}, {"id": "methuselah", "label": "Methuselah", "tradition": "medieval Jewish aggadah", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The longest biography reduces to an anti-demonic police action. Ginzberg compiles the apocryphal account: after Enoch's translation 'Methuselah was proclaimed ruler of the earth by all the kings', ruled in rectitude, and then addressed the demon surplus, 'the posterity of Adam which he had begotten with Lilith, that she-devil of she-devils' [19]. After three days' fasting he is authorized to inscribe the Ineffable Name upon his sword, 'wherewith he slew ninety-four myriads of the demons in a minute' [19]; Agrimus, Lilith's first-born demon, surrenders the registry of the rest to him. Power accounting: name-on-sword, ninety-four myriads per minute, and a sobriquet earned. The patriarch of record longevity dies before the flood; witnesses retain him chiefly as the spell-checker of the demon roll.\n\nThe Bible files him as a ledger line with a summit: 'And all the days of Methuselah were nine hundred sixty and nine years: and he died' [18]. Genesis leaves him no speech and no act, only the maximum term; the demon-slaying kingship of the aggadah [19] is the later tradition's answer to the question that line dares you to ask: what is done with nine hundred and sixty-nine years."}, {"id": "metis", "label": "Metis (Thought)", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Counsel, in the Theogony, is a substance one can eat. Metis, Ocean's daughter, 'was wisest among gods and mortal men', and her career ends when Zeus, acting on the advice of Earth and starry Heaven, deceives her with cunning words and puts her in his belly, 'for fear that she might bring forth something stronger than his thunderbolt' [26]. EW's marginal gloss translates her name outright: Thought. She then exists only as an interior cause: from within, she conceives Athene, who emerges through Zeus' head armed [26]. The fetched witnesses give her no actions of her own after the swallowing; she is the one figure whose entire power is exercised from inside an enemy. That internalization is the Theogony's most direct definition of what Zeus commands: even wisdom itself, once ingested, cannot object."}, {"id": "faraday", "label": "Michael Faraday", "tradition": "Flesh record, Royal Institution", "batch": 9, "date_added": "2026-10-12", "era": 1831, "pw_d": 0.0, "pw_p": 20000000000.0, "pw_t": 20000000000.0, "pw_e": 15249881712.696, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The induction discovery is logged with the tenacity of a working diary: 'In December 1824 he had attempted to obtain an electric current by means of a magnet, and on three occasions he had made elaborate but unsuccessful attempts to produce a current in one wire by means of a current in another wire... He still persevered, and on the 29th of August 1831' the conversion succeeded [51]. Seven years of negative entries, one positive line-item on a Tuesday. The Britannica obituary-with-accounting calls him a genius of experiment just before this passage; the ledger itself is the evidence. The Prometheus line finally has its auditor: on the record is the man who made magnetism pay current income."}, {"id": "minerva", "label": "Minerva", "tradition": "Roman crafts and schools goddess", "batch": 3, "date_added": "2026-10-12", "era": -8, "pw_d": 400000000.0, "pw_p": 18000000000.0, "pw_t": 18400000000.0, "pw_e": 1087561226.037, "pw_pool": "P_school", "pw_why": "Ovid logs schoolmasters paying her fees at the Quinquatrus and credits her with attracting new pupils [36]; the education economy has a named patroness with a documented revenue stream.", "pw_ws": 1.0, "essay": "Ovid opens March with a correction: the month is named for Mars, yet the poet points out that 'fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?' [36]. Her festival, the Quinquatrus, is a payroll inventory: the first day bloodless because she was born that day; thereafter the wool-carders, the dyers, the shoemakers, the doctors and, Ovid insists twice, the schoolmasters pay her, 'ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils' [36]. A goddess whose cult collects actual fees from the education economy, which Ovid knew got skimmed. He sums her as 'the goddess of a thousand works' [36]. The Capitol files her under Science [16], which is exactly the Roman job: not war's opposite but its desk half, the faculty that makes skill a taxable category."}, {"id": "mnemosyne", "label": "Mnemosyne (Memory)", "tradition": "Greek Titaness", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Muses' mother comes on the payroll in a single line of job description: 'Them in Pieria did Mnemosyne, who reigns over the hills of Eleuther, bear of union with the father... a forgetting of ills and a rest from sorrow' [26]. Memory's great service to the king of gods is forgetfulness; the state of the immortal court depends on nine nights with the department that manages what everyone stops remembering. The Muses she bears then issue 'the laws of all and the goodly ways' [26] as song. The genealogical logic is exact: law and song come only after wrath is forgotten."}, {"id": "neptune", "label": "Neptune", "tradition": "Roman, sea and horse god", "batch": 3, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 1047768474.926, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil stages him as a jurisdiction dispute with a whip in it. Juno has borrowed the winds from their keeper Aeolus to wreck the Trojan fleet, and Neptune rises from the water not to fight but to read the offenders their charter: 'The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea' [35]. His power is a deed of property registered against other gods, including the king of the winds, who is told to go home and 'boast and bluster in his empty hall.' The sea calms not through force but through title. The Capitol's Marine panel [16] hangs this god over the young republic's shipping for the same reason Vergil's Rome needed him: the sea is the one territory no senate can garrison, so you put its leaseholder on the wall and pay him in fresco."}, {"id": "nereus", "label": "Nereus (Old Man of the Sea)", "tradition": "Greek sea elder", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod's character reference is the shortest personnel file in the Theogony and the most envious: 'Sea begat Nereus, the eldest of his children, who is true and lies not: and men call him the Old Man because he is trusty and gentle and does not forget the laws of righteousness, but thinks just and kindly thoughts' [26]. Positioned in the genealogy before Thaumas (father of Iris) and Phorkys (father of monsters), he is the respectable son in a family of wonders. His narrative function across the tradition is to know and to withhold until caught; prophecy as a family business where the patriarch is honest only under duress."}, {"id": "victory", "label": "Nike / Victory", "tradition": "Greek-Roman, victory daimon", "batch": 3, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 406442279.497, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod gives the whole job description in one sentence of zoning law. Styx bears Nike, Victory, and her siblings Kratos and Bia, Strength and Force, and of the four he says they 'have no house apart from Zeus, nor any dwelling nor path except that wherein God leads them, but they dwell always with Zeus the loud-thunderer' [26]. Victory is not a free agent with her own cult itinerary; she is live-in staff of the sovereign, part of the household that arrived at Olympus because Styx came first to the levy with her children and was rewarded with permanence. Twenty-six centuries later Brumidi paints the same floor plan with federal funds: Washington enthroned, and at his sides 'female figures representing Liberty and Victory/Fame' [16], the abstractions rendered as ladies because that is what a daimon is once a state has purchased the wall space. The Greek text already knew what the Rotunda executes: wherever ultimate authority is seated, Victory has her room in the same house, and she is not paying rent."}, {"id": "nithuths-queen", "label": "Nithuth's queen", "tradition": "Volundarkvitha", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Lay's explicit oracle of power and fear: she 'spake: The glow of his eyes is like gleaming snakes, His teeth he gnashes if now is shown / The sword... Let them straightway cut his sinews of strength' [24]. What other characters must summon as proof, she reads off the smith's face at once. Yet her counsel generates the very thing it warned of; the maiming creates its avenger. Her closing inventory is domestic and macabre in equal parts: Volund's confession assigns her the quarry of her murdered sons' eyes, 'gems full fair... To Nithuth's wife so wise he gave them' [24]. In testimony she is the highest-fidelity sensor in the poem; in action she enables the loss her sensor detected. That pairing is her character in the fetched witness, and it is thin by function: a queen who exists to say 'now'."}, {"id": "nithuth", "label": "Nithuth/Niðhad", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 1000000000.0, "pw_p": 30000000000.0, "pw_t": 31000000000.0, "pw_e": 6476686140.449, "pw_pool": "P_military", "pw_why": "A king who commands force sufficient to maim an elf-smith [24]; pool share is a throne-share, small.", "pw_ws": 1.0, "essay": "The king of the Njars is remembered for three administrative decisions, all thefts. He takes the smith Volund from the isle where he sat 'fashioning the gold', and it is his queen who supplies the diagnosis: 'The glow of his eyes is like gleaming snakes... Let them straightway cut his sinews of strength, And set him then in Saevarstath' [24]. Maimed and islanded, Volund 'smithied for the king all kinds of precious things. No man dared to go to him, save only the king himself' [24]: Nithuth converts a person into a crown monopoly before he suspects a crown monopoly can hate. The poem's answer arrives by installments: 'I smote off the heads of both thy sons', skulls silvered into cups, eyes as gems to the queen, teeth as a brooch to the daughter [24]. In stanza 39 the king can only concede altitude: 'There is no man so high from thy horse to take thee... While high in the clouds thy course thou takest' [24]. Nithuth's is the most complete documented case of power confiscating craft: it worked for exactly the interval between two island trips."}, {"id": "odin", "label": "Odin", "tradition": "Norse All-Father", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The rune-purchase is narrated as a self-transaction with no purchaser's regret: 'I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself... Bread no one gave me... downward I peered, to runes applied myself, wailing learnt them' [46]. The offering is the offerer; the office buys its own knowledge with its own body. The Edda's All-Father is not the father of Olympus' desk-temper; he is a one-man research staff, self-sacrificed on the world-tree's branch to acquire the alphabet. The model's thinnest premise, that power is sustained by pain, is his entire job description."}, {"id": "pandora", "label": "Pandora", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The first woman enters the tradition not as a person but as a consignment. In Works and Days each god contributes a component to the package, and Hermes delivers her to Epimetheus door to door [26]; the Theogony's compressed version calls her 'the woman, the maiden' Zeus had formed [26]. Apollodorus, centuries later, softens her into a mother: 'Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods' [28]. Between those two statements is the whole of her character available in the fetched witnesses: fabricated, gifted, forgotten, and then quietly maternal. The jar is a later proverb's accessory; in Hesiod she opens nothing, Epimetheus simply 'took the gift' [26]. Under-definition again functions as finding: the tradition mined her for mechanism, not personality."}, {"id": "pericles", "label": "Pericles", "tradition": "Athenian statesman, flesh record", "batch": 6, "date_added": "2026-10-12", "era": -431, "pw_d": 0.0, "pw_p": 30000000000.0, "pw_t": 30000000000.0, "pw_e": 984693100.471, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His funeral oration is an audit of the Athenian character submitted to a juy of mourners: Athens is 'the school of Hellas,' its citizens 'equal to so many emergencies, and graced by so happy a versatility,' and the boasting is 'no mere boast thrown out for the occasion, but plain matter of fact, the power of the state acquired by these habits proves' [44]. Where Brumidi sells Washington as apotheosis [16], Pericles sells the city itself as the monument: the paragon is not a man enthroned but a habit of association itself, and the dead are proof of the operating system. The flesh-record man proposes that the city is the god, and the speech is the offering.\n\nPlutarch files the character the funeral speech sells. Trained by Anaxagoras, he carried natural philosophy into his oratory, and for that elevation 'he was nicknamed the Olympian', a surname some traced to the city's new buildings, some to his power 'both as a politician and a general' [61]. Plutarch's own verdict is severer than the nickname: the man 'never gave way to feelings of envy or hatred', a serenity 'utterly uncorrupt though possessed of great power' [61]. Thucydides lets him have the last word himself, and it is a fiat of identity: 'I am the same man and do not alter, it is you who change' [56]. Statesman, city-cult, apologist of empire: all three registers quote the same man."}, {"id": "poseidon", "label": "Poseidon", "tradition": "Greek sea god", "batch": 5, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Homer's portrait of reserve power: the three strides to Aegae are protocol footage of an old god who rarely needs to move [1]. The Iliad never gives him Olympus' desk, only the deep address and the title Zeus's brother cannot rescind: when Hera plots to drug Zeus, it is Poseidon's faction that flips the field below Troy. His labour is negative, the threat that holds the balance. The Romans will rename him, re-fresco him for Marine [35][16], and bill the republic's shipping to his account; the bill has been outstanding since the Iliad first noted 'the earth-holder who shakes the earth' [26].\n\nThe Odyssey prices his vendetta precisely. Zeus lays out the terms in the divine council of book 1: Polyphemus 'is son to Neptune by the nymph Thoosa', and 'therefore though he will not kill Ulysses outright, he torments him by preventing him from getting home' [54]. Not a grudge to the death but a licensed harassment, the sea's jurisdiction used as a blockade. Homer's second poem gives the earth-shaker what the first never did: a casus belli and a schedule of damages."}, {"id": "priam", "label": "Priam", "tradition": "Greek epic king of Troy", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His great negotiation is conducted in the idiom of kinship inventory: 'Think of your father, O Achilles like unto the gods, who is such even as I am, on the sad threshold of old age... he is glad, and his days are full of hope that he shall see his dear son come home to him from Troy; but I, wretched man that I am, had children not a few in far-famed Troy, and of all these there is none left' [1] (Il. 24). The ransom is purchased not in talents but in staged equivalents: one old man swapped for another, one sonless father teaching the victor's filial arithmetic. The king retrieves his son's body by performing a mortgage on memory. It is the oldest leveraged buyout in the tradition."}, {"id": "pryderi", "label": "Pryderi", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Pryderi is born from Rhiannon's shoulder as an infant whose colt-night theft is the whole branch: one claw, one vigil, one foster-household, one naming by Pendaran: 'Pryderi, son of Pwyll, chief of Annwvyn' [21]. In the Third Branch he supplies the balm: a kingdom emptied by a spell he triggers, an exile kept alive by market craft: shoemaking in three towns is the only employment sequence in the corpus where national scales are settled by craft guild pricing ('nothing would the brewers do but take the trade of him' style; the fetched passage runs saddlery-to-shoeing) [21]. His most legible decision is exogamy-statecraft: 'I did offer thee as a wife to Manawyddan the son of Llyr' is his line to his mother [21]. He reads as a transfer student between tales, thin in all of them; by the Fourth Branch his death belongs to another book."}, {"id": "pwyll", "label": "Pwyll", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Prince of Dyved is the Mabinogion's documented case of rule by courtesy. He meets a stranger of the Otherworld on his own chase, asks friendship, and accepts the price: 'I will show thee. Behold thus it is thou mayest' -- a body swap to fight Havgan, 'a man whose dominions are opposite to mine, who is ever warring against me' [21]. Only one blow is allowed, and Pwyll gives exactly one, declining the second for a year of impersonated kingship; the witness emphasizes that he did not touch Arawn's wife. Later, pledged hospitality sends him a rival: he learns of Rhiannon's designation for 'Gwawl the son of Clud' and must yield on the word already spoken [21]. His rescue plays out as literate contract abuse: the bag is exactly what was promised and who gets into it is Gwawl, beaten by Pwyll's knights, whence 'the game of Badger in the Bag' [21]. He rules by keeping words harder than anyone else keeps them."}, {"id": "pyrrha", "label": "Pyrrha", "tradition": "Greek mythography", "batch": 3, "date_added": "2026-10-12", "era": 100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Known by one sentence of Apollodorus and one act. She is 'the daughter of Epimetheus and Pandora' and the wife Deucalion takes aboard the chest his father advised [28]. After nine days on the water she disembarks at Parnassus with him and, at Zeus' bidding through Hermes, helps throw the stones that become the new race of men [28]. The witnesses give her no words. Her salience is genealogical: she is the hinge between the thieving, gift-forgetting generation of Titans' children and the rebuilt human stock.\n\nOvid gives her the words Apollodorus withholds, and they are a refusal. At Themis' answer, 'Pyrrha is the first by her words to break the silence, and refuses to obey the commands of the Goddess; and begs her, with trembling lips, to grant her pardon, and dreads to offend the shades of her mother' [60]. The tradition's one glimpse of her independence is piety against piety: she will not throw her mother's bones, and must be argued past herself by her husband's reading that the mother is earth and the bones are stones [60]. Pandora's daughter ends the myth doing what her mother never learned: refusing an instruction from the gods until its cost has been reasoned out."}, {"id": "quirinus", "label": "Quirinus (Romulus)", "tradition": "Roman founding god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid's compressed founder story reads like a patent filing for succession: Silvia 'lay big, for already within her womb there was Rome's founder... Remus was growing, and growing, too, was Quirinus' [36]. Two embryos, one name becomes a god. Then the wall, and Ovid's single dry afterword recorded as historical commentary: 'Walls were built, which, small though they were, it had been better for Remus not to have overleaped' [36]. The founding breach is the founding lesson. It is the Roman original of a pattern this graph keeps finding: the first act of the city's god is the murder of the boundary-crosser. Quirinus is the nation state's own genius as tutelary [14] with a fratricide in the footer."}, {"id": "rhiannon", "label": "Rhiannon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 450000000.0, "pw_p": 0.0, "pw_t": 450000000.0, "pw_e": 175778454.742, "pw_pool": "P_horses", "pw_why": "Horse association is a penance in the primary witness [21] and the goddess claim scholarship [23]; the equine economy still runs under her modern name.", "pw_ws": 0.75, "essay": "The texts give a woman with full agency; the modern label gives a function. In the Pwyll branch she rides past pursuit-'the more he urged his horse, the further was she from him'-and halts only when spoken to, remarking 'it were better for thy horse hadst thou asked it long since' [21]. She engineers her own marriage, survives a false accusation and a horse-carrying penance at the gate [21], and in the Branwen branch her three birds sing the survivors of Ireland through seven years at Harlech [21]. The Manawyddan branch has Pryderi settle her on Manawyddan with the seven Cantrevs, after which Llwyd empties Dyfed in a fall of mist [21]. Nowhere is she called a goddess or given a horse attribute. The label 'Welsh horse goddess' rests on MacCulloch's Rigantona etymology ('we may postulate') [23] plus an analogy to the genuinely epigraphic Epona [23], whose rose-decked stable shrine Apuleius already attests [22]. The abstraction erases exactly what the primary witness supplies."}, {"id": "styx", "label": "Styx", "tradition": "Greek oath-river", "batch": 5, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The reward for showing up first is permanent infrastructure. When Zeus levied the gods against the Titans, Styx 'came first to Olympus with her children' and he 'honoured her, and gave her very great gifts, for her he appointed to be the great oath of the gods' [26]. After that, Hediod says simply, 'he himself mightily reigns and rules' [26]. The causality is written backwards on purpose: he reigns because she holds the oath pool. Every contract between immortals is settled in her water, fetched in a golden jug by Iris [26]. Emulation, Victory, Strength and Force sleep in her house but answer to his roof; she is the escrow of Olympus, the one power in the register who got paid before the war was won."}, {"id": "teyrnon", "label": "Teyrnon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Teirnyon Twryf Vliant, the lord who keeps the account books of May Day. His mare foals 'on the night of every first of May... and no one ever knew what became of the colt'; Teirnyon keeps vigil, severs the vast claw that comes through the window, and finds at his door a new-born child in a sea-satin cloth [21]. He raises Gwri Wallt Euryn, sees his resemblance to Pwyll grown up, and delivers him back to the court despite his wife's half-in-earnest remonstrance; Pendaran Dyved crowns the household-naming: 'well hast thou named thy son Pryderi, and well becomes him the name of Pryderi, son of Pwyll, chief of Annwvyn' [21]. The fetched tale grants him no office and no tenure in the royal line; only a stolid logistics of honesty by horse. He is the graph's cleanest documented fosterage-edge: all strength, little claim."}, {"id": "sibyl", "label": "The Cumaean Sibyl", "tradition": "Roman prophetic priestess", "batch": 5, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Her memo to Aeneas is the graph's only honest access-policy document: 'The gates of hell are open night and day; smooth the descent, and easy is the way: but to return, and view the cheerful skies, in this the task and mighty labor lies. To few great Jupiter imparts this grace' [35]. The underworld as a building with symmetric entry controls and asymmetric exit controls. She is Apollo's office manager in the Aeneid, the one flesh person in the epic whose job description grants her the password list. Rome institutionalized her books as the state's emergency manual; the Sibylline shelf was consulted by the Senate for five centuries. The model: prophecy as filings, accessible on petition."}, {"id": "erinyes", "label": "The Erinyes (Spirits of Wrath/Blessing)", "tradition": "Greek tragedy", "batch": 3, "date_added": "2026-10-12", "era": -458, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Older than the court they are escorted to. In the Eumenides they enter as 'the daughters of Night', pursuers of blood-guilt, and are publicly mocked for it: 'What I have suffered is unbearable' [31]. Athene's settlement neither defeats nor disbands them but converts them; the translator's argument for the play states the outcome plainly, they move from Spirits of Wrath to Spirits of Blessing with a sanctuary beneath the Hill of Ares [31]. Their salience is the durable one: the play proposes that vengeance, given a seat and an address, becomes the guarantee of law rather than its enemy.\n\nHomer keeps them, as law keeps them, under the floor of the family. Phoenix stands cursed by his father 'calling the dread Erinyes to witness', and 'the gods, Jove of the world below and awful Proserpine, fulfilled his curse' [1]; Meleager's mother, kneeling and beating the earth, prays her own son dead, 'and Erinys that walks in darkness and knows no ruth heard her from Erebus' [1]. Their jurisdiction extends even over miracles inside the war: when Xanthus the horse is given speech and foretells Achilles' end, he gets the prophecy out and no further: 'When he had thus said the Erinyes stayed his speech' [1]. Three centuries before Aeschylus sat them down in Athens, the Iliad knew them as the powers who enforce curses and censor the unlicensed voice alike."}, {"id": "themis", "label": "Themis", "tradition": "Greek Titaness of order", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "She appears first in the Muses' proem as a court fixture: 'reverend Themis', counted between Poseidon and Aphrodite [26]. Before any laws are sung, the Titaness of custom sits the assembly where they will be recited. Her name is the name of the Muses' subject-matter: they 'sing the laws of all and the goodly ways of the immortals' [26], and those laws are her person. The tithe: Themis holds no flashy pool; she is the chart the pools are drawn on. When Zeus's reign is praised as reign, the praise says his distributions were lawful, i.e., Themis-worthy.\n\nThe Iliad keeps her at her assembly post: when Hera returns to Olympus in book 15, shaken from the deception plot, 'lovely Themis' is 'first to come running up to her' with the cup, and is dispatched to 'lead the gods to table' [1]. Usher, cupbearer, convener: the poem stages custom's goddess doing the courtesies the divine parliament cannot survive without."}, {"id": "thetis", "label": "Thetis", "tradition": "Greek sea goddess, mother of Achilles", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 750000000000.0, "pw_t": 750000000000.0, "pw_e": 15797627245.563, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Her condolence paragraph is a ledger of maternity: 'My son, woe is me that I should have borne or suckled you. Would indeed that you had lived your span free from all sorrow at your ships, for it is all too brief; alas, that you should be at once short of life and long of sorrow' [1]. The goddess who can call in Olympus' favor for her son's honor is helpless about the span itself: she can move Zeus but not change the length written at birth. She is the graph's cleanest case of a spirit with enormous proxy power and zero say over the only variable she measures.\n\nThe Odyssey hears of her last rite for the son. Agamemnon's ghost recalls that after the fall of the Achaean dead, 'you never saw such prizes as silver-footed Thetis offered in your honour; for the gods loved you well' [54]. Her power registers at the one moment power cannot help: purse and games, love's expenditure upon a fixed grave."}, {"id": "thor", "label": "Thor", "tradition": "Norse thunder god", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His apocalypse entry is a work order: 'Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgard's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe' [46]. Even at the world's end Thor is dispatched on a specific task, and the finish is measured in feet walked after the kill: nine, then bowed. The god of the hammer does the deed that ends the story and counts his own steps off the job-site. There is no triumph in the stanza, only closing documentation."}, {"id": "tiberinus", "label": "Tiberinus", "tradition": "Roman river god", "batch": 6, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The river's biography in the Fasti is a single hire report: 'when Tiberinus possessed his father's kingdom after the death of Calpetus, he was drowned... and gave his own name to the water' [37]. The Alban king drowns in a stream and the stream takes his surname permanently; Rome's logistics artery is a drowning victim with tenure. When the Tiber floods, the tradition's memory is not of weather but of inheritance: a royal body converted into public infrastructure, surname and all. The state's central river is a personnel record."}, {"id": "typhoeus", "label": "Typhoeus", "tradition": "Greek chaos-monster", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 2250000000000.0, "pw_t": 2250000000000.0, "pw_e": 50805284937.092, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod's sequence is an escalation report for the incumbent's file: Earth's youngest, born when all her other weapons had failed, with an hundred snake-heads, 'and there were voices in all his dreadful heads which uttered every kind of sound unspeakable' [26]. It almost works: 'he would have come to reign over mortals and immortals, had not the father of men and gods been quick to perceive it. But he thundered hard and mightily' [26]. Hesiod's proem already told us the campaigns by which Zeus was established; here is the last firewall test, and the answer is raw kilowatts, no strategy. The succession of heaven ends not in deliberation but in the largest power spike in the register."}, {"id": "venus", "label": "Venus", "tradition": "Roman state ancestress", "batch": 3, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 1063918590.688, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid does the arithmetic of state cult out loud. Asking why April belongs to Venus, he finds the reason in bookkeeping: the Julian house 'traced his descent from her through many generations,' so the founder of the line 'willed that the place of the second month should belong to Venus' [37]. A month of the state calendar allocated to a goddess as a dividend on the ruling family's genealogy. Rome's rulers are her collateral descendants, the calendar her certificate of title. When the American state needed its faculty of love and lineage for the Rotunda's six, Venus came with the portfolio already assembled [16]: the goddess who proves that politics begins with a family tree and that mythology, correctly filed, is hereditary office."}, {"id": "vesta", "label": "Vesta", "tradition": "Roman hearth goddess", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "She appears in the Fasti by defensive reflex: when the vestal Silvia bears the future founders in secret, 'the images of Vesta are said to have covered their eyes with their virgin hands... and the altar of the goddess trembled' [36]. The hearth goddess who cannot look at the arrival of the state. Her power is the negative pool, the flame that must not go out and must not see; Rome wires its continuity to her averted gaze. Every cantonment of the Roman fire has her floor plan: a protected, unseen center, tended by women whose term of service is the state's metabolism."}, {"id": "volundr", "label": "Volundr / Wayland / Velent", "tradition": "Germanic/Norse", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 50000000000.0, "pw_p": 600000000.0, "pw_t": 50600000000.0, "pw_e": 10571623184.087, "pw_pool": "P_metals", "pw_why": "Smith-king of the Germanic tradition; revenge executed precisely through metalwork [24][25]; share small but the attribution is absolute within its domain.", "pw_ws": 1.0, "essay": "The tradition's actual figure is a revenge-tragedy protagonist. The queen reads the captive's nature at a glance-'The glow of his eyes is like gleaming snakes'-and prescribes the hamstringing that sets him on the island [24]. His reply is workshop horror: he smites the two princes, sets their skulls in silver for the king, fashions gems from their eyes for the queen, and a brooch from their teeth for Bothvild [24]. Bothvild comes with her broken ring; the beer out-sleeps her [24]; Deor reports in Old English that her brothers' death grieved her less than her own thing, 'that she was with child' [25]. Then the exit: 'Laughing Volund rose aloft, / Weeping Bothvild went from the isle' [24]. Bellows' note documents the legend's geography from Saxon regions into the North [24]. The softened craftsman of Scott and Kipling is not this figure; the softening deletes precisely what the witnesses keep."}, {"id": "vulcan", "label": "Vulcan", "tradition": "Roman name of the Greek forge god", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 18000000000.0, "pw_t": 18000000000.0, "pw_e": 379143053.894, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The name is Roman but the factory is Homer's. In the Iliad the lame god receives Thetis between jobs, and the jobs are already automated: 'Twenty tripods that were to stand by the wall of his house, and he set wheels of gold under them all that they might go of their own selves to the assemblies of the gods, and come back again: marvels indeed to see' [1]. A forge whose products report to work by themselves; the tradition's earliest description of self-driving manufacture is a household appliance of Vulcan's. Rome did not invent this god, it naturalized him, and the Capitol hires him again for Mechanics, where the AOC's own caption has him forging cannon [16]. Three thousand years of the same character sheet: the god who builds the weapons he does not command, lusting after the pool of whomever gives the orders."}, {"id": "xanthus-balius", "label": "Xanthus and Balius", "tradition": "Greek immortal horses", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Zeus's regret for lending them out is the Iliad's most bizarre depreciation report: 'Why did we give you making over to Peleus who is a mortal, while you are yourselves ageless and immortal? Was it that you might share the sorrows that befall mankind? For of all creatures that live and move upon the earth there is none so pitiable as he is' [1]. The horses' immortality is a loan-covenant with grief embedded in the terms. Hector 'shall drive neither you nor your chariot' [1]; the divine asset returns to its unlanded status. The tradition registers, in horse-flesh, what happens when durable goods are attached to mortals: they age along with the account."}, {"id": "yggdrasil", "label": "Yggdrasil", "tradition": "Norse world-tree", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The seeress's first memory claim is a filing system: 'I nine worlds remember, nine trees, the great central tree, with its roots covered with mold' [46]. The tree is not a symbol so much as a storage medium: nine worlds indexed on one fixed axis, with the seeress's memory as lookup. When Odin needs to purchase runes, the tree doubles as the gallows [46]. The cosmos' one permanent installation: everything hangs on it, including the god."}], "edges": [{"frm": "asclepius", "to": "machaon", "type": "kinship", "title": "Sons of the healer", "essay": "The Catalogue identifies both brothers as 'the two sons of Aesculapius' [1]; the office descends as kinship before it appears as skill.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "podaleirius", "type": "kinship", "title": "The other healing son", "essay": "Podaleirius shares the Catalogue entry and the thirty ships [1]; Pausanias adds his separate landing at Syrnus [3]. He is Machaon's structural double across the same sources.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": 170}, {"frm": "chiron", "to": "asclepius", "type": "transmission", "title": "transmission", "essay": "craft lineage: 'soothing drugs which Chiron had given to Aesculapius'", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "machaon", "type": "transmission", "title": "The trade descends with the bloodline", "essay": "Chiron's drugs pass from the centaur to Asclepius, and the Catalogue names the sons 'skilled in the art of healing' [1]. Machaon's clinic at Menelaus' wound applies the inherited line directly [1].", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "paris-alexandrus", "to": "machaon", "type": "conflict", "title": "The arrow that priced a physician", "essay": "Alexandrus' triple-barbed arrow to the right shoulder triggers the Iliad's explicit value judgment: Idomeneus tells Nestor a physician is worth more than several other men [1], and the rescue sets Patroclus' errand in motion [1].", "source": "[1] Il. 11.506-520", "date_added": "2026-10-12", "era": -750}, {"frm": "nestor", "to": "machaon", "type": "interaction", "title": "The knight of Gerene, twice", "essay": "Nestor drives the wounded Machaon from the field in the poem [1], and Pausanias reports the same Nestor bringing the healer's bones home to Gerenia for cult [3]. The man who rescues the body becomes the guardian of the grave.", "source": "[1] Il. 11.596-604; [3] Paus. 3.26.10", "date_added": "2026-10-12", "era": 170}, {"frm": "eurypylus-telephid", "to": "machaon", "type": "conflict", "title": "The healer's killer, by report", "essay": "The Little Iliad tradition, preserved only through Pausanias, has Eurypylus son of Telephus kill Machaon [3]. A lost epic's claim reaching us through a traveler's report ([3] Paus. 3.26).", "source": "[3] Paus. 3.26.9-10", "date_added": "2026-10-12", "era": 170}, {"frm": "genius", "to": "lares-penates", "type": "comparison", "title": "Categories confounded, firm only in a dictionary", "essay": "Smith's 1870 dictionary keeps the boundary: genii produce life and attend it as a second self, while lares and penates operate after life begins; the same entry admits the terms are 'frequently confounded' [12]. The clean distinction is an antiquarian artifact.", "source": "[12] Smith s.v. Genius", "date_added": "2026-10-12", "era": 1870}, {"frm": "juno", "to": "genius", "type": "analogy", "title": "Every soul its own named god", "essay": "Pliny's skepticism documents the pairing: 'each individual makes a separate God for himself, adopting his own Juno and his own Genius' [11]. The female counterpart principle is attested but its doctrine is unstable across sources [12].", "source": "[11] Plin. NH 2.5", "date_added": "2026-10-12", "era": 1870}, {"frm": "silvanus", "to": "genius", "type": "interaction", "title": "One rustic altar, three recipients", "essay": "Horace's farmer atones Earth with a hog, Silvanus with milk, and 'with flowers and wine the genius that reminds us of our short life' [9]. The genius sits at the same field-table as the established gods, without ever receiving a myth.", "source": "[9] Horace Ep. 2.1.143-144", "date_added": "2026-10-12", "era": -20}, {"frm": "sandman", "to": "nathanael", "type": "conflict", "title": "The threat that never has to execute", "essay": "Coppelius cries for the eyes and the father buys them back; years later the cry 'Sköne Oke' from the crowd is enough to throw Nathanael from the tower [4]. No act is ever completed onstage; recurrence does all the work.", "source": "[4] Hoffmann, Der Sandmann", "date_added": "2026-10-12", "era": 1816}, {"frm": "olympia", "to": "nathanael", "type": "interaction", "title": "The dispute Freud overruled", "essay": "Jentsch located the tale's uncanny in Olympia's ambiguity, animate doll or living woman; Freud rejects that reading in favor of the eye-motif and castration economy [5]. The log flags the disagreement as unresolved rival readings, not a settled point.", "source": "[5] Freud CP IV, pp. 383-384", "date_added": "2026-10-12", "era": 1919}, {"frm": "sandman", "to": "genius", "type": "analogy", "title": "The companion who attends you to death", "essay": "Horace's genius 'dies with each individual' [9]; Hoffmann's phantom tracks one individual to his [4]. Structural analogy only: no document connects the Roman tutelary to the German nursery bogey.", "source": "log batch 1 connection map; [9], [5]", "date_added": "2026-10-11", "era": 1919}, {"frm": "prometheus", "to": "hephaestus", "type": "conflict", "title": "Theft from the craftsman", "essay": "Aeschylus names the stolen thing 'flashing fire, source of all arts' [6]; Plato specifies the burglarized workshops: 'the mechanical arts of Hephaestus and Athene, and fire with them' [7]. The giver to men begins as a thief among gods.", "source": "[7] Protagoras 321c-d; [6] PB 4-10", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "athene", "type": "conflict", "title": "Her arts, taken in the same burglary", "essay": "Plato's myth distributes the theft across two divine workshops; Athene's crafts pass to mortals through a crime committed by a Titan [7].", "source": "[7] Protagoras 321c-d", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "zeus", "type": "conflict", "title": "The distribution and the penalty", "essay": "Prometheus' gift leaves man without political wisdom, 'for that was in the keeping of Zeus' [7], and the punishment plus the concession-'Skill is weaker by far than Necessity' [6]-frame the bond between giver and ruler.", "source": "[6] PB; [7] Protagoras", "date_added": "2026-10-12", "era": -380}, {"frm": "epimetheus", "to": "prometheus", "type": "kinship+interaction", "title": "The blunder that armed the theft", "essay": "Epimetheus exhausts the faculties on the animals, leaving man unprovided; Prometheus' theft follows from the blunder, and Plato notes he was 'prosecuted for theft, owing to the blunder of Epimetheus' [7].", "source": "[7] Protagoras 320c-321e", "date_added": "2026-10-12", "era": -380}, {"frm": "heracles", "to": "prometheus", "type": "interaction", "title": "Release, prophesied", "essay": "The tradition of eventual release by Heracles stands within the Prometheus Bound frame; the log records it as tradition-internal prophecy [6], with the release narrative itself not fetched as a separate witness.", "source": "[6] PB", "date_added": "2026-10-12", "era": -458}, {"frm": "gilgamesh", "to": "lilith", "type": "conflict", "title": "Dispossessed by the hero's axe", "essay": "When Gilgamesh kills the snake and the Anzud flees with its young, 'the phantom maid living in its trunk left her dwelling and sought refuge in the wilderness' [17]. Her only recorded act in Sumer is a retreat. The name-link to later Lilith is philology, and stays only that.", "source": "[17] lines 136-150 (philological linkage flagged)", "date_added": "2026-10-12", "era": -2000}, {"frm": "lilith", "to": "adam", "type": "interaction", "title": "The wife who chose the wilderness", "essay": "The Ben Sira narrative, via Ginzberg: created from the same dust, she claims equality as a matter of derivation, pronounces the Ineffable Name, and flies away; facing the angelic ultimatum she 'preferred this punishment to living with Adam' [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "eve", "to": "adam", "type": "kinship", "title": "The second fabrication", "essay": "In the same anthology's frame, Eve is formed from Adam's body on the principle that 'only when like is joined unto like the union is indissoluble' [19]. The replacement spouse replaces the rebel.", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "lilith", "to": "agrimus", "type": "kinship+conflict", "title": "The demon's mother, the demon's bargain", "essay": "Methuselah 'delivered the world from thousands of demons, the posterity of Adam which he had begotten with Lilith,' slaying myriads until Agrimus, their first-born, sued for terms and surrendered the demons' names [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "methuselah", "to": "agrimus", "type": "conflict", "title": "Ninety-four myriads per minute", "essay": "Ginzberg's Methuselah wields a sword inscribed with the Ineffable Name; the demon hierarchy capitulates, its kings are fettered, and the rest hide in the ocean's chambers [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "pwyll", "to": "rhiannon", "type": "interaction+marriage", "title": "The courtship no horse can win", "essay": "Three days of pursuit fail-'the more he urged his horse, the further was she from him'-until Pwyll speaks, and she answers that it would have been better for his horse had he asked sooner; she has come on her own quest to seek him [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "arawn", "to": "pwyll", "type": "interaction", "title": "A year in another man's shape", "essay": "Pwyll exchanges form and kingdom with Arawn of Annwfn, holds to the covenant including the marriage bed, and returns as both lord of Dyfed and Head of Annwfn [21]. The exchange is the branch's hinge and Rhiannon's entrance follows it.", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "gwawl", "to": "rhiannon", "type": "conflict", "title": "The suitor in the bag", "essay": "Gwawl claims by covenant what Pwyll rashly granted; Rhiannon's counter-counsel traps him in the small bag at the feast's tallies, and the badger-in-the-bag sport settles the wager [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "llwyd", "to": "rhiannon", "type": "conflict", "title": "A kingdom emptied for a wedding debt", "essay": "Llwyd's revenge for Gwawl arrives as mist over the Gorsedd of Narberth: when it lifts, Dyfed holds 'neither house, nor beast, nor smoke, nor fire, nor man, nor dwelling' [21]. The feud is inherited by Pryderi's marriage.", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "teyrnon", "to": "pryderi", "type": "interaction", "title": "The May-eve vigil", "essay": "Teyrnon watches his mare on the night her colts always vanish; he severs the claw that reaches through the window, pursues the wailing into the dark, and returns to find the newborn in satin at his door [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "pryderi", "type": "kinship", "title": "The mother who served the sentence", "essay": "Accused of destroying her newborn, Rhiannon lets the penance stand rather than press her own vindication, sitting at the horse-block and offering to carry guests into the palace, until the grown child's face settles the account [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "manawyddan", "type": "marriage", "title": "The widow held in the same trap", "essay": "Pryderi gives his mother to Manawyddan with the seven Cantrevs; the enchantment strips the land, and husband and wife are taken together in Llwyd's fortress until the one captured mouse is ransomed [21].", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "bran", "to": "rhiannon", "type": "interaction", "title": "Seven years at the tables of birds", "essay": "Bran's company, reduced to seven and a head, sit at Harlech where the three birds of Rhiannon sing 'and at this repast they continued seven years' [21]. The song is distance-canceling and time-dissolving.", "source": "[21] Branwen branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "epona", "type": "analogy", "title": "A goddess borrowed from another country", "essay": "Epona is real in the record: Gaulish inscriptions, stable statuettes, a shrine-decked pillar in Apuleius [22], cult carried by Roman cavalry [23]. Rhiannon's equation to her is MacCulloch's postulation over a contested etymology [23]; the Mabinogi itself gives Rhiannon a horse only as penance [21].", "source": "[23] vs [21]", "date_added": "2026-10-12", "era": 1911}, {"frm": "nithuth", "to": "volundr", "type": "conflict", "title": "The king who stole the smith's limbs", "essay": "Nithuth takes Völund by night, wears his sword, gives his ring to Bothvild; the queen prescribes: 'Let them straightway cut his sinews of strength,' and the island captivity follows [24].", "source": "[24] st. 17-18 + prose", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "nithuth", "type": "conflict", "title": "Payment in the family's own metal", "essay": "The two princes come for keys and gold; Völund smites off their heads, hides the feet under the bellows, silvers the skulls for Nithuth, sets the eyes as gems for the queen, and brooches the teeth for Bothvild [24]. The revenge is executed in the arrested craft.", "source": "[24] st. 24-26", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "bothvild", "type": "conflict+interaction", "title": "The ring, the beer, the child", "essay": "Bothvild brings the broken ring; the beer puts her to sleep [24]. The Old English Deor states the consequence without euphemism: the death of her brothers grieved her less than her own thing, 'that she was with child' [25].", "source": "[24] st. 27-29; [25]", "date_added": "2026-10-12", "era": 1923}, {"frm": "volundr", "to": "prometheus", "type": "analogy", "title": "Two smiths, two chains", "essay": "Prometheus steals for men and suffers at Zeus' order while conceding that skill bows to Necessity [6]; Völundr suffers at a king's order and answers with the family's own flesh reworked as gifts [24]. Analogy only; no document joins the Greek and Germanic smiths.", "source": "log batch 2 connection map", "date_added": "2026-10-12", "era": 1923}, {"frm": "mason-weems", "to": "george-washington", "type": "transmission", "title": "The parson's unnamed lady", "essay": "Weems introduces the cherry tree as 'too true to be doubted; for it was communicated to me by the same excellent lady' [15], an informant without a name. The most repeated anecdote of the American childhood rests on 'the same excellent lady' and nothing else inside the text.", "source": "[15]", "date_added": "2026-10-12", "era": 1800}, {"frm": "cincinnatus", "to": "george-washington", "type": "analogy", "title": "The plough as title", "essay": "Weems writes the retirement in Roman: 'Here, Cincinnatus-like, he betook him to his favorite plough' [15]. The exemplum functions as a claim of type, not of relation; the dictator who left the plough is the mold into which the president is poured.", "source": "[15]", "date_added": "2026-10-12", "era": 1800}, {"frm": "brumidi", "to": "george-washington", "type": "transmission", "title": "Apotheosis, painted by the state", "essay": "Brumidi's 1865 fresco suspends Washington 'rising to the heavens in glory' between Liberty and Victory, ringed by six faculties of the nation worked as Roman gods [16]. A legislature commissioned what antiquity required centuries of cult to build.", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "george-washington", "to": "genius", "type": "analogy", "title": "The Capitol's tutelary", "essay": "Servius: no place is without its genius [14]. The Rotunda executes that idea with federal funds: one man enthroned as the guardian-deity of the national place [16]. Analogy in structure; the machinery is documented on both sides.", "source": "[14][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "zeus", "to": "pandora", "type": "creation", "title": "The consignment", "essay": "Both Hesiodic poems agree on the negation of agency: she is made to be sent. The Father orders the components, Hephaestus moulds, and Hermes carries 'the sheer, hopeless snare' to its recipient [26]; the Theogony version marks the maiden as 'whom he had formed' [26]. Assembled by a committee of gods, Pandora's entire attested being is delivery to an address.", "source": "[26] Th. 570-589; W&D 60-89", "date_added": "2026-10-12", "era": -750}, {"frm": "pandora", "to": "epimetheus", "type": "interaction", "title": "The gift accepted", "essay": "The turning of the human age is phrased as a lapse of memory, not malice: 'Epimetheus did not think on what Prometheus had said to him... But he took the gift, and afterwards, when the evil thing was already his, he understood' [26]. This is the graph's first edge whose title is a failure mode.", "source": "[26] W&D 83-89", "date_added": "2026-10-12", "era": -750}, {"frm": "prometheus", "to": "epimetheus", "type": "kinship", "title": "Let me distribute", "essay": "Plato records the brothers' own division of the divine labor in direct speech: 'Epimetheus said to Prometheus: Let me distribute, and do you inspect' [27]. Brotherly trust is the load-bearing structure here; inspection comes after distribution, which is exactly the complaint. Hesiod had already made them sons of Iapetus, though he calls the mother Clymene where Apollodorus says Asia [26][28].", "source": "[27] Protagoras 320d-e", "date_added": "2026-10-12", "era": -380}, {"frm": "epimetheus", "to": "prometheus", "type": "interaction", "title": "The blunder billed", "essay": "The myth's punchline attaches legal liability to the afterthought: Prometheus 'is said to have been afterwards prosecuted for theft, owing to the blunder of Epimetheus' [27]. Plato, via Protagoras, is the only fetched witness that makes one brother legally responsible for the other's bookkeeping; Aeschylus' Prometheus knows nothing of the arrangement.", "source": "[27] Protagoras 322a", "date_added": "2026-10-12", "era": -380}, {"frm": "pandora", "to": "pyrrha", "type": "kinship", "title": "Survivor of the snare", "essay": "Apollodorus is the only fetched witness to continue Pandora's line: Pyrrha is 'the daughter of Epimetheus and Pandora' and becomes wife of the flood survivor [28]. The snare Zeus engineered thus becomes, by the mythographer's arithmetic, the grandmother of re-peopled mankind.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "prometheus", "to": "deucalion", "type": "kinship", "title": "Forethought inherited", "essay": "'Prometheus had a son Deucalion' [28]; when the Bronze Age is annulled by rain it is 'by the advice of Prometheus' that the son constructs the chest [28]. The family profession has changed hands: from theft for mankind's sake to compliance that preserves it.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "deucalion", "to": "pyrrha", "type": "kinship", "title": "The chest and the stones", "essay": "Marriage as mutual survival: Deucalion 'married Pyrrha' and floats nine days to Parnassus beside her [28]; together they throw the stones behind their shoulders at Zeus' command and the race is renewed [28]. The witness is an epitome, so the reconstruction of humanity takes the space of three sentences.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "athene", "type": "kinship", "title": "Born armed from the head", "essay": "Metis, swallowed pregnant, 'straightway conceived Pallas Athene: and the father of men and
