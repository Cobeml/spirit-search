us", "to": "george-washington", "type": "analogy", "title": "The plough as title", "essay": "Weems writes the retirement in Roman: 'Here, Cincinnatus-like, he betook him to his favorite plough' [15]. The exemplum functions as a claim of type, not of relation; the dictator who left the plough is the mold into which the president is poured.", "source": "[15]", "date_added": "2026-10-12", "era": 1800}, {"frm": "brumidi", "to": "george-washington", "type": "transmission", "title": "Apotheosis, painted by the state", "essay": "Brumidi's 1865 fresco suspends Washington 'rising to the heavens in glory' between Liberty and Victory, ringed by six faculties of the nation worked as Roman gods [16]. A legislature commissioned what antiquity required centuries of cult to build.", "source": "[16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "george-washington", "to": "genius", "type": "analogy", "title": "The Capitol's tutelary", "essay": "Servius: no place is without its genius [14]. The Rotunda executes that idea with federal funds: one man enthroned as the guardian-deity of the national place [16]. Analogy in structure; the machinery is documented on both sides.", "source": "[14][16]", "date_added": "2026-10-12", "era": 1865}, {"frm": "zeus", "to": "pandora", "type": "creation", "title": "The consignment", "essay": "Both Hesiodic poems agree on the negation of agency: she is made to be sent. The Father orders the components, Hephaestus moulds, and Hermes carries 'the sheer, hopeless snare' to its recipient [26]; the Theogony version marks the maiden as 'whom he had formed' [26]. Assembled by a committee of gods, Pandora's entire attested being is delivery to an address.", "source": "[26] Th. 570-589; W&D 60-89", "date_added": "2026-10-12", "era": -750}, {"frm": "pandora", "to": "epimetheus", "type": "interaction", "title": "The gift accepted", "essay": "The turning of the human age is phrased as a lapse of memory, not malice: 'Epimetheus did not think on what Prometheus had said to him... But he took the gift, and afterwards, when the evil thing was already his, he understood' [26]. This is the graph's first edge whose title is a failure mode.", "source": "[26] W&D 83-89", "date_added": "2026-10-12", "era": -750}, {"frm": "prometheus", "to": "epimetheus", "type": "kinship", "title": "Let me distribute", "essay": "Plato records the brothers' own division of the divine labor in direct speech: 'Epimetheus said to Prometheus: Let me distribute, and do you inspect' [27]. Brotherly trust is the load-bearing structure here; inspection comes after distribution, which is exactly the complaint. Hesiod had already made them sons of Iapetus, though he calls the mother Clymene where Apollodorus says Asia [26][28].", "source": "[27] Protagoras 320d-e", "date_added": "2026-10-12", "era": -380}, {"frm": "epimetheus", "to": "prometheus", "type": "interaction", "title": "The blunder billed", "essay": "The myth's punchline attaches legal liability to the afterthought: Prometheus 'is said to have been afterwards prosecuted for theft, owing to the blunder of Epimetheus' [27]. Plato, via Protagoras, is the only fetched witness that makes one brother legally responsible for the other's bookkeeping; Aeschylus' Prometheus knows nothing of the arrangement.", "source": "[27] Protagoras 322a", "date_added": "2026-10-12", "era": -380}, {"frm": "pandora", "to": "pyrrha", "type": "kinship", "title": "Survivor of the snare", "essay": "Apollodorus is the only fetched witness to continue Pandora's line: Pyrrha is 'the daughter of Epimetheus and Pandora' and becomes wife of the flood survivor [28]. The snare Zeus engineered thus becomes, by the mythographer's arithmetic, the grandmother of re-peopled mankind.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "prometheus", "to": "deucalion", "type": "kinship", "title": "Forethought inherited", "essay": "'Prometheus had a son Deucalion' [28]; when the Bronze Age is annulled by rain it is 'by the advice of Prometheus' that the son constructs the chest [28]. The family profession has changed hands: from theft for mankind's sake to compliance that preserves it.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "deucalion", "to": "pyrrha", "type": "kinship", "title": "The chest and the stones", "essay": "Marriage as mutual survival: Deucalion 'married Pyrrha' and floats nine days to Parnassus beside her [28]; together they throw the stones behind their shoulders at Zeus' command and the race is renewed [28]. The witness is an epitome, so the reconstruction of humanity takes the space of three sentences.", "source": "[28] Bibl. 1.7.2", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "athene", "type": "kinship", "title": "Born armed from the head", "essay": "Metis, swallowed pregnant, 'straightway conceived Pallas Athene: and the father of men and gods gave her birth by way of his head' [26]. Athene enters the world already 'arrayed in arms of war', her craft natal rather than learned; the guardian of crafts enters the record as a byproduct of a coup.", "source": "[26] Th. 886-929", "date_added": "2026-10-12", "era": -750}, {"frm": "zeus", "to": "metis", "type": "conflict", "title": "The swallowing of counsel", "essay": "The most economical coup in the corpus: advised that Metis might bear 'something stronger than his thunderbolt', Zeus 'seized her with his hands and put her in his belly' [26]. No battle is needed against an intelligence; the monarch simply converts counsel into nutrition. It is a conflict in which only one side fights.", "source": "[26] Th. 886-900", "date_added": "2026-10-12", "era": -750}, {"frm": "zeus", "to": "cincinnatus", "type": "analogy", "title": "Licensed thrones, late and early", "essay": "ANALOGY, not transmission: Callimachus writes 'from Zeus come kings; for nothing is diviner than the kings of Zeus' [29], and the Roman insistence that power must be handed back to be legitimate is the same doctrine in reverse gear. The Welsh and Roman fathers-in-arms of cincinnatus share only the licensing scheme with the Olympian; no textual carrier between the strata is claimed.", "source": "[29] Callim. Hy. 1.79-84", "date_added": "2026-10-12", "era": -270}, {"frm": "zeus", "to": "hephaestus", "type": "conflict", "title": "The thrown artificer", "essay": "Hephaestus attests his own dismissal from Olympus: defending his mother, he was caught by the foot and flung from the threshold, falling a whole day to Lemnos [1]. The father-discipline that later nails Prometheus to the Caucasus is documented first against the smith; the forge itself is royal property.", "source": "[1] Il. 1.590-594", "date_added": "2026-10-12", "era": -750}, {"frm": "hephaestus", "to": "athene", "type": "interaction", "title": "Co-proprietors of the crafts", "essay": "The Homeric Hymn yokes them as joint teachers: 'With bright-eyed Athene he taught men glorious gifts throughout the world' [30]. Plato's allegation that Prometheus burgled both their arts in one theft [27] here finds its sole Hesiodic-era anchor: metals and craft were already held as one shared office.", "source": "[30] Hy. 20.1-5", "date_added": "2026-10-12", "era": -700}, {"frm": "athene", "to": "erinyes", "type": "interaction", "title": "Wrath given an address", "essay": "The Furies are won by contract, not force: 'You are not dishonored... So yield to my counsel' [31]; the play closes with the escort to their sanctuary beneath the Areopagus, renamed from wrath to blessing in the translator's summary [31]. This is the reverse of the Metis edge: instead of enfolding danger, Athene seats it.", "source": "[31] Eum. 824-851, ending", "date_added": "2026-10-12", "era": -458}, {"frm": "zeus", "to": "erinyes", "type": "analogy", "title": "The keys, mentioned and set down", "essay": "ANALOGY: Athene's leverage over the Furies rests on invoking Zeus' arsenal she does not intend to use, since she 'alone of the gods know[s] the keys to the house where his thunderbolt is sealed... there is no need of that' [31]. Power held in escrow works harder than power used; note this as standing structure, not textual transmission.", "source": "[31] Eum. 824-851", "date_added": "2026-10-12", "era": -458}, {"frm": "hera", "to": "heracles", "type": "conflict", "title": "The madness that made the labors", "essay": "Hera's single attested act here has structural consequences: jealous madness, parricide-fire, exile, oracle, serfdom to Eurystheus, then the labors [32]. Everything heroic in the tradition is invoice for Hera's sabotage. Conflict edge; the conflict is unreciprocated in these texts, which is itself a finding.", "source": "[32] Bibl. 2.4.12", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "heracles", "type": "kinship", "title": "Licensed liberation", "essay": "The freeing of Prometheus happens under civic cover: Zeus wills it 'that the glory of Heracles the Theban-born might be yet greater than it was before' [26]. Even mercy is a glory-investment; the father's anger at Prometheus is reported retired on the strength of the son's fame.", "source": "[26] Th. 526-534", "date_added": "2026-10-12", "era": -750}, {"frm": "nithuths-queen", "to": "volundr", "type": "conflict", "title": "The eyes of snakes, the order given", "essay": "The initiative for the maiming is hers, delivered in two images that diagnose power in a look: serpent eyes and gnashing teeth suffice, so 'cut his sinews of strength, And set him then in Saevarstath' [24]. It is done at once by unnamed hands. Her diagnosis was correct; her prescription made it a self-fulfilling one.", "source": "[24] Vkv 17-18", "date_added": "2026-10-12", "era": 900}, {"frm": "nithuth", "to": "nithuths-queen", "type": "kinship", "title": "Her rings, his sword", "essay": "The spoil of the isle is divided along gendered lines: Nithuth wears the sword, the queen claims the ring of Bothvild's stolen troth [24]. In the Vengeful catalogue the pair appears only as recipients: gems 'to Nithuth's wife so wise he gave them' [24]. Domesticity here is a ledger-balancing.", "source": "[24] Vkv 18 (prose: \"The queen spake\")", "date_added": "2026-10-12", "era": 900}, {"frm": "nithuth", "to": "bothvild", "type": "kinship", "title": "The only daughter", "essay": "Volund's announcement fixes their kinship for him to exploit: brooch from her brothers' teeth, their shared daughter 'big with child' [24]. The poem names her only in speech by others until her lament; the witness writes this family as a set of delivery addresses.", "source": "[24] Vkv 38", "date_added": "2026-10-12", "era": 900}, {"frm": "volundr", "to": "bothvild", "type": "agency", "title": "Ring, isle, accusation", "essay": "Bothvild's only documented speech is an answer to a charge: 'An hour of lust, alas it should be!... Nor from his strength could I save myself' [24]. The tradition has often read the ring-trick as courtship gone wrong; the text gives coercion. Her bigger-with-child coda arrives from Volund's mouth [24], so even her fate is reported through her injurer.", "source": "[24] Vkv 42-43", "date_added": "2026-10-12", "era": 900}, {"frm": "apollo", "to": "asclepius", "type": "kinship", "title": "Off the pyre, to the centaur", "essay": "The healing line begins as salvage: the mother burns for her infidelity and the god cuts his unborn son from the fire, delivering him to Chiron for rearing [34]. The cult's founder is twice orphaned in a sentence: from his mother by death, from his father by delegation.", "source": "[34] Bibl. 3.10.3", "date_added": "2026-10-12", "era": 100}, {"frm": "zeus", "to": "asclepius", "type": "conflict", "title": "Thunderbolt against medicine", "essay": "Zeus' motive is given with rare candor: 'fearing that men might acquire the healing art from him and so come to the rescue of each other, smote him with a thunderbolt' [34]. Immortality is a moat, and Asclepius was bridging it. The conflict is between sovereignty and medicine, and sovereignty fires first.", "source": "[34] Bibl. 3.10.4", "date_added": "2026-10-12", "era": 100}, {"frm": "athene", "to": "asclepius", "type": "interaction", "title": "The Gorgon's two bloods", "essay": "Apollodorus records the healer's working capital as a gift from the goddess: 'he had received from Athena the blood that flowed from the veins of the Gorgon', bane from the left side, salvation from the right [34]. The same Athene whose workshop Prometheus burgled here donates the substance that raises the dead; her edges increasingly read as underwriting.", "source": "[34] Bibl. 3.10.3", "date_added": "2026-10-12", "era": 100}, {"frm": "chiron", "to": "achilles", "type": "transmission", "title": "Herbs up, spear down", "essay": "The centaur's two recorded smiles: he 'showed' the herbs to Achilles, and 'cut upon a mountain top... the ashen spear... given to Peleus, wherewith to deal out death among heroes' [1]. Both gifts are tools of war seen from the pharmacy; the double transmission (healing through Achilles, killing through Peleus) is the graph's cleanest surviving case of one node arming both the soldier and the surgeon.", "source": "[1] Il. 11.831; 16.143", "date_added": "2026-10-12", "era": -750}, {"frm": "podaleirius", "to": "eurypylus-telephid", "type": "interaction", "title": "The unavailable doctor", "essay": "Eurypylus' report names the crisis: one physician wounded, the other 'fighting the Trojans upon the plain' [1], so the patient must beg a non-physician (Patroclus) for herbs. Podaleirius' whole attested action at Troy is his absence from the wound that needs him; the text itself documents a failure of medical logistics.", "source": "[1] Il. 11.833-836", "date_added": "2026-10-12", "era": -750}, {"frm": "inana", "to": "lilith", "type": "interaction", "title": "The phantom maid expelled", "essay": "The earliest stratum of the Lilith-file anchors here: Inana's garden harbors 'the phantom maid built herself a dwelling' in the tree's trunk [17], and Gilgamec's clearing work drives her to the desolate places. No name is spoken; the label 'ki-sikil-lil-la' comes through this text's apparatus and our batch-2 reading of Isaiah [18]. ([17] GEN t.1.8.1.4, 123-135)", "source": "[17] GEN t.1.8.1.4, 123-135", "date_added": "2026-10-12", "era": -2000}, {"frm": "gilgamesh", "to": "enkidu", "type": "kinship", "title": "My walnut, my mallet", "essay": "Of all the ground this text covers, the edge of command is teaching: Gilgamec briefs his servant at length on how not to be recognized in the nether world [17]; the instruction fails in exactly the manner warned about; Utu's brotherly hole in the ground is what returns him [17]. The poem itself ties the bond to grief ('my beloved servant, my faithful companion, my counsellor') [17].", "source": "[17] GEN t.1.8.1.4, 176-183", "date_added": "2026-10-12", "era": -2000}, {"frm": "inana", "to": "gilgamesh", "type": "interaction", "title": "Pest control as office", "essay": "The throne-and-bed project cannot proceed while the tree is occupied, so the goddess applies to her brother-warrior, whose bronze axe settles the matter in one stanza [17]. The exchange is documented, not adoration: her relation to kingship seeds her authority pool. ([17] GEN t.1.8.1.4, 114-135)", "source": "[17] GEN t.1.8.1.4, 114-135", "date_added": "2026-10-12", "era": -2000}, {"frm": "lilith", "to": "methuselah", "type": "conflict", "title": "The demon-registry surrendered", "essay": "Methuselah's single legible exploit is conducted against Lilith's get: after three fast days he writes the Name on his sword and annihilates 'ninety-four myriads' at once [19]. The sword-grip is subcontracted omnipotence; that such a weapon exists is testimony from the demon side to the same night-economy she feeds on [19].", "source": "[19] Legends I ch.2 (Methuselah)", "date_added": "2026-10-12", "era": 900}, {"frm": "lilith", "to": "agrimus", "type": "kinship", "title": "First-born of the brood", "essay": "The demon's first-born negotiates the cease-fire and delivers the census of demons and imps to the enemy [19]. Kin only in the legend's manner of speaking; no generation ritual is shown. One line in Ginzberg, no location, no cult.", "source": "[19] Legends I ch.2", "date_added": "2026-10-12", "era": 900}, {"frm": "eve", "to": "agrimus", "type": "analogy", "title": "Label housekeeping", "essay": "Eve's 'angel of the Lord' exclamation [19] and Agrimus' census-handing [19] mark the two ends of the same story about paternity-contamination. No text in our corpus connects them; the link is structural (each ancestral mother gets a shadow sire), not transmission.", "source": "[19] Legends I ch.1-2", "date_added": "2026-10-12", "era": 900}, {"frm": "pwyll", "to": "arawn", "type": "interaction", "title": "The year of the semblance", "essay": "Pwyll borrows Arawn's body and court, kills Havgan with the single permitted blow, and returns; Arawn's offer 'by ridding me of this oppression... shalt thou gain my friendship' establishes the Otherworld's way of doing foreign policy: subcontracting [21]. Homage is rendered but no tribute is paid: Dyved's sovereignty exchanges straight for Annwvyn's favors.", "source": "[21] Pwyll, Prince of Dyved (Mab. I)", "date_added": "2026-10-12", "era": 1350}, {"frm": "teyrnon", "to": "pryderi", "type": "kinship", "title": "Fostered under the claw", "essay": "Teirnyon loses his mare's foals every May Eve; the year he keeps watch, he hacks off the monster's arm and picks up the royal child in the doorway [21]. He raises Gwri until the resemblance forces return, and the court names him Pryderi [21]. Fosterage is here logged as the tradition's highest office, all duty, no claim.", "source": "[21] Pwyll (Mab. I, end)", "date_added": "2026-10-12", "era": 1350}, {"frm": "llwyd", "to": "manawyddan", "type": "conflict", "title": "The mouse, ransomed", "essay": "Llwyd strips every field Manawyddan sows; Manawyddan answers by hanging one pregnant mouse and refusing three ransoms until the terms are read aloud [21]. Then Llwyd confesses and swears friendship: vengeance paid by the disclosure rather than the deed [21]. Vengeance is discharged by disclosure, enforcement by trade-settlement.", "source": "[21] Manawyddan (Mab. III)", "date_added": "2026-10-12", "era": 1350}, {"frm": "manawyddan", "to": "bran", "type": "kinship", "title": "Counsel at Harlech", "essay": "Bran's inventory of counsel begins with 'his brother Manawyddan the son of Llyr' sitting with him on the rock [21]; through the Irish catastrophe it is the brothers' counsel that holds the court. Manawyddan survives to bury him; the Second Branch's only living mourner figures in our corpus are his.", "source": "[21] Branwen (Mab. II)", "date_added": "2026-10-12", "era": 1350}], "sources": [{"id": 1, "url": "https://classics.mit.edu/Homer/iliad.mb.txt", "title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)"}, {"id": 2, "url": "https://classics.mit.edu/Plato/ion.html", "title": "Plato, Ion, trans. Jowett (MIT Classics)"}, {"id": 3, "url": "https://www.theoi.com/Text/Pausanias3B.html", "title": "Pausanias 3, trans. Jones 1918 (Loeb, via theoi.com)"}, {"id": 4, "url": "https://www.gutenberg.org/cache/epub/6341/pg6341.txt", "title": "Hoffmann, Nachtstücke 1816, Der Sandmann (Gutenberg #6341)"}, {"id": 5, "url": "https://archive.org/details/freud-1925-cp-5", "title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)"}, {"id": 6, "url": "http://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0010", "title": "Aeschylus, Prometheus Bound, trans. Smyth, Loeb 1926 (Perseus)"}, {"id": 7, "url": "https://en.wikisource.org/wiki/Protagoras_%28Jowett%29", "title": "Plato, Protagoras, trans. Jowett 1871 (Wikisource)"}, {"id": 8, "url": "https://archive.org/stream/the-question-concerning-technology-1/The%20Question%20Concerning%20Technology%20%281%29_djvu.txt", "title": "Heidegger, QCT, trans. Lovitt 1977 (IN COPYRIGHT; OCR for verification only)"}, {"id": 9, "url": "https://en.wikisource.org/wiki/The_works_of_Horace/Second_Book_of_Epistles", "title": "Horace, Epistles II, trans. C. Smart 1856 (Wikisource)"}, {"id": 10, "url": "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Censorinus/text*.html", "title": "Censorinus, De Die Natali ch.2-3, Latin (LacusCurtius)"}, {"id": 11, "url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5", "title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)"}, {"id": 12, "url": "https://en.wikisource.org/wiki/Page:Dictionary_of_Greek_and_Roman_Biography_and_Mythology_%281870%29_-_Volume_2.djvu/256", "title": "Smith, Dict. Greek & Roman Biography & Mythology 1870, s.v. Genius (Wikisource)"}, {"id": 13, "url": "https://www.newadvent.org/fathers/120107.htm", "title": "Augustine, City of God VII, trans. Dods (New Advent)"}, {"id": 14, "url": "https://www.perseus.tufts.edu/hopper/text?doc=Serv.+A.+5.85", "title": "Servius, In Vergilii Aeneida Commentarii, ed. Thilo & Hagen 1881 (Perseus)"}, {"id": 15, "url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt", "title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)"}, {"id": 16, "url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm", "title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)"}, {"id": 17, "url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm", "title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)"}, {"id": 18, "url": "https://www.gutenberg.org/cache/epub/10/pg10.txt", "title": "KJV Bible, Isaiah 34:14 (Gutenberg #10)"}, {"id": 19, "url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt", "title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)"}, {"id": 20, "url": "https://en.wikisource.org/wiki/Bible_%28Wycliffe%29/Isaiah", "title": "Wycliffe Bible, Isaiah 34 (Wikisource)"}, {"id": 21, "url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt", "title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)"}, {"id": 22, "url": "https://www.gutenberg.org/cache/epub/1666/pg1666.txt", "title": "Apuleius, Golden Asse, trans. Adlington 1566 (Gutenberg #1666)"}, {"id": 23, "url": "https://archive.org/download/religionofancien00macc/religionofancien00macc_djvu.txt", "title": "MacCulloch, Religion of the Ancient Celts 1911 (archive.org)"}, {"id": 24, "url": "https://archive.org/download/poeticedda00belluoft/poeticedda00belluoft_djvu.txt", "title": "Bellows, The Poetic Edda 1923, Volundarkvitha (archive.org)"}, {"id": 25, "url": "https://en.wikisource.org/wiki/The_Exeter_Book_%28manuscript_transcription%29/Deor", "title": "Deor, OE, Exeter Book ff.100r-100v (Wikisource)"}, {"id": 26, "url": "https://www.gutenberg.org/cache/epub/348/pg348.txt", "title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)"}, {"id": 27, "url": "https://classics.mit.edu/Plato/protagoras.html", "title": "Plato, Protagoras, trans. Jowett 1871 (MIT Classics)"}, {"id": 28, "url": "https://www.theoi.com/Text/Apollodorus1.html", "title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)"}, {"id": 29, "url": "https://www.theoi.com/Text/CallimachusHymns1.html", "title": "Callimachus, Hymn 1 to Zeus, trans. Mair 1921 (theoi.com)"}, {"id": 30, "url": "https://www.theoi.com/Text/HomericHymns3.html", "title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus"}, {"id": 31, "url": "https://www.theoi.com/Text/AeschylusEumenides.html", "title": "Aeschylus, Eumenides, trans. Smyth 1926 (theoi.com)"}, {"id": 32, "url": "https://www.theoi.com/Text/Apollodorus2.html", "title": "Pseudo-Apollodorus, Bibliotheca Book 2, trans. Frazer 1921 (theoi.com)"}, {"id": 33, "url": "https://en.wikisource.org/wiki/From_the_Founding_of_the_City/Book_3?action=raw", "title": "Livy, Ab Urbe Condita Book 3, trans. Canon Roberts 1905 (Wikisource raw)"}, {"id": 34, "url": "https://www.theoi.com/Text/Apollodorus3.html", "title": "Pseudo-Apollodorus, Bibliotheca Book 3, trans. Frazer 1921 (theoi.com)"}], "version": 5, "generated": "2026-10-12"}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = {}; DATA.nodes.forEach(n=>byId[n.id]=n);

/* ---------- edit tracking (localStorage v2) ---------- */
const LSKEY='highdrama_edits_v2';
let edits = JSON.parse(localStorage.getItem(LSKEY)||'[]');
let editMode=false;
const editStatus=document.getElementById('editStatus');
function showEditStatus(){ editStatus.textContent = edits.length? `${edits.length} local edit(s)` : ''; }
function applyEdits(){
  edits.forEach(e=>{
    if(e.kind==='node-essay' && byId[e.id]) byId[e.id].essay=e.new;
    if(e.kind==='edge-title'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.title=e.new;}
    if(e.kind==='edge-essay'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.essay=e.new;}
  });
  showEditStatus();
}
function record(kind, idOrEdge, oldVal, newVal){
  if(oldVal===newVal) return;
  const rec = Object.assign({kind, old:oldVal, new:newVal, ts:new Date().toISOString()}, idOrEdge);
  function kindrec(e){ return e.kind==='node-essay'? {id:e.id} : {frm:e.frm,to:e.to,type:e.type}; }
  const key = JSON.stringify([kind, idOrEdge]);
  const ix = edits.findIndex(e=>JSON.stringify([e.kind, kindrec(e)])===key);
  if(ix>=0){ rec.old = edits[ix].old; edits[ix]=rec; } else edits.push(rec);
  localStorage.setItem(LSKEY, JSON.stringify(edits));
  showEditStatus();
}

/* ---------- helpers ---------- */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return esc(t).replace(/\[(\d+)\]/g,(m,n)=>{
    const s=DATA.sources.find(s=>s.id==n);
    return s? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m;
  });
}
function fmtW(w){ if(!w) return '0 W';
  if(w>=1e12) return (w/1e12).toPrecision(3)+' TW'; if(w>=1e9) return (w/1e9).toPrecision(3)+' GW';
  if(w>=1e6) return (w/1e6).toPrecision(3)+' MW'; if(w>=1e3) return (w/1e3).toPrecision(3)+' kW';
  return Math.round(w)+' W'; }
function yearFmt(y){ return y<0? (-y)+' BCE' : y+' CE'; }

/* ---------- time model ---------- */
const ZMIN=-2100, ZMAX=2030, ZSPAN=320;
function zOf(era){ return ((era-ZMIN)/(ZMAX-ZMIN))*ZSPAN - ZSPAN/2; }
function currentT(){ return parseInt(document.getElementById('year').value,10); }
function edgeWeight(e,T){ if(e.era>T) return 0; return Math.exp(-(T-e.era)/250); }
function nodeCentrality(id,T){ let s=0; for(const e of DATA.edges){ if(e.frm===id||e.to===id) s+=edgeWeight(e,T); } return s; }
let sizeMode='centrality';
function nodeSize(n,T){
  if(sizeMode==='watts') return 1.8+1.5*Math.max(0,Math.log10(Math.max(n.pw_t,1)));
  return 3.0+3.4*Math.sqrt(nodeCentrality(n.id,T));
}

/* ---------- colors ---------- */
const PALETTE=['#7a4a1f','#3b6ea5','#5e7f3c','#8e3b46','#6a5a8e','#a5762b','#2f7d6d','#945e9a','#8c2f2f','#4c6b8a'];
function tradColor(t){ let h=0; for(const c of (t||'')) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

/* ---------- 3D graph ---------- */
let Graph=null, simReady=false;

function makeLabelSprite(text){
  const label = (text.length>24? text.slice(0,23)+'…':text);
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const font='44px Georgia, serif';
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(label).width)+16;
  cv.width=w; cv.height=64;
  ctx.font=font; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(43,38,32,0.92)';
  ctx.fillText(label,8,34);
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4; tex.minFilter=THREE.LinearFilter; tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const h=6; spr.scale.set(h*w/64, h, 1);
  return spr;
}

function styleNode(n,T){
  const g=n.__group; if(!g) return;
  const vis = n.era<=T;
  g.visible = vis;
  if(!vis) return;
  const s=nodeSize(n,T);
  n.__mesh.scale.setScalar(s);
  n.__sprite.position.set(0, s+3.2, 0);
}

function applyLinkStyles(){
  const T=currentT();
  // Re-apply style accessors with fresh closures: re-renders link visuals ONLY.
  // Does NOT touch graphData or the simulation, so engineRunning stays false
  // and tickFrame never calls layout.tick -> no race, no reheat, no pop-in.
  Graph.linkVisibility(l=> l.era<=T)
       .linkColor(l=>{ const w=edgeWeight(l,T); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
       .linkWidth(l=> 0.4+2.6*edgeWeight(l,T));
}

function applyTimeStyles(){
  if(!Graph) return;
  const T=currentT();
  Graph.graphData().nodes.forEach(n=>styleNode(n,T));  // engine nodes carry the meshes
  applyLinkStyles();
}

function initGraph(){
  const el=document.getElementById('graph');
  const T0=currentT();

  // Build data ONCE. z is pinned to era from the start (fz); x/y relax during warmup.
  const nodes = DATA.nodes.map(n=>Object.assign({}, n, {fz:zOf(n.era||0)}));
  const idset = new Set(nodes.map(n=>n.id));
  const links = DATA.edges
    .filter(e=>idset.has(e.frm)&&idset.has(e.to))
    .map(e=>({frm:e.frm,to:e.to,type:e.type,title:e.title,essay:e.essay,
              era:e.era,influence:e.influence, source:e.frm, target:e.to}));
  // parallel edges between the same directed pair get alternating curvature offsets
  const pairCount={}, pairSeen={};
  links.forEach(l=>{ const k=l.frm+'->'+l.to; pairCount[k]=(pairCount[k]||0)+1; });
  links.forEach(l=>{ const k=l.frm+'->'+l.to, n=pairCount[k];
    if(n>1){ const i=(pairSeen[k]=(pairSeen[k]||0)+1); l.curvature=((i%2)?1:-1)*Math.ceil(i/2)*0.28; }
    else l.curvature=0; });

  Graph = ForceGraph3D()(el)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#f6f1e7')
    .showNavInfo(false)
    .enableNodeDrag(false)
    .nodeThreeObject(n=>{
      const group=new THREE.Group();
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(1,16,12),
        new THREE.MeshLambertMaterial({color:tradColor(n.tradition)}));
      group.add(mesh);
      const sprite=makeLabelSprite(n.label);
      group.add(sprite);
      n.__group=group; n.__mesh=mesh; n.__sprite=sprite;
      styleNode(n, currentT());
      return group;
    })
    .nodeLabel(n=>`<div style="font-family:Georgia,serif">
        <b>${esc(n.label)}</b><br>${esc(n.tradition)}<br>
        attested ${yearFmt(n.era)} · ⚡ ${fmtW(n.pw_t)}</div>`)
    .linkColor(l=>{ const w=edgeWeight(l,currentT()); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
    .linkWidth(l=> 0.4+2.6*edgeWeight(l,currentT()))
    .linkVisibility(l=> l.era<=currentT())
    .linkCurvature(l=> l.curvature||0)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .warmupTicks(90)
    .cooldownTime(700)
    .d3AlphaMin(0.004)
    .onEngineStop(()=>{
      if(simReady) return;
      simReady=true;
      applyTimeStyles();
      Graph.zoomToFit(600, 60);
    })
    .onNodeClick(n=> openNode(n.id))
    .onLinkClick(l=>{ const e=DATA.edges.find(x=>x.frm===l.frm&&x.to===l.to&&x.type===l.type); if(e) openEdge(e); })
    .onNodeHover(n=>{ el.style.cursor=n?'pointer':'grab'; })
    .onLinkHover(l=>{ el.style.cursor=l?'pointer':'grab'; });

  Graph.d3Force('charge').strength(-120);
  // Set the full dataset LAST — library creates layout + starts/stops engine in one digest.
  Graph.graphData({nodes, links});

  window.addEventListener('resize', ()=>{
    Graph.width(el.clientWidth).height(el.clientHeight);
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const drawerBody=document.getElementById('drawerBody');
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
document.getElementById('drawerClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function openNode(id){
  const n=byId[id]; if(!n) return;
  const rel=DATA.edges.filter(e=>e.frm===id||e.to===id);
  drawerBody.innerHTML=`
    <div class="meta">batch ${n.batch} · added ${n.date_added} · ${esc(n.tradition)} · attested ${yearFmt(n.era)}</div>
    <h2>${esc(n.label)}</h2>
    <p class="meta" style="font-size:.86rem">⚡ commands ≈ <b>${fmtW(n.pw_t)}</b>
      (${fmtW(n.pw_d)} direct${n.pw_p?` + ${fmtW(n.pw_p)} by proxy`:''})${n.pw_pool?` · pool: ${esc(n.pw_pool)} × witness ${n.pw_ws}`:''}<br>
      <span class="hint">${n.pw_why?esc(n.pw_why):'No industry pool attributed; power flows to it, if at all, by proxy (see edges).'}
      Method: pool × claim-share × witness-strength; single-hop proxy routing.</span></p>
    <p id="essayNode" data-id="${esc(n.id)}">${linkify(n.essay)}</p>
    <h4>Documented interactions (${rel.length})</h4>
    ${rel.map(e=>{const other=e.frm===id?byId[e.to]:byId[e.frm];const dir=e.frm===id?'→':'←';
      return `<div class="edge"><div class="etype">${esc(e.type)}</div>
        <div class="t" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
        <div data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)} ${e.source?`<span class="hint">(${esc(e.source)})</span>`:''}</div>
        <div class="hint">${dir} ${other?esc(other.label):esc(e.frm===id?e.to:e.frm)}</div></div>`;}).join('')}
    <p class="hint">${editMode?'Edit mode ON: click the essay or any edge title/paragraph to correct the language.':'Toggle Edit to correct the language here.'}</p>`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

function openEdge(e){
  const a=byId[e.frm], b=byId[e.to];
  drawerBody.innerHTML=`
    <div class="meta">edge · added ${e.date_added} · attested ${yearFmt(e.era)}</div>
    <div class="etype">${esc(e.type)}</div>
    <h2>${esc(a?a.label:e.frm)} → ${esc(b?b.label:e.to)}</h2>
    <div class="t" style="font-size:1.12rem" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
    <p data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)}</p>
    ${e.source?`<p class="hint">Witness: ${esc(e.source)}</p>`:''}`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

/* ---------- contenteditable arming ---------- */
function armEditables(scope){
  scope.querySelectorAll('#essayNode').forEach(el=>{
    el.contentEditable=true; el.dataset.orig=byId[el.dataset.id].essay;
    el.onblur=()=>{ record('node-essay',{id:el.dataset.id},el.dataset.orig,el.innerText);
      byId[el.dataset.id].essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
  scope.querySelectorAll('[data-et]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.et.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.title;
    el.onblur=()=>{ record('edge-title',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.title=el.innerText; el.dataset.orig=el.innerText; };
  });
  scope.querySelectorAll('[data-ee]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.ee.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.essay;
    el.onblur=()=>{ record('edge-essay',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
}

/* ---------- toolbar wiring ---------- */
document.getElementById('editBtn').onclick=()=>{
  editMode=!editMode;
  const b=document.getElementById('editBtn'); b.textContent='Edit: '+(editMode?'on':'off'); b.classList.toggle('on',editMode);
  if(editMode) armEditables(drawerBody);
  else drawerBody.querySelectorAll('[contenteditable]').forEach(el=>el.contentEditable=false);
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({page:'High Drama — Spirit Graph', exported:new Date().toISOString(), edits},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='high-drama-edits.json'; a.click();
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Discard all your local edits?')){ edits=[]; localStorage.removeItem(LSKEY); location.reload(); }
};
document.getElementById('sizeBtn').onclick=()=>{
  sizeMode = sizeMode==='centrality' ? 'watts' : 'centrality';
  document.getElementById('sizeBtn').textContent='size: '+sizeMode;
  applyTimeStyles();
};

  // Retune forces for a given year: strong/fresh links bind tight, decayed ones stretch;
  // invisible (future) nodes carry no charge; z stays era-pinned.
  function retuneForces(T){
    if(!simReady) return;
    Graph.d3Force('link').distance(l=>24+150*(1-edgeWeight(l,T)))
                        .strength(l=>0.9*edgeWeight(l,T));
    Graph.d3Force('charge').strength(n=> (n.era<=T ? -120 : 0));
    Graph.d3ReheatSimulation();  // safe post-init: layout exists; this is the race-free path
  }

const yearEl=document.getElementById('year'), yearLabel=document.getElementById('yearLabel');
function retime(){
  const T=currentT();
  yearLabel.textContent=yearFmt(T);
  applyTimeStyles();           // visibility, sizes, link paint
  retuneForces(T);             // then let physics flow with the new weights
}
yearEl.addEventListener('input', retime);

let playing=false, playTimer=null;
document.getElementById('playBtn').onclick=()=>{
  const b=document.getElementById('playBtn');
  playing=!playing; b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing);
  if(playing){ playTimer=setInterval(()=>{
    let y=currentT()+10; if(y>2030){ y=-2100; }
    yearEl.value=y; retime();
  },200);} else clearInterval(playTimer);
};

/* search: focus camera on first matching visible node */
document.getElementById('q').addEventListener('change',()=>{
  if(!Graph) return;
  const q=document.getElementById('q').value.trim().toLowerCase(); if(!q) return;
  const gn=Graph.graphData().nodes.find(n=>n.label.toLowerCase().includes(q) && n.era<=currentT());
  if(gn && gn.x!=null){
    const d=120;
    Graph.cameraPosition({x:gn.x,y:gn.y,z:gn.z+d},{x:gn.x,y:gn.y,z:gn.z},900);
  }
});

/* ---------- boot ---------- */
applyEdits();
initGraph();
</script>
