adds Loki as of doubtful divinity. The fragmentary stanzas 31-34 have been regrouped in various ways, and with many conjectures as to omissions, none of which are indicated in the manuscript.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "galen", "label": "Galen", "tradition": "Greek physician of the empire, flesh record", "batch": 9, "date_added": "2026-10-12", "era": 170, "pw_d": 0.0, "pw_p": 1500000000.0, "pw_t": 1500000000.0, "pw_e": 113559666.64, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His apologetic is a defense of the oldest faculty in the register: 'Nature acts throughout in an artistic and equitable manner, having certain faculties' [53], and the lineage claimed explicitly: 'Hippocrates took the first-mentioned' road where nature is prior to the corpuscles [53]. Galen writes the professional genealogy backward into the divine one: against the atomists who dismember causation into particles, he files nature as the healer-craftsman whose command of substances is itself medical skill. The Asclepiadae line through Hippocrates becomes a reading of matter itself: every tissue that 'draws to itself the juice which is proper to it' [53] is performing the household economics of the healer's office.", "highlights": [{"text": "Nature acts throughout in an artistic and equitable manner, having certain faculties, by virtue of which each part of the body draws to itself the juice which is proper to it.", "source_id": 53, "source_title": "Galen, On the Natural Faculties, trans. Brock (MIT Classics)", "source_url": "https://classics.mit.edu/Galen/natfac.mb.txt"}], "proposals": [{"text": "1-9 are preserved by Diodorus Siculus iii. 66. 3; ll. 10-21 are extant only in M.] 2502 (return) [ Dionysus, after his untimely birth from Semele, was sewn into the thigh of Zeus.] 2503 (return) [ _sc_. In _Geoponica_ i. 14. 8 the living tortoise is prescribed as a charm to preserve vineyards from hail.]", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "His work, a mixture of history and geography, was used by Herodotus.] 1716 (return) [ The Hesiodic story of the daughters of Proetus can be reconstructed from these sources. They were sought in marriage by all the Greeks (Pauhellenes), but having offended Dionysus (or, according to Servius, Juno), were afflicted with a disease which destroyed their beauty (or were turned into cows). They were finally healed by Melampus.] 1717 (return) [ Fl. 56-88 A.D.: he is best known for his work on Vergil.] 1718 (return) [ This and the following fragment segment are meant to be read together.—DBK.] 1719 (return) [ This fragment as well as fragments #40A, #101, and #102 were added by Mr.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "HORATI FLACCI EPISTVLARVM LIBER SECVNDVS I", "source_title": "horace_epist2_latin.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "george-washington", "label": "George Washington", "tradition": "American national cult", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 180000000000.0, "pw_p": 0.0, "pw_t": 180000000000.0, "pw_e": 131458176663.585, "pw_pool": "P_nation", "pw_why": "State-commissioned national tutelary [16]; his biography industry was Weems [15]; the US national pool is the pool the name organizes.", "pw_ws": 1.0, "essay": "A tutelary manufactured in two steps, both documented. Step one is Weems' biography for 'young countrymen': the cherry-tree anecdote introduced as 'too true to be doubted; for it was communicated to me by the same excellent lady,' an unnamed informant who is the story's only authority [15]. Weems' Washington is explicitly 'the HERO, and the Demigod,' 'the jupiter Conservator,' 'Cincinnatus-like' at the plough, and a man whom 'the prayers of millions' would have made 'immortal on earth' [15]. The famous wording is not even his: he writes 'I can't tell a lie, Pa' [15]. Step two is architecture: Brumidi's 1865 Rotunda fresco, whose own title the Architect of the Capitol glosses as 'the raising of a person to the rank of a god,' with Washington 'rising to the heavens in glory' among Minerva, Neptune, Venus, Mercury, Vulcan, and Ceres [16]. A Roman genius loci commissioned by a legislature: the Servian structure executed with federal funds.", "highlights": [{"text": "It is too valuable to be lost, and too true to be doubted", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}, {"text": "only Wash- ington, the HERO, and the Demigod — Washington the sun-beam in council, or the storm in war", "source_id": 15, "source_title": "Weems, Life of George Washington (archive.org lifeofgeorgewash00weem2)", "source_url": "https://archive.org/download/lifeofgeorgewash00weem2/lifeofgeorgewash00weem2_djvu.txt"}, {"text": "Brumidi depicted George Washington rising to the heavens in glory, flanked by female figures representing Liberty and Victory/Fame", "source_id": 16, "source_title": "Architect of the Capitol, Apotheosis of Washington (Brumidi 1865)", "source_url": "http://aoc.gov/cc/art/rotunda/apotheosis/apoth_comm.cfm"}], "proposals": [{"text": "They will sigh for a change : and many of them already begin to talk of monarchy, without horror !\" In this, as in all cases of apprehended danger, his pen knew no rest. The leading characters of the nation were roused : and a coxvention was formed, of deputies from tiie several states, to revise and amend the general guveramsnt. Of this convoution Washington was unanimously chosen president. — Their session commenced in Philadelphia, May. 1 7S7, and ended in October.", "source_title": "weems-life-of-washington-1800s-archive-full.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "For besides all those inestimable favours which he received from her at the hands of her celestial daugh- ters, the Virtues; she threw over him her own magic mantle of Character. And it was this that immortal- ized Washington. How far this precious instinct in favour of goodness was correct, or how far Washington's conduct was honourable to Religion and glorious to himself and country, bright ages to come, and happy millions yet unborn, will, we confidently hope, declare to the most distant posterity.", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}, {"text": "For where is that pleasurable ingredient with which his cup was not full and over- flowing? Crowned with honours — laden with riches — blest with health — and in the joyous prime of 27, sharing each rural sweet in the society of a charming woman who doated on him, he surely bid fair to spend his days and nights of life in ceaseless pleasure. — But ah ! — as sings the sweet bard of Zion, Our days, alas ! our mortal days, Are short and wretchtd too ! \" Evil and few !\" the Patriarch says, \\nd well the Patriarch knew !", "source_title": "weems_life_of_washington_archive_org_1800_djvu.txt", "source_url": "", "cluster": "washington", "proposed": true}]}, {"id": "gilgamesh", "label": "Gilgamesh", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 125000000.0, "pw_t": 125000000.0, "pw_e": 462962.963, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Gilgamec appears in this Sumerian witness as exterminator and undertaker. Inana cries; her warrior-brother 'took his bronze axe used for expeditions, which weighs seven talents and seven minas', killed the snake immune to incantations at the tree's roots, scattered the Anzud brood into the mountains, and made the phantom maid flee [17]. Then comes the poem's pivot to mortality: his ball and mallet drop to the nether world, Enkidu goes down to fetch them and is seized [17], and the long interrogation returns its census of the dead, including the spirit 'who has no funerary offerings' who 'eats the scraps and the crumbs' [17]. In this telling the hero's power is not defiance of death; it is pest removal indoors plus a budget for funerary cult. When the fetchings end with his heart 'smitten' and his search for life just beginning [17], the transition is declared openly by the text itself.\n\nThe Old Babylonian version reframes him as the problem to be engineered against. The people of Erech, ground down by his tyranny, appeal upward, and 'Aruru upon hearing this created a man of Anu in her heart' [68]: Enkidu as counter-force, divinely tooled. By the Sumerian witness the character has already aged into its later weights, exterminator at the tree, bankrupt partner of death [17]; the Akkadian stratum keeps the fresher story: his excess calls the response into being.", "highlights": [{"text": "In its trunk, the phantom maid built herself a dwelling, the maid who laughs with a joyful heart.", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "\" 79-90. \"I, the woman, planted the tree with my feet, but not with my hands. I, { Inana } {( 1 ms. has instead: ) the woman}, watered it using my feet but not my hands. She said: \"When will this be a luxuriant chair on which I can take a seat?\" She said: \"When will this be a luxuriant bed on which I can lie down?\" Five years, 10 years had gone by, the tree had grown massive; its bark, however, did not split. At its roots, a s", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "1919) has been followed. (7^ INTRODUCTION. I. The Gilgamesh Epic is the most notable literary product of Baby- lonia as yet discovered in the mounds of Mesopotamia. It recounts the exploits and adventures of a favorite hero, and in its final form covers twelve tablets,", "source_id": 68, "source_title": "Jastrow & Clay, An Old Babylonian Version of the Gilgamesh Epic 1920 (archive.org)", "source_url": "https://archive.org/download/anoldbabylonian00claygoog/anoldbabylonian00claygoog_djvu.txt"}], "proposals": [{"text": "The lament of Guthrun (Kriemhild) is almost certainly among the oldest parts of the story. The lament was one of the earliest forms of poetry to develop among the Germanic peoples, and I suspect, though the matter is not susceptible of proof, that the lament of Sigurth's wife had assumed lyric form as early as the seventh century, and reached the North in that shape rather than in prose tradition (cf. We find traces of it in the seventeenth Aventiure of the Nibelungenlied, and In the poems of the Edda it dominates every appearance of Guthrun.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Se thou alle thingis, but ye telden not. Y made herd newe thyngis to thee fro that tyme, and thingis ben kept whiche thou knowist not; {{verse|chapter=48|verse=7}} now tho ben maad of nouyt, and not fro that tyme, and bifor the dai, and thou herdist not tho thingis; lest perauenture thou seie, Lo! Y knew tho thingis. {{verse|chapter=48|verse=8}} Nether thou herdist, nether thou knewist, nether thin eere was openyd fro that tyme; for Y woot, that thou trespassynge schal trespasse, and Y clepide thee a trespassour fro the wombe. {{verse|chapter=48|verse=9}} For my name Y schal make fer my strong veniaunce, and with my preysyng Y schal refreyne thee, lest thou perische. {{verse|chapter=48|verse=10}} Lo!", "source_title": "wycliffe-isaiah-wikisource.txt", "source_url": "", "cluster": "lilith", "proposed": true}, {"text": "{{verse|chapter=26|verse=7}} The weie of a iust man is riytful, the path of a iust man is riytful to go. {{verse|chapter=26|verse=8}} And in the weie of thi domes, Lord, we suffriden thee; thi name, and thi memorial is in desir of soule. {{verse|chapter=26|verse=9}} My soule schal desire thee in the niyt, but also with my spirit in myn entrails; fro the morewtid Y schal wake to thee. Therfor thou hast visityd, and hast al-to broke hem, and thou hast lost al the mynde of hem; and Lord, thou hast foryoue to a folc, {{verse|chapter=26|verse=15}} thou hast foryoue to a folc. Whether thou art glorified? thou hast maad fer fro thee all the endis of erthe. {{verse|chapter=26|verse=16}} Lord, in angwisch thei souyten thee; in the tribulacioun of grutchyng thi doctryn to hem. {{verse|chapter=26|verse=17}} As sche that conseyuede, whanne sche neiyeth sorewful to the child beryng, crieth in her sorewis, so we ben maad, Lord, of thi face.", "source_title": "wycliffe-isaiah-wikisource.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "gwawl", "label": "Gwawl", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Gwawl's one attested decision is category error: he asks Pwyll, who is bound by a feast-pledge, for 'the lady I love best', and Rhiannon's management converts it him into a badger. At the trap's spring she warns him first: 'bestow me upon him lest shame befall thee', said she, to keep the letter of Pwyll's word [21]; next scene, he is in the bag, struck by each entering knight, and must beg: 'Lord... I merit not to be slain in a bag' [21]. Llwyd later avenges 'the game of Badger in the Bag' [21]. The fetched tale keeps him as its investment folly: a man of great power and wealth spent in one ill-phrased petition. He is what the ballgame cost.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "And Gwydion went on before and proceeded to Mur y Castell. And when Blodeuwedd heard that he was coming, she took her maidens with her, and fled to the mountain. And they passed through the river Cynvael, and went towards a court that there was upon the mountain, and through fear they could not proceed except with their faces looking backwards, so that unawares they fell into the lake.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "pwyll-branch.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "hecate", "label": "Hecate", "tradition": "Greek crossroads goddess", "batch": 7, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 1500000000000.0, "pw_t": 1500000000000.0, "pw_e": 33870189958.061, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hesiod keeps her in his god-list as the one account Zeus did not restructure: 'she conceived and bare Hecate whom Zeus the son of Cronos honoured above all. He gave her splendid gifts, to have a share of the earth and the unfruitful sea... The son of Cronos did her no wrong nor took anything away of all that was her portion among the former Titan gods' [26]. The redistribution of the universe's shares stops at her file. Every other Titan-era portfolio got reassigned; hers was grandfathered in all three jurisdictions at once. The tradition's quiet point: even the revolution's winner found one incumbent it was cheaper to honor than to fight, and she holds the original deed.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}], "proposals": [{"text": "And the goddess did not disobey the message of Zeus; swiftly she rushed down from the peaks of Olympus and came to the plain of Rharus, rich, fertile corn-land once, but then in nowise fruitful, for it lay idle and utterly leafless, because the white grain was hidden by design of trim-ankled Demeter. But afterwards, as springtime waxed, it was soon to be waving with long ears of corn, and its rich furrows to be loaded with grain upon the ground, while others would already be bound in sheaves. There first she landed from the fruitless upper air: and glad were the goddesses to see each other and cheered in heart.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And as he promised, so he performed fully unto them all. But he himself mightily reigns and rules. (ll. 404-452) Again, Phoebe came to the desired embrace of Coeus. Then the goddess through the love of the god conceived and brought forth dark-gowned Leto, always mild, kind to men and to the deathless gods, mild from the beginning, gentlest in all Olympus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Hecate dicta est hekaton, id est centum, potestates habens. 'tonat' autem perite dixit; in aliquibus enim sacris imitabantur tonitrua, sed praecipue in Hecatae. aut 'tonat' clara voce et cum fiducia invocat. EREBUM inferorum profunditatem. [4.511] TERGEMINAMQUE HECATEN quidam Hecaten dictam esse tradunt, quod eadem et Diana sit et Proserpina, apo ton hekateron: vel quod Apollinis soror sit, qui est hekatebolos. sed secundum Hesiodum Hecate Persi Titanis et Asteriae filia est, Diana Iovis et Latonae, Persephone Iovis et Cereris, quam genealogiam posteriores confuderunt.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "hector", "label": "Hector", "tradition": "Greek epic, flesh-layer hero", "batch": 6, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "His signature line is a hygiene rule delivered to his mother: 'Honoured mother, bring no wine, lest you unman me and I forget my strength. I dare not make a drink-offering to Jove with unwashed hands; one who is bespattered with blood and filth may not pray to the son of Saturn' [1]. The defender of Troy keeps his own ritual accounting in the middle of a siege and declines even the wine that would hedge the price paid for the city. His arm is the city's load-bearing member and he knows it: his body is Troy's perimeter, and his refusal of the offering is the budget-consciousness of a man who cannot afford a cleaner night's sleep.\n\nThe Iliad writes him at the doorway as the war's civil price. To Andromache's pleading he answers the single most quoted order in the poem: 'Go, then, within the house, and busy yourself with your daily duties, your loom, your distaff, and the ordering of your servants; for war is man's matter, and mine above all others of them that have been born in Ilius' [1]. The poem's finest soldier orders his household to stand down and takes the job description himself; the war is 'man's matter', and his most of all. Vergil keeps the receipt. In Aeneas' dream the hero appears as casualty returns: 'When Hector's ghost before my sight appears: A bloody shroud he seem'd, and bath'd in tears', dragged body 'black with dust', so unlike the man 'who return'd from toils Of war, triumphant' [35]. The Roman founder's night is haunted by the defender he had to replace.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "Therefore she put strength into his knees and shoulders, and made him as bold as a fly, which, though driven off will yet come again and bite if it can, so dearly does it love man's blood- even so bold as this did she make him as he stood over Patroclus and threw his spear. Now there was among the Trojans a man named Podes, son of Eetion, who was both rich and valiant. Hector held him in the highest honour for he was his comrade and boon companion; the spear of Menelaus struck this man in the girdle just as he had turned in flight, and went right through him.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Yet, if I could find Ajax, the two of us would fight Hector and heaven too, if we might only save the body of Patroclus for Achilles son of Peleus. This, of many evils would be the least.\" While he was thus in two minds, the Trojans came up to him with Hector at their head; he therefore drew back and left the body, turning about like some bearded lion who is being chased by dogs and men from a stockyard with spears and hue and cry, whereon he is daunted and slinks sulkily off- even so did Menelaus son of Atreus turn and leave the body of Patroclus. When among the body of his men, he looked around for mighty Ajax son of Telamon, and presently saw him on the extreme left of the fight, cheering on his men and exhorting them to keep on fighting, for Phoebus Apollo had spread a great panic among them.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "When Jove, lord of the storm-cloud, saw Hector standing aloof and arming himself in the armour of the son of Peleus, he wagged his head and muttered to himself saying, \"A! poor wretch, you arm in the armour of a hero, before whom many another trembles, and you reck nothing of the doom that is already close upon you. You have killed his comrade so brave and strong, but it was not well that you should strip the armour from his head and shoulders. I do indeed endow you with great might now, but as against this you shall not return from battle to lay the armour of the son of Peleus before Andromache.\"", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "heimdall", "label": "Heimdall", "tradition": "Norse watchman", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The locational clue is a security deposit: 'She knows that Heimdall's horn is hidden under the heaven-bright holy tree. A river she sees flow, with foamy fall, from Valfather's pledge' [46]. The watchman's signal horn is buried at the foot of the world-tree, collateral in the same safe-deposit floor where Odin's pledged eye waters. Heimdall's asset is not the horn but the hearing; the Edda records that it can grass-growing hear, and stores the trumpet in a place no one can reach. The graph's model of sensor-network-as-god: the watchman whose deterrent is perfect and whose alarm has been prepaid in another god's body.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}], "proposals": [{"text": "Brisings' neck- lace: a marvelous necklace fashioned by the dwarfs, here called Brisings (i.e., \"Twiners\") ; cf. Lokasenna, 20 and note. [177] Poetic Edda 13. Then were the gods together met, And the goddesses came and council held, And the far-famed ones a plan would find.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Oaths, etc.: the gods, by violating their oaths to the giant who rebuilt Asgarth, aroused the undying hatred of the giants' race, and thus the giants were among their enemies in the final battle. 27. Here the Volva turns from her memories of the past to a statement of some of Othin's own secrets in his eternal search for knowledge (stanzas 27-29). The horn of Heimdall: the Gjallarhorn (\"Shrieking Horn\"), with which Heimdall, watchman of the gods, will summon them to the last battle.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "I remember yet the giants of yore, Who gave me bread in the days gone by ; Nine worlds I knew, the nine in the tree With mighty roots beneath the mold. 1. A few editors, following Bugge, in an effort to clarify the poem, place stanzas 22, 28 and 30 before stanzas 1-20, but the arrangement in both manuscripts, followed here, seems logical. In stanza i the Volva, or wise-woman, called upon by Othin, answers him and demands a hearing.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}]}, {"id": "hera", "label": "Hera", "tradition": "Greek epic", "batch": 3, "date_added": "2026-10-12", "era": -750, "pw_d": 0.0, "pw_p": 60000000000.0, "pw_t": 60000000000.0, "pw_e": 1263810179.645, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The wife at the top of the king-list is the tradition's first study in rival sovereignty. Hesiod closes Zeus' marriages with the politics of generation: 'Lastly, he made Hera his blooming wife: and she was joined in love with the king of gods and men, and brought forth Hebe and Ares and Eileithyia', and then records her answer to his head-birth of Athene: Hera, 'without union with Zeus' and 'very angry', 'quarrelled with her mate' and 'bare famous Hephaestus, who is skilled in crafts more than all the sons of Heaven' [26]. Motherhood as counter-stroke, in the poem of housekeeping at war which is the Iliad, becomes grand strategy. It is Hera who pities the dying Greeks and dispatches Athene to stay Achilles' hand: 'Juno has sent me, who cares for both of you alike' [1]. It is Hera who has sworn with Athene 'full many a time before all the immortals, that never would we shield Trojans from destruction, not even when all Troy is burning' [1], and who engineers the deception of Zeus in the fourteenth book, borrowing Aphrodite's own tackle: 'the curiously embroidered girdle into which all her charms had been wrought: love, desire, and that sweet flattery which steals the judgement even of the most prudent' [1]. The later mythographers only miniaturize the same character: Heracles 'was driven mad through the jealousy of Hera' and burned his own children [32]. Across the earliest witnesses she never wields a weapon and never needs one; her instruments are the aide, the alliance oath, the borrowed girdle, and the bedroom humiliation of the king. The Odyssey, which repatriates Greek husbands, has no work for her.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "Now it came to pass that after the battle with the Minyans Hercules was driven mad through the jealousy of Hera and flung his own children, whom he had by Megara, and two children of Iphicles into the fire 96 ; wherefore he condemned himself to exile, and was purified by Thespius, and repairing to Delphi he inquired of the god where he should dwell. 97 The Pythian priestess then first c", "source_id": 32, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 2, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus2.html"}], "proposals": [{"text": "Fragment #9—Pausanias, ii. 16. 4: The epic poem, which the Greek call the _Great Eoiae_, says that she (Mycene) was the daughter of Inachus and wife of Arestor: from her, then, it is said, the city received its name. Fragment #10—Pausanias, vi. 21. 10: According to the poem the _Great Eoiae_, these were killed by Oenomaus 2002: Alcathous the son of Porthaon next after Marmax, and after Alcathous, Euryalus, Eurymachus and Crotalus. The man killed next after them, Aerias, we should judge to have been a Lacedemonian and founder of Aeria.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "And the countless tribes of men built the whole temple of wrought stones, to be sung of for ever. (ll. 300-310) But near by was a sweet flowing spring, and there with his strong bow the lord, the son of Zeus, killed the bloated, great she-dragon, a fierce monster wont to do great mischief to men upon earth, to men themselves and to their thin-shanked sheep; for she was a very bloody plague. She it was who once received from gold-throned Hera and brought up fell, cruel Typhaon to be a plague to men. Once on a time Hera bare him because she was angry with father Zeus, when the Son of Cronos bare all-glorious Athena in his head.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "But Hera without union with Zeus—for she was very angry and quarrelled with her mate—bare famous Hephaestus, who is skilled in crafts more than all the sons of Heaven. (ll. 929a-929t) 1630 But Hera was very angry and quarrelled with her mate. And because of this strife she bare without union with Zeus who holds the aegis a glorious son, Hephaestus, who excelled all the sons of Heaven in crafts. But Zeus lay with the fair-cheeked daughter of Ocean and Tethys apart from Hera.... ((LACUNA)) ....deceiving Metis (Thought) although she was full wise.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "hippocrates", "label": "Hippocrates", "tradition": "Greek physician of record", "batch": 5, "date_added": "2026-10-12", "era": -400, "pw_d": 5000000000.0, "pw_p": 15000000000.0, "pw_t": 20000000000.0, "pw_e": 685379351.21, "pw_pool": "P_health", "pw_why": "Founder of the first billing discipline in medicine [42]; the Asclepiadae descent claim [3] makes the descent-line explicit rather than analogy.", "pw_ws": 1.0, "essay": "The Aphorisms open with the first limitation-of-liability clause in medicine: 'Life is short, and Art long; the crisis fleeting; experience perilous, and decision difficult' [42]. The physician who was flesh and billable drafts himself as the founder of a discipline whose first law is that it cannot promise. Our sources keep the descent public: his medical house claimed Asclepiadae descent, the healer clan of the hero-god [3][1]. Where Machaon binds wounds in the Iliad's line of battle, Hippocrates' corpus teaches that the art outlives the practitioner because the practitioner is mortal and the billing relationship is not. The health pool has a human signature now.", "highlights": [{"text": "Life is short, and Art long; the crisis fleeting; experience perilous, and decision difficult. The physician must not only be prepared to do what is right himself, but also to make the patient, the attendants, and externals cooperate.", "source_id": 42, "source_title": "Hippocrates, Aphorisms, trans. Adams (MIT Classics)", "source_url": "https://classics.mit.edu/Hippocrates/aphorisms.mb.txt"}, {"text": "Here in Gerenia is a tomb of Machaon, son of Asclepius, and a holy sanctuary. In his temple men may find cures for diseases. They call the holy spot Rhodos; there is a standing bronze statue of Machaon, with a crown on his head which the Messenians in the local speech call kiphos. The author of the epic", "source_id": 3, "source_title": "Pausanias 3, trans. Jones 1918 (Loeb, via theoi.com)", "source_url": "https://www.theoi.com/Text/Pausanias3B.html"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "proposals": [{"text": "//penelope.uchicago.edu/Thayer/F/Roman/Texts/Censorinus/text*.html#14.12) Denique Plato ille veniat, veteris philosophiae sanctissimus, qui quadrato numero annorum vitam humanam consummari putavit, sed novenario, qui conplet annos octoginta p21 et unum. Nam utrumque quidem supra dictum continet numerum, sed neutrum quadratum, et ut est ab utroque non alienus, ita in neutro potens.", "source_title": "censorinus-de-die-natali-latin-cholodniak-lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "He waived his right in order that the liberties of the people might gain what he surrendered of his power. ===34=== Whilst highest and lowest alike were enjoying their prompt and impartial administration of justice, as though delivered by an oracle, they were at the same time devoting their attention to the framing of the laws. These eagerly looked for laws were at length inscribed on ten tables which were exhibited in an Assembly specially convened for the purpose. After a prayer that their work might bring welfare and happiness to the State, to them and to their children, the decemvirs bade them go and read the laws which were exhibited.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "Diocles tamen Carystius et Aristoteles Stagirites aliter senserunt. Nono autem et decimo mense cum Chaldaei plurimi et idem supra mihi nominatus Aristoteles edi posse partum putaverint, neque Epigenes Byzantius non fieri posse contendit, p12 nec Hippocrates Cous decimo; ceterum undecimum mensem Aristoteles solus recipit, ceteri universi inprobarunt. ### VIII.", "source_title": "censorinus-de-die-natali-latin-cholodniak-lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "inana", "label": "Inana", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 1111111111.111, "pw_pool": "P_authority", "pw_why": "Owner of the halub-tree and its throne/bed claim [17]; Sumerian sovereignty-adjacent.", "pw_ws": 1.0, "essay": "The fetched witness is the first-person prologue so often elided: the goddess narrates in her own voice how she found the ḫalub tree after the flood-wind had stripped it, carried it to her garden in Unug, and planted it 'with my feet, not with my hands' [17]. Her whole action is prospective furnishing: 'When will this be a luxuriant chair on which I can take a seat? When will this be a luxuriant bed on which I can lie down?' [17]. She plans a throne and a bed counted in property terms; a decade later the tree is massive but unsurveyable, colonized at root, branch, and trunk by three squatters [17]. Her recourse is complaint: she cries to Utu and at last to Gilgamec, whose services she retains [17]. It is worth marking against the fear-intensive later goddess and against her sister of the nether world: power here is domestic ambition, thwarted, and crowdsourced. The garden tree episode is the graph's earliest attested case of sovereignty subcontracting pest control.\n\nIn the earliest Akkadian stratum of the Gilgamesh cycle her neighbor-claim is different: the crown she is attached to is the king's excess. When Erech labors under Gilgamesh's tyranny, the appeal goes to Aruru, and 'Aruru upon hearing this created a man of Anu in her heart' [68]. Enkidu enters the tradition as an engineered counterweight; by the Sumerian witness [17] Inana is the tree's proprietor hiring the strongman. The two strata keep her in the same posture toward the heroic economy: sponsor of its balances, not its deeds.", "highlights": [{"text": "In its trunk, the phantom maid built herself a dwelling, the maid who laughs with a joyful heart.", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "\" 79-90. \"I, the woman, planted the tree with my feet, but not with my hands. I, { Inana } {( 1 ms. has instead: ) the woman}, watered it using my feet but not my hands. She said: \"When will this be a luxuriant chair on which I can take a seat?\" She said: \"When will this be a luxuriant bed on which I can lie down?\" Five years, 10 years had gone by, the tree had grown massive; its bark, however, did not split. At its roots, a s", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "1919) has been followed. (7^ INTRODUCTION. I. The Gilgamesh Epic is the most notable literary product of Baby- lonia as yet discovered in the mounds of Mesopotamia. It recounts the exploits and adventures of a favorite hero, and in its final form covers twelve tablets,", "source_id": 68, "source_title": "Jastrow & Clay, An Old Babylonian Version of the Gilgamesh Epic 1920 (archive.org)", "source_url": "https://archive.org/download/anoldbabylonian00claygoog/anoldbabylonian00claygoog_djvu.txt"}], "proposals": [{"text": "Demons or giants or \\ monsters strive with gods in Hindu, Greek, and Teutonic 1 Larminie, \" Kian, son of Kontje.\" 2 See p. 78; LL 245b. 3 Mannhardt, Mythol. Forsch. 310 f. 4 \" Fir Domnann,\" \"men of Domna,\" a goddess (Khys, HL 597), or a god (D'Arbois, ii. 130). \" Domna\" is connected with Irish words meaning \" deep \" (Windisch, IT i. 498 ; Stokes, US 153).", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "\" But, 0 reader, this deed did not pass unpunished. \" 1 Of another bile, that of Borrisokane, it was said that any house in which a fragment of it was burned would itself be destroyed by fire.2 Tribal and personal names point to belief in descent from tree gods or spirits and perhaps to totemism. Though these names became conventional, they express what had once been a living belief.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Isaac, and Ishmael. 1:29 These are their generations: The firstborn of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam, 1:30 Mishma, and Dumah, Massa, Hadad, and Tema, 1:31 Jetur, Naphish, and Kedemah. These are the sons of Ishmael. 1:32 Now the sons of Keturah, Abraham’s concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan; Sheba, and Dedan. 1:33 And the sons of Midian; Ephah, and Epher, and Henoch, and Abida, and Eldaah.", "source_title": "kjv-isaiah-gutenberg.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "iopas", "label": "Iopas", "tradition": "Roman epic, court bard", "batch": 6, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "At Dido's banquet Vergil posts the one entertainment that matters to this graph: 'Iopas brought his golden lyre, and sung what ancient Atlas taught: the various labors of the wand'ring moon, and whence proceed the eclipses of the sun; th' original of men and beasts; and whence the rains arise, and fires their warmth dispense, and fix'd and erring stars dispose their influence' [35]. Atlas's stopped shoulder becomes curriculum. The bard at the queen's table transmits a Titan's burden as celestial mechanics; what the condemned god supports physically, the singer recites as physics. No one at the banquet appears to notice that the love-goddess is in the same register, rigging another landfall. The court hears cosmology while the machinery of lineage operates on the queen's lap.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "But, as you have shown your skill at other-times, so now also wheel the great black-maned horse Arion about every way, and help me as you may be able.’ (ll. 122-138) So he said, and put upon his legs greaves of shining bronze, the splendid gift of Hephaestus. Next he fastened about his breast a fine golden breast-plate, curiously wrought, which Pallas Athene the daughter of Zeus had given him when first he was about to set out upon his grievous labours. Over his shoulders the fierce warrior put the steel that saves men from doom, and across his breast he slung behind him a hollow quiver.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "TO HESTIA (ll. 1-5) Hestia, you who tend the holy house of the lord Apollo, the Far-shooter at goodly Pytho, with soft oil dripping ever from your locks, come now into this house, come, having one mind with Zeus the all-wise—draw near, and withal bestow grace upon my song. TO THE MUSES AND APOLLO (ll. 1-5) I will begin with the Muses and Apollo and Zeus. For it is through the Muses and Apollo that there are singers upon the earth and players upon the lyre; but kings are from Zeus.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "{{verse|chapter=31|verse=9}} and the strengthe of hym schal passe fro ferdfulnesse, and hise princes fleynge schulen drede.", "source_title": "wycliffe-isaiah-wikisource.txt", "source_url": "", "cluster": "lilith", "proposed": true}]}, {"id": "iris", "label": "Iris", "tradition": "Greek messenger", "batch": 5, "date_added": "2026-10-12", "era": -700, "pw_d": 0.0, "pw_p": 750000000000.0, "pw_t": 750000000000.0, "pw_e": 16935094979.031, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The delivery system of Olympus has a name and a route. Hesiod files her among the storm family: 'swift Iris' is born of Thaumas beside the Harpies who 'keep pace with the blasts of the winds' [26], and her job in the Theogony's own telling is procurement of the sovereign's signature liquid: 'Zeus sends Iris to bring in a golden jug the great oath of the gods' [26]. A messenger trusted exactly once per crisis, with the one container that can ruin a god. She has no pool of her own; her power is throughput, pure connectivity, the graph's first edge rendered as a goddess.\n\nIn the Iliad her delivery uniform is another person's body. She brings Zeus' bad news to the Trojan muster 'speaking with the voice of Priam's son Polites', comes to Helen 'in the form of her sister-in-law' Laodice, and pulls the wounded Aphrodite out of the press and begs Ares' horses for her [1]. The Odyssey does not speak her name once; in that poem the divine errands all run on Hermes. Between the two earliest epics her route is already fixed: the war-messenger, voice and face always borrowed, keeper only of the one errand Hesiod gives her, the oath-water run [26].", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}], "proposals": [{"text": "Meanwhile Juno called Apollo outside, with Iris the messenger of the gods. \"Jove,\" she said to them, \"desires you to go to him at once on Mt. Ida; when you have seen him you are to do as he may then bid you.\" Thereon Juno left them and resumed her seat inside, while Iris and Apollo made all haste on their way.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Then again the father sent forth all the blessed and eternal gods besides: and they came, one after the other, and kept calling her and offering many very beautiful gifts and whatever right she might be pleased to choose among the deathless gods. And Hermes obeyed, and leaving the house of Olympus, straightway sprang down with speed to the hidden places of the earth. And he found the lord Hades in his house seated upon a couch, and his shy mate with him, much reluctant, because she yearned for her mother.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "\"Am I really, Neptune, to take this daring and unyielding message to Jove, or will you reconsider your answer? Sensible people are open to argument, and you know that the Erinyes always range themselves on the side of the older person.\" Neptune answered, \"Goddess Iris, your words have been spoken in season. It is well when a messenger shows so much discretion.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "newton", "label": "Isaac Newton", "tradition": "Flesh record, Royal Society", "batch": 9, "date_added": "2026-10-12", "era": 1687, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Principia was kept almost tribally internal before publication: Halley 'entered on the register his notions about motion,' and De Motu 'was the germ of the Principia' [50], intended as a summary of the yet unwritten whole. The county-line between private reckoning and public law is the Register itself: the Royal Society's book where motion's theorems were deposited under a date. Pallas's pool extends to him by computation: Minerva does the wars of the mind [36] and the schoolmasters pay their pennies [36]; Newton is the tithe-collector's nightmare because the account is apparently recordable by anyone who can compute, yet produced by only one hand.", "highlights": [{"text": "This treatise De Motu was the germ of the Principia.", "source_id": 50, "source_title": "EB1911, \"Newton, Sir Isaac\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Newton,_Sir_Isaac"}, {"text": "Thyself dost see that fierce wars are waged by Minerva's hands. Is she for that the less at leisure for the liberal arts?", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}, {"text": "And spurn her not, ye schoolmasters, ye tribe too often cheated of your income, she attracts new pupils.", "source_id": 36, "source_title": "Ovid, Fasti Book 3, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti3.html"}], "proposals": [{"text": "Accius celebri gradu gressum adcelerate . [4.642] AT TREPIDA hoc est festina: nam moritura nihil timebat. TREPIDA] festina, id est occasione vix data. COEPTIS INMANIBUS EFFERA furiata saevis cogitationibus.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "This piece of cor- roborative evidence was given by the oldest inhabitant to Sir Arthur Mitchell.2 The people also spoke of the god Mourie. Other survivals of animal sacrifice are found in cases of cattle-plague, as in Morayshire sixty years ago, in Wales, Devon, and the Isle of Man. The victim was burned and its ashes sprinkled on the herd, or it was thrown into the sea or over a precipice.3 Perhaps it was both a propitiatory sacrifice and a scape-animal, carrying away the disease, though the rite may be connected with the former slaying of a divine animal whose death benefited all the cattle of the district.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Just as before they used to work together over the fire, so now they have jointly created the doll Olympia; the Professor is even called 1919 THE ‘ UNCANNY’ 385 We shall venture, therefore, to refer the uncanny effect of the Sand-Man to the child’s dread in relation to its castration-complex. But having gained the idea that we can take this infantile factor to account for feelings of uncanniness, we are drawn to examine whether we can apply it to other instances of uncanny things. We find in the story of the Sand-Man the other theme upon which Jentsch lays stress, of a doll that appears to be alive.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "joule", "label": "James Prescott Joule", "tradition": "Flesh record, brewing physics", "batch": 9, "date_added": "2026-10-12", "era": 1847, "pw_d": 0.0, "pw_p": 60000000000.0, "pw_t": 60000000000.0, "pw_e": 46778940111.892, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Joule spent his career re-running the same measurement until it satisfied the Association: asked to derive the mechanical equivalent of heat from electrical heating, 'this inquiry yielded (in 1867) the result 783,' his old friction method 'was repeated with every precaution, and again indicated 772.55 foot-pounds' [52]. Two numbers for the same conversion, and the discrepancy is the whole profession: the world will yield slightly different answers through different instruments, and the difference is published rather than hidden. The unit that prices steam tables and starship drives alike carries a man who never rounded off.", "highlights": [{"text": "This inquiry yielded (in 1867) the result 783... repeated with every precaution, and again indicated 772.55 foot-pounds.", "source_id": 52, "source_title": "EB1911, \"Joule, James Prescott\" (Wikisource)", "source_url": "https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Joule,_James_Prescott"}], "proposals": [{"text": "Secondly, one would like to hear more about the difference between the ‘ ceremonial ’ (purely formal, ritual, official) coitus performed on these occasions and ordinary sexual intercourse. The writers of such works as I could obtain were either too much ashamed to mention such things or else they again underestimated the psychological importance of these sexual details. It is to be hoped that the first-hand reports of travellers and missionaries may be fuller and less equivocal, but in view of the inaccessibility at the present time of publications of this nature,t which are mostly foreign, I cannot speak with any certainty upon the matter.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "This piece of cor- roborative evidence was given by the oldest inhabitant to Sir Arthur Mitchell.2 The people also spoke of the god Mourie. Other survivals of animal sacrifice are found in cases of cattle-plague, as in Morayshire sixty years ago, in Wales, Devon, and the Isle of Man. The victim was burned and its ashes sprinkled on the herd, or it was thrown into the sea or over a precipice.3 Perhaps it was both a propitiatory sacrifice and a scape-animal, carrying away the disease, though the rite may be connected with the former slaying of a divine animal whose death benefited all the cattle of the district.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "I the Biblical text of her uncanny nuptials. But with the sensitive intuition of a poet Hebbel probably divined the primordial theme that had been lost in the tendentious story, and only gave back to the con- tent its earlier currency. I will not touch Sadger’s explanation of why the widowed Judith of the Bible had to become a virgin widow.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "james-watt", "label": "James Watt", "tradition": "Soho manufactory, flesh record", "batch": 4, "date_added": "2026-10-12", "era": 1776, "pw_d": 200000000000.0, "pw_p": 240000000000.0, "pw_t": 440000000000.0, "pw_e": 310794842950.935, "pw_pool": "P_energy", "pw_why": "The SI unit of every pool in this graph is his name; the Soho works sold power itself as a commodity [39]. The man is the denomination of the modern fire economy Prometheus claims as mythic origin.", "pw_ws": 1.0, "essay": "The unit of this entire graph is his patronym. Boswell walked the Soho works in 1776 and recorded the proprietor's sales pitch in one sentence: 'I sell here, Sir, what all the world desires to have--POWER'; seven hundred people at work, the owner contemplated 'as an iron chieftain' who 'seemed to be a father to his tribe' [39]. The speaker at the bench was Boulton, but the power retailed was Watt's engine, and the transaction is the graph's thesis commercialized: what the Titan stole, the Soho partnership metered, priced, and shipped. Zeus chained his fire-thief to a rock; the Georgian fire-dealer patented his condenser and put the gods' forbidden commodity on a per-horsepower contract. Every watt in this graph's pools is denominated in his name, which makes him less a node in the mythology than the banknote in which the mythology now pays its bills.", "highlights": [{"text": "I shall never forget Mr. Bolton's expression to me: 'I sell here, Sir, what all the world desires to have--POWER.' He had about seven hundred people at work. I contemplated him as an iron chieftain, and he seemed to be a father to his tribe.", "source_id": 39, "source_title": "Boswell, Life of Johnson, Vol 2 (1776 Soho visit), Gutenberg #9072", "source_url": "https://www.gutenberg.org/cache/epub/9072/pg9072.txt"}], "proposals": [{"text": "In the reign of Servius Tullus, the Romans weighed their money before witnesses, in a bargain of buying and selling. When this custom was afterward changed, yet the same expression continued. To prevent the perpetual vexations of law-suits, the laws wisely established, that possession and enjoyment for a certain number of years should confirm a title and ascertain the property of an estate.", "source_title": "horace_epistles_smart_wikisource.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "The sun's warmth is challenged forth for heat, which in turn is ordered to deliver steam whose pressure turns the wheels that keep a factory running. The hydroelectric plant is set into the current of the Rhine. It sets the Rhine to supplying its hydraulic pressure, which then sets the turbines turning.", "source_title": "heidegger_qct_archive.txt", "source_url": "", "cluster": "prometheus", "proposed": true}, {"text": "The fact that it has been showing itself in the light of Ideas ever since the time of Plato, Plato did not bring about. The thinker only responded to what addressed itself to him. Only to the extent that man for his part is already challenged to exploit the energies of nature can this revealing that orders happen.", "source_title": "heidegger_qct_archive.txt", "source_url": "", "cluster": "prometheus", "proposed": true}]}, {"id": "janus", "label": "Janus", "tradition": "Roman threshold god", "batch": 5, "date_added": "2026-10-12", "era": -8, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Ovid's god answers the poet in propria persona, unmediated, staff in right hand, key in left: 'Whate'er you see- sky, sea, clouds, earth- all things are closed and opened by my hand. The guardianship of this vast universe is in my hands alone... I sit at heaven's gate with the gentle Hours; my office regulates the goings and the comings of Jupiter himself' [41]. The claim outranks the king upstairs: the being who lets Jupiter in and out of the room is older than the occupant, and says so. Rome put his month first for the same reason the graph's power model keys everything to sovereign order; every regime opens its account through the gate, and the gatekeeper predates the account.", "highlights": [{"text": "Whate'er you see- sky, sea, clouds, earth- all things are closed and opened by my hand. The guardianship of this vast universe is in my hands alone... I sit at heaven's gate with the gentle Hours; my office regulates the goings and the comings of Jupiter himself.", "source_id": 41, "source_title": "Ovid, Fasti Book 1, trans. Frazer 1931 (theoi.com)", "source_url": "https://www.theoi.com/Text/OvidFasti1.html"}], "proposals": [{"text": "[ Van Lennep explains that Hecate, having no brothers to support her claim, might have been slighted.] 1618 (return) [ The goddess of the _hearth_ (the Roman _Vesta_), and so of the house. Cp. _Homeric Hymns_ v.22 ff.; xxxix.1 ff.] 1619 (return) [ The variant reading ‘of his father’ (sc. Heaven) rests on inferior MS. authority and is probably an alteration due to the difficulty stated by a Scholiast: ‘How could Zeus, being not yet begotten, plot against his father?’ The phrase is, however, part of the prophecy.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": ": ^gir's use of gold to light his hall, which was often thought of as under the sea, was responsible for the phrase \"flame of the flood,\" and sundry kin- dred phrases, meaning \"gold.\" [ 153 ] Poetic Edda Bale and hatred I bring to the gods, And their mead with venom I mix.\" Eldir spake : 4. \"If in thou goest to iiEgir's hall, And fain the feast wouldst see, And with slander and spite wouldst sprinkle the gods, Think well lest they wipe it on thee,\" Loki spake: 5. \"Bethink thee, Eldir, if thou and I Shall strive with spiteful speech ; Richer I grow in ready words If thou speakest too much to me.\" Then Loki went into the hall, but when they who were there saw who had entered, they were all silent.", "source_title": "bellows-poetic-edda-1923-full.txt", "source_url": "", "cluster": "volundr", "proposed": true}, {"text": "Hom.: ‘He brought pure water and mixed it with Ocean’s streams.’ Fragment #9—Stephanus of Byzantium: ‘Aspledon and Clymenus and god-like Amphidocus.’ (sons of Orchomenus). Fragment #10—Scholiast on Pindar, Nem. iii. 64: ‘Telemon never sated with battle first brought light to our comrades by slaying blameless Melanippe, destroyer of men, own sister of the golden-girdled queen.’ THE HOMERIC HYMNS I.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "latinus", "label": "Latinus", "tradition": "Roman epic, pre-founder king", "batch": 6, "date_added": "2026-10-12", "era": -19, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Vergil gives him the longest track-record announcement of any minor king in epic: 'Latinus, old and mild, had long possess'd the Latin scepter... His father Faunus; a Laurentian dame his mother; fair Marica was her name. But Faunus came from Picus: Picus drew his birth from Saturn, if records be true' [35]. In four lines the scepter's chain of title runs king to faun to woodpecker-man to the Titan who ate his children. The 'if records be true' is not skepticism, it is the Roman office of records keeping its hand in the register. Latinus is the graph's demonstration that the founder myth requires not only a founder but a prior king with impeccable paperwork waiting to hand over the land.", "highlights": [{"text": "The realms of ocean and the fields of air are mine, not his. By fatal lot to me the liquid empire fell, and trident of the sea.", "source_id": 35, "source_title": "Vergil, Aeneid, trans. Dryden (MIT Classics)", "source_url": "https://classics.mit.edu/Virgil/aeneid.mb.txt"}], "proposals": [{"text": "As he did so, he cried aloud to the Trojans, \"Up, Trojans, break the wall of the Argives, and fling fire upon their ships.\" Thus did he hound them on, and in one body they rushed straight at the wall as he had bidden them, and scaled the battlements with sharp spears in their hands. Hector laid hold of a stone that lay just outside the gates and was thick at one end but pointed at the other; two of the best men in a town, as men now are, could hardly raise it from the ground and put it on to a waggon, but Hector lifted it quite easily by himself, for the son of scheming Saturn made it light for him. As a shepherd picks up a ram's fleece with one hand and finds it no burden, so easily did Hector lift the great stone and drive it right at the doors that closed the gates so strong and so firmly set.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "The Trojans and Achaeans were struck with awe as they beheld, and one would turn to his neighbour, saying, \"Either we shall again have war and din of combat, or Jove the lord of battle will now make peace between us.\" Thus did they converse. Then Minerva took the form of Laodocus, son of Antenor, and went through the ranks of the Trojans to find Pandarus, the redoubtable son of Lycaon. She found him standing among the stalwart heroes who had followed him from the banks of the Aesopus, so she went close up to him and said, \"Brave son of Lycaon, will you do as I tell you?", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Mesthles and Antiphus commanded the Meonians, sons of Talaemenes, born to him of the Gygaean lake. These led the Meonians, who dwelt under Mt. Nastes led the Carians, men of a strange speech.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "lilith", "label": "Lilith / phantom maid / lamia", "tradition": "Sumer→Hebrew→medieval Jewish", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 250000000.0, "pw_p": 0.0, "pw_t": 250000000.0, "pw_e": 925925.926, "pw_pool": "P_amulet", "pw_why": "Infant-protection economy literally documented as her price (amulet with three angel names) [19]; night-fear persists in Isaiah/Huluppu strata [17][18][20].", "pw_ws": 1.0, "essay": "Three strata, three different beings. The Sumerian witness is a squatter in Inana's halub-tree, 'the phantom maid ... the maid who laughs with a joyful heart,' who, when Gilgamesh clears the tree, 'left her dwelling and sought refuge in the wilderness' [17]. Isaiah names her once, in a ruin catalogue between satyrs and beasts; the KJV makes her a screech owl [18], while the Vulgate's lamia and Wycliffe's 'Lamya schal ligge there' [20] turn her into the Greco-Roman night-witch. Only the medieval Ben Sira satire gives her a will: a first wife who claims equality, pronounces the Name, flies to the Red Sea, refuses return, and takes revenge on infants [19]. The modern 'first feminist' figure is a selection from that satire, taking the claim and dropping the revenge. Before the satire she is a habitat: tree-trunk, wilderness, ruins by night.", "highlights": [{"text": "In its trunk, the phantom maid built herself a dwelling, the maid who laughs with a joyful heart.", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "\" 79-90. \"I, the woman, planted the tree with my feet, but not with my hands. I, { Inana } {( 1 ms. has instead: ) the woman}, watered it using my feet but not my hands. She said: \"When will this be a luxuriant chair on which I can take a seat?\" She said: \"When will this be a luxuriant bed on which I can lie down?\" Five years, 10 years had gone by, the tree had grown massive; its bark, however, did not split. At its roots, a s", "source_id": 17, "source_title": "ETCSL Gilgamesh Enkidu and the nether world (c.1.8.1.4)", "source_url": "http://etcsl.orinst.ox.ac.uk/section1/tr1814.htm"}, {"text": "screech owl also shall rest there, and find for herself a place of rest", "source_id": 18, "source_title": "KJV Bible, Isaiah 34:14 (Gutenberg #10)", "source_url": "https://www.gutenberg.org/cache/epub/10/pg10.txt"}, {"text": "Lamya schal ligge there, and foond rest there to hir silf", "source_id": 20, "source_title": "Wycliffe Bible, Isaiah 34 (Wikisource)", "source_url": "https://en.wikisource.org/wiki/Bible_%28Wycliffe%29/Isaiah"}, {"text": "To banish his loneliness, Lilith was first given to Adam as wife.", "source_id": 19, "source_title": "Ginzberg, Legends of the Jews vol 1 1909 (Gutenberg #1493)", "source_url": "https://www.gutenberg.org/cache/epub/1493/pg1493.txt"}], "proposals": [{"text": "I the Biblical text of her uncanny nuptials. But with the sensitive intuition of a poet Hebbel probably divined the primordial theme that had been lost in the tendentious story, and only gave back to the con- tent its earlier currency. I will not touch Sadger’s explanation of why the widowed Judith of the Bible had to become a virgin widow.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "When their father and mother beheld them weep and lament still, they doubled their sorrowes and griefes, but full of yre and forced with Envy, they tooke their voyage homeward, devising the slaughter and destruction of their sister. In the meane season the husband of Psyches did warne her againe in the night with these words: Seest thou not (quoth he) what perill and danger evill fortune doth threaten unto thee, whereof if thou take not good heed it will shortly come upon thee. For the unfaithfull harlots doe greatly endeavor to set their snares to catch thee, and their purpose is to make and perswade thee to behold my face, which if thou once fortune to see, as I have often told, thou shalt see no more.", "source_title": "apuleius-golden-ass-adlington-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "There seems to be a contradiction here; but perhaps it is only a complication, which may be helpful to us later on. Hoffmann is in literature the unrivalled master of conjuring up the uncanny. His Elixive des Teufels [The Devil’s Elixir] contains a mass of themes to which one is tempted to ascribe the uncanny effect of the narrative; but it is too obscure and intricate a story to venture to summarize.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "llwyd", "label": "Llwyd", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 225000000.0, "pw_t": 225000000.0, "pw_e": 87889227.371, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The purest revenge economics in the corpus: Llwyd the son of Kilcoed casts the charm over seven Cantrevs not for land but out of 'the friendship I had towards him [Gwawl]', and only stops when a hostage is the price of admission into narrative again. His weasel-army harvests wheat night by night, strand-like; when Manawyddan sets up a gallows for the pregnant mouse, the doubling clerk and the churl and the bishop arrive in sequence to redeem it [21]. Caught, his confession is the whole essay: 'To despoil thee... I cast the charm over the seven Cantrevs of Dyved... upon Pryderi did I revenge Gwawl the son of Clud, for the game of Badger in the Bag' [21]. He vanishes by treaty, not defeat: oaths for friendship-keeps. His power is gated entirely through enchantment-with-terms, and when it ends the land simply regrows.", "highlights": [{"text": "more he urged his horse, the further was she from him. Yet she rode not faster than before", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}, {"text": "comest thou?\" \"From Annwvyn,\" answered he; \"Arawn, a King of Annwvyn, {13} am I.\" \"Lord,\" said he, \"how may I gain thy friendship?\" \"After this manner mayest thou,\" he said. \"There is a man whose dominions are opposite to mine, who is ever warring against me, and he is Havgan, a King of Annwvyn, and by ridding me of this oppression which thou canst easily do shalt thou gain my friendship.\" \"Gladly will I do this,\" said he, \"show me how I may.\" \"I will show thee. Behold thus it is thou mayest. I will make firm f", "source_id": 21, "source_title": "Mabinogion vol 3, trans. Guest, ed. Edwards 1902 (Gutenberg #19976)", "source_url": "https://www.gutenberg.org/cache/epub/19976/pg19976.txt"}], "proposals": [{"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "His two brothers by the mother's side were the sons of Eurosswydd, by his mother, Penardun, {40} the daughter of Beli son of Manogan. And one of these youths was a good youth and of gentle nature, and would make peace between his kindred and cause his family to be friends when their wrath was at the highest; and this one was Nissyen; but the other would cause strife between his two brothers when they were most at peace. And as they sat thus, they beheld thirteen ships coming from the South of Ireland, and making towards them, and they came with a swift motion, the wind being behind them, and they neared them rapidly.", "source_title": "pwyll-branch.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Gwynedd, and Pryderi the son of Pwyll was lord over the one and twenty Cantrevs of the South; and these were the seven Cantrevs of Dyved, and the seven Cantrevs of Morganwc, the four Cantrevs of Ceredigiawn, and the three of Ystrad Tywi. At that time, Math the son of Mathonwy could not exist unless his feet were in the lap of a maiden, except only when he was prevented by the tumult of war. Now the maiden who was with him was Goewin, the daughter of Pebin of Dol Pebin, in Arvon, and she was the fairest maiden of her time who was known there.", "source_title": "guest-mabinogion-vol3-gutenberg.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "loki", "label": "Loki", "tradition": "Norse trickster", "batch": 7, "date_added": "2026-10-12", "era": 1100, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The Edda files him in the company with the one forecast he cannot script out of: 'The wolf will the father of men devour; him Vidar will avenge' [46], and the wolf is Loki's own. His function in the tradition is catalyst and debtor at once: he supplies the bridal veil-comedy's rescue and also the serpent-chain he ends up wearing. The god of cleverness is the one liability on the Aesir's books that cannot be provisioned against; his margin of usefulness is exactly the width of the last day.", "highlights": [{"text": "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völuspá, Hávamál, Vafþrúðnismál, Lokasenna, Gylfaginning; Gutenberg #14726)", "source_url": "https://www.gutenberg.org/cache/epub/14726/pg14726.txt"}, {"text": "Then comes the mighty son of Hlôdyn: (Odin's son goes with the monster to fight); Midgârd's Veor in his rage will slay the worm. Nine feet will go Fiörgyn's son, bowed by the serpent, who feared no foe.", "source_id": 46, "source_title": "Bellows, The Poetic Edda (Völu
