es.", "pw_ws": 1.0, "essay": "A tutelary manufactured in two steps, both documented. Step one is Weems' biography for 'young countrymen': the cherry-tree anecdote introduced as 'too true to be doubted; for it was communicated to me by the same excellent lady,' an unnamed informant who is the story's only authority [15]. Weems' Washington is explicitly 'the HERO, and the Demigod,' 'the jupiter Conservator,' 'Cincinnatus-like' at the plough, and a man whom 'the prayers of millions' would have made 'immortal on earth' [15]. The famous wording is not even his: he writes 'I can't tell a lie, Pa' [15]. Step two is architecture: Brumidi's 1865 Rotunda fresco, whose own title the Architect of the Capitol glosses as 'the raising of a person to the rank of a god,' with Washington 'rising to the heavens in glory' among Minerva, Neptune, Venus, Mercury, Vulcan, and Ceres [16]. A Roman genius loci commissioned by a legislature: the Servian structure executed with federal funds."}, {"id": "gilgamesh", "label": "Gilgamesh", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 0.0, "pw_p": 125000000.0, "pw_t": 125000000.0, "pw_e": 462962.963, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "gwawl", "label": "Gwawl", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "inana", "label": "Inana", "tradition": "Sumerian", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 1111111111.111, "pw_pool": "P_authority", "pw_why": "Owner of the halub-tree and its throne/bed claim [17]; Sumerian sovereignty-adjacent.", "pw_ws": 1.0, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "lilith", "label": "Lilith / phantom maid / lamia", "tradition": "Sumer→Hebrew→medieval Jewish", "batch": 2, "date_added": "2026-10-12", "era": -2000, "pw_d": 250000000.0, "pw_p": 0.0, "pw_t": 250000000.0, "pw_e": 925925.926, "pw_pool": "P_amulet", "pw_why": "Infant-protection economy literally documented as her price (amulet with three angel names) [19]; night-fear persists in Isaiah/Huluppu strata [17][18][20].", "pw_ws": 1.0, "essay": "Three strata, three different beings. The Sumerian witness is a squatter in Inana's halub-tree, 'the phantom maid ... the maid who laughs with a joyful heart,' who, when Gilgamesh clears the tree, 'left her dwelling and sought refuge in the wilderness' [17]. Isaiah names her once, in a ruin catalogue between satyrs and beasts; the KJV makes her a screech owl [18], while the Vulgate's lamia and Wycliffe's 'Lamya schal ligge there' [20] turn her into the Greco-Roman night-witch. Only the medieval Ben Sira satire gives her a will: a first wife who claims equality, pronounces the Name, flies to the Red Sea, refuses return, and takes revenge on infants [19]. The modern 'first feminist' figure is a selection from that satire, taking the claim and dropping the revenge. Before the satire she is a habitat: tree-trunk, wilderness, ruins by night."}, {"id": "llwyd", "label": "Llwyd", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 225000000.0, "pw_t": 225000000.0, "pw_e": 87889227.371, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "manawyddan", "label": "Manawyddan fab Llyr", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "mason-weems", "label": "Mason Locke Weems", "tradition": "American, 1800s biographer", "batch": 2, "date_added": "2026-10-12", "era": 1800, "pw_d": 0.0, "pw_p": 162000000000.0, "pw_t": 162000000000.0, "pw_e": 118312358997.226, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "methuselah", "label": "Methuselah", "tradition": "medieval Jewish aggadah", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "nithuths-queen", "label": "Nithuth's queen", "tradition": "Volundarkvitha", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "nithuth", "label": "Nithuth/Niðhad", "tradition": "Volundarkvitha/Deor", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 1000000000.0, "pw_p": 30000000000.0, "pw_t": 31000000000.0, "pw_e": 6476686140.449, "pw_pool": "P_military", "pw_why": "A king who commands force sufficient to maim an elf-smith [24]; pool share is a throne-share, small.", "pw_ws": 1.0, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "pryderi", "label": "Pryderi", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "pwyll", "label": "Pwyll", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "rhiannon", "label": "Rhiannon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 450000000.0, "pw_p": 0.0, "pw_t": 450000000.0, "pw_e": 175778454.742, "pw_pool": "P_horses", "pw_why": "Horse association is a penance in the primary witness [21] and the goddess claim scholarship [23]; the equine economy still runs under her modern name.", "pw_ws": 0.75, "essay": "The texts give a woman with full agency; the modern label gives a function. In the Pwyll branch she rides past pursuit-'the more he urged his horse, the further was she from him'-and halts only when spoken to, remarking 'it were better for thy horse hadst thou asked it long since' [21]. She engineers her own marriage, survives a false accusation and a horse-carrying penance at the gate [21], and in the Branwen branch her three birds sing the survivors of Ireland through seven years at Harlech [21]. The Manawyddan branch has Pryderi settle her on Manawyddan with the seven Cantrevs, after which Llwyd empties Dyfed in a fall of mist [21]. Nowhere is she called a goddess or given a horse attribute. The label 'Welsh horse goddess' rests on MacCulloch's Rigantona etymology ('we may postulate') [23] plus an analogy to the genuinely epigraphic Epona [23], whose rose-decked stable shrine Apuleius already attests [22]. The abstraction erases exactly what the primary witness supplies."}, {"id": "teyrnon", "label": "Teyrnon", "tradition": "Welsh, Mabinogi", "batch": 2, "date_added": "2026-10-12", "era": 1350, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Supporting figure. Registered because a primary narrative names them; no standalone essay yet. Their documented interactions are the edges below."}, {"id": "volundr", "label": "Volundr / Wayland / Velent", "tradition": "Germanic/Norse", "batch": 2, "date_added": "2026-10-12", "era": 900, "pw_d": 50000000000.0, "pw_p": 600000000.0, "pw_t": 50600000000.0, "pw_e": 10571623184.087, "pw_pool": "P_metals", "pw_why": "Smith-king of the Germanic tradition; revenge executed precisely through metalwork [24][25]; share small but the attribution is absolute within its domain.", "pw_ws": 1.0, "essay": "The tradition's actual figure is a revenge-tragedy protagonist. The queen reads the captive's nature at a glance-'The glow of his eyes is like gleaming snakes'-and prescribes the hamstringing that sets him on the island [24]. His reply is workshop horror: he smites the two princes, sets their skulls in silver for the king, fashions gems from their eyes for the queen, and a brooch from their teeth for Bothvild [24]. Bothvild comes with her broken ring; the beer out-sleeps her [24]; Deor reports in Old English that her brothers' death grieved her less than her own thing, 'that she was with child' [25]. Then the exit: 'Laughing Volund rose aloft, / Weeping Bothvild went from the isle' [24]. Bellows' note documents the legend's geography from Saxon regions into the North [24]. The softened craftsman of Scott and Kipling is not this figure; the softening deletes precisely what the witnesses keep."}], "edges": [{"frm": "asclepius", "to": "machaon", "type": "kinship", "title": "Sons of the healer", "essay": "The Catalogue identifies both brothers as 'the two sons of Aesculapius' [1]; the office descends as kinship before it appears as skill.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "podaleirius", "type": "kinship", "title": "The other healing son", "essay": "Podaleirius shares the Catalogue entry and the thirty ships [1]; Pausanias adds his separate landing at Syrnus [3]. He is Machaon's structural double across the same sources.", "source": "[1] Il. 2.731-732", "date_added": "2026-10-12", "era": 170}, {"frm": "chiron", "to": "asclepius", "type": "transmission", "title": "transmission", "essay": "craft lineage: 'soothing drugs which Chiron had given to Aesculapius'", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "asclepius", "to": "machaon", "type": "transmission", "title": "The trade descends with the bloodline", "essay": "Chiron's drugs pass from the centaur to Asclepius, and the Catalogue names the sons 'skilled in the art of healing' [1]. Machaon's clinic at Menelaus' wound applies the inherited line directly [1].", "source": "[1] Il. 4.218-219", "date_added": "2026-10-12", "era": -750}, {"frm": "paris-alexandrus", "to": "machaon", "type": "conflict", "title": "The arrow that priced a physician", "essay": "Alexandrus' triple-barbed arrow to the right shoulder triggers the Iliad's explicit value judgment: Idomeneus tells Nestor a physician is worth more than several other men [1], and the rescue sets Patroclus' errand in motion [1].", "source": "[1] Il. 11.506-520", "date_added": "2026-10-12", "era": -750}, {"frm": "nestor", "to": "machaon", "type": "interaction", "title": "The knight of Gerene, twice", "essay": "Nestor drives the wounded Machaon from the field in the poem [1], and Pausanias reports the same Nestor bringing the healer's bones home to Gerenia for cult [3]. The man who rescues the body becomes the guardian of the grave.", "source": "[1] Il. 11.596-604; [3] Paus. 3.26.10", "date_added": "2026-10-12", "era": 170}, {"frm": "eurypylus-telephid", "to": "machaon", "type": "conflict", "title": "The healer's killer, by report", "essay": "The Little Iliad tradition, preserved only through Pausanias, has Eurypylus son of Telephus kill Machaon [3]. A lost epic's claim reaching us through a traveler's report; flagged as such.", "source": "[3] Paus. 3.26.9-10", "date_added": "2026-10-12", "era": 170}, {"frm": "genius", "to": "lares-penates", "type": "comparison", "title": "Categories confounded, firm only in a dictionary", "essay": "Smith's 1870 dictionary keeps the boundary: genii produce life and attend it as a second self, while lares and penates operate after life begins; the same entry admits the terms are 'frequently confounded' [12]. The clean distinction is an antiquarian artifact.", "source": "[12] Smith s.v. Genius", "date_added": "2026-10-12", "era": 1870}, {"frm": "juno", "to": "genius", "type": "analogy", "title": "Every soul its own named god", "essay": "Pliny's skepticism documents the pairing: 'each individual makes a separate God for himself, adopting his own Juno and his own Genius' [11]. The female counterpart principle is attested but its doctrine is unstable across sources [12].", "source": "[11] Plin. NH 2.5", "date_added": "2026-10-12", "era": 1870}, {"frm": "silvanus", "to": "genius", "type": "interaction", "title": "One rustic altar, three recipients", "essay": "Horace's farmer atones Earth with a hog, Silvanus with milk, and 'with flowers and wine the genius that reminds us of our short life' [9]. The genius sits at the same field-table as the established gods, without ever receiving a myth.", "source": "[9] Horace Ep. 2.1.143-144", "date_added": "2026-10-12", "era": -20}, {"frm": "sandman", "to": "nathanael", "type": "conflict", "title": "The threat that never has to execute", "essay": "Coppelius cries for the eyes and the father buys them back; years later the cry 'Sköne Oke' from the crowd is enough to throw Nathanael from the tower [4]. No act is ever completed onstage; recurrence does all the work.", "source": "[4] Hoffmann, Der Sandmann", "date_added": "2026-10-12", "era": 1816}, {"frm": "olympia", "to": "nathanael", "type": "interaction", "title": "The dispute Freud overruled", "essay": "Jentsch located the tale's uncanny in Olympia's ambiguity, animate doll or living woman; Freud rejects that reading in favor of the eye-motif and castration economy [5]. The log flags the disagreement as unresolved rival readings, not a settled point.", "source": "[5] Freud CP IV, pp. 383-384", "date_added": "2026-10-12", "era": 1919}, {"frm": "sandman", "to": "genius", "type": "analogy", "title": "The companion who attends you to death", "essay": "Horace's genius 'dies with each individual' [9]; Hoffmann's phantom tracks one individual to his [4]. Structural analogy only: no document connects the Roman tutelary to the German nursery bogey.", "source": "log batch 1 connection map; [9], [5]", "date_added": "2026-10-11", "era": 1919}, {"frm": "prometheus", "to": "hephaestus", "type": "conflict", "title": "Theft from the craftsman", "essay": "Aeschylus names the stolen thing 'flashing fire, source of all arts' [6]; Plato specifies the burglarized workshops: 'the mechanical arts of Hephaestus and Athene, and fire with them' [7]. The giver to men begins as a thief among gods.", "source": "[7] Protagoras 321c-d; [6] PB 4-10", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "athene", "type": "conflict", "title": "Her arts, taken in the same burglary", "essay": "Plato's myth distributes the theft across two divine workshops; Athene's crafts pass to mortals through a crime committed by a Titan [7].", "source": "[7] Protagoras 321c-d", "date_added": "2026-10-12", "era": -380}, {"frm": "prometheus", "to": "zeus", "type": "conflict", "title": "The distribution and the penalty", "essay": "Prometheus' gift leaves man without political wisdom, 'for that was in the keeping of Zeus' [7], and the punishment plus the concession-'Skill is weaker by far than Necessity' [6]-frame the bond between giver and ruler.", "source": "[6] PB; [7] Protagoras", "date_added": "2026-10-12", "era": -380}, {"frm": "epimetheus", "to": "prometheus", "type": "kinship+interaction", "title": "The blunder that armed the theft", "essay": "Epimetheus exhausts the faculties on the animals, leaving man unprovided; Prometheus' theft follows from the blunder, and Plato notes he was 'prosecuted for theft, owing to the blunder of Epimetheus' [7].", "source": "[7] Protagoras 320c-321e", "date_added": "2026-10-12", "era": -380}, {"frm": "heracles", "to": "prometheus", "type": "interaction", "title": "Release, prophesied", "essay": "The tradition of eventual release by Heracles stands within the Prometheus Bound frame; the log records it as tradition-internal prophecy [6], with the release narrative itself not fetched as a separate witness.", "source": "[6] PB", "date_added": "2026-10-12", "era": -458}, {"frm": "gilgamesh", "to": "lilith", "type": "conflict", "title": "Dispossessed by the hero's axe", "essay": "When Gilgamesh kills the snake and the Anzud flees with its young, 'the phantom maid living in its trunk left her dwelling and sought refuge in the wilderness' [17]. Her only recorded act in Sumer is a retreat. The name-link to later Lilith is philology, flagged.", "source": "[17] lines 136-150 (philological linkage flagged)", "date_added": "2026-10-12", "era": -2000}, {"frm": "lilith", "to": "adam", "type": "interaction", "title": "The wife who chose the wilderness", "essay": "The Ben Sira narrative, via Ginzberg: created from the same dust, she claims equality as a matter of derivation, pronounces the Ineffable Name, and flies away; facing the angelic ultimatum she 'preferred this punishment to living with Adam' [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "eve", "to": "adam", "type": "kinship", "title": "The second fabrication", "essay": "In the same anthology's frame, Eve is formed from Adam's body on the principle that 'only when like is joined unto like the union is indissoluble' [19]. The replacement spouse replaces the rebel.", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "lilith", "to": "agrimus", "type": "kinship+conflict", "title": "The demon's mother, the demon's bargain", "essay": "Methuselah 'delivered the world from thousands of demons, the posterity of Adam which he had begotten with Lilith,' slaying myriads until Agrimus, their first-born, sued for terms and surrendered the demons' names [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "methuselah", "to": "agrimus", "type": "conflict", "title": "Ninety-four myriads per minute", "essay": "Ginzberg's Methuselah wields a sword inscribed with the Ineffable Name; the demon hierarchy capitulates, its kings are fettered, and the rest hide in the ocean's chambers [19].", "source": "[19]", "date_added": "2026-10-12", "era": 1909}, {"frm": "pwyll", "to": "rhiannon", "type": "interaction+marriage", "title": "The courtship no horse can win", "essay": "Three days of pursuit fail-'the more he urged his horse, the further was she from him'-until Pwyll speaks, and she answers that it would have been better for his horse had he asked sooner; she has come on her own quest to seek him [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "arawn", "to": "pwyll", "type": "interaction", "title": "A year in another man's shape", "essay": "Pwyll exchanges form and kingdom with Arawn of Annwfn, holds to the covenant including the marriage bed, and returns as both lord of Dyfed and Head of Annwfn [21]. The exchange is the branch's hinge and Rhiannon's entrance follows it.", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "gwawl", "to": "rhiannon", "type": "conflict", "title": "The suitor in the bag", "essay": "Gwawl claims by covenant what Pwyll rashly granted; Rhiannon's counter-counsel traps him in the small bag at the feast's tallies, and the badger-in-the-bag sport settles the wager [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "llwyd", "to": "rhiannon", "type": "conflict", "title": "A kingdom emptied for a wedding debt", "essay": "Llwyd's revenge for Gwawl arrives as mist over the Gorsedd of Narberth: when it lifts, Dyfed holds 'neither house, nor beast, nor smoke, nor fire, nor man, nor dwelling' [21]. The feud is inherited by Pryderi's marriage.", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "teyrnon", "to": "pryderi", "type": "interaction", "title": "The May-eve vigil", "essay": "Teyrnon watches his mare on the night her colts always vanish; he severs the claw that reaches through the window, pursues the wailing into the dark, and returns to find the newborn in satin at his door [21].", "source": "[21] Pwyll branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "pryderi", "type": "kinship", "title": "The mother who served the sentence", "essay": "Accused of destroying her newborn, Rhiannon lets the penance stand rather than press her own vindication, sitting at the horse-block and offering to carry guests into the palace, until the grown child's face settles the account [21].", "source": "[21]", "date_added": "2026-10-12", "era": 1350}, {"frm": "rhiannon", "to": "manawyddan", "type": "marriage", "title": "The widow held in the same trap", "essay": "Pryderi gives his mother to Manawyddan with the seven Cantrevs; the enchantment strips the land, and husband and wife are taken together in Llwyd's fortress until the one captured mouse is ransomed [21].", "source": "[21] Manawyddan branch", "date_added": "2026-10-12", "era": 1350}, {"frm": "bran", "to": "rhiannon", "type": "interactio <script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = {}; DATA.nodes.forEach(n=>byId[n.id]=n);

/* ---------- edit tracking (localStorage v2) ---------- */
const LSKEY='highdrama_edits_v2';
let edits = JSON.parse(localStorage.getItem(LSKEY)||'[]');
let editMode=false;
const editStatus=document.getElementById('editStatus');
function showEditStatus(){ editStatus.textContent = edits.length? `${edits.length} local edit(s)` : ''; }
function applyEdits(){
  edits.forEach(e=>{
    if(e.kind==='node-essay' && byId[e.id]) byId[e.id].essay=e.new;
    if(e.kind==='edge-title'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.title=e.new;}
    if(e.kind==='edge-essay'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.essay=e.new;}
  });
  showEditStatus();
}
function record(kind, idOrEdge, oldVal, newVal){
  if(oldVal===newVal) return;
  const rec = Object.assign({kind, old:oldVal, new:newVal, ts:new Date().toISOString()}, idOrEdge);
  function kindrec(e){ return e.kind==='node-essay'? {id:e.id} : {frm:e.frm,to:e.to,type:e.type}; }
  const key = JSON.stringify([kind, idOrEdge]);
  const ix = edits.findIndex(e=>JSON.stringify([e.kind, kindrec(e)])===key);
  if(ix>=0){ rec.old = edits[ix].old; edits[ix]=rec; } else edits.push(rec);
  localStorage.setItem(LSKEY, JSON.stringify(edits));
  showEditStatus();
}

/* ---------- helpers ---------- */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return esc(t).replace(/\[(\d+)\]/g,(m,n)=>{
    const s=DATA.sources.find(s=>s.id==n);
    return s? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m;
  });
}
function fmtW(w){ if(!w) return '0 W';
  if(w>=1e12) return (w/1e12).toPrecision(3)+' TW'; if(w>=1e9) return (w/1e9).toPrecision(3)+' GW';
  if(w>=1e6) return (w/1e6).toPrecision(3)+' MW'; if(w>=1e3) return (w/1e3).toPrecision(3)+' kW';
  return Math.round(w)+' W'; }
function yearFmt(y){ return y<0? (-y)+' BCE' : y+' CE'; }

/* ---------- time model ---------- */
const ZMIN=-2100, ZMAX=2030, ZSPAN=320;
function zOf(era){ return ((era-ZMIN)/(ZMAX-ZMIN))*ZSPAN - ZSPAN/2; }
function currentT(){ return parseInt(document.getElementById('year').value,10); }
function edgeWeight(e,T){ if(e.era>T) return 0; return Math.exp(-(T-e.era)/250); }
function nodeCentrality(id,T){ let s=0; for(const e of DATA.edges){ if(e.frm===id||e.to===id) s+=edgeWeight(e,T); } return s; }
let sizeMode='centrality';
function nodeSize(n,T){
  if(sizeMode==='watts') return 1.8+1.5*Math.max(0,Math.log10(Math.max(n.pw_t,1)));
  return 3.0+3.4*Math.sqrt(nodeCentrality(n.id,T));
}

/* ---------- colors ---------- */
const PALETTE=['#7a4a1f','#3b6ea5','#5e7f3c','#8e3b46','#6a5a8e','#a5762b','#2f7d6d','#945e9a','#8c2f2f','#4c6b8a'];
function tradColor(t){ let h=0; for(const c of (t||'')) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

/* ---------- 3D graph ---------- */
let Graph=null, simReady=false;

function makeLabelSprite(text){
  const label = (text.length>24? text.slice(0,23)+'…':text);
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const font='44px Georgia, serif';
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(label).width)+16;
  cv.width=w; cv.height=64;
  ctx.font=font; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(43,38,32,0.92)';
  ctx.fillText(label,8,34);
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4; tex.minFilter=THREE.LinearFilter; tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const h=6; spr.scale.set(h*w/64, h, 1);
  return spr;
}

function styleNode(n,T){
  const g=n.__group; if(!g) return;
  const vis = n.era<=T;
  g.visible = vis;
  if(!vis) return;
  const s=nodeSize(n,T);
  n.__mesh.scale.setScalar(s);
  n.__sprite.position.set(0, s+3.2, 0);
}

function applyLinkStyles(){
  const T=currentT();
  // Re-apply style accessors with fresh closures: re-renders link visuals ONLY.
  // Does NOT touch graphData or the simulation, so engineRunning stays false
  // and tickFrame never calls layout.tick -> no race, no reheat, no pop-in.
  Graph.linkVisibility(l=> l.era<=T)
       .linkColor(l=>{ const w=edgeWeight(l,T); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
       .linkWidth(l=> 0.4+2.6*edgeWeight(l,T));
}

function applyTimeStyles(){
  if(!Graph) return;
  const T=currentT();
  DATA.nodes.forEach(n=>styleNode(n,T));
  applyLinkStyles();
}

function initGraph(){
  const el=document.getElementById('graph');
  const T0=currentT();

  // Build data ONCE. z is pinned to era from the start (fz); x/y relax during warmup.
  const nodes = DATA.nodes.map(n=>Object.assign({}, n, {fz:zOf(n.era||0)}));
  const idset = new Set(nodes.map(n=>n.id));
  const links = DATA.edges
    .filter(e=>idset.has(e.frm)&&idset.has(e.to))
    .map(e=>({frm:e.frm,to:e.to,type:e.type,title:e.title,essay:e.essay,
              era:e.era,influence:e.influence, source:e.frm, target:e.to}));

  Graph = ForceGraph3D()(el)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#f6f1e7')
    .showNavInfo(false)
    .enableNodeDrag(false)
    .nodeThreeObject(n=>{
      const group=new THREE.Group();
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(1,16,12),
        new THREE.MeshLambertMaterial({color:tradColor(n.tradition)}));
      group.add(mesh);
      const sprite=makeLabelSprite(n.label);
      group.add(sprite);
      n.__group=group; n.__mesh=mesh; n.__sprite=sprite;
      styleNode(n, currentT());
      return group;
    })
    .nodeLabel(n=>`<div style="font-family:Georgia,serif">
        <b>${esc(n.label)}</b><br>${esc(n.tradition)}<br>
        attested ${yearFmt(n.era)} · ⚡ ${fmtW(n.pw_t)}</div>`)
    .linkColor(l=>{ const w=edgeWeight(l,currentT()); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
    .linkWidth(l=> 0.4+2.6*edgeWeight(l,currentT()))
    .linkVisibility(l=> l.era<=currentT())
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .warmupTicks(90)
    .cooldownTicks(0)
    .onEngineStop(()=>{
      if(simReady) return;
      simReady=true;
      // Pin x/y once settled (z already pinned). Positions never recompute afterward.
      Graph.graphData().nodes.forEach(n=>{ n.fx=n.x; n.fy=n.y; });
      applyTimeStyles();
      Graph.zoomToFit(600, 60);
    })
    .onNodeClick(n=> openNode(n.id))
    .onLinkClick(l=>{ const e=DATA.edges.find(x=>x.frm===l.frm&&x.to===l.to&&x.type===l.type); if(e) openEdge(e); })
    .onNodeHover(n=>{ el.style.cursor=n?'pointer':'grab'; })
    .onLinkHover(l=>{ el.style.cursor=l?'pointer':'grab'; });

  Graph.d3Force('charge').strength(-120);
  // Set the full dataset LAST — library creates layout + starts/stops engine in one digest.
  Graph.graphData({nodes, links});

  window.addEventListener('resize', ()=>{
    Graph.width(el.clientWidth).height(el.clientHeight);
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const drawerBody=document.getElementById('drawerBody');
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
document.getElementById('drawerClose').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function openNode(id){
  const n=byId[id]; if(!n) return;
  const rel=DATA.edges.filter(e=>e.frm===id||e.to===id);
  drawerBody.innerHTML=`
    <div class="meta">batch ${n.batch} · added ${n.date_added} · ${esc(n.tradition)} · attested ${yearFmt(n.era)}</div>
    <h2>${esc(n.label)}</h2>
    <p class="meta" style="font-size:.86rem">⚡ commands ≈ <b>${fmtW(n.pw_t)}</b>
      (${fmtW(n.pw_d)} direct${n.pw_p?` + ${fmtW(n.pw_p)} by proxy`:''})${n.pw_pool?` · pool: ${esc(n.pw_pool)} × witness ${n.pw_ws}`:''}<br>
      <span class="hint">${n.pw_why?esc(n.pw_why):'No industry pool attributed; power flows to it, if at all, by proxy (see edges).'}
      Method: pool × claim-share × witness-strength; single-hop proxy routing.</span></p>
    <p id="essayNode" data-id="${esc(n.id)}">${linkify(n.essay)}</p>
    <h4>Documented interactions (${rel.length})</h4>
    ${rel.map(e=>{const other=e.frm===id?byId[e.to]:byId[e.frm];const dir=e.frm===id?'→':'←';
      return `<div class="edge"><div class="etype">${esc(e.type)}</div>
        <div class="t" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
        <div data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)} ${e.source?`<span class="hint">(${esc(e.source)})</span>`:''}</div>
        <div class="hint">${dir} ${other?esc(other.label):esc(e.frm===id?e.to:e.frm)}</div></div>`;}).join('')}
    <p class="hint">${editMode?'Edit mode ON: click the essay or any edge title/paragraph to correct the language.':'Toggle Edit to correct the language here.'}</p>`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

function openEdge(e){
  const a=byId[e.frm], b=byId[e.to];
  drawerBody.innerHTML=`
    <div class="meta">edge · added ${e.date_added} · attested ${yearFmt(e.era)}</div>
    <div class="etype">${esc(e.type)}</div>
    <h2>${esc(a?a.label:e.frm)} → ${esc(b?b.label:e.to)}</h2>
    <div class="t" style="font-size:1.12rem" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
    <p data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)}</p>
    ${e.source?`<p class="hint">Witness: ${esc(e.source)}</p>`:''}`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

/* ---------- contenteditable arming ---------- */
function armEditables(scope){
  scope.querySelectorAll('#essayNode').forEach(el=>{
    el.contentEditable=true; el.dataset.orig=byId[el.dataset.id].essay;
    el.onblur=()=>{ record('node-essay',{id:el.dataset.id},el.dataset.orig,el.innerText);
      byId[el.dataset.id].essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
  scope.querySelectorAll('[data-et]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.et.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.title;
    el.onblur=()=>{ record('edge-title',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.title=el.innerText; el.dataset.orig=el.innerText; };
  });
  scope.querySelectorAll('[data-ee]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.ee.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.essay;
    el.onblur=()=>{ record('edge-essay',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
}

/* ---------- toolbar wiring ---------- */
document.getElementById('editBtn').onclick=()=>{
  editMode=!editMode;
  const b=document.getElementById('editBtn'); b.textContent='Edit: '+(editMode?'on':'off'); b.classList.toggle('on',editMode);
  if(editMode) armEditables(drawerBody);
  else drawerBody.querySelectorAll('[contenteditable]').forEach(el=>el.contentEditable=false);
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({page:'High Drama — Spirit Graph', exported:new Date().toISOString(), edits},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='high-drama-edits.json'; a.click();
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Discard all your local edits?')){ edits=[]; localStorage.removeItem(LSKEY); location.reload(); }
};
document.getElementById('sizeBtn').onclick=()=>{
  sizeMode = sizeMode==='centrality' ? 'watts' : 'centrality';
  document.getElementById('sizeBtn').textContent='size: '+sizeMode;
  applyTimeStyles();
};

const yearEl=document.getElementById('year'), yearLabel=document.getElementById('yearLabel');
yearEl.addEventListener('input',()=>{
  yearLabel.textContent=yearFmt(currentT());
  applyTimeStyles();           // restyle only — never rebuild, never reheat
});

let playing=false, playTimer=null;
document.getElementById('playBtn').onclick=()=>{
  const b=document.getElementById('playBtn');
  playing=!playing; b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing);
  if(playing){ playTimer=setInterval(()=>{
    let y=currentT()+10; if(y>2030){ y=-2100; }
    yearEl.value=y; yearLabel.textContent=yearFmt(y); applyTimeStyles();
  },200);} else clearInterval(playTimer);
};

/* search: focus camera on first matching visible node */
document.getElementById('q').addEventListener('change',()=>{
  if(!Graph) return;
  const q=document.getElementById('q').value.trim().toLowerCase(); if(!q) return;
  const gn=Graph.graphData().nodes.find(n=>n.label.toLowerCase().includes(q) && n.era<=currentT());
  if(gn && gn.x!=null){
    const d=120;
    Graph.cameraPosition({x:gn.x,y:gn.y,z:gn.z+d},{x:gn.x,y:gn.y,z:gn.z},900);
  }
});

/* ---------- boot ---------- */
applyEdits();
initGraph();
</script>
</body>
</html>
