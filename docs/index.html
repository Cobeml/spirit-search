<script id="data" type="application/json">{"nodes": [{"id": "asclepius", "label": "Asclepius", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 30000000000.0, "pw_p": 5000000000.0, "pw_t": 35000000000.0, "pw_e": 737222604.793, "pw_pool": "P_health", "pw_why": "Pandemic-scale healing cult of the ancient world; father-source of Machaon line [1][3]; Apollo/Asculapius branding persists on modern medicine.", "pw_ws": 1.0, "essay": "Born in fire and reared by a horse. Apollo 'killed Coronis. As she was burning, he snatched the babe from the pyre and brought it to Chiron, the centaur, by whom he was brought up and taught the arts of healing and hunting' [34]. The mythographer then states plainly what the cult had to believe: he 'not only prevented some from dying, but even raised up the dead', armed with the Gorgon's two bloods from Athena, one side bane, the other salvation [34], and the witnesses queue up their raised dead with bibliography: Capaneus, Hippolytus, Tyndareus, Hymenaeus, Glaucus, each tagged to Stesichorus or Panyasis or Melesagoras [34]. The punishment follows the same accounting: 'Zeus, fearing that men might acquire the healing art from him and so come to the rescue of each other, smote him with a thunderbolt' [34]. Behind all this the Iliad gives the office its catalogue price, sons who are 'skilled in the art of healing' leading thirty ships [1], and the Homeric Hymn reduces the god to his function, 'healer of sickness' [30]. His salience problem runs opposite Machaon's: the myth grew to violate the decree of death itself; what perished in the telling is the man.\n\nPindar's third Pythian, older than any other full account, prices the healer honestly. Asclepius is 'that gentle craftsman who drove pain from the limbs that he healed, that hero who cured all types of diseases', working his whole case list in turn, 'tending some of them with gentle incantations, others with soothing potions, or by wrapping remedies all around their limbs, and others he set right with surgery' [69]. Then the practice fails in the one direction it cannot be allowed to go: 'But even skill is enthralled by the love of gain. Gold shining in his hand turned even that man, for a handsome price, to bring back from death a man who was already caught. And so the son of Cronus hurled his shaft with his hands through both of them' [69]. The first documented medical fee is a resurrection fee, and the tradition's pricing is immediate: medicine may push the boundary of death only at the cost of the doctor.", "highlights": [{"text": "been before; but he killed Coronis. As she was burning, he snatched the babe from the pyre and brought it to Chiron, the centaur, 178 by whom he was brought up and taught the arts of healing and hunting. And having become a surgeon, and carried the art to a great pitch, he not only prevented some from dying, but even raised up the dead; for he had receiv", "source_id": 34, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 3, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus3.html"}, {"text": "up and taught the arts of healing and hunting. And having become a surgeon, and carried the art to a great pitch, he not only prevented some from dying, but even raised up the dead; for he had received from Athena the blood that flowed from the veins of the Gorgon, and while he used the blood that flowed from the veins on the left side for the bane of mankind, he used the blood that flowed from the right side for salvation, and by that mean", "source_id": 34, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 3, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus3.html"}, {"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "clear-voiced Muses, of Hephaestus famed for inventions. With bright-eyed Athene he taught men glorious gifts throughout the world, -- men who before used to dwell in caves in the mountains like wild beasts. But now that they have learned crafts through Hephaestus the famed worker, easily they live a peaceful life in their own houses the whole year round. Be gracious, Hephaestus, and", "source_id": 30, "source_title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus", "source_url": "https://www.theoi.com/Text/HomericHymns3.html"}], "proposals": [{"text": "Arctinus in the _Sack of Ilium_ seems to be of this opinion when he says: (ll. 1-8) ‘For their father the famous Earth-Shaker gave both of them gifts, making each more glorious than the other. To the one he gave hands more light to draw or cut out missiles from the flesh and to heal all kinds of wounds; but in the heart of the other he put full and perfect knowledge to tell hidden diseases and cure desperate sicknesses. It was he who first noticed Aias’ flashing eyes and clouded mind when he was enraged.’ Fragment #6—Diomedes in Gramm., Lat. i. 477: ‘Iambus stood a little while astride with foot advanced, that so his strained limbs might get power and have a show of ready strength.’ THE RETURNS", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "PANOS LYCAEI 'huius Panos' genetivus est Graecus, et 'Panos Lycaei' sic dictum est, ut 'Iovis Olympi', 'Apollinis Delphorum'.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": " . [3.129] PROAVOSQUE sane 'proavos' appellando cognationem declarat. [3.130] SURGENS flans, ut et fando surgentes demoror austros : econtra non flans ponens et residens dicitur, ut cum venti posuere omnisque repente resedit flatus . [3.131] ET TANDEM ad desiderium pertinet navigantum; nam sequitur 'ergo avidus muros'. CURETUM hi Curetes sunt primi cultores Cretae. alii tradunt Curetes et Corybantes, matris deum ministros, custodes sicut dictum est pueri Iovis, ad plurimas res maximi usus hominibus extitisse. GENTEM sociorum multitudinem, 'laetam' autem propter Pergama restituta.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "athene", "label": "Athene", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 100000000000.0, "pw_p": 0.0, "pw_t": 100000000000.0, "pw_e": 2106350299.408, "pw_pool": "P_metals", "pw_why": "Co-owner of the burgled crafts with Hephaestus [7].", "pw_ws": 1.0, "essay": "Athene's credentials in this corpus are all mechanisms of retention. Born through the skull of the father who ate her mother to prevent her birth [26], she surfaces 'arrayed in arms of war' and joins Hephaestus as co-teacher of the crafts that move men out of caves [30]; Plato credits half of Prometheus' burglary to her workshop [7][27]. Her own voice arrives only in the Eumenides, and it is the voice of an officeholder. Founding the Areopagus she addresses the city as an equal body at law: 'Hear now my ordinance, people of Attica, as you judge the first trial for bloodshed... this court of judges will always exist for the people of Aegeus' [31]. Her single great constitutional sentence follows: 'Neither anarchy nor tyranny--this I counsel my citizens to support and respect, and not to drive fear wholly out of the city' [31]. And facing down the Furies she reveals her reserve account: 'I alone of the gods know the keys to the house where his thunderbolt is sealed. But there is no need of that. So yield to my counsel' [31]. Threat, in her register, is a tool of last resort precisely because it is banked. Zeus rules by holding power; Athene by knowing where it is locked.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "clear-voiced Muses, of Hephaestus famed for inventions. With bright-eyed Athene he taught men glorious gifts throughout the world, -- men who before used to dwell in caves in the mountains like wild beasts. But now that they have learned crafts through Hephaestus the famed worker, easily they live a peaceful life in their own houses the whole year round. Be gracious, Hephaestus, and", "source_id": 30, "source_title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus", "source_url": "https://www.theoi.com/Text/HomericHymns3.html"}, {"text": "against Jove. Once before when I was trying to help you, he caught me by the foot and flung me from the heavenly threshold. All day long from morn till eve, was I falling, till at sunset I came to ground in the island of Lemnos, and there I lay, with very little life left in me, till the Sintians came and tended me.\" Juno smiled at this, and as she smiled she took the cup from her son's hands. Then Vulcan drew swe", "source_id": 30, "source_title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus", "source_url": "https://www.theoi.com/Text/HomericHymns3.html"}, {"text": "Prometheus, not knowing how he could devise his salvation, stole the mechanical arts of Hephaestus and Athene, and fire with them (they could neither have been acquired nor used without fire), and gave them to man. Thus man had the wisdom necessary to the support of life, but political wisdom he had not; for that was in the keeping of Zeus, and the power of", "source_id": 7, "source_title": "Plato, Protagoras, trans. Jowett 1871 (Wikisource)", "source_url": "https://en.wikisource.org/wiki/Protagoras_%28Jowett%29"}], "proposals": [{"text": "But Hera without union with Zeus—for she was very angry and quarrelled with her mate—bare famous Hephaestus, who is skilled in crafts more than all the sons of Heaven. (ll. 929a-929t) 1630 But Hera was very angry and quarrelled with her mate. And because of this strife she bare without union with Zeus who holds the aegis a glorious son, Hephaestus, who excelled all the sons of Heaven in crafts. But Zeus lay with the fair-cheeked daughter of Ocean and Tethys apart from Hera.... ((LACUNA)) ....deceiving Metis (Thought) although she was full wise.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "He hid fire; but that the noble son of Iapetus stole again for men from Zeus the counsellor in a hollow fennel-stalk, so that Zeus who delights in thunder did not see it. But afterwards Zeus who gathers the clouds said to him in anger: (ll. 54-59) ‘Son of Iapetus, surpassing all in cunning, you are glad that you have outwitted me and stolen fire—a great plague to you yourself and to men that shall be. But I will give men as the price for fire an evil thing in which they may all be glad of heart while they embrace their own destruction.’ (ll. 60-68) So said the father of men and gods, and laughed aloud.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "For he has finished his great works and lives amongst the undying gods, untroubled and unageing all his days. (ll. 956-962) And Perseis, the daughter of Ocean, bare to unwearying Helios Circe and Aeetes the king. And Aeetes, the son of Helios who shows light to men, took to wife fair-cheeked Idyia, daughter of Ocean the perfect stream, by the will of the gods: and she was subject to him in love through golden Aphrodite and bare him neat-ankled Medea. (ll. 963-968) And now farewell, you dwellers on Olympus and you islands and continents and thou briny sea within.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "chiron", "label": "Chiron", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 24000000000.0, "pw_t": 24000000000.0, "pw_e": 505524071.858, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The centaur enters the poem by inventory. When Menelaus is wounded under the truce, Machaon draws the arrow and applies 'soothing drugs which Chiron had given to Aesculapius out of the good will he bore him' [1]. When Eurypylus is hit, he begs for the herbs 'shown you by Achilles, who was himself shown them by Chiron, most righteous of all the centaurs' [1]. And the spear none but Achilles can lift is 'the ashen spear from Mount Pelion, which Chiron had cut upon a mountain top and had given to Peleus, wherewith to deal out death among heroes' [1]. the Iliad's only centaur is thus an ontological anomaly, the just beast, dispenser of salves and a murderous spear, teacher of the art of healing by way of Apollo's orphan and Achilles both. Apollodorus documents his birth as a kidding: 'to Cronus and Philyra was born Chiron, a centaur of double form' [28], and his rearing of Asclepius as a foster-parentage purchased with the boy's mother's pyre [34]. He commands nothing and is commanded by nothing in these witnesses; power routes through him because the tradition made him its courier between gods and men.\n\nThe naming of him in Homer is already a citation: the wound-herbs come 'by Achilles, who was himself shown them by Chiron, most righteous of all the centaurs' [1]. Most righteous of the centaurs: the Iliad grants the exemption in a comparative clause, as if the violence of the kind were the known quantity and Chiron the documented exception.\n\nPindar keeps the wish simple: 'I would want Cheiron the son of Philyra to be alive again', the beast of the wilds 'whose mind was friendly to men', since with him alive 'I would have persuaded him to send even now a healer to cure noble men of their feverish diseases' [69]. The centaur's obituary is a staffing gap; the tradition measures his goodness by the clinic that could no longer be staffed after him.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "; [1.2.3] to Iapetus and Asia was born Atlas, who has the sky on his shoulders, and Prometheus, and Epimetheus, and Menoetius, he whom Zeus in the battle with the Titans smote with a thunderbolt and hurled down to Tartarus. 22 [1.2.4] And to Cronus and Philyra was born Chiron, a centaur of double form 23 ; an", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "4 [1.7.2] And Prometheus had a son Deucalion. 105 He reigning in the regions about Phthia, married Pyrrha, the daughter of Epimetheus and Pandora, the first woman fashioned by the gods. 106 And when Zeus would destroy the men of the Bronze Age, Deucalion by the advice of Prometheus constructed a chest, 107 and having stored it with provisions he em", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}, {"text": "been before; but he killed Coronis. As she was burning, he snatched the babe from the pyre and brought it to Chiron, the centaur, 178 by whom he was brought up and taught the arts of healing and hunting. And having become a surgeon, and carried the art to a great pitch, he not only prevented some from dying, but even raised up the dead; for he had receiv", "source_id": 34, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 3, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus3.html"}], "proposals": [{"text": "OF CHIRON THE GREAT WORKS THE IDAEAN DACTYLS THE THEOGONY THE CATALOGUES OF WOMEN AND EOIAE THE SHIELD OF HERACLES THE MARRIAGE OF CEYX THE GREAT EOIAE THE MELAMPODIA THE AEGIMIUS FRAGMENTS OF UNKNOWN POSITION DOUBTFUL FRAGMENTS THE HOMERIC HYMNS I. Homer: _The Homeric Hymns_, _The Epigrams of Homer_ (both attributed to Homer).", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "](https://penelope.uchicago.edu/Thayer/Images/Utility/Flags/link/France.gif)](https://penelope.uchicago.edu/Thayer/F/Roman/Texts/Censorinus/text*.html#20.2) De quibus omnibus disserere quoniam longum est, ad Romanorum annum transibimus.", "source_title": "censorinus-de-die-natali-latin-cholodniak-lacuscurtius.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "DESPECTARE id est electas iam intentius despicere. [1.397] STRIDENTIBUS ALIS signum augurii est.", "source_title": "serviusaeneid.txt", "source_url": "", "cluster": "genius", "proposed": true}]}, {"id": "epimetheus", "label": "Epimetheus", "tradition": "Greek myth", "batch": 1, "date_added": "2026-10-11", "era": -380, "pw_d": 0.0, "pw_p": 4800000000000.0, "pw_t": 4800000000000.0, "pw_e": 169129968346.298, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Hindsight walks with foresight, and is the smaller brother. Hesiod names him once in the Theogony genealogy and gives him no deeds but one epithet, 'scatter-brained Epimetheus', and one disaster: it was he who first took from Zeus the woman the Father had had formed [26]. Works and Days fills in the mechanism. Hermes brings the snare to his door, and Epimetheus does not remember what Prometheus told him; he took the gift, and only afterwards, when the evil was already his, understood [26]. The mischief of the text is temporal, not moral: the warning existed, spoken in advance, and was useless to a mind that only reads backward. Plato then promotes him from fool to author of the human condition. In Protagoras' myth Epimetheus claims the office of distribution and spends the whole inventory of qualities on the beasts; when he comes to man nothing is left [27]. Fire, in Plato, is not Prometheus' rebellion but his brother's railway accounting: Prometheus 'is said to have been afterwards prosecuted for theft, owing to the blunder of Epimetheus' [27]. Apollodorus writes the family's aftermath: Pyrrha, daughter of Epimetheus and Pandora, marries Prometheus' son Deucalion, and the two survivors of the flood that ends the Bronze Age re-people the world by throwing stones [28]. Even here Epimetheus fathers only continuity. One contradiction in the witnesses is worth keeping visible: Hesiod makes his mother Clymene daughter of Ocean, while Apollodorus names Asia [26][28]; the genealogy itself is unstable, as if the tradition could not be bothered to give the after-thinker a fixed mother. What Epimetheus commands is the structure of every misallocation discovered too late: the gods' gift is real power, and the instruction manual arrives after the damage.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "severally their proper qualities. Epimetheus said to Prometheus: \"Let me distribute, and do you inspect.\" This was agreed, and Epimetheus made the distribution. There were some to whom he gave strength without swiftness, while he equipped the weaker with swiftness; some he armed, and others he left unarmed; and devised for the latter some other means of preserva", "source_id": 27, "source_title": "Plato, Protagoras, trans. Jowett 1871 (MIT Classics)", "source_url": "https://classics.mit.edu/Plato/protagoras.html"}, {"text": "and in this manner the race was preserved. Thus did Epimetheus, who, not being very wise, forgot that he had distributed among the brute animals all the qualities which he had to give-and when he came to man, who was still unprovided, he was terribly perplexed. Now while he was in this perplexity, Prometheus came to inspect the distribution, and he found that the other animals were suitably furnished, but that man alone was naked and shoeless, and had neither bed nor arms of defence. The appoin", "source_id": 27, "source_title": "Plato, Protagoras, trans. Jowett 1871 (MIT Classics)", "source_url": "https://classics.mit.edu/Plato/protagoras.html"}, {"text": "; [1.2.3] to Iapetus and Asia was born Atlas, who has the sky on his shoulders, and Prometheus, and Epimetheus, and Menoetius, he whom Zeus in the battle with the Titans smote with a thunderbolt and hurled down to Tartarus. 22 [1.2.4] And to Cronus and Philyra was born Chiron, a centaur of double form 23 ; an", "source_id": 28, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 1, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus1.html"}], "proposals": [{"text": "The Norns of German mythology are akin to the Hours and the Moerae and exhibit this time-signification in their names. This knowledge of nature reacted on the conception of human life. The nature-myth changed into a myth of human life : the weather-goddesses became goddesses of destiny.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "\"All who have not since perished must remember as though it were yesterday or the day before, how the ships of the Achaeans were detained in Aulis when we were on our way hither to make war on Priam and the Trojans. We were ranged round about a fountain offering hecatombs to the gods upon their holy altars, and there was a fine plane-tree from beneath which there welled a stream of pure water. Then we saw a prodigy; for Jove sent a fearful serpent out of the ground, with blood-red stains upon its back, and it darted from under the altar on to the plane-tree.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "In all this we may see a survival of the older belief, modified by Christian teaching, since the Bretons suppose that purgatory and hell are beneath the earth and accessible from its surface.1 Some British folk-lore brought to Greece by Demetrius and reported by Plutarch might seem to suggest that certain persons — the mighty dead — were privileged to pass to the island Elysium. Some islands near Britain were called after gods and heroes, and the inhabitants of one of these were regarded as sacrosanct by the Britons, like the priestesses of Sena. They were visited by Demetrius, who was told that the storms which arose during his visit were caused by the passing away of some of the \" mighty \" or of the \" great souls.\" It may have been meant that such mighty ones passed to the more distant islands, but this is certainly not stated.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "eurypylus-telephid", "label": "Eurypylus son of Telephus", "tradition": "Greek epic cycle", "batch": 1, "date_added": "2026-10-11", "era": -600, "pw_d": 0.0, "pw_p": 1500000000.0, "pw_t": 1500000000.0, "pw_e": 38923257.682, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "First, a correction: our corpus knows Eurypylus the Thessalian, 'son of Euaemon', who led forty ships out of Ormenius [1], killed Hypsenor 'priest of the river Scamander, who was honoured among the people as though he were a god' [1], and was himself wounded by Paris' arrow to the thigh, whence his plea for the drug-oilment lodged in Book 11 [1]. The Telephid Eurypylus of the Odyssean sequel-tradition, to whom later tradition attached this name, is nowhere attested in our fetched witnesses; the conflation is borrowed from scholarship and has to remain marked as such. What survives in the epic is a competent mid-tier captain who kills a river-priest and then becomes the poem's second case of medicine lamed by logistics, the wound that proves Machaon irreplaceable.\n\nOdysseus, dead, remembers killing him: 'that valiant hero Eurypylus son of Telephus, who was the handsomest man I ever saw except Memnon; many others also of the Ceteians fell around him by reason of a woman's bribes' [54]. The afterlife notice ratifies the catalogue's judgment: beauty and a bought war, dead among the Ceteians, carried into Homer by the one Achaean whose trade was the memory.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "proposals": [{"text": "Fragment #2—Eustathias, 1796. 35: The author of the _Telegony_, a Cyrenaean, relates that Odysseus had by Calypso a son Telegonus or Teledamus, and by Penelope Telemachus and Acusilaus. HOMERICA THE EXPEDITION OF AMPHIARAUS Fragment #1—Pseudo-Herodotus, Life of Homer: Sitting there in the tanner’s yard, Homer recited his poetry to them, the _Expedition of Amphiarus to Thebes_ and the _Hymns to the Gods_ composed by him. THE TAKING OF OECHALIA Fragment #1—Eustathius, 330. 41: An account has there been given of Eurytus and his daughter Iole, for whose sake Heracles sacked Oechalia.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Of all this mass of epic poetry only the scantiest fragments survive; but happily Photius has preserved to us an abridgment of the synopsis made of each poem of the “Trojan Cycle” by Proclus, _i.e._ Eutychius Proclus of Sicca. The pre-Trojan poems of the Cycle may be noticed first. The _Titanomachy_, ascribed both to Eumelus of Corinth and to Arctinus of Miletus, began with a kind of Theogony which told of the union of Heaven and Earth and of their offspring the Cyclopes and the Hundred-handed Giants.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "THE TELEGONY Fragment #1—Proclus, Chrestomathia, ii: After the _Returns_ comes the _Odyssey_ of Homer, and then the _Telegony_ in two books by Eugammon of Cyrene, which contain the following matters. The suitors of Penelope are buried by their kinsmen, and Odysseus, after sacrificing to the Nymphs, sails to Elis to inspect his herds. He is entertained there by Polyxenus and receives a mixing bowl as a gift; the story of Trophonius and Agamedes and Augeas then follows.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "genius", "label": "Genius (tutelary)", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -20, "pw_d": 4000000000.0, "pw_p": 0.0, "pw_t": 4000000000.0, "pw_e": 232513887.871, "pw_pool": "P_self", "pw_why": "Tutelary of every person and place [9][10][14]: the pool of selfhood-ritual answers to it structurally, no myth needed.", "pw_ws": 1.0, "essay": "A relation, not a person. Censorinus defines it by attachment: the god under whose tutelage each person lives from birth [10]. Horace gives it astrology and a birthday [9]. Servius makes every place answer to one, usually shown as a serpent [14]. Pliny registers the multiplication with open skepticism [11], and Augustine quotes Varro's cosmic version only to reduce it [13]. Across every fetched witness, no genius ever speaks, acts, or receives a story. The sources argue only about what it attaches to: soul, place, or world. There is no character here to recover or to misquote; the disagreement is the content of the tradition.", "highlights": [{"text": "Genius est deus, cuius in tutela ut quisque natus est vivit. Hic sive quod ut genamur curat, sive quod una genitur nobiscum, sive etiam quod nos genitos suscipit ac tutatur, certe a genendo genius appellatur. 2 [![[ALT i", "source_id": 10, "source_title": "Censorinus, De Die Natali ch.2-3, Latin (LacusCurtius)", "source_url": "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Censorinus/text*.html"}, {"text": "his woodland with fire and steel: our attendant genius knows, who governs the planet of our nativity, the divinity [that presides] over human nature, who dies with each individual, of various complexion, white and black. I will use, and take out from my moderate stock, as much as my exigence dem", "source_id": 9, "source_title": "Horace, Epistles II, trans. C. Smart 1856 (Wikisource)", "source_url": "https://en.wikisource.org/wiki/The_works_of_Horace/Second_Book_of_Epistles"}, {"text": "slaves and faithful wife, the partners of their labors, atoned with a hog [the goddess] Earth, with milk Silvanus, with flowers and wine the genius that reminds us of our short life. Invented by this custom, the Fescennine [ 22 ] licentiousness poured forth its rustic taunt", "source_id": 9, "source_title": "Horace, Epistles II, trans. C. Smart 1856 (Wikisource)", "source_url": "https://en.wikisource.org/wiki/The_works_of_Horace/Second_Book_of_Epistles"}, {"text": "TEM INGENS GYROS loci genium per magnitudinem vult probare; nullus enim locus sine genio, qui per anguem plerumque osten", "source_id": 14, "source_title": "Servius, In Vergilii Aeneida Commentarii, ed. Thilo & Hagen 1881 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Serv.+A.+5.85"}, {"text": "a greater population of the Celestials than of human beings, since each individual makes a separate God for himself,", "source_id": 11, "source_title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5"}], "proposals": [{"text": "Negation is, at a higher level, a sub- stitute for repression. In the Ucs there are only con- tents more or less strongly cathected. Intensity of cathexis is mobile in a far greater degree in this than in the other systems.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "Our opponent would merely reply that such analogies and connecting-links were non- existent, that they were artifacts introduced by our- selves, figments of our overweening sagacity. Now I shall not preface my reply with the words, ‘Let us be honest’ or ‘ Let us be sincere,’ since that one must always be able to be, and without making any preliminary flourish about it. Let me say quite simply that I am well aware that any reader who does not already believe in the soundness of the psycho-analytic mode of thought will certainly not acquire this con- viction by reading the case of Christoph Haitzmann, painter in the seventeenth century.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "It would be only with the greatest reluctance that I could bring myself to believe in any such necessity. I do not mean that connoisseurs and lovers of art find no words with which to praise such objects to us. They are eloquent enough, it seems to me.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "hephaestus", "label": "Hephaestus", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 300000000000.0, "pw_p": 0.0, "pw_t": 300000000000.0, "pw_e": 6319050898.225, "pw_pool": "P_metals", "pw_why": "The forge the fire was stolen from [7]; divine artisan of the Greek pool.", "pw_ws": 1.0, "essay": "The god of the forge is introduced by his own body hitting the ground. In the Iliad he tells it in the first person: Zeus 'caught me by the foot and flung me from the heavenly threshold. All day long from morn till eve, was I falling, till at sunset I came to ground in the island of Lemnos', where the Sintians tended him [1][30]. The craftsman of heaven begins as industrial refuse. Yet the Homeric Hymn to Hephaestus records the counter-account, the one the metals trade still runs on: 'With bright-eyed Athene he taught men glorious gifts throughout the world, men who before used to dwell in caves in the mountains like wild beasts' [30]. Human housing, in that witness, is Hephaestus output. Prometheus' whole revolution is framed by Plato as burglary of two workshops: 'the art of Hephaestus' and 'the art of Athene', taken together with fire [27]. So the smith who could not defend his own threshold against his father holds the license to everything other characters fight over; when Aeschylus opens Prometheus Bound, it is Hephaestus who must haul the thief to the rock [6]. His power is the quietest kind on record: he commands not men but the means by which command is carried out.\n\nIn the Odyssey's most performed lay, the forge turns its skill on its own household. Tipped off by the Sun, he 'went to his smithy brooding mischief, got his great anvil into its place, and began to forge some chains which none could either unloose or break', and 'festooned the bed-posts all over with chains like cobwebs' [54]. Workmanship serving jealousy: the one fine specimen of divine engineering in Homer spent on matrimonial evidence. The scene pays in the currency he commands, the whole assembly of gods coming to his bedroom to view the catch, and compensation negotiated in person with the sea god standing bond.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "clear-voiced Muses, of Hephaestus famed for inventions. With bright-eyed Athene he taught men glorious gifts throughout the world, -- men who before used to dwell in caves in the mountains like wild beasts. But now that they have learned crafts through Hephaestus the famed worker, easily they live a peaceful life in their own houses the whole year round. Be gracious, Hephaestus, and", "source_id": 30, "source_title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus", "source_url": "https://www.theoi.com/Text/HomericHymns3.html"}, {"text": "against Jove. Once before when I was trying to help you, he caught me by the foot and flung me from the heavenly threshold. All day long from morn till eve, was I falling, till at sunset I came to ground in the island of Lemnos, and there I lay, with very little life left in me, till the Sintians came and tended me.\" Juno smiled at this, and as she smiled she took the cup from her son's hands. Then Vulcan drew swe", "source_id": 30, "source_title": "Homeric Hymns 5-33, trans. Evelyn-White 1914 (theoi.com), Hymn 20 To Hephaestus", "source_url": "https://www.theoi.com/Text/HomericHymns3.html"}, {"text": "severally their proper qualities. Epimetheus said to Prometheus: \"Let me distribute, and do you inspect.\" This was agreed, and Epimetheus made the distribution. There were some to whom he gave strength without swiftness, while he equipped the weaker with swiftness; some he armed, and others he left unarmed; and devised for the latter some other means of preserva", "source_id": 27, "source_title": "Plato, Protagoras, trans. Jowett 1871 (MIT Classics)", "source_url": "https://classics.mit.edu/Plato/protagoras.html"}], "proposals": [{"text": "He hid fire; but that the noble son of Iapetus stole again for men from Zeus the counsellor in a hollow fennel-stalk, so that Zeus who delights in thunder did not see it. But afterwards Zeus who gathers the clouds said to him in anger: (ll. 54-59) ‘Son of Iapetus, surpassing all in cunning, you are glad that you have outwitted me and stolen fire—a great plague to you yourself and to men that shall be. But I will give men as the price for fire an evil thing in which they may all be glad of heart while they embrace their own destruction.’ (ll. 60-68) So said the father of men and gods, and laughed aloud.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "All who had been cutting wood bore logs, for so Meriones squire to Idomeneus had bidden them, and they threw them down in a line upon the seashore at the place where Achilles would make a mighty monument for Patroclus and for himself. When they had thrown down their great logs of wood over the whole ground, they stayed all of them where they were, but Achilles ordered his brave Myrmidons to gird on their armour, and to yoke each man his horses; they therefore rose, girded on their armour and mounted each his chariot- they and their charioteers with them. The chariots went before, and they that were on foot followed as a cloud in their tens of thousands after.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "For it was Hermes who first invented fire-sticks and fire. Next he took many dried sticks and piled them thick and plenty in a sunken trench: and flame began to glow, spreading afar the blast of fierce-burning fire. (ll. 115-137) And while the strength of glorious Hephaestus was beginning to kindle the fire, he dragged out two lowing, horned cows close to the fire; for great strength was with him. He threw them both panting upon their backs on the ground, and rolled them on their sides, bending their necks over 2517, and pierced their vital chord.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}]}, {"id": "heracles", "label": "Heracles (as unbinder, prophesied)", "tradition": "Greek", "batch": 1, "date_added": "2026-10-11", "era": -458, "pw_d": 3750000000.0, "pw_p": 0.0, "pw_t": 3750000000.0, "pw_e": 118550991.267, "pw_pool": "P_military", "pw_why": "Labors as licensed force; release of Prometheus anchors him into the machine [6].", "pw_ws": 0.75, "essay": "The strongest man in the tradition holds his power on lease. Hesiod's Prometheus passage is explicit that even his most famous deed was license-dependent: he slew the eagle and released its victim 'not without the will of Olympian Zeus who reigns on high, that the glory of Heracles the Theban-born might be yet greater' [26]. Apollodorus then documents what that lease costs: driven mad 'through the jealousy of Hera', he flings his own children into the fire, condemns himself to exile, and is assigned by the Pythia to serve a lesser king twelve years and 'to perform the ten labours imposed on him' [32]. Before the first labor is even told, the narrator records his own cult-protocol: he instructs Molorchus that if he fails to return, the sacrifice should be made 'to him as to a hero' [32]. The fetched witnesses thus bracket his whole career between a stepmother's sabotage and a pre-negotiated tomb. Nothing in these texts shows him choosing his tasks. What Heracles commands is licensed force itself, force that works only while the office above it signs off.\n\nOdysseus meets him twice over in the underworld, and the poem states the split outright: 'mighty Hercules, but it was his phantom only, for he is feasting ever with the immortal gods, and has lovely Hebe to wife' [54]. The tradition's earliest double-entry: the shadow below, scowling with bow drawn, the person above at table 'feasting ever'. Herodotus, checking the name abroad, adjudicates the confusion four centuries later: 'These researches show plainly that there is an ancient god Hercules; and my own opinion is that those Greeks act most wisely who build and maintain two temples of Hercules, in the one of which the Hercules worshipped is known by the name of Olympian, and has sacrifice offered to him as an immortal, while in the other the honours paid are such as are due to' a hero [55]. The historian's fieldwork in Tyre and Thasos institutionalizes what the Odyssey already knew: two Heracleses, and the books must be kept separately.", "highlights": [{"text": "the Father sent glorious Argos-Slayer, the swift messenger of the gods, to take it to Epimetheus as a gift. And Epimetheus did not think on what Prometheus had said to him, bidding him never take a gift of Olympian Zeus, but to send it back for fear it might prove to be something harmful to men. But he took the gift, and afterwards, when the evil thing was already his, he understood. (ll. 90-", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed. But Menoetius was outrageous, and far-seeing Zeus struck him with a lurid thunderbolt and sent him", "source_id": 26, "source_title": "Hesiod, Works and Days + Theogony, trans. Evelyn-White 1914 (Gutenberg #348)", "source_url": "https://www.gutenberg.org/cache/epub/348/pg348.txt"}, {"text": "Now it came to pass that after the battle with the Minyans Hercules was driven mad through the jealousy of Hera and flung his own children, whom he had by Megara, and two children of Iphicles into the fire 96 ; wherefore he condemned himself to exile, and was purified by Thespius, and repairing to Delphi he inquired of the god where he should dwell. 97 The Pythian priestess then first c", "source_id": 32, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 2, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus2.html"}, {"text": "he would be immortal. 99 [2.5.1] When Hercules heard that, he went to Tiryns and did as he was bid by Eurystheus. First, Eurystheus ordered him to bring the skin of the Nemean lion 100 ; now that was an invulnerable beast begotten by Typhon. On his way to attack the lion he came to Cleonae and lodged at the house of a day-laborer, Molorchus 101 ; and when his host would have offered a victim in sacrifice, Hercules told him to wait for thirty days, and then, if he had returned safe from the hunt, to sacrifice to Saviour Zeus, but if he were dead, to sacrifice to him as to a hero. 102 And having come to Nemea and tracked the lio", "source_id": 32, "source_title": "Pseudo-Apollodorus, Bibliotheca Book 2, trans. Frazer 1921 (theoi.com)", "source_url": "https://www.theoi.com/Text/Apollodorus2.html"}, {"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "proposals": [{"text": "And they remembered to be grateful to him for his kindness, and gave him thunder and the glowing thunderbolt and lightening: for before that, huge Earth had hidden these. In them he trusts and rules over mortals and immortals. (ll. 507-543) Now Iapetus took to wife the neat-ankled mad Clymene, daughter of Ocean, and went up with her into one bed. And she bare him a stout-hearted son, Atlas: also she bare very glorious Menoetius and clever Prometheus, full of various wiles, and scatter-brained Epimetheus who from the first was a mischief to men who eat bread; for it was he who first took of Zeus the woman, the maiden whom he had formed.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Zeus because he vied with the immortals in beauty........rich-tressed Diomede; and she bare Hyacinthus, the blameless one and strong........whom, on a time Phoebus himself slew unwittingly with a ruthless disk.... THE SHIELD OF HERACLES (ll. 1-27) Or like her who left home and country and came to Thebes, following warlike Amphitryon,—even Alcmena, the daughter of Electyron, gatherer of the people. She surpassed the tribe of womankind in beauty and in height; and in wisdom none vied with her of those whom mortal women bare of union with mortal men.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Mesthles and Antiphus commanded the Meonians, sons of Talaemenes, born to him of the Gygaean lake. These led the Meonians, who dwelt under Mt. Nastes led the Carians, men of a strange speech.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "juno", "label": "Juno (as female counterpart-genius)", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -400, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "In our witnesses Juno appears strictly as the female case of the genius doctrine. Pliny's complaint that 'each individual makes a separate God for himself, adopting his own Juno and his own Genius' [11], and Smith's capsule 'Women called their genius Juno (Senec. Epist. 110; Tibull. iv. 6. 1)' [12], both derive from the older equation our batch 1 logged in Augustine. Augustine then uses her as the polemic's reductio: 'queen among the select gods', yet her job-share is allotted in the small print, Juno Lucina sharing the bloods of women with the exacted-out Mena, Iterduca walking boys along roads beside 'a most ignoble pair' of roadside goddesses [13]. Glory, in the bishop's retelling, is bonus salary for clerical work. The fetched witnesses give the goddess no myth, no deed, no line of dialogue: only an org chart. So Juno here is a tutelary function for women plus an org chart. The thinness must be marked as an argument from silence: Latin poetry and cult gave her far more, but that witness was not fetched.\n\nLatin epic supplies the myth the lawyers withheld. Vergil's premise is her memory: Aeneas is driven by 'haughty Juno's unrelenting hate' [35], for the slighted beauty contest and for Carthage. Blocked above, she works below: 'Now Juno to the Stygian sky descends, Solicits hell for aid, and arms the fiends', renting the Fury Allecto to set the Italian war alight [35]. Dryden's note for the operation is the poem's own sneer: 'An act that well became the wife of Jove' [35]. In the Aeneid the women's tutelary of the jurists has become statecraft in opposition: where she cannot veto the fates she inflates the price of Italy, and the cost lands on Dido first.", "highlights": [{"text": "a greater population of the Celestials than of human beings, since each individual makes a separate God for himself,", "source_id": 11, "source_title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5"}, {"text": "on the Esquiline. Hence we may understand how it comes to pass that there is a greater population of the Celestials than of human beings, since each individual makes a separate God for himself, adopting his own Juno and his own Genius [9](https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5#note9). And th", "source_id": 11, "source_title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5"}, {"text": "Wikisource This page needs to be proofread . loc cit. loc cit. 242 GENIUS. the name Genius itself is Latin (it is connected with i/eu'itus, 'yi-yv-oixai, and equivalent in meaning to generator or father ; see August, de Civ. Dei, vii. 1 3). The genii of the Romans are frequently confounded with the Manes, Lares, and Penates (Censorin. 3.) ; and they have indeed one great feature in common, viz. that of protecting mortals ; but there seems to be this essential difference, that the genii are the powers which produce life {(Hi genitales), and accompany man through it as his second or spiritual self, whereas the other powers do not begin to exercise their influence till life, the work of the genii, has commenced. The genii were further not confined to man, but every living being, animal as wel", "source_id": 12, "source_title": "Smith, Dict. Greek & Roman Biography & Mythology 1870, s.v. Genius (Wikisource)", "source_url": "https://en.wikisource.org/wiki/Page:Dictionary_of_Greek_and_Roman_Biography_and_Mythology_%281870%29_-_Volume_2.djvu/256"}, {"text": "It is Expounded What Saturn Is, What Genius Is, It Comes to This, that Both of Them are Shown to Be Jupiter. Bu", "source_id": 13, "source_title": "Augustine, City of God VII, trans. Dods (New Advent)", "source_url": "https://www.newadvent.org/fathers/120107.htm"}, {"text": "And this province of the menses the same author, in his book on the select gods, assigns to Juno herself, who is even queen among the select gods; and here, as Juno Lucina, along with the same Mena, her stepdaughter, she presides over the same blood. There also are two gods, exceedingly obscure, Vitumnus and Sentinus — the one of whom imparts life to the fœtus, and the other sensation; and, of a truth , they b", "source_id": 13, "source_title": "Augustine, City of God VII, trans. Dods (New Advent)", "source_url": "https://www.newadvent.org/fathers/120107.htm"}], "proposals": [{"text": "\"Why are you here,\" said he, \"daughter of aegis-bearing Jove? To see the pride of Agamemnon, son of Atreus? Let me tell you- and it shall surely be- he shall pay for this insolence with his life.\" And Minerva said, \"I come from heaven, if you will hear me, to bid you stay your anger.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Brut. 36.) Women called their genius Juno (Senec. Epist. 110; TibuU. iv. 6. 1 ) ; and as we may thus regard the genii of men a3 being in some way connected with Jupiter, it would follow that the genii were emanations from the great gods. Every man at Rome had his own genius, whom he worshipped as sanctus et sanctissi- mus deus, especially on his birthday, with libations of vnne, incense, and garlands of flowers. (TibuU. li. 2. 5 ; Ov.", "source_title": "smith_dictionary_genius_wikisource.txt", "source_url": "", "cluster": "genius", "proposed": true}, {"text": "When Queen Juno saw her, she said to Minerva, \"Look, daughter of aegis-bearing Jove, unweariable, that vixen Venus is again taking Mars through the crowd out of the battle; go after her at once.\" Thus she spoke. Minerva sped after Venus with a will, and made at her, striking her on the bosom with her strong hand so that she fell fainting to the ground, and there they both lay stretched at full length. Then Minerva vaunted over her saying, \"May all who help the Trojans against the Argives prove just as redoubtable and stalwart as Venus did when she came across me while she was helping Mars.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "lares-penates", "label": "Lares & Penates", "tradition": "Roman", "batch": 1, "date_added": "2026-10-11", "era": -200, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The corpus knows them mostly as a grammatical accident of plurality: Smith's dictionary reports that the genii are 'frequently confounded with the Manes, Lares, and Penates (Censorin. 3.)', then insists on the essential difference that 'the genii are the powers which produce life... and accompany mortals from their first existence to the end of it' [12]. Protection versus production: the Lares underwrite places, the genius underwrites a lifespan's continuity, and the tradition's own antiquaries could not always tell them apart, which is itself witness to how crowded the Roman threshold was. Our fetched evidence for them is entirely definitional; no Larius gets a story in this corpus. The state outsourced smaller-order vigilance to them: Pliny records a temple 'dedicated to Fever, at the public expense, on the Palatine Hill... near the Temple of the Lares' [11], a state shrine to a disease doing its protecting next door to them. That absurdity is data: micro-powers were on payroll.", "highlights": [{"text": "Wikisource This page needs to be proofread . loc cit. loc cit. 242 GENIUS. the name Genius itself is Latin (it is connected with i/eu'itus, 'yi-yv-oixai, and equivalent in meaning to generator or father ; see August, de Civ. Dei, vii. 1 3). The genii of the Romans are frequently confounded with the Manes, Lares, and Penates (Censorin. 3.) ; and they have indeed one great feature in common, viz. that of protecting mortals ; but there seems to be this essential difference, that the genii are the powers which produce life {(Hi genitales), and accompany man through it as his second or spiritual self, whereas the other powers do not begin to exercise their influence till life, the work of the genii, has commenced. The genii were further not confined to man, but every living being, animal as wel", "source_id": 12, "source_title": "Smith, Dict. Greek & Roman Biography & Mythology 1870, s.v. Genius (Wikisource)", "source_url": "https://en.wikisource.org/wiki/Page:Dictionary_of_Greek_and_Roman_Biography_and_Mythology_%281870%29_-_Volume_2.djvu/256"}, {"text": "a greater population of the Celestials than of human beings, since each individual makes a separate God for himself,", "source_id": 11, "source_title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5"}, {"text": "on the Esquiline. Hence we may understand how it comes to pass that there is a greater population of the Celestials than of human beings, since each individual makes a separate God for himself, adopting his own Juno and his own Genius [9](https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5#note9). And th", "source_id": 11, "source_title": "Pliny, Natural History 2.5, trans. Bostock & Riley 1855 (Perseus)", "source_url": "https://www.perseus.tufts.edu/hopper/text?doc=Plin.+Nat.+2.5"}], "proposals": [{"text": "The thousand soldiers from Antium who had come after the battle, too late to help, were sent back almost with ignominy. ===6=== Then the elections were held, and L. Servilius were chosen as consuls; they entered upon office on August 1, which was then the commencement of the consular year. The season was a trying one, and that year happened to be a pestilential one both for the City and the rural districts, for the flocks and herds quite as much as for human beings.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "The rest of the year remained undisturbed both at home and abroad. [[fr:Histoire romaine (Tite-Live)/Livre III]] [[la:Ab Urbe Condita/liber III]]", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}, {"text": "It is said that wolves pursued by dogs were seen in the Capitol; this prodigy necessitated its purification. These were the events of the year. ===30=== The next consuls were Quintus Minucius and C. As there was peace abroad at the beginning of the year, the domestic troubles began again; the same tribunes agitating for the same Law.", "source_title": "livy3-roberts-wikisource.txt", "source_url": "", "cluster": "cincinnatus", "proposed": true}]}, {"id": "machaon", "label": "Machaon", "tradition": "Greek epic/hero-cult", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 5000000000.0, "pw_p": 0.0, "pw_t": 5000000000.0, "pw_e": 105317514.97, "pw_pool": "P_health", "pw_why": "Battlefield medicine personified; the Iliad prices the healer explicitly at several men [1]; Gerenia cult sustained a healing economy locally [3].", "pw_ws": 1.0, "essay": "Two offices in one Catalogue entry, and almost nothing else. Homer gives Machaon deeds: he draws Pandarus' arrow from Menelaus and lays on 'soothing drugs which Chiron had given to Aesculapius' [1]. When Paris wounds him, the army's value-scale is spoken over his body: a physician is worth more than several men together [1]. Centuries later Pausanias finds him a local cult, a bronze statue, and a legend of bones brought home [3]. What no witness gives him is a personality. His silence is not scarcity; it is the tradition transmitting an office rather than a person. Whether that thinness caused his low later salience or resulted from it cannot be decided from the fetched witnesses, and the Gerenia cult is evidence he stayed locally salient for centuries.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "Here in Gerenia is a tomb of Machaon, son of Asclepius, and a holy sanctuary. In his temple men may find cures for diseases. They call the holy spot Rhodos; there is a standing bronze statue of Machaon, with a crown on his head which the Messenians in the local speech call kiphos. The author of the epic", "source_id": 3, "source_title": "Pausanias 3, trans. Jones 1918 (Loeb, via theoi.com)", "source_url": "https://www.theoi.com/Text/Pausanias3B.html"}, {"text": "Some Trojan or Lycian archer has wounded him with an arrow to our dismay and to his own great glory.\" Thus did he speak, and Machaon was moved to go. They passed through the spreading host of the Achaeans and went on till they came to the place where Menelaus had been wounded and was lying with the chieftains gathered in a circle round him. Machaon passed into the middle of the ring and at once drew the arrow from the belt, bending its barbs back through the force with which he pulled it out.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "algorithmic": true}, {"text": "When Nestor and Machaon had reached the tents of the son of Neleus, they dismounted, and an esquire, Eurymedon, took the horses from the chariot. The pair then stood in the breeze by the seaside to dry the sweat from their shirts, and when they had so done they came inside and took their seats. Fair Hecamede, whom Nestor had had awarded to him from Tenedos when Achilles took it, mixed them a mess; she was daughter of wise Arsinous, and the Achaeans had given her to Nestor because he excelled all of them in counsel.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "algorithmic": true}], "proposals": [{"text": "Arctinus in the _Sack of Ilium_ seems to be of this opinion when he says: (ll. 1-8) ‘For their father the famous Earth-Shaker gave both of them gifts, making each more glorious than the other. To the one he gave hands more light to draw or cut out missiles from the flesh and to heal all kinds of wounds; but in the heart of the other he put full and perfect knowledge to tell hidden diseases and cure desperate sicknesses. It was he who first noticed Aias’ flashing eyes and clouded mind when he was enraged.’ Fragment #6—Diomedes in Gramm., Lat. i. 477: ‘Iambus stood a little while astride with foot advanced, that so his strained limbs might get power and have a show of ready strength.’ THE RETURNS", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "; Zimmer, Glossce Hibernicce, 1881, 270. 3 Atlantis, 1860, iii. 389. 4JRCxii. 89. 5LLlla. THE TUATHA DE DAN ANN 77 for the battle, and with marvellous skill flung them into the sockets of the spear-heads.1 Diancecht, whose name may mean \" swift in power,\" was god of medicine, and, with Creidne's help, fashioned a silver hand for Nuada.2 His son Miach replaced this by a magic restoration of the real hand, and in jealousy his father slew him — a version of the Mcirchen formula of the jealous master. Three hundred and sixty-five herbs grew from his grave, and were arranged according to their properties by his sister Airmed, but Diancecht again confused them, \" so that no one knows their proper cures.\"3 At the second battle of Mag- tured, Diancecht presided over a healing-well containing magic herbs.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}, {"text": "Various attempts have been 1 RG vii. 225 ; Windisch, Tain, 20. To this period belong also the tale of Cuchulainn's visit to Elysium, and others to be referred to later. Another story describes his attack upon Morrigan because she would neither yield up the cows which she was driving away nor tell her true name — an instance of the well-known name tabu.", "source_title": "macculloch-religion-ancient-celts-1911.txt", "source_url": "", "cluster": "rhiannon", "proposed": true}]}, {"id": "nathanael", "label": "Nathanael", "tradition": "Hoffmann's tale", "batch": 1, "date_added": "2026-10-11", "era": 1816, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The case-study subject who proves diagnostic. Jentsch's rule of narrative uncertainty is built around him: the reader must not be allowed to clear up 'whether a particular figure in the story is a human being or an automaton' [5]. Nathanael 'falls in love with her so violently that, because of her, he quite forgets the clever and sensible girl to whom he is betrothed' [5]; the autopilot of desire is the point. His end comes on the tower, where the Sandman-words return as pure formula: 'Ring of fire, spin about!' [5], the whole crisis read backward through the childhood line. Freud mines the tale for the eye-anxiety and for involuntary return; the cost falls on him: in the story he perceives, absorbs, and echoes a fear; he never generates one. His nominal agency is zeroed out by narration, which is precisely why psychoanalysis could index on him.", "highlights": [{"text": "I will say at once that both courses lead to the same result: the ‘ uncanny ’ is that class of the terrifying which leads back to something long known", "source_id": 5, "source_title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)", "source_url": "https://archive.org/details/freud-1925-cp-5"}, {"text": "I found myself in a quarter the character of which could not long remain in doubt. Nothing but painted women were to be seen at the windows of the small houses, and I hastened to leave the narrow street at the next turning.", "source_id": 5, "source_title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)", "source_url": "https://archive.org/details/freud-1925-cp-5"}], "proposals": [{"text": "Auf mich kannst du rechnen, wenn alles - Nein, ich mag nichts weiter sagen! -« Dem Nathanael war es plötzlich, als meine der kalte prosaische Siegmund es sehr treu mit ihm, er schüttelte daher die ihm dargebotene Hand recht herzlich. Nathanael hatte rein vergessen, daß es eine Clara in der Welt gebe, die er sonst geliebt; - die Mutter - Lothar - alle waren aus seinem Gedächtnis entschwunden, er lebte nur für Olimpia, bei der er täglich stundenlang saß und von seiner Liebe, von zum Leben erglühter Sympathie, von psychischer Wahlverwandtschaft fantasierte, welches alles Olimpia mit großer Andacht anhörte. Aus dem tiefsten Grunde des Schreibpults holte Nathanael alles hervor, was er jemals geschrieben.", "source_title": "hoffmann-der-sandmann-gutenberg-6341.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "Dir im Traum beschwerlich zu fallen, mit lautem Lachen fortzubannen. Ganz und gar nicht fürchte ich mich vor ihm und vor seinen garstigen Fäusten, er soll mir weder als Advokat eine Näscherei, noch als Sandmann die Augen verderben. Ewig, mein herzinnigstgeliebter Nathanael etc. etc. etc.", "source_title": "hoffmann-der-sandmann-gutenberg-6341.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "Der Mutter war alles, was sich auf Coppelius bezog, verschwiegen worden; denn man wußte, daß sie nicht ohne Entsetzen an ihn denken konnte, weil sie, wie Nathanael, ihm den Tod ihres Mannes schuld gab. Wie erstaunte Nathanael, als er in seine Wohnung wollte und sah, daß das ganze Haus niedergebrannt war, so daß aus dem Schutthaufen nur die nackten Feuermauern hervorragten. Unerachtet das Feuer in dem Laboratorium des Apothekers, der im untern Stocke wohnte, ausgebrochen war, das Haus daher von unten herauf gebrannt hatte, so war es doch den kühnen, rüstigen Freunden gelungen, noch zu rechter Zeit in Nathanaels im obern Stock gelegenes Zimmer zu dringen, und Bücher, Manuskripte, Instrumente zu retten.", "source_title": "hoffmann-der-sandmann-gutenberg-6341.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "nestor", "label": "Nestor", "tradition": "Greek epic", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Nestor's credential is duration itself, stated in arithmetic: 'the words fell from his lips sweeter than honey. Two generations of men born and bred in Pylos had passed away under his rule, and he was now reigning over the third' [1]. The poem grants him no strength, only the voice; his role in the wound-scenes is transport and provision (his mare carries Machaon off the field; his handmaid grates goat-cheese over Pramnian wine for the surgeons' posset [1][2]). He is a relay with three generations of uptime: power persists through him by memory, not command. The fetched witnesses give no deed of his that is not advice or hauling; the 'knight of Gerene' title, given twice over, is all ceremony.\n\nThe Odyssey finds him at home in the third generation, still doing the same job: he receives Telemachus, itemizes the returns ('Our best men all of them fell there: Ajax, Achilles, Patroclus peer of gods in counsel, and my own dear son Antilochus'), and forwards the boy to Menelaus for the rest of the war's news [54]. The Iliad's hauler and adviser has become the Ithaca question's clearing-house; longevity has made him a dispatch office of the heroic world.", "highlights": [{"text": "array. Those, again, of Tricca and the stony region of Ithome, and they that held Oechalia, the city of Oechalian Eurytus, these were commanded by the two sons of Aesculapius, skilled in the art of healing, Podalirius and Machaon. And with them there came", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "A physician is worth more than several other men put together, for he can cut out arrows and spread healing herbs.\" Nestor knight of Gerene did as I", "source_id": 1, "source_title": "Homer, Iliad, trans. Butler 1898 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/iliad.mb.txt"}, {"text": "in which Hecamede, the concubine of Nestor, is described as giving to the wounded Machaon a posset, as he says, Made with Pramnian wine; and she grated cheese of goat's milk with a grater of bronze, and at his side placed an onion which gives a relish to drink. Now would you say that the ar", "source_id": 2, "source_title": "Plato, Ion, trans. Jowett (MIT Classics)", "source_url": "https://classics.mit.edu/Plato/ion.html"}, {"text": "---------------------------------------------------- BOOK I Tell me, O muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy. Many cities did he visit, and many were the nations with whose manners and customs he was acquainted; moreover he suffered much", "source_id": 54, "source_title": "Homer, Odyssey, trans. Butler 1900 (MIT Classics)", "source_url": "https://classics.mit.edu/Homer/odyssey.mb.txt"}], "proposals": [{"text": "And of Aeson and Polymede, according to Hesiod, Iason was born: ‘Aeson, who begot a son Iason, shepherd of the people, whom Chiron brought up in woody Pelion.’ Fragment #14—Petrie Papyri (ed. III. 3: ‘....of the glorious lord ....fair Atalanta, swift of foot, the daughter of Schoeneus, who had the beaming eyes of the Graces, though she was ripe for wedlock rejected the company of her equals and sought to avoid marriage with men who eat bread.’ Scholiast on Homer, Iliad xxiii. 683: Hesiod is therefore later in date than Homer since he represents Hippomenes as stripped when contending with Atalanta 1710. No. 130 (2nd-3rd century) 1711: (ll. 1-7) ‘Then straightway there rose up against him the trim-ankled maiden (Atalanta), peerless in beauty: a great throng stood round about her as she gazed fiercely, and wonder held all men as they looked upon her.", "source_title": "hesiod-evelynwhite-gutenberg348.txt", "source_url": "", "cluster": "epimetheus", "proposed": true}, {"text": "Let him then yieldit is only Hades who is utterly ruthless and unyielding- and hence he is of all gods the one most hateful to mankind. Moreover I am older and more royal than himself. Therefore, let him now obey me.\" Then Nestor answered, \"Most noble son of Atreus, king of men, Agamemnon.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}, {"text": "Let our squires attend to your own steeds, but let us drive mine straight at the Trojans, that Hector may learn how furiously I too can wield my spear.\" Nestor knight of Gerene hearkened to his words. Thereon the doughty squires, Sthenelus and kind-hearted Eurymedon, saw to Nestor's horses, while the two both mounted Diomed's chariot. Nestor took the reins in his hands and lashed the horses on; they were soon close up with Hector, and the son of Tydeus aimed a spear at him as he was charging full speed towards them.", "source_title": "homer-iliad-butler-mb.txt", "source_url": "", "cluster": "machaon", "proposed": true}]}, {"id": "olympia", "label": "Olympia the automaton", "tradition": "Hoffmann's tale", "batch": 1, "date_added": "2026-10-11", "era": 1816, "pw_d": 0.0, "pw_p": 0.0, "pw_t": 0.0, "pw_e": 0, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "Assessed entirely on what she is documented as being: 'an automaton whose clock-work has been made by Spalanzani, and whose eyes have been put in by Coppola, the Sand-Man' [5]. Hoffmann's German adds the institutional chill, since Nathanael himself reports her kept so 'daß durchaus kein Mensch in ihre Nähe kommen darf' (so that absolutely no one could come near her) [4]. Her only performance, singing at the party, is noticed not by her doing but by its effect; Freud remarks that the tale plays her 'with a faint touch of satire' at the student's expense [5]. The doll's power in the repertoire is not deceptive because it deceives; it is the power of a surface on which men discourse across a gap. As a node she is a manufactured nexus of custody (Spalanzani's lock) and optics (Coppola's eyes), i.e. two separate Workshops' joint product.", "highlights": [{"text": "I will say at once that both courses lead to the same result: the ‘ uncanny ’ is that class of the terrifying which leads back to something long known", "source_id": 5, "source_title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)", "source_url": "https://archive.org/details/freud-1925-cp-5"}, {"text": "I found myself in a quarter the character of which could not long remain in doubt. Nothing but painted women were to be seen at the windows of the small houses, and I hastened to leave the narrow street at the next turning.", "source_id": 5, "source_title": "Freud, The Uncanny, trans. Strachey, Collected Papers IV 1925 (archive.org)", "source_url": "https://archive.org/details/freud-1925-cp-5"}, {"text": "zu den Kindern, wenn sie nicht zu Bett gehen wollen und wirft ihnen Händevoll Sand in die Augen, daß sie blutig zum Kopf herausspringen, die wirft er dann in den Sack und trägt sie in den Halbmond zur Atzung für seine Kinderchen; die sitzen dort im Nest und haben krumme Schnäbel, wie die Eulen, damit picken sie der unartigen Menschenkindlein Augen auf.« - Gräßlich malte sic", "source_id": 4, "source_title": "Hoffmann, Nachtstücke 1816, Der Sandmann (Gutenberg #6341)", "source_url": "https://www.gutenberg.org/cache/epub/6341/pg6341.txt"}, {"text": "etwas Starres, beinahe möcht ich sagen, keine Sehkraft, es war mir so, als schliefe sie mit offnen Augen. Mir wurde ganz unheimlich und deshalb schlich ich leise fort ins Auditorium, das daneben gelegen. Nachher erfuhr ich, daß die Gestalt, die ich gesehen, Spalanzanis Tochter, Olimpia war, die er sonderbarer und schlechter Weise einsperrt, so, daß durchaus kein Mensch in ihre Nähe kommen darf. - Am Ende hat es eine Bewandtnis mit ihr, sie ist vielleicht blödsinnig oder sonst. - Wesh", "source_id": 4, "source_title": "Hoffmann, Nachtstücke 1816, Der Sandmann (Gutenberg #6341)", "source_url": "https://www.gutenberg.org/cache/epub/6341/pg6341.txt"}], "proposals": [{"text": "'I'hat, as we have said, would quickly dissipate the Freud, “The Uncanny” peculiar emotional effect of the thing. Nor is this atmosphere heightened by the fact that the author himself treats the episode of Olympia with a faint touch of satire and uses it to poke fun at the young man’s idealization of his mistress. The main theme of the story is, on the contrary, something different, something which gives it its name, and which is always re-introduced at critical moments: it is the theme of the ‘Sand-Man’ who tears out children’s eyes.", "source_title": "freud-on-the-uncanny-strachey-1925.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "IgI9 THE ‘ UNCANNY’ 379 the doll in the first act of Offenbach’s opera, Tales of Hoffmann. But I cannot think—and I hope that most readers of the story will agree with me—that the theme of the doll, Olympia, who is to all appearances a living being, is by any means the only element to be held responsible for the quite unparalleled atmo- sphere of uncanniness which the story evokes; or, indeed, that it is the most important among them. Nor is this effect of the story heightened by the fact that the author himself treats the episode of Olympia with a faint touch of satire and uses it to make fun of the young man’s idealization of his mistress.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}, {"text": "Hoffmann was the child of an unhappy marriage. When he was three years old, his father left his small family, never to be united to them again. According to Grisebach, in his biographical introduction to Hoffmann’s works, the writer’s relation to his father was always a most sensitive subject with him.", "source_title": "freud-cp4-1925-full-djvu.txt", "source_url": "", "cluster": "sandmann", "proposed": true}]}, {"id": "paris-alexandrus", "label": "Paris/Alexandrus", "tradition": "Greek epic", "batch": 1, "date_added": "2026-10-11", "era": -750, "pw_d": 0.0, "pw_p": 1500000000.0, "pw_t": 1500000000.0, "pw_e": 31595254.491, "pw_pool": null, "pw_why": null, "pw_ws": null, "essay": "The war's author enters
