<!DOCTYPE html>
<!--
SELF-CHECK — DATA fields this template now relies on:
  nodes[]: id,label,tradition,batch,date_added,era,pw_d,pw_p,pw_t,pw_pool,pw_why,pw_ws,essay
  nodes[] NEW: highlights[] of {text, source_title, source_url, cluster} (essay is FALLBACK when empty)
  nodes[] NEW: proposals[]  of {text, source_title, source_url, cluster} (+proposed:true), shown collapsed
  edges[]: frm,to,type,title,essay,source,date_added,era
  edges[] NEW: excerpts[] of {text, source_title, source_url, cluster} (essay is FALLBACK when empty)
  edges[] NEW: influence (float), shown in edge detail
  Search bar GETs http://127.0.0.1:8788/search?q=..&k=10&mode=(hybrid|bm25|vec)
    -> {results:[{snippet, text, cluster, title, url, path}]}
  Sanity: node 'machaon' highlights include text like "A physician is worth more than several other men put together..."
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Drama — Spirit Graph</title>
<script src="./lib/three.min.js"></script>
<script src="./lib/3d-force-graph.min.js"></script>
<style>
  :root{--paper:#f6f1e7;--ink:#2b2620;--faint:#8a8175;--line:#d9d0c0;--accent:#7a4a1f;--panel:#fffdf8;}
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.55;
       display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:.7rem 1.2rem .5rem;border-bottom:1px solid var(--line);flex:0 0 auto;}
  h1{font-size:1.9rem;margin:0;letter-spacing:.01em;font-weight:600;line-height:1;}
  .sub{font-size:1rem;color:var(--faint);margin-top:.1rem;font-style:italic;}
  .toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 1.2rem;
           align-items:center;border-bottom:1px solid var(--line);background:rgba(246,241,231,.9);}
  input[type=search]{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;
           padding:.4rem .55rem;color:var(--ink);flex:1;min-width:160px;}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:6px;
           padding:.4rem .7rem;cursor:pointer;color:var(--ink);white-space:nowrap;}
  button:hover{border-color:var(--accent);}
  button.on{background:var(--accent);color:var(--paper);border-color:var(--accent);}
  .tgroup{display:flex;align-items:center;gap:.4rem;}
  input[type=range]{width:160px;accent-color:var(--accent);}
  #yearLabel{min-width:72px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--faint);}
  .hint{font-size:.78rem;color:var(--faint);}
  #graph{flex:1 1 auto;min-height:0;position:relative;}
  /* drawer */
  #scrim{position:fixed;inset:0;background:rgba(43,38,32,.18);opacity:0;pointer-events:none;
         transition:opacity .22s ease;z-index:20;}
  #scrim.open{opacity:1;pointer-events:auto;}
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(43,38,32,.12);
          transform:translateX(102%);transition:transform .24s ease;z-index:21;
          display:flex;flex-direction:column;}
  #drawer.open{transform:translateX(0);}
  #drawerClose{position:absolute;top:.6rem;right:.7rem;border:none;background:transparent;
          font-size:1.5rem;line-height:1;padding:.2rem .4rem;color:var(--faint);}
  #drawerBody{overflow:auto;padding:1.4rem 1.3rem 2.2rem;}
  #drawerBody h2{margin:.2rem 0 .2rem;font-size:1.55rem;}
  #drawerBody h4{margin:1.1rem 0 .2rem;}
  .meta{font-size:.82rem;color:var(--faint);}
  .etype{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
  .edge{border-top:1px dashed var(--line);padding:.6rem 0;}
  .edge .t{font-weight:600;font-size:1rem;}
  a.cite{color:var(--accent);text-decoration:none;}
  a.cite:hover{text-decoration:underline;}
  [contenteditable=true]{outline:1.5px dashed var(--accent);outline-offset:3px;background:#fffef4;}
  p{text-align:justify;}
  @media(max-width:860px){
    #drawer{width:100%;height:76vh;top:auto;bottom:0;left:0;right:0;border-left:none;
            border-top:1px solid var(--line);border-radius:14px 14px 0 0;
            transform:translateY(102%);box-shadow:0 -10px 34px rgba(43,38,32,.14);}
    #drawer.open{transform:translateY(0);}
    input[type=range]{width:120px;}
  }
  .scene-tooltip{color:#000 !important;background:rgba(255,253,248,.97) !important;border:1px solid var(--line);border-radius:6px;padding:.35rem .55rem;font-family:Georgia,serif !important;max-width:300px;}
  /* header layout + corpus search */
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
  #searchWrap{position:relative;display:flex;align-items:center;gap:.35rem;}
  #searchWrap input[type=search]{font-size:.85rem;padding:.3rem .5rem;min-width:180px;flex:0 1 auto;}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .seg button{border:none;border-radius:0;padding:.3rem .45rem;font-size:.72rem;background:var(--panel);}
  .seg button.on{background:var(--accent);color:var(--paper);}
  #searchResults{position:absolute;top:calc(100% + 4px);right:0;width:min(420px,90vw);max-height:60vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(43,38,32,.18);
    padding:.5rem;display:none;z-index:30;font-size:.85rem;}
  #searchResults.open{display:block;}
  #searchResults mark{background:#f2e2b8;color:inherit;padding:0 1px;border-radius:2px;}
  .sr-item{border-bottom:1px dashed var(--line);padding:.45rem .2rem;}
  .sr-item:last-child{border-bottom:none;}
  .sr-snip{margin:.1rem 0;line-height:1.45;}
  .sr-meta{font-size:.74rem;color:var(--faint);}
  #searchNote{font-size:.75rem;color:var(--faint);padding:.3rem .2rem;}
  /* highlights / excerpts */
  h4.sec{margin:1.1rem 0 .3rem;letter-spacing:.03em;}
  .hl{border-left:3px solid var(--accent);margin:.55rem 0;padding:.15rem 0 .15rem .8rem;}
  .hl blockquote{margin:0;font-style:italic;}
  .hl .cite-line{font-size:.75rem;color:var(--faint);margin-top:.15rem;}
  .hl .cluster{font-size:.7rem;background:rgba(122,74,31,.1);border-radius:4px;padding:0 .3rem;margin-left:.3rem;}
  .hl.proposed{border-left-style:dashed;border-left-color:var(--faint);opacity:.85;}
  .hl .tag-proposed{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
    border:1px dashed var(--faint);border-radius:4px;padding:0 .25rem;margin-right:.3rem;}
  details.proposals{margin:.4rem 0;}
  details.proposals summary{cursor:pointer;font-size:.85rem;color:var(--faint);}
</style>
</head>
<body>
<header>
  <div>
    <h1>High Drama</h1>
    <div class="sub">Spirit Graph</div>
  </div>
  <div id="searchWrap">
    <div class="seg" id="searchModeSeg">
      <button data-mode="hybrid" class="on" title="Hybrid search">hybrid</button>
      <button data-mode="bm25" title="Keyword search">bm25</button>
      <button data-mode="vec" title="Vector search">vec</button>
    </div>
    <input id="corpusSearch" type="search" placeholder="Search corpus…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search figures…">
  <button id="reviewBtn" title="List auto-added nodes awaiting review">Review: 0</button>
  <div class="tgroup">
    <button id="playBtn" title="Play the timeline">▶</button>
    <input id="year" type="range" min="-2100" max="2030" step="10" value="2030">
    <span id="yearLabel">2030 CE</span>
  </div>
  <button id="sizeBtn" title="What drives node size">size: centrality</button>
  <button id="editBtn">Edit: off</button>
  <button id="exportBtn">Export edits</button>
  <button id="resetBtn" title="Discard all local edits">Reset edits</button>
  <span id="editStatus" class="hint"></span>
</div>
<div id="graph"></div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Details">
  <button id="drawerClose" aria-label="Close">×</button>
  <div id="drawerBody"></div>
</aside>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = {}; DATA.nodes.forEach(n=>byId[n.id]=n);

/* ---------- edit tracking (localStorage v2) ---------- */
const LSKEY='highdrama_edits_v2';
let edits = JSON.parse(localStorage.getItem(LSKEY)||'[]');
let editMode=false;
const editStatus=document.getElementById('editStatus');
function showEditStatus(){ editStatus.textContent = edits.length? `${edits.length} local edit(s)` : ''; }
function applyEdits(){
  edits.forEach(e=>{
    if(e.kind==='node-essay' && byId[e.id]) byId[e.id].essay=e.new;
    if(e.kind==='edge-title'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.title=e.new;}
    if(e.kind==='edge-essay'){const ed=DATA.edges.find(x=>x.frm===e.frm&&x.to===e.to&&x.type===e.type); if(ed)ed.essay=e.new;}
  });
  showEditStatus();
}
function record(kind, idOrEdge, oldVal, newVal){
  if(oldVal===newVal) return;
  const rec = Object.assign({kind, old:oldVal, new:newVal, ts:new Date().toISOString()}, idOrEdge);
  function kindrec(e){ return e.kind==='node-essay'? {id:e.id} : {frm:e.frm,to:e.to,type:e.type}; }
  const key = JSON.stringify([kind, idOrEdge]);
  const ix = edits.findIndex(e=>JSON.stringify([e.kind, kindrec(e)])===key);
  if(ix>=0){ rec.old = edits[ix].old; edits[ix]=rec; } else edits.push(rec);
  localStorage.setItem(LSKEY, JSON.stringify(edits));
  showEditStatus();
}

/* ---------- helpers ---------- */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(t){
  return esc(t).replace(/\[(\d+)\]/g,(m,n)=>{
    const s=DATA.sources.find(s=>s.id==n);
    return s? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">[${n}]</a>`:m;
  });
}
function fmtW(w){ if(!w) return '0 W';
  if(w>=1e12) return (w/1e12).toPrecision(3)+' TW'; if(w>=1e9) return (w/1e9).toPrecision(3)+' GW';
  if(w>=1e6) return (w/1e6).toPrecision(3)+' MW'; if(w>=1e3) return (w/1e3).toPrecision(3)+' kW';
  return Math.round(w)+' W'; }
function yearFmt(y){ return y<0? (-y)+' BCE' : y+' CE'; }

/* ---------- time model ---------- */
const ZMIN=-2100, ZMAX=2030, ZSPAN=320;
function zOf(era){ return ((era-ZMIN)/(ZMAX-ZMIN))*ZSPAN - ZSPAN/2; }
function currentT(){ return parseInt(document.getElementById('year').value,10); }
function edgeWeight(e,T){ if(e.era>T) return 0; return Math.exp(-(T-e.era)/250); }
function nodeCentrality(id,T){ let s=0; for(const e of DATA.edges){ if(e.frm===id||e.to===id) s+=edgeWeight(e,T); } return s; }
let sizeMode='centrality';
function nodeSize(n,T){
  if(sizeMode==='watts') return 1.8+1.5*Math.max(0,Math.log10(Math.max(n.pw_t,1)));
  return 3.0+3.4*Math.sqrt(nodeCentrality(n.id,T));
}

/* ---------- colors ---------- */
const PALETTE=['#7a4a1f','#3b6ea5','#5e7f3c','#8e3b46','#6a5a8e','#a5762b','#2f7d6d','#945e9a','#8c2f2f','#4c6b8a'];
function tradColor(t){ let h=0; for(const c of (t||'')) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

/* ---------- 3D graph ---------- */
let Graph=null, simReady=false;

function makeLabelSprite(text){
  const label = (text.length>24? text.slice(0,23)+'…':text);
  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const font='44px Georgia, serif';
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(label).width)+16;
  cv.width=w; cv.height=64;
  ctx.font=font; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(43,38,32,0.92)';
  ctx.fillText(label,8,34);
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4; tex.minFilter=THREE.LinearFilter; tex.needsUpdate=true;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const h=6; spr.scale.set(h*w/64, h, 1);
  return spr;
}

function styleNode(n,T){
  const g=n.__group; if(!g) return;
  const vis = n.era<=T;
  g.visible = vis;
  if(!vis) return;
  const s=nodeSize(n,T);
  n.__mesh.scale.setScalar(s);
  n.__sprite.position.set(0, s+3.2, 0);
}

function applyLinkStyles(){
  const T=currentT();
  // Re-apply style accessors with fresh closures: re-renders link visuals ONLY.
  // Does NOT touch graphData or the simulation, so engineRunning stays false
  // and tickFrame never calls layout.tick -> no race, no reheat, no pop-in.
  Graph.linkVisibility(l=> l.era<=T)
       .linkColor(l=>{ const w=edgeWeight(l,T); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
       .linkWidth(l=> 0.4+2.6*edgeWeight(l,T));
}

function applyTimeStyles(){
  if(!Graph) return;
  const T=currentT();
  Graph.graphData().nodes.forEach(n=>styleNode(n,T));  // engine nodes carry the meshes
  applyLinkStyles();
}

function initGraph(){
  const el=document.getElementById('graph');
  const T0=currentT();

  // Build data ONCE. z is pinned to era from the start (fz); x/y relax during warmup.
  const nodes = DATA.nodes.map(n=>Object.assign({}, n, {fz:zOf(n.era||0)}));
  const idset = new Set(nodes.map(n=>n.id));
  const links = DATA.edges
    .filter(e=>idset.has(e.frm)&&idset.has(e.to))
    .map(e=>({frm:e.frm,to:e.to,type:e.type,title:e.title,essay:e.essay,
              era:e.era,influence:e.influence, source:e.frm, target:e.to}));
  // parallel edges between the same directed pair get alternating curvature offsets
  const pairCount={}, pairSeen={};
  links.forEach(l=>{ const k=l.frm+'->'+l.to; pairCount[k]=(pairCount[k]||0)+1; });
  links.forEach(l=>{ const k=l.frm+'->'+l.to, n=pairCount[k];
    if(n>1){ const i=(pairSeen[k]=(pairSeen[k]||0)+1); l.curvature=((i%2)?1:-1)*Math.ceil(i/2)*0.28; }
    else l.curvature=0; });

  Graph = ForceGraph3D()(el)
    .width(el.clientWidth).height(el.clientHeight)
    .backgroundColor('#f6f1e7')
    .showNavInfo(false)
    .enableNodeDrag(false)
    .nodeThreeObject(n=>{
      const group=new THREE.Group();
      const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(1,16,12),
        new THREE.MeshLambertMaterial({color:tradColor(n.tradition)}));
      group.add(mesh);
      const sprite=makeLabelSprite(n.label);
      group.add(sprite);
      n.__group=group; n.__mesh=mesh; n.__sprite=sprite;
      styleNode(n, currentT());
      return group;
    })
    .nodeLabel(n=>`<div style="font-family:Georgia,serif">
        <b>${esc(n.label)}</b><br>${esc(n.tradition)}<br>
        attested ${yearFmt(n.era)} · ⚡ ${fmtW(n.pw_t)}</div>`)
    .linkColor(l=>{ const w=edgeWeight(l,currentT()); return `rgba(122,74,31,${(0.12+0.6*w).toFixed(3)})`; })
    .linkWidth(l=> 0.4+2.6*edgeWeight(l,currentT()))
    .linkVisibility(l=> l.era<=currentT())
    .linkCurvature(l=> l.curvature||0)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .warmupTicks(90)
    .cooldownTime(700)
    .d3AlphaMin(0.004)
    .onEngineStop(()=>{
      if(simReady) return;
      simReady=true;
      applyTimeStyles();
      Graph.zoomToFit(600, 60);
    })
    .onNodeClick(n=> openNode(n.id))
    .onLinkClick(l=>{ const e=DATA.edges.find(x=>x.frm===l.frm&&x.to===l.to&&x.type===l.type); if(e) openEdge(e); })
    .onNodeHover(n=>{ el.style.cursor=n?'pointer':'grab'; })
    .onLinkHover(l=>{ el.style.cursor=l?'pointer':'grab'; });

  Graph.d3Force('charge').strength(-120);
  // Set the full dataset LAST — library creates layout + starts/stops engine in one digest.
  Graph.graphData({nodes, links});

  window.addEventListener('resize', ()=>{
    Graph.width(el.clientWidth).height(el.clientHeight);
  });
}

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const drawerBody=document.getElementById('drawerBody');
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
document.getElementById('drawerClose').onclick=closeDrawer;

/* review mode: surface auto-added nodes awaiting Cobe's inspection */
(function(){
  const btn=document.getElementById('reviewBtn');
  const pending=()=>DATA.nodes.filter(n=>n.review&&n.review.status==='auto-added');
  function refresh(){ btn.textContent='Review: '+pending().length; }
  btn.onclick=()=>{
    const p=pending();
    drawerBody.innerHTML=`<div class="meta">${p.length} auto-added nodes and their edges awaiting review (from the 2026-10-14 corpus-growth waves)</div>
      <h2>Review queue</h2>
      ${p.map(n=>`<div class="edge"><div class="etype">${esc(n.tradition||'')}</div>
        <div class="t" data-reviewgo="${esc(n.id)}" style="cursor:pointer">${esc(n.label)} <span class="hint">· ${esc(n.id)}</span></div></div>`).join('')}`;
    drawerBody.querySelectorAll('[data-reviewgo]').forEach(el=>el.onclick=()=>{ if(window.byId) {}; document.getElementById('q').value=el.dataset.reviewgo; document.getElementById('q').dispatchEvent(new Event('change',{bubbles:true})); });
    openDrawer();
  };
  refresh();
})();
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* one excerpt/highlight card: blockquote + citation line (+ optional proposed tag) */
function excerptHtml(x, proposed){
  const cite = x.source_url
    ? `<a class="cite" href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc(x.source_title||x.source_url)}</a>`
    : esc(x.source_title||'');
  return `<div class="hl${proposed?' proposed':''}">
    ${proposed?'<span class="tag-proposed">proposed</span>':''}
    <blockquote>${esc(x.text)}</blockquote>
    <div class="cite-line">— ${cite}${x.cluster?`<span class="cluster">${esc(x.cluster)}</span>`:''}</div>
  </div>`;
}

function openNode(id){
  const n=byId[id]; if(!n) return;
  const rel=DATA.edges.filter(e=>e.frm===id||e.to===id);
  const hl=(n.highlights||[]);
  const props=(n.proposals||[]);
  const mainBlock = hl.length
    ? `<h4 class="sec">Highlights (${hl.length})</h4>${hl.map(x=>excerptHtml(x,false)).join('')}`
    : `<p id="essayNode" data-id="${esc(n.id)}">${linkify(n.essay)}</p>`;
  const propBlock = props.length
    ? `<details class="proposals"><summary>Proposed connections (from corpus) · ${props.length}</summary>
         ${props.map(x=>excerptHtml(x,true)).join('')}</details>` : '';
  drawerBody.innerHTML=`
    <div class="meta">batch ${n.batch} · added ${n.date_added} · ${esc(n.tradition)} · attested ${yearFmt(n.era)}${n.review?' · <b style=\"color:#ffb020\">auto-added, needs review</b>':''}</div>
    <h2>${esc(n.label)}</h2>
    <p class="meta" style="font-size:.86rem">⚡ commands ≈ <b>${fmtW(n.pw_t)}</b>
      (${fmtW(n.pw_d)} direct${n.pw_p?` + ${fmtW(n.pw_p)} by proxy`:''})${n.pw_pool?` · pool: ${esc(n.pw_pool)} × witness ${n.pw_ws}`:''}<br>
      <span class="hint">${n.pw_why?esc(n.pw_why):'No industry pool attributed; power flows to it, if at all, by proxy (see edges).'}
      Method: pool × claim-share × witness-strength; single-hop proxy routing.</span></p>
    ${mainBlock}
    ${propBlock}
    <h4>Documented interactions (${rel.length})</h4>
    ${rel.map(e=>{const other=e.frm===id?byId[e.to]:byId[e.frm];const dir=e.frm===id?'→':'←';
      const body=(e.excerpts&&e.excerpts.length)
        ? e.excerpts.map(x=>excerptHtml(x,false)).join('')
        : `<div data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)} ${e.source?`<span class="hint">(${esc(e.source)})</span>`:''}</div>`;
      return `<div class="edge"><div class="etype">${esc(e.type)}</div>
        <div class="t" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
        ${body}
        <div class="hint">${dir} ${other?esc(other.label):esc(e.frm===id?e.to:e.frm)}</div></div>`;}).join('')}
    <p class="hint">${editMode?'Edit mode ON: click an editable essay or edge title to correct the language.':'Toggle Edit to correct the language here.'}</p>`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

function openEdge(e){
  const a=byId[e.frm], b=byId[e.to];
  const exc=(e.excerpts||[]);
  const body = exc.length
    ? `<h4 class="sec">Excerpts (${exc.length})</h4>${exc.map(x=>excerptHtml(x,false)).join('')}`
    : `<p data-ee="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${linkify(e.essay)}</p>`;
  drawerBody.innerHTML=`
    <div class="meta">edge · added ${e.date_added} · attested ${yearFmt(e.era)}</div>
    <div class="etype">${esc(e.type)}</div>
    <h2>${esc(a?a.label:e.frm)} → ${esc(b?b.label:e.to)}</h2>
    <div class="t" style="font-size:1.12rem" data-et="${esc(e.frm)}|${esc(e.type)}|${esc(e.to)}">${esc(e.title)}</div>
    ${e.influence!=null?`<p class="meta">influence: <b>${(+e.influence).toFixed(2)}</b></p>`:''}
    ${body}
    ${e.source?`<p class="hint">Witness: ${esc(e.source)}</p>`:''}`;
  if(editMode) armEditables(drawerBody);
  openDrawer();
}

/* ---------- contenteditable arming ---------- */
function armEditables(scope){
  scope.querySelectorAll('#essayNode').forEach(el=>{
    el.contentEditable=true; el.dataset.orig=byId[el.dataset.id].essay;
    el.onblur=()=>{ record('node-essay',{id:el.dataset.id},el.dataset.orig,el.innerText);
      byId[el.dataset.id].essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
  scope.querySelectorAll('[data-et]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.et.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.title;
    el.onblur=()=>{ record('edge-title',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.title=el.innerText; el.dataset.orig=el.innerText; };
  });
  scope.querySelectorAll('[data-ee]').forEach(el=>{
    el.contentEditable=true; const [f,ty,t]=el.dataset.ee.split('|');
    const ed=DATA.edges.find(x=>x.frm===f&&x.type===ty&&x.to===t); if(!ed)return; el.dataset.orig=ed.essay;
    el.onblur=()=>{ record('edge-essay',{frm:f,type:ty,to:t},el.dataset.orig,el.innerText); ed.essay=el.innerText; el.dataset.orig=el.innerText; el.innerHTML=linkify(el.innerText); };
  });
}

document.getElementById('sizeBtn').onclick=()=>{

  // Retune forces for a given year: strong/fresh links bind tight, decayed ones stretch;
  // invisible (future) nodes carry no charge; z stays era-pinned.
  function retuneForces(T){
    if(!simReady) return;
    Graph.d3Force('link').distance(l=>24+150*(1-edgeWeight(l,T)))
                        .strength(l=>0.9*edgeWeight(l,T));
    Graph.d3Force('charge').strength(n=> (n.era<=T ? -120 : 0));
    Graph.d3ReheatSimulation();  // safe post-init: layout exists; this is the race-free path
  }

const yearEl=document.getElementById('year'), yearLabel=document.getElementById('yearLabel');
function retime(){
  const T=currentT();
  yearLabel.textContent=yearFmt(T);
  applyTimeStyles();           // visibility, sizes, link paint
  retuneForces(T);             // then let physics flow with the new weights
}
yearEl.addEventListener('input', retime);

let playing=false, playTimer=null;
document.getElementById('playBtn').onclick=()=>{
  const b=document.getElementById('playBtn');
  playing=!playing; b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing);
  if(playing){ playTimer=setInterval(()=>{
    let y=currentT()+10; if(y>2030){ y=-2100; }
    yearEl.value=y; retime();
  },200);} else clearInterval(playTimer);
};

/* ---------- corpus search (search server on :8788) ---------- */
const SEARCH_API='http://127.0.0.1:8788/search';
let searchMode='hybrid';
const csInput=document.getElementById('corpusSearch');
const csResults=document.getElementById('searchResults');
document.getElementById('searchModeSeg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    searchMode=b.dataset.mode;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(csInput.value.trim()) runCorpusSearch();
  };
});
function markTerms(snippet, q){
  let out=esc(snippet);
  const terms=q.trim().split(/\s+/).filter(Boolean).slice(0,8);
  for(const t of terms){
    const re=new RegExp('('+esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  }
  return out;
}
let searchTimer=null;
csInput.addEventListener('input',()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(runCorpusSearch,220); });
csInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); runCorpusSearch(); } });
document.addEventListener('click',e=>{
  if(!document.getElementById('searchWrap').contains(e.target)) csResults.classList.remove('open');
});
async function runCorpusSearch(){
  const q=csInput.value.trim();
  if(!q){ csResults.classList.remove('open'); csResults.innerHTML=''; return; }
  let data;
  try{
    const res=await fetch(`${SEARCH_API}?q=${encodeURIComponent(q)}&k=10&mode=${encodeURIComponent(searchMode)}`);
    if(!res.ok) throw new Error('bad status '+res.status);
    data=await res.json();
  }catch(err){
    csResults.innerHTML=`<div id="searchNote">search server offline (research/_search_server.py on :8788)</div>`;
    csResults.classList.add('open');
    return;
  }
  const items=(data&&data.results)||[];
  csResults.innerHTML = items.length
    ? items.map(r=>`<div class="sr-item">
        <div class="sr-snip">${markTerms(r.snippet||r.text||'', q)}</div>
        <div class="sr-meta">${r.url?`<a class="cite" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title||r.url)}</a>`:esc(r.title||'')}${r.cluster?` · ${esc(r.cluster)}`:''}</div>
      </div>`).join('')
    : `<div id="searchNote">no results</div>`;
  csResults.classList.add('open');
}

/* search: focus camera on first matching visible node */
document.getElementById('q').addEventListener('change',()=>{
  if(!Graph) return;
  const q=document.getElementById('q').value.trim().toLowerCase(); if(!q) return;
  const gn=Graph.graphData().nodes.find(n=>n.label.toLowerCase().includes(q) && n.era<=currentT());
  if(gn && gn.x!=null){
    const d=120;
    Graph.cameraPosition({x:gn.x,y:gn.y,z:gn.z+d},{x:gn.x,y:gn.y,z:gn.z},900);
  }
});

initGraph();
